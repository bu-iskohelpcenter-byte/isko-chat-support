 certificate of registration.\n   → 1. Verify the patient status. (Fee: None; Time: 5 Minutes; Person: Nurse I, BU Tabaco Health Services)\n2. Submit for interview and fill up medical patient record.\n   → 2. Conduct interview and review medical patient record for accuracy of information. (Fee: None; Time: 15 Minutes; Person: Nurse I, BU Tabaco Health Services)\n3. Submit for checking of vital signs.\n   → 3. Take vital signs of the patient. (Fee: None; Time: 15 Minutes; Person: Nurse I, BU Tabaco Health Services)\n4. Proceed to consultation area.\n   → 4. Medical Officer conducts examination, diagnosis and treatment. May perform minor procedure/s if necessary. (Fee: None; Time: 75 Minutes; Person: Medical Officer IV, University Health Services)\n5. Standby for monitoring and/or referral to specialized institution/s if needed.\n   → 5. Medical Officer monitors and explains the reason for referral (if needed). Emergency cases are referred within 30 minutes; non-emergency cases within 1 day. (Fee: None; Time: 15 Minutes; Person: Nurse I, BU Tabaco Health Services / Medical Officer IV, University Health Services)\n6. Report to Nurse.\n   → 6. Carry out Medical Officer's order, dispense medicines as prescribed if available and conduct health education. (Fee: None; Time: 5 Minutes; Person: Nurse I, BU Tabaco Health Services)\n7. Report to Nurse (Referred Patient).\n   → 7. Document clinical findings and release medical certificate if needed. (Fee: None; Time: 5 Minutes; Person: Nurse I, BU Tabaco Health Services / Medical Officer IV, University Health Services)\n\n**Total:** Fee: None • Processing time: 2 Hours and 15 Minutes\n\n> Source: BU Citizen's Charter 2024 (1st Edition), BU Tabaco Health Services, pp. 873-874. Fees, requirements, and processing times may be updated by the University — always verify with the responsible office before transacting."},{"c":"Citizen's Charter Services","q":"How do I avail a medical examination at the BU Tabaco Health Services?","a":"**Who may avail:** BU Students; Non-BU Personnel\n**Classification / type of transaction:** Simple • G2C - Government to Citizen\n\n**Checklist of requirements (where to secure):**\n- For Students: Identification Card (1 original copy) — Office of Student Affairs Services; Certificate of Registration (1 original copy) — Registrar Office\n- For New Entrants: BUCET/SHAT/HISET/KAT Result (1 Original or Photocopy) — BU Admission Office; Chest X-ray (PA view) Result (1 Original copy) — Outside Diagnostic & Laboratory Facility; Complete Blood Count with Blood Typing Result (1 Original copy); Urinalysis Result (1 Original copy); Hepatitis B Screening Result (for Nursing, Food Service Mgt., Food Technology, Entrepreneurship, Fisheries, Medicine & Dentistry courses) (1 Original copy); Medical Clearance for students with comorbidities (1 Original copy) — Attending Physician; OB-Gynecologist Clearance for pregnant students (1 Original copy) — Attending Physician; Student Health Record (Form No.: BU-F-UHS-05) and Individual Dental Record (Form No.: BU-F-UHS-21) — Downloadable at BU Health Services Facebook Page; Ordinary Long Brown Envelope (1 piece) — Educational Store\n- Reinstatement from Sick Leave: Medical Certificate (1 original copy) — From the attending physician\n\n**Steps, fees and processing time:**\n1. Present identification card or certificate of registration.\n   → 1. Verify the client status. (Fee: None; Time: 5 Minutes; Person: Nurse I, BU Tabaco Health Services)\n2. Submit for interview and present laboratory and diagnostic results.\n   → 2. Conduct interview and review documents presented. (Fee: None; Time: 15 Minutes; Person: Nurse I, BU Tabaco Health Services)\n3. Submit for checking of vital signs.\n   → 3. Take vital signs of the client. (Fee: None; Time: 15 Minutes; Person: Nurse I, BU Tabaco Health Services)\n4. Proceed to medical examination area.\n   → 4. Medical Officer conducts medical examination and treatment (if needed). (Fee: None; Time: 75 Minutes; Person: Medical Officer IV, University Health Services)\n5. Report to nurse (with findings).\n   → 5. Carry out Medical Officer's order, dispense medicines as prescribed if available and conduct health education. May issue medical certificate if needed. (Fee: None; Time: 5 Minutes; Person: Nurse I, BU Tabaco Health Services)\n6. Report to nurse (without findings).\n   → 6. Release medical certificate. (Fee: None; Time: 5 Minutes; Person: Nurse I, BU Tabaco Health Services)\n\n**Total:** Fee: None • Processing time: 2 Hours\n\n> Source: BU Citizen's Charter 2024 (1st Edition), BU Tabaco Health Services, pp. 875-877. Fees, requirements, and processing times may be updated by the University — always verify with the responsible office before transacting."},{"c":"Citizen's Charter Services","q":"How do I borrow books from the BU Gubat Library?","a":"**Who may avail:** BU Students\n**Classification / type of transaction:** Simple • G2C - Government to Citizen\n\n**Checklist of requirements (where to secure):**\n- Validated Certificate of Registration (1 Hardcopy or Electronic Copy) — College Registrar\n- BU Student ID (1 Original) — Office of Student Affairs and Services/Office of the College Student Affairs Coordinator\n- Student Borrower's Card (1 Original) — Library\n- If a representative will pick up the book/s: Authorization Letter (1 Physical Letter Signed by the BU Student), the student's BU ID, validated Certificate of Registration and Borrower's Card — Requesting Party; and the representative's Government-Issued ID (1 Original)\n\n**Steps, fees and processing time:**\nFace-to-Face:\n1. Present the book/s to be borrowed along with the Certificate of Registration, BU ID and borrower's card at the Circulation Desk.\n   → 1.1 Receive the books and verify patron borrowing requirements. (Fee: None; Time: 5 Minutes; Person: Librarian/Library Aide, BU Gubat Library)\n   → 1.2 Check the title, author & accession number of the book/s against the book card/s. (Fee: None; Time: 5 Minutes; Person: Librarian/Library Aide, BU Gubat Library)\n2. Accomplish the book card/s with date borrowed, name, college/department and signature.\n   → 2.1 Receive and check the book card/s and fill out the date due slip. (Fee: None; Time: 5 Minutes; Person: Librarian/Library Aide, BU Gubat Library)\n   → 2.2 Fill-out the borrower's card. (Fee: None; Time: 5 Minutes; Person: Librarian/Library Aide, BU Gubat Library)\n3. Fill-out and sign the Log Book.\n   → 3. Check-out in the BU-iLib System (if applicable) and check correctness of information in the Log Book. (Fee: None; Time: 10 Minutes; Person: Librarian/Library Aide, BU Gubat Library)\n4. Receive the book/s and borrower's card.\n   → 4. Release the book/s borrowed and file the book card/s. (Fee: None; Time: 5 Minutes; Person: Librarian/Library Aide, BU Gubat Library)\n\n**Total (Face-to-Face):** Fee: None • Processing time: 35 Minutes\n\nOnline (book reservation):\n1. Fill out the reservation form: tinyurl.com/GC-LibraryAskRISA\n   → 1. Check if the client meets the requirements and if the requested material/s are available. (Fee: None; Time: 2 Days; Person: Librarian/Library Aide, BU Gubat Library)\n2. Receive confirmation message.\n   → 2. Send confirmation of availability and inform the client of the next steps. (Fee: None; Time: 35 Minutes; Person: Librarian/Library Aide, BU Gubat Library)\n3. Proceed to the library with the Certificate of Registration, BU ID and borrower's card.\n   → 3. Check the borrowing requirements and hand-in the book card/s. (Fee: None; Time: 5 Minutes; Person: Librarian/Library Aide, BU Gubat Library)\n4. Accomplish the book card/s and sign the Log Book; receive the book/s.\n   → 4-6. Fill the date due slip and borrower's card, check-out in the BU-iLib System, release the book/s. (Fee: None; Time: 25 Minutes; Person: Librarian/Library Aide, BU Gubat Library)\n\n**Total (Online):** Fee: None • Processing time: 2 Days, 1 Hour, 5 Minutes\n\n> Source: BU Citizen's Charter 2024 (1st Edition), BU Gubat Library Services, pp. 988-990. Fees, requirements, and processing times may be updated by the University — always verify with the responsible office before transacting."},{"c":"Citizen's Charter Services","q":"How do I settle an overdue fine or lost book at the BU Gubat Library?","a":"**Who may avail:** BU Students\n**Classification / type of transaction:** Simple (Face-to-Face) • Complex (Online) • G2C - Government to Citizen\nBorrowing privileges are suspended for students with unreturned books, overdue fines or lost books until the accountability is settled.\n\n**Checklist of requirements (where to secure):**\n- Payment of Overdue Fines above PHP 50.00: Order of Payment (1 Original or Electronic Copy) — Library; Official Receipt (1 Original Copy) — University Cashier\n- Payment for Lost Book: Order of Payment (1 Original or Electronic Copy) — Library; Official Receipt (1 Original Copy) — University Cashier\n- Replacement for Lost Book: Formal declaration of lost book/s (1 Physical Letter Signed by the student) — Requesting Party; Certification from the Barangay (if due to natural/man-made disaster); Order of Payment — Library; Official Receipt — University Cashier\n\n**Steps, fees and processing time:**\nPayment of Overdue Fines below PHP 50.00:\n1. Pay fine and fill-out the Overdue Log Sheet.\n   → 1.1 Receive the payment and check information in the Overdue Log Sheet. (Fee: See Table of Fines; Time: 5 Minutes; Person: Librarian/Library Aide, BU Gubat Library)\n   → 1.2 Clear the accountability. (Fee: None; Time: 3 Minutes; Person: Librarian/Library Aide, BU Gubat Library)\n**Total:** Fee: No. of book/s x Amount of Fine • Processing time: 8 Minutes\n\nPayment of Overdue Fines above PHP 50.00:\n1. Receive the Order of Payment.\n   → 1. Issue Order of Payment. (Fee: See Table of Fines; Time: 4 Minutes; Person: Librarian/Library Aide, BU Gubat Library)\n2. Present the Order of Payment to the Cashier and pay fine.\n   → 2. Process payment based on Order of Payment and issue Official Receipt. (Fee: Amount indicated in the Order of Payment; Time: 10 Minutes; Person: Cashier, University/College Cashier's Office)\n3. Go back to the library and present the Official Receipt.\n   → 3. Write the OR number and date in the Overdue Fines Log Sheet. (Fee: None; Time: 3 Minutes; Person: Librarian/Library Aide, BU Gubat Library)\n4. Receive the Official Receipt.\n   → 4. Return the Official Receipt and clear the accountability. (Fee: None; Time: 3 Minutes; Person: Librarian/Library Aide, BU Gubat Library)\n**Total:** Fee: No. of book/s x Amount of Fine • Processing time: 20 Minutes\n\nPayment of the Cost of Book:\n1. Present formal declaration of lost book/s.\n   → 1.1 Receive formal declaration and retrieve book card/s. (Fee: None; Time: 5 Minutes; Person: Librarian/Library Aide, BU Gubat Library)\n   → 1.2 Check the record for cost of book/s. (Fee: Acquisition price/assigned amount if undetermined; Time: 15 Minutes; Person: Librarian/Library Aide, BU Gubat Library)\n2. Receive Order of Payment.\n   → 2. Issue Order of Payment. (Fee: Acquisition price/assigned amount if undetermined; Time: 5 Minutes; Person: Librarian/Library Aide, BU Gubat Library)\n3. Pay the assessed amount.\n   → 3. Process payment and issue Official Receipt. (Fee: Amount indicated in the Order of Payment; Time: 10 Minutes; Person: Cashier, University/College Cashier's Office)\n4. Present the Official Receipt to the library personnel-in-charge.\n   → 4. Photocopy Official Receipt. Write, \"Declared Lost & Paid with OR# and date paid\" in the book card/s. (Fee: None; Time: 5 Minutes; Person: Librarian/Library Aide, BU Gubat Library)\n5. Receive the Official Receipt.\n   → 5.1 Return the Official Receipt and clear the accountability. (Fee: None; Time: 5 Minutes; Person: Librarian/Library Aide, BU Gubat Library)\n   → 5.2 Record in the accession record and BU-iLib (if applicable). (Fee: None; Time: 1 Hour; Person: Librarian/Library Aide, BU Gubat Library)\n**Total:** Fee: Acquisition price/assigned amount if undetermined • Processing time: 1 Hour, 45 Minutes\n\nReplacement for Lost Book:\n1. Present formal declaration of lost book/s.\n   → 1. Receive formal declaration, retrieve book card/s and verify information in the records. (Fee: None; Time: 15 Minutes; Person: Librarian/Library Aide, BU Gubat Library)\n2. Receive the written details of the book/s for replacement.\n   → 2. Give the full bibliographic information of the book/s. (Fee: None; Time: 5 Minutes; Person: Librarian/Library Aide, BU Gubat Library)\n3. Hand-in the book/s.\n   → 3.1 Check the title, author, copyright/edition of the book/s. (Fee: None; Time: 5 Minutes; Person: Librarian/Library Aide, BU Gubat Library)\n   → 3.2 Clear the accountability in the records. (Fee: None; Time: 5 Minutes; Person: Librarian/Library Aide, BU Gubat Library)\n   → 3.3 Prepare the new book/s for mechanical processing/shelving and update the accession record/BU-iLib. (Fee: None; Time: 1 Day; Person: Librarian/Library Aide, BU Gubat Library)\n**Total:** Fee: None • Processing time: 1 Day, 30 Minutes\n\n> Source: BU Citizen's Charter 2024 (1st Edition), BU Gubat Library Services, pp. 991-997. Fees, requirements, and processing times may be updated by the University — always verify with the responsible office before transacting."},{"c":"Citizen's Charter Services","q":"How do I borrow books from the BU Polangui Library?","a":"**Who may avail:** BU Students\n**Classification / type of transaction:** Simple • G2C - Government to Citizen\n\n**Checklist of requirements (where to secure):**\n- Validated Certificate of Registration (1 Hardcopy or Electronic Copy) — College Registrar\n- BU Student ID (1 Original) — Office of Student Affairs and Services/Office of the College Student Affairs Coordinator\n- Student Borrower's Card (1 Original) — Library\n- If a representative will pick up the book/s: Authorization Letter (1 Physical Letter Signed by the BU Student), the student's BU ID, validated Certificate of Registration and Borrower's Card — Requesting Party; and the representative's Government-Issued ID (1 Original)\n\n**Steps, fees and processing time:**\nFace-to-Face:\n1. Present the book/s to be borrowed along with the Certificate of Registration, BU ID and borrower's card at the Circulation Desk.\n   → 1.1 Receive the books and verify patron borrowing requirements. (Fee: None; Time: 5 Minutes; Person: College Librarian or Library Aide, Circulation Section, BU Polangui Library)\n   → 1.2 Check the title, author & accession number of the book/s against the book card/s. (Fee: None; Time: 5 Minutes; Person: College Librarian or Library Aide, Circulation Section, BU Polangui Library)\n2. Accomplish the book card/s with date borrowed, name, college/department and signature.\n   → 2.1 Receive and check the book card/s and fill out the date due slip. (Fee: None; Time: 5 Minutes; Person: College Librarian or Library Aide, Circulation Section, BU Polangui Library)\n   → 2.2 Fill-out the borrower's card. (Fee: None; Time: 5 Minutes; Person: College Librarian or Library Aide, Circulation Section, BU Polangui Library)\n3. Fill-out and sign the Log Book.\n   → 3. Check-out in the BU-iLib System (if applicable) and check correctness of information in the Log Book. (Fee: None; Time: 10 Minutes; Person: College Librarian or Library Aide, Circulation Section, BU Polangui Library)\n4. Receive the book/s and borrower's card.\n   → 4. Release the book/s borrowed and file the book card/s. (Fee: None; Time: 5 Minutes; Person: College Librarian or Library Aide, Circulation Section, BU Polangui Library)\n\n**Total (Face-to-Face):** Fee: None • Processing time: 35 Minutes\n\nOnline (book reservation):\n1. Fill out the reservation form: tinyurl.com/PCASkRisaform\n   → 1. Check if the client meets the requirements and if the requested material/s are available. (Fee: None; Time: 2 Days; Person: College Librarian or Library Aide, BU Polangui Library)\n2. Receive confirmation message.\n   → 2. Send confirmation of availability and inform the client of the next steps. (Fee: None; Time: 35 Minutes; Person: College Librarian or Library Aide, BU Polangui Library)\n3. Proceed to the library with the Certificate of Registration, BU ID and borrower's card.\n   → 3. Check the borrowing requirements and hand-in the book card/s. (Fee: None; Time: 5 Minutes; Person: College Librarian or Library Aide, Circulation Section, BU Polangui Library)\n4. Accomplish the book card/s and sign the Log Book; receive the book/s.\n   → 4-6. Fill the date due slip and borrower's card, check-out in the BU-iLib System, release the book/s. (Fee: None; Time: 25 Minutes; Person: College Librarian or Library Aide, Circulation Section, BU Polangui Library)\n\n**Total (Online):** Fee: None • Processing time: 2 Days, 1 Hour, 5 Minutes\n\n> Source: BU Citizen's Charter 2024 (1st Edition), BU Polangui Library Services, pp. 1049-1051. Fees, requirements, and processing times may be updated by the University — always verify with the responsible office before transacting."},{"c":"Citizen's Charter Services","q":"How do I settle an overdue fine or lost book at the BU Polangui Library?","a":"**Who may avail:** BU Students\n**Classification / type of transaction:** Simple (Face-to-Face) • Complex (Online) • G2C - Government to Citizen\nBorrowing privileges are suspended for students with unreturned books, overdue fines or lost books until the accountability is settled.\n\n**Checklist of requirements (where to secure):**\n- Payment of Overdue Fines above PHP 50.00: Order of Payment (1 Original or Electronic Copy) — Library; Official Receipt (1 Original Copy) — University Cashier\n- Payment for Lost Book: Order of Payment (1 Original or Electronic Copy) — Library; Official Receipt (1 Original Copy) — University Cashier\n- Replacement for Lost Book: Formal declaration of lost book/s (1 Physical Letter Signed by the student) — Requesting Party; Certification from the Barangay (if due to natural/man-made disaster); Order of Payment — Library; Official Receipt — University Cashier\n\n**Steps, fees and processing time:**\nPayment of Overdue Fines below PHP 50.00:\n1. Pay fine and fill-out the Overdue Log Sheet.\n   → 1.1 Receive the payment and check information in the Overdue Log Sheet. (Fee: See Table of Fines; Time: 5 Minutes; Person: College Librarian or Library Aide, Circulation Section, BU Polangui Library)\n   → 1.2 Clear the accountability. (Fee: None; Time: 3 Minutes; Person: College Librarian or Library Aide, Circulation Section, BU Polangui Library)\n**Total:** Fee: No. of book/s x Amount of Fine • Processing time: 8 Minutes\n\nPayment of Overdue Fines above PHP 50.00:\n1. Receive the Order of Payment.\n   → 1. Issue Order of Payment. (Fee: See Table of Fines; Time: 4 Minutes; Person: College Librarian or Library Aide, Circulation Section, BU Polangui Library)\n2. Present the Order of Payment to the Cashier and pay fine.\n   → 2. Process payment based on Order of Payment and issue Official Receipt. (Fee: Amount indicated in the Order of Payment; Time: 10 Minutes; Person: Cashier, BU Polangui Cashier's Office)\n3. Go back to the library and present the Official Receipt.\n   → 3. Write the OR number and date in the Overdue Fines Log Sheet. (Fee: None; Time: 3 Minutes; Person: College Librarian or Library Aide, Circulation Section, BU Polangui Library)\n4. Receive the Official Receipt.\n   → 4. Return the Official Receipt and clear the accountability. (Fee: None; Time: 3 Minutes; Person: College Librarian or Library Aide, Circulation Section, BU Polangui Library)\n**Total:** Fee: No. of book/s x Amount of Fine • Processing time: 20 Minutes\n\nPayment of the Cost of Book:\n1. Present formal declaration of lost book/s.\n   → 1.1 Receive formal declaration and retrieve book card/s. (Fee: None; Time: 5 Minutes; Person: College Librarian or Library Aide, Circulation Section, BU Polangui Library)\n   → 1.2 Check the record for cost of book/s. (Fee: Acquisition price/assigned amount if undetermined; Time: 15 Minutes; Person: College Librarian or Library Aide, Circulation Section, BU Polangui Library)\n2. Receive Order of Payment.\n   → 2. Issue Order of Payment. (Fee: Acquisition price/assigned amount if undetermined; Time: 5 Minutes; Person: College Librarian or Library Aide, Circulation Section, BU Polangui Library)\n3. Pay the assessed amount.\n   → 3. Process payment and issue Official Receipt. (Fee: Amount indicated in the Order of Payment; Time: 10 Minutes; Person: Cashier, BU Polangui Cashier's Office)\n4. Present the Official Receipt to the library personnel-in-charge.\n   → 4. Photocopy Official Receipt. Write, \"Declared Lost & Paid with OR# and date paid\" in the book card/s. (Fee: None; Time: 5 Minutes; Person: College Librarian or Library Aide, Circulation Section, BU Polangui Library)\n5. Receive the Official Receipt.\n   → 5.1 Return the Official Receipt and clear the accountability. (Fee: None; Time: 5 Minutes; Person: College Librarian or Library Aide, Circulation Section, BU Polangui Library)\n   → 5.2 Record in the accession record and BU-iLib (if applicable). (Fee: None; Time: 1 Hour; Person: College Librarian or Library Aide, Circulation Section, BU Polangui Library)\n**Total:** Fee: Acquisition price/assigned amount if undetermined • Processing time: 1 Hour, 45 Minutes\n\nReplacement for Lost Book:\n1. Present formal declaration of lost book/s.\n   → 1. Receive formal declaration, retrieve book card/s and verify information in the records. (Fee: None; Time: 15 Minutes; Person: College Librarian or Library Aide, Circulation Section, BU Polangui Library)\n2. Receive the written details of the book/s for replacement.\n   → 2. Give the full bibliographic information of the book/s. (Fee: None; Time: 5 Minutes; Person: College Librarian or Library Aide, Circulation Section, BU Polangui Library)\n3. Hand-in the book/s.\n   → 3.1 Check the title, author, copyright/edition of the book/s. (Fee: None; Time: 5 Minutes; Person: College Librarian or Library Aide, Circulation Section, BU Polangui Library)\n   → 3.2 Clear the accountability in the records. (Fee: None; Time: 5 Minutes; Person: College Librarian or Library Aide, Circulation Section, BU Polangui Library)\n   → 3.3 Prepare the new book/s for mechanical processing/shelving and update the accession record/BU-iLib. (Fee: None; Time: 1 Day; Person: College Librarian or Library Aide, Circulation Section, BU Polangui Library)\n**Total:** Fee: None • Processing time: 1 Day, 30 Minutes\n\n> Source: BU Citizen's Charter 2024 (1st Edition), BU Polangui Library Services, pp. 1052-1058. Fees, requirements, and processing times may be updated by the University — always verify with the responsible office before transacting."},{"c":"Citizen's Charter Services","q":"How do I avail dental consultation and treatment at the BU Polangui Health Services?","a":"**Who may avail:** BU Students\n**Classification / type of transaction:** Simple • G2C - Government to Citizen\n\n**Checklist of requirements (where to secure):**\n- Identification Card (1 Original Copy); or Certificate of Registration (1 Original Copy) — Office of Student Affairs Services / Registrar Office\n\n**Steps, fees and processing time:**\n1. Present identification card or certificate of registration.\n   → 1. Validate the client status from the documents submitted. (Fee: None; Time: 5 Minutes; Person: Dental Aide, University Health Services)\n2. Submit for interview.\n   → 2. Conduct interview and check veracity of forms and documents. (Fee: None; Time: 15 Minutes; Person: Dental Aide/Dentist I/Dentist II, University Health Services)\n3. Submit for vital signs taking.\n   → 3. Conduct vital signs checking and evaluation of the client. (Fee: None; Time: 15 Minutes; Person: Dental Aide/Dentist I/Dentist II, University Health Services)\n4. Undergo dental examination.\n   → 4. Dentist conducts dental examination and performs diagnosis and treatment planning. (Fee: None; Time: 30 Minutes; Person: Dentist I/Dentist II, University Health Services)\n5. Referral (if needed).\n   → 5. Dentist explains the reason for referral to another specialist. (Fee: None; Time: 5 Minutes; Person: Dentist I/Dentist II, University Health Services)\n6. Receive medication and/or treatment.\n   → 6. Dentist performs dental treatment/s and/or gives medication/s. (Fee: None; Time: 40 Minutes; Person: Dentist I/Dentist II, University Health Services)\n7. Submit medical/dental certificate or diagnostic test results of the referred case (if referred).\n   → 7. Dentist receives, assesses and documents results. (Fee: None; Time: 5 Minutes; Person: Dentist I/Dentist II, University Health Services)\n8. Receive dental education.\n   → 8. Dentist conducts dental education and promotes dental health consciousness. (Fee: None; Time: 5 Minutes; Person: Dentist I/Dentist II, University Health Services)\n\n**Total:** Fee: None • Processing time: 2 Hours\n\n> Source: BU Citizen's Charter 2024 (1st Edition), BU Polangui Health Services, pp. 1067-1068. Fees, requirements, and processing times may be updated by the University — always verify with the responsible office before transacting."},{"c":"Citizen's Charter Services","q":"How do I avail a dental examination at the BU Polangui Health Services?","a":"**Who may avail:** BU Students\n**Classification / type of transaction:** Simple • G2C - Government to Citizen\n\n**Checklist of requirements (where to secure):**\n- For BU Students: Identification Card (1 Original copy) — Office of Student Affairs Services; Certificate of Registration (1 Original copy) — Registrar Office\n- For Incoming Freshmen/New Entrants: BUCET/SHAT/HISET/KAT Result (1 original or photocopy) — BU Admission; Long Brown Envelope (1 pc) — Educational Store; Individual Dental Health Record Form No. BU-F-UHS-21 (1 original copy) — Downloadable at BU Health Services Facebook Page\n\n**Steps, fees and processing time:**\n1. Present identification card or certificate of registration.\n   → 1. Validate the client status from the documents submitted. (Fee: None; Time: 5 Minutes; Person: Dental Aide, University Health Services)\n2. Submit for interview.\n   → 2. Conduct interview and check veracity of forms and documents. (Fee: None; Time: 15 Minutes; Person: Dental Aide/Dentist I/Dentist II, University Health Services)\n3. Submit for vital signs taking.\n   → 3. Conduct vital signs checking and evaluation of the client. (Fee: None; Time: 15 Minutes; Person: Dental Aide/Dentist I/Dentist II, University Health Services)\n4. Undergo dental examination.\n   → 4. Dentist conducts dental examination and performs diagnosis. (Fee: None; Time: 40 Minutes; Person: Dentist I/Dentist II, University Health Services)\n5. Receive medication and/or treatment (if with dental findings).\n   → 5. Dentist performs dental treatment/s, gives medication/s, or schedules the client for an appointment. (Fee: None; Time: 40 Minutes; Person: Dentist I/Dentist II, University Health Services)\n6. Receive dental certificate.\n   → 6. Release dental certificate. (Fee: None; Time: 5 Minutes; Person: Dental Aide, University Health Services)\n\n**Total:** Fee: None • Processing time: 2 Hours\n\n> Source: BU Citizen's Charter 2024 (1st Edition), BU Polangui Health Services, pp. 1069-1070. Fees, requirements, and processing times may be updated by the University — always verify with the responsible office before transacting."},{"c":"Citizen's Charter Services","q":"How do I avail medical consultation and treatment at the BU Polangui Health Services?","a":"**Who may avail:** BU Students; Non-BU Personnel\n**Classification / type of transaction:** Simple • G2C - Government to Citizen\n\n**Checklist of requirements (where to secure):**\n- Bicol University Student Identification Card (1 Original) — Office of Student Affairs Services\n- Student Certificate of Registration (1 Original Copy) — Registrar Office\n\n**Steps, fees and processing time:**\n1. Present identification card or certificate of registration.\n   → 1. Verify the patient status. (Fee: None; Time: 5 Minutes; Person: Nurse I/Nurse II/Nurse III, University Health Services)\n2. Submit for interview and fill up medical patient record.\n   → 2. Conduct interview and review medical patient record for accuracy of information. (Fee: None; Time: 15 Minutes; Person: Nurse I/Nurse II/Nurse III, University Health Services)\n3. Submit for checking of vital signs.\n   → 3. Take vital signs of the patient. (Fee: None; Time: 15 Minutes; Person: Nurse I/Nurse II/Nurse III, University Health Services)\n4. Proceed to consultation area.\n   → 4. Medical Officer conducts examination, diagnosis and treatment. May perform minor procedure/s if necessary. (Fee: None; Time: 75 Minutes; Person: Medical Officer IV, University Health Services)\n5. Standby for monitoring and/or referral to specialized institution/s if needed.\n   → 5. Medical Officer monitors and explains the reason for referral (if needed). Emergency cases are referred within 30 minutes; non-emergency cases within 1 day. (Fee: None; Time: 15 Minutes; Person: Medical Officer IV/Nurse I/Nurse II/Nurse III, University Health Services)\n6. Report to Nurse.\n   → 6. Carry out Medical Officer's order, dispense medicines as prescribed if available and conduct health education. (Fee: None; Time: 5 Minutes; Person: Nurse I/Nurse II/Nurse III, University Health Services)\n7. Report to Nurse (Referred Patient).\n   → 7. Document clinical findings and release medical certificate if needed. (Fee: None; Time: 5 Minutes; Person: Medical Officer IV/Nurse I/Nurse II/Nurse III, University Health Services)\n\n**Total:** Fee: None • Processing time: 2 Hours and 15 Minutes\n\n> Source: BU Citizen's Charter 2024 (1st Edition), BU Polangui Health Services, pp. 1070-1071. Fees, requirements, and processing times may be updated by the University — always verify with the responsible office before transacting."},{"c":"Citizen's Charter Services","q":"How do I avail a medical examination at the BU Polangui Health Services?","a":"**Who may avail:** BU Students; Non-BU Personnel\n**Classification / type of transaction:** Simple • G2C - Government to Citizen\n\n**Checklist of requirements (where to secure):**\n- For Students: Identification Card (1 original copy) — Office of Student Affairs Services; Certificate of Registration (1 original copy) — Registrar Office\n- For New Entrants: BUCET/SHAT/HISET/KAT Result (1 Original or Photocopy) — BU Admission Office; Chest X-ray (PA view) Result (1 Original copy) — Outside Diagnostic & Laboratory Facility; Complete Blood Count with Blood Typing Result (1 Original copy); Urinalysis Result (1 Original copy); Hepatitis B Screening Result (for Nursing, Food Service Mgt., Food Technology, Entrepreneurship, Fisheries, Medicine & Dentistry courses) (1 Original copy); Medical Clearance for students with comorbidities (1 Original copy) — Attending Physician; OB-Gynecologist Clearance for pregnant students (1 Original copy) — Attending Physician; Student Health Record (Form No.: BU-F-UHS-05) and Individual Dental Record (Form No.: BU-F-UHS-21) — Downloadable at BU Health Services Facebook Page; Ordinary Long Brown Envelope (1 piece) — Educational Store\n- Reinstatement from Sick Leave: Medical Certificate (1 original copy) — From the attending physician\n\n**Steps, fees and processing time:**\n1. Present identification card or certificate of registration.\n   → 1. Verify the client status. (Fee: None; Time: 5 Minutes; Person: Nurse I/Nurse II/Nurse III, University Health Services)\n2. Submit for interview and present laboratory and diagnostic results.\n   → 2. Conduct interview and review documents presented. (Fee: None; Time: 15 Minutes; Person: Nurse I/Nurse II/Nurse III, University Health Services)\n3. Submit for checking of vital signs.\n   → 3. Take vital signs of the client. (Fee: None; Time: 15 Minutes; Person: Nurse I/Nurse II/Nurse III, University Health Services)\n4. Proceed to medical examination area.\n   → 4. Medical Officer conducts medical examination and treatment (if needed). (Fee: None; Time: 75 Minutes; Person: Medical Officer IV, University Health Services)\n5. Report to nurse (with findings).\n   → 5. Carry out Medical Officer's order, dispense medicines as prescribed if available and conduct health education. May issue medical certificate if needed. (Fee: None; Time: 5 Minutes; Person: Nurse I/Nurse II/Nurse III, University Health Services)\n6. Report to nurse (without findings).\n   → 6. Release medical certificate. (Fee: None; Time: 5 Minutes; Person: Nurse I/Nurse II/Nurse III, University Health Services)\n\n**Total:** Fee: None • Processing time: 2 Hours\n\n> Source: BU Citizen's Charter 2024 (1st Edition), BU Polangui Health Services, pp. 1072-1073. Fees, requirements, and processing times may be updated by the University — always verify with the responsible office before transacting."},{"c":"BUCET & Admissions","q":"How do I edit or update the information in my iBU application or account?","a":"**Yes, you can update your iBU information through the settings in the iBU application portal.** Log in to your iBU account, go to the account/settings section, and edit your personal information there.\n\nIf you have already printed your application form, you may correct minor entries using **white-out or correction tape** — just make sure you **affix your signature beside every correction** so the change is valid.\n\nFor portal or account problems (e.g., you cannot log in, or a field will not save), contact:\n- **BU Admissions Office:** bu-admission@bicol-u.edu.ph\n- **BU ICTO:** bu-icto@bicol-u.edu.ph\n\n> Verify the current application procedure through official BU announcements."},{"c":"Student Handbook (Complete)","q":"When was Bicol University founded and what is its brief history?","a":"Bicol University, a state university in Region V, was created on June 21, 1969 through the passage of Republic Act 5521 but was institutionalized on September 22, 1970 by virtue of Resolution No. 1 of its Board of Regents. Section 2 of the aforementioned Act mandates that the following schools comprise the University: the Bicol Teacher's College (BTC) with its Laboratory School (BTCLS) at Daraga Albay, the Daraga East Central School, the Albay High School in Legazpi City (all of which became the College of Education with its Laboratory School); the Bicol Regional School of Arts and Trades (BRSAT) in Legazpi (now the College of Engineering and the College of Industrial Technology); the Roxas Memorial Agricultural School (RMAS) at Guinobatan, Albay (now the College of Agriculture); and the School of Fisheries at Tabaco Albay (now the College of Fisheries, otherwise known as the Bicol University Tabaco Campus).\n\nThrough the leadership of historian-lawyer Dr. Ricardo A. Arcilla, Bicol University's first president, the developmental path of BU was charted. Graduate Education was offered in June 1972 with its first batch of enrollees in the Master of Arts and Education Program. In the same year, the College of Arts and Sciences was established, followed by the College of Nursing in 1973. Under Judge Aquilino B. Bonto, the decentralization of the administrative and financial management of the University was realized. In 1981, the Regional Institute of Fishery Technology was organized with World Bank support. In 1993 the BS Forestry Program was established and the College of Agriculture was renamed College of Agriculture and Forestry; the College of Fisheries was restructured into the BU Tabaco Campus. In 1995 the Computer Science Institute was born, the School of Arts and Trades was renamed College of Industrial Technology, and the Institute of Physical Education, Sports and Recreation was shaped.\n\nFrom 1999-2003, under Dr. Emiliano A. Aberin, the University integrated the School of Philippine Craftsmen in Polangui, Albay (now the BU Polangui Campus). Under the first two-year stewardship of Dr. Susana C. Cabredo, the Comprehensive Development (ComDev) Plan took shape, giving birth to the College of Arts and Letters (CAL), the College of Science (CS), the College of Business, Economics and Management (CBEM), and the College of Social Sciences and Philosophy (CSSP). On September 3, 2012, the BU Board of Regents approved the opening of the College of Medicine; in June 2014, 62 students were admitted to its pioneer batch. In 2015, Dr. Arnulfo M. Mascariñas succeeded Dr. Fay Lea Patria M. Lauraya as the 8th President of Bicol University; on March 4, 2019 he was confirmed for his second term as SUC President IV."},{"c":"Student Handbook (Complete)","q":"Who We Are — what are BU's core values and status?","a":"An institution promoting Scholarship, Leadership, Character, and Service as its core values, Bicol University remains the premier state university in the Bicol Region. Founded in 1969, it has risen to SUC Level IV status, a prestige it has enjoyed since 1998. It is home to topnotchers in the fields of Accountancy, Engineering, Midwifery, Nursing, Social Work and Education.\n\nAs a comprehensive university, it caters to the needs of society in the following fields:\n• Technology, Engineering, Architecture and Sciences\n• Arts and Letters, Culture, Recreation and Sports\n• Agriculture, Forestry and Fisheries\n• Business and Entrepreneurship\n• Health and Medicine\n• Social Sciences\n• Education\n\nProfile of Excellence:\n• Center of Excellence in Teacher Education\n• Center of Development in Nursing Education\n• Center of Development in Fisheries Education\n• Center for Higher Education Research\n• One of the 22 Leading SUCs in the Philippines\n• SUC Level IV by the DBM Standards\n• 6th in General Budget Appropriation\n• 16th Biggest SUCs in Enrolment"},{"c":"Student Handbook (Complete)","q":"What are BU's Vision, Mission, Quality Policy and Goals?","a":"Vision: A University for Humanity characterized by productive scholarship, transformative leadership, collaborative service, and distinctive character for sustainable societies.\n\nMission: The Bicol University shall primarily give professional and technical training, and provide advanced and specialized instruction in literature, philosophy, the science and arts, besides providing for the promotion of scientific and technological researches.\n\nQuality Policy: Bicol University commits to continually strive for excellence in instruction, research and extension by meeting the highest level of clientele satisfaction and adhering to quality standards and applicable and statutory requirements.\n\nGoals of the University include: optimize the resource-generation capacity of the University pursuing academe-based entrepreneurship anchored on the core competencies of the faculty and the vast land resources of the University; effect timely administrative and academic support services through simplification of processes and actualization of the highest degree of efficiency and effectiveness; and provide a physical environment supportive of the instruction, research, extension and production programs."},{"c":"Student Handbook (Complete)","q":"How is the University governed?","a":"The governing body of the University is the Board of Regents (BOR), as mandated by the Higher Education Modernization Act of 1997 (R.A. 8292). The Board of Regents is the highest policy-making body of a chartered State University and is composed of: the Chairperson of the Commission on Higher Education (CHED) as Chairperson; the President of the University as Vice Chairperson; the Chairpersons of the Congressional Committees on Education (Arts & Culture; Technical & Higher Education); the Regional Directors of NEDA, DOST and the Department of Agriculture; the President of the BU Faculty Association; the Chairperson of the University Student Council; the President of the BU Alumni Association; and two (2) prominent citizens.\n\nThe Administrative Council is composed of the President as Chairperson, the Vice Presidents, Deans, Directors and other officials of equal rank as members, whose duty is to review and recommend to the Board of Regents policies governing the administration, management and development planning of the University.\n\nThe Academic Council is composed of the President as Chairperson and all members of the instructional staff with the rank Assistant Professor and above. It has the power to review and recommend curricular offerings and rules of discipline, and to fix requirements for admission, graduation and the conferment of degrees, subject to review/approval by the Board of Regents.\n\nThe Administration is vested in the President, assisted by the Vice Presidents for Academic Affairs, for Planning and Development, for Research Development and Extension, and for Administration and Finance. Each college/academic unit is presided over by a Dean/Director designated by the President and confirmed by the Board of Regents.\n\nRepresentation of Students in Governing Bodies: the duly elected Chairperson of the Bicol University Student Council serves as the Student Regent representing the students in the Board of Regents. In the interim period when the student representative loses his status as a student (graduation, transfer, expulsion and similar causes), he may be represented by a duly elected representative. The USC Chairperson is invited to attend the Administrative and Academic Council as a non-voting member, and student representatives are regular members of several standing and ad-hoc committees."},{"c":"Student Handbook (Complete)","q":"What is the BUCET and how is admission determined?","a":"Admission to the undergraduate programs leading to an award of a diploma or baccalaureate degree is selective to promote quality and excellence in tertiary education. To qualify for admission, incoming students need to pass the Bicol University College Entrance Test (BUCET).\n\nIt is a three-hour examination consisting of sub-tests in Language Proficiency in English, Mathematics, Science and Reading Comprehension. Admission is based on the applicant's BUCET Composite Rating consisting of the BUCET score and his/her general weighted average (GWA) in grades 9 to 11.\n\nGeneral requirements for BUCET:\n1. Students from DepEd or other recognized high schools who are high school seniors expecting to graduate at the end of the school year; OR\n2. Senior high school graduates who have not taken and/or are not taking any college subject/s; AND\n3. Holders of Philippine Educational Placement Test / Alternative Learning System (PEPT/ALS) certificates who are eligible for admission to college.\n\nThe BUCET cut-off rating for the Licensure and Non-licensure courses shall be recommended by the Admissions Office."},{"c":"Student Handbook (Complete)","q":"How do I transfer to Bicol University?","a":"Admission of transferees is contingent upon the availability of slots in the College the applicants are seeking transfer to, upon which the Dean of the College shall declare the slot open or available upon the recommendation of the College Department Head of the program. Transferees' application for transfer must reach the Office of Admissions in due time prior to the registration period, together with the letter of intent for transfer.\n\nThe following documents are to be submitted:\n1. Certification from the Dean/Director of availability of place/slot in the College/Unit;\n2. Certification of grades duly signed by the Registrar of the original school bearing the school's seal; or\n3. Official Transcript of Records (OTR) from the last school attended; and\n4. Certificate of Honorable Dismissal.\n\nProcessing of the transferees' documents shall commence upon payment of the processing fee inclusive of aptitude testing which some colleges require. Applicants for transfer may still go through an interview in the college/unit they intend to transfer to or be subjected to other college/program requirements.\n\nEligibility for admission of transferees shall be determined by the result of multiple assessment procedures, including but not limited to:\n1. Course-program aptitude test, if required by the College/Unit/Department;\n2. Grade Point Average (GPA) of 2.0 or 89%;\n3. No failing grade in any of the courses taken;\n4. Applicant shall not have finished more than twenty-five percent (25%) of the units required for the course;\n5. Interview; and/or\n6. Other assessment procedure(s) required by the College/Unit/Department."},{"c":"Student Handbook (Complete)","q":"What are the rules on transfer credits?","a":"Only course units earned from colleges/universities with the same program accreditation level as Bicol University or higher, or those duly recognized by CHED, will be credited. Transfer credits, however, shall not exceed twenty-five percent (25%) of the total number of units required for the course.\n\nConsiderations in awarding transfer credits:\n1. At the discretion of the College Dean, a validation examination may be required for subjects with ratings below 2.5 or its equivalent before credits are granted.\n2. The courses or subjects for which credits are claimed are, in the opinion of the College Dean, equivalent to the content coverage, or have the same curriculum offered in the college.\n3. The number of units is the same as the units of the equivalent subject in Bicol University.\n4. The rules on sequences of subjects (prerequisites) in the curriculum are observed; the student will not be allowed to enroll in a subject the prerequisites of which, taken elsewhere, have not been validated or repeated.\n\nAll transferees shall be admitted on probation for one semester, within which period specific conditions set by the college shall be met in addition to the conditions imposed by the University. Special admission or re-admission of students shall be approved by the President following a thorough evaluation by relevant committees at the college level and the university level."},{"c":"Student Handbook (Complete)","q":"Are graduates of technical-vocational courses admitted?","a":"Admission of graduates of terminal technical-vocational courses shall be assessed on a case-to-case basis. The documentary requirements and conditions set for transfer students shall apply to them."},{"c":"Student Handbook (Complete)","q":"How do I shift to another course/program within BU?","a":"Shifters are internal transferees from one course program to another within the University. They shall be allowed to shift subject to the availability of place/slot in the college/unit they are seeking transfer to. They shall vie for the places/slots along with transferees from outside the University; hence, they will be required to submit the following documents:\n1. Letter of intent to transfer specifying, among others, the reason for request for transfer;\n2. Certification from the Dean/Director of the availability of slot;\n3. Certification of grades duly signed by the College/Unit Registrar.\n\nWhen and if needed, the prospective shifter may have to be referred to the University Guidance Office. Conditions required of transferees from outside the University shall apply to shifters, including the payment of a processing fee of Php 100.00."},{"c":"Student Handbook (Complete)","q":"How do returning students re-enroll?","a":"Old students who stopped schooling due to ill health or any other valid reason can seek re-admission by presenting medical or other documents to support his/her reason/s for dropping out of school.\n\nRenewal of registration of a student is dependent on his/her previous performance. The college/unit reserves the right to refuse enrollment/re-admission of old/returning students on account of proof of his/her violation of the school's rules and regulations and/or academic deficiency.\n\nAn old student may be re-admitted upon presentation of his/her clearance duly signed by school officials concerned; while a student returning from leave of absence shall present supporting papers."},{"c":"Student Handbook (Complete)","q":"What are the requirements for undergraduate foreign students?","a":"A Foreign Student is one who is a citizen/subject or resident of another country whose admission to the University is contingent upon the compliance of the requirements of the National Government, after qualifying for admission and submission of all the documentary and other requirements of the University."},{"c":"Student Handbook (Complete)","q":"What is the registration process?","a":"Qualified applicants for admission should register within the period of registration. Registration includes filling out the prescribed forms and paying the required fees.\n\nStudents enrolled during the preceding semester including summer session are re-enrolled upon being cleared by the Dean and other officials concerned.\n\nNo student shall be registered in any subject after the last day of late registration in the school calendar.\n\nRegistration without fine is allowed only to special students, but is subject to other regulations of the University.\n\nA student must be officially registered in order to receive credit for course work."},{"c":"Student Handbook (Complete)","q":"How is the Academic Year structured and what is a credit unit?","a":"Generally, all academic units of the University in all levels operate under the semestral system in which classes are scheduled Monday through Friday, occasionally three (3) hours are scheduled on Saturdays and/or Sundays.\n\nPrescribed Uniform: Students must wear the required uniform for their academic level. The design approved by the Board of Regents is disseminated upon enrollment.\n\nCredit Unit: One unit of credit shall be at least eighteen (18) full hours of instruction per semester in the form of lecture, discussion, seminar, tutorial, or equivalent field or any combination of these forms. A substantial equivalent shall be observed for other terms such as trimestral or quarterly system."},{"c":"Student Handbook (Complete)","q":"What is the academic load policy?","a":"The regular academic load for undergraduate students shall be that which is prescribed in the curriculum in a semester for a certain program/course.\n\nA graduating student with a satisfactory academic record may be permitted to carry an additional load of one or two subjects in his/her last semester, provided that the total load does not exceed the maximum of thirty-three (33) units per semester, provided further that this will not contradict any existing policy of the University; provided finally that the student concerned is a candidate for graduation at the end of the semester that the load is allowed. An additional one (1) or two (2) non-major subjects may also be allowed to students who are on Student Teaching/Practicum.\n\nDuring the summer term, the regular load shall be nine (9) units or that which is prescribed in the curriculum, but in justifiable cases the Dean or Director may allow a higher load of not exceeding twelve (12) units. The Dean shall limit the academic load to students who are employed in the University, whether full time or part-time."},{"c":"Student Handbook (Complete)","q":"How are students classified?","a":"Undergraduate students are classified as regular, irregular, non-regular, and foreign.\n\nA Regular Undergraduate Student is one who has organized a program of study for a bachelor's degree, or undergraduate diploma/certificate, is registered for formal academic credits, and carries the subjects called for by the curriculum for which s/he is registered in a given semester.\n\nAn Irregular Student is one who is registered for formal academic credits, but does not carry the full semester load called for by the curriculum for which s/he is registered.\n\nA Non-Regular Student is one who is registered for formal academic credits, but not for a degree, or is registered but does not receive formal academic credit/s for subjects taken. Classified as non-regular students are: non-degree students with credits; cross registrants with credits; and special students without credits.\n\nA Foreign Student is one who is a citizen/subject or resident of another country whose admission to the University is contingent upon the compliance of the requirements of the National Government.\n\nFor purposes of registration, students are also classified as:\n1. First Year - one who has not finished the prescribed subjects for the first year of his/her curriculum or twenty-five (25) percent of the total number of units required for the entire four-year degree course, or twenty (20) percent in the case of a five-year degree course.\n2. Sophomore - one who has completed the prescribed subjects for the first year of his/her curriculum or has finished not less than twenty-five (25) percent of the total units of a four-year degree course, or not less than twenty (20) percent but not more than forty (40) percent of the units required for the five-year degree course.\n3. Junior - one who has completed the prescribed subjects for the first two years of his/her curriculum or has finished not less than fifty (50) percent but not more than seventy-five (75) percent of the total units of a four-year degree course, or not less than forty (40) percent but not more than sixty (60) percent for the five-year degree course.\n4. Senior - one who has completed the prescribed subjects for the first, second, and third year of his/her curriculum or has finished the remaining units required for graduation."},{"c":"Student Handbook (Complete)","q":"What are the rules on cross-registration?","a":"(Cross-registration rules are set in the handbook's classification of non-regular students: cross registrants with credits are classified as non-regular students. Cross-registration arrangements follow the University's policies on credit units, academic load and the approval of the concerned Deans/Directors.)"},{"c":"Student Handbook (Complete)","q":"What are the rules on withdrawal of registration and prerequisites?","a":"Withdrawal of Registration: A student may be entitled to withdraw his/her credentials submitted as requirements for enrollment. After this period, the request shall be for dropping of subjects and the rules for dropping shall apply.\n\nPrerequisites: The rules on sequence of subjects in the curriculum in the course being taken must be followed. A subject or course approved by the Academic Council, as prerequisite to others, should be taken before a higher course. Enrolling and attendance in a subject without passing its prerequisite shall earn students no academic credit, unless such enrollment has been approved by the College Dean."},{"c":"Student Handbook (Complete)","q":"What are the requirements for shifting to another course?","a":"A student of any college in the University who desires to shift to another course/program within the University for a valid reason shall be governed by the following:\n1. S/he has not obtained two or more failing grades in his/her present course/program;\n2. S/he has not finished fifty (50) percent or more of the required units of his/her present course;\n3. His/her transfer is accepted by the Dean of the college where s/he plans to continue the new course; and\n4. S/he has earned a Grade Point Average (GPA) of 2.4;\n5. S/he has satisfied all other requirements for admission to the new course.\n\nThe student shall file an application for this purpose through the Dean of the college where s/he is presently enrolled. This application shall be endorsed to the Dean of the college where s/he plans to continue the new course. Once admitted, the latter shall request his/her records for evaluation of his/her subjects before s/he can be enrolled."},{"c":"Student Handbook (Complete)","q":"What is the attendance and absence policy (including the 20% rule)?","a":"Any student who, for unavoidable cause, absents him/herself from classes must obtain an excuse letter from either the adviser or the guidance coordinator to be presented to the instructors concerned not later than the second session following his/her return. In case of illness where the absence is for five days or more, but not exceeding one month, a medical certificate must be secured from the University Medical Center, or from a proper medical office outside the University.\n\nExcuses are only for time missed. All work covered by the class during his/her absence shall have to be made up to the satisfaction of the instructor within a reasonable time from the date of absence.\n\nWhen the number of hours lost by the absence of a student reaches twenty percent (20%) of the hours of the scheduled work in one subject, s/he shall be dropped. However, a faculty member may prescribe a longer attendance requirement to meet special needs. If the majority of the absences are excused, the student shall not be given a grade of 5.0 (failure) upon being dropped."},{"c":"Student Handbook (Complete)","q":"What are the rules on scholastic deficiency (probation and dismissal)?","a":"a. Academic Probation: A student who fails in one subject at any time shall in the succeeding term carry a load which in one subject (of equivalent unit) is less than the load allowed for his course during the current semester. A student who obtains two failing marks at the end of the term will be under probation during the following semester and may be allowed to take not more than seventy-five percent (75%) of the regular load for the semester. Probation may be removed upon passing all the subjects carried during the term s/he is on probation.\n\nb. Academic Dismissal: A student who is under probation and still obtains a failing mark in one of his subjects at the end of the term shall be automatically dropped from the rolls of the college. A student who obtains three or more failing grades at the end of the term shall be dropped from the rolls of the college. Third, fourth, and fifth year students may be re-enrolled upon petition in writing addressed to the Academic Petitions Committee, provided the failure is for the first time; the maximum academic load that may be granted is nine (9) units. The Academic Petitions Committee is composed of the Associate Dean/Department Chairperson as Chair, the Faculty Club President, a Department Chair/Senior Faculty designated by the Dean, the CSC President, and another student representative designated by the Dean. The final decision shall be with the Dean of the college concerned."},{"c":"Student Handbook (Complete)","q":"What are Honorable Dismissal, Dismissal and Permanent Disqualification?","a":"c. Honorable Dismissal: A student in good standing who desires to leave the University shall present his clearance and receipt of payment for a transcript of records to the Registrar for the preparation of a Certificate of Honorable Dismissal. The Certificate indicates that the student leaves the University in good standing as far as character and conduct are concerned.\n\nd. Dismissal: A student who leaves the University for reason of dismissal due to disciplinary action shall be entitled, or permitted to receive the transcript of records or certification of his academic status in the University containing a statement of the disciplinary action rendered against him. He shall not be entitled to an honorable dismissal.\n\ne. Permanent Disqualification: Any student shall be permanently barred from re-enrolment in any college/school/unit of the University on the following grounds: (1) poor scholarship — the student is dropped from the rolls of any college of the University due to poor scholarship as governed by the rules on academic dismissal; (2) complete failure — the student failed in all his subjects for the term/semester; or (3) dismissal due to violation of the rules and regulations of the University. Permanent disqualification shall not apply to cases in which failing grades were due to unauthorized dropping of subjects and not poor scholarship, as certified by the instructor concerned."},{"c":"Student Handbook (Complete)","q":"What is the Policy Statement on Academic Integrity?","a":"Pursuant to paragraph 2, section 5 of Article XIV of the Constitution, the University enjoys academic freedom and institutional autonomy. No student is denied admission by reason of sex, nationality, religion, political affiliation or physical disability.\n\nExamples of academic dishonesty include, but are not limited to:\n1. Plagiarizing or representing the words, ideas or information of another person as one's own and not offering proper documentation;\n2. Giving or receiving prior to an examination, any unauthorized information concerning the content of that examination;\n3. Referring to or displaying any unauthorized materials inside the examination room during the course of an examination;\n4. Communicating during an examination in any manner with any unauthorized person concerning the examination or any part of it;\n5. Giving or receiving substantive aid during the course of an examination;\n6. Talking, converting, concealing, defacing, damaging or destroying any property related to the preparation or completion of assignments, research or examination.\n\nStudents found guilty of academic dishonesty are subject to any or a combination of the following: written warning; loss of credit for the work involved; reduction of grades; failing grade in the course; suspension; dismissal; or other sanctions imposed by the University. A notation that such sanction has been imposed will be made part of the student's permanent record. It is expected that the Dean will notify the student of the sanction imposed and the appeal procedure."},{"c":"Student Handbook (Complete)","q":"What happens when a new curriculum is enforced?","a":"Any change in curriculum must be implemented in such a way that the interest of the students is not prejudiced. When a new curriculum is enforced, only new students or first year shall be concerned. A student shall follow the same curriculum that s/he started on within the maximum length of time allowed for residence. However, if for some reason s/he drops from school before graduation and when s/he returns the maximum length of residence has been exceeded, s/he will already be covered by any change in curriculum that has been implemented while s/he was out. Similarly, if a student fails to finish his/her course within the prescribed maximum number of years of residence in the college, s/he shall be required to follow the new curriculum."},{"c":"Student Handbook (Complete)","q":"What are the examination rules?","a":"A. Regular Examination: Two regular written examinations — the mid-term and the final examinations — are prescribed every semester/term. Other written, oral or practical examinations are also given at the discretion of the subject instructor. Regular examinations are administered by the subject instructors with the assistance of proctors.\n\nB. Make-up Examination: Examination missed for justifiable reasons may be made up within the same term at the discretion of the subject instructor concerned.\n\nC. Validating Examination: For purposes of accreditation of subjects taken from other institutions by transfer students with ratings lower than 2.5, validating examinations may be requested by the student from the office of the College Dean with a corresponding validating fee charged per subject."},{"c":"Student Handbook (Complete)","q":"What is the grading system?","a":"The University shall have a uniform grading system using number grades from 1.0 to 5.0, where 1.0 is the highest.\n\nAdjectival Rating / Grade Equivalent:\n• Outstanding — 1.0, 1.1, 1.2, 1.3, 1.4 (99–100)\n• Superior — 1.5, 1.6, 1.7\n• Very Satisfactory — 1.8, 1.9, 2.0, 2.1, 2.2, 2.3, 2.4, 2.5\n• Satisfactory — 2.6, 2.7, 2.8 (82–83, 80–81, 78–79)\n• Fair/Average — 2.9, 3.0 (76–77, 75 Passing)\n• Poor — 3.1–4.0 (Below 75)\n• Conditional — 5.0 (lowest possible mid-term rating)\n• Failure — 5.0 (lowest possible final rating)\n\nThe passing grade in the Graduate School is 3.0, but a graduate student has to maintain a general weighted average of 2.0, otherwise s/he will not be allowed to take the comprehensive examination and will subsequently be disqualified from earning the degree. A student who incurred a FAILING MARK in his/her course work may be allowed to retake the subject not more than two times."},{"c":"Student Handbook (Complete)","q":"How are grades interpreted and how is the grade of Incomplete (INC) resolved?","a":"Interpretation of Grades: The meaning of the adjectival ratings and the corresponding ratings on the scale indicate the extent to which the behavior is exhibited and how frequently the skill/quality/attribute is observed — from Outstanding (student has mastered all of the course's major instructional objectives) down through Superior, Very Satisfactory, Satisfactory, Fair/Average, Poor, Conditional, and Failure.\n\nThe Grade of Incomplete (INC): Students who have not completed all requirements for a grade may be given an incomplete, which is resolved according to the University's rules on completing the requirements within the prescribed period."},{"c":"Student Handbook (Complete)","q":"What are the graduation requirements?","a":"A student shall be recommended for graduation only after s/he has satisfied all academic and other requirements prescribed for graduation.\n\nCandidates for graduation who began their studies under a curriculum ten (10) years back shall be governed by the following:\n• Those who have completed all the requirements of the curriculum but did not apply for, nor were granted the corresponding degree or title, shall have their graduation approved, as of the date they should have originally graduated.\n• Those who have completed all but two or three subjects required by the curriculum shall be made to follow either the revised curriculum or the curriculum enforced from the time they first enrolled in the University to the present.\n• All candidates for graduation must have their deficiencies removed and their records cleared not later than five weeks before the end of their last semester/term in the program, with the exception of the subjects in which they are currently enrolled. No student shall be allowed to graduate from the University unless s/he is in residence during the last two terms/semesters of his/her course."},{"c":"Student Handbook (Complete)","q":"What are the non-academic awards and ladderized program recognition?","a":"Non-Academic Awards or Incentives: as provided in the handbook, students may receive recognition and incentives for non-academic achievements in accordance with University policies.\n\nLadderized Type Program Recognition: recognition is given to students completing ladderized programs in accordance with the University's rules."},{"c":"Student Handbook (Complete)","q":"What are the rules on transcripts/diplomas and cost-recovery courses?","a":"Transcript/Diploma: Official transcripts of records and diplomas are issued by the University Registrar's Office in accordance with University rules (see also the Citizen's Charter services for the Registrar's procedures and fees).\n\nOpening of Cost Recovery Courses: Cost-recovery/petition courses may be opened by the University in accordance with BOR policies. The professor/instructor shall be compensated fully based on his/her hourly rate; the computation for payment of honorarium is: Hourly rate of faculty x no. of hours / no. of students = Cost per student. Fees shall be deposited to the College Trust Fund and disbursed solely for the purpose; payment shall be made to the professors/instructors concerned following the usual procedure; and usual supervision shall be exercised by the Deans/Directors concerned."},{"c":"Student Handbook (Complete)","q":"Who is eligible for Free Higher Education under RA 10931?","a":"By virtue of RA 10931 or the 'Universal Access to Quality Tertiary Education Act,' all students pursuing a bachelor's degree in the University, not disregarding the exceptions provided in its implementing rules and regulations (IRR), are entitled to free tertiary education starting S.Y. 2018-2019, with the tuition fee and 13 miscellaneous fees approved in the law subsidized by the Commission on Higher Education (CHED).\n\nStudents are entitled to this benefit provided they:\n• pass/meet the University's admission and retention policies;\n• have no previous undergraduate degree; and\n• are not overstaying at the college level.\n\nStudents who are not eligible will be charged tuition and other school fees at the rate of tuition and other school fees (TOSF) pegged in S.Y. 2017-2018.\n\nR.A. 10931 provides a one-year grace period on top of the prescribed number of years of the course of the student. For example:\n• Incoming first year students during S.Y. 2018-2019: students in four-year courses can benefit for five years; students in five-year courses can benefit for six years.\n• Continuing students during S.Y. 2018-2019: fourth year students in four-year courses can benefit for two years (their fourth year and the one-year grace period); third year students in five-year courses can benefit for four years (their third to fifth years and the one-year grace period).\n• For any extension beyond the above, the student shall pay for the TOSF.\n\nStarting AY 2018-2019, all summer classes that are part of the curriculum are covered by the Free Higher Education provisions of the law. Special arrangements wherein institutions charge petitioning students higher tuition fees or ask petitioning students to cover the fees for an entire class are not reimbursable to UniFAST."},{"c":"Student Handbook (Complete)","q":"What fees are paid upon enrollment?","a":"The following fees are collected upon enrollment (covered by RA 10931 for eligible students):\n• Tuition Fee — the basic fee computed on a per unit basis.\n• Matriculation Fee — registration fee for the student to be considered a bona fide student of the University.\n• Physical Development Fee — partly covers the cost of improving the physical facilities of the University.\n• Library Fee — partly covers the cost of improving library collection and resources.\n• Laboratory Fee (Science, Computer, Language, Other) — used to upgrade laboratory facilities and cover depreciation cost of equipment.\n• Medical-Dental Fee — entitles the student to free medical and dental services from BU clinics where s/he is officially enrolled.\n• Athletic Fee — used in the conduct of intramurals and other athletic events involving students.\n• SCUAA Fee — used during SCUAA participated by BU athletes.\n• NSTP Fee — covers operational expenses in implementing the NSTP program.\n• Guidance Fee — finances training programs on various self-development issues for students.\n• Entrance Fee (New Students) — covers the cost of the identification card for new students and the student handbook.\n• Internet Fee or its Equivalent — covers the cost of internet access and use of IT equipment within the University."},{"c":"Student Handbook (Complete)","q":"What is the mode and nature of payment of school fees, and the refund policy?","a":"Mode of Payment of School Fees: fees are paid in accordance with the University's schedule and the mode of payment prescribed at enrollment (see the official handbook and the current enrollment guidelines for the payment schedule).\n\nNature of Payment: fees are classified and collected according to their nature (per unit, per semester, yearly, or once only) as prescribed by BOR resolutions.\n\nRefunds: refunds are governed by the University's refund policy as prescribed in the handbook and current financial policies — students who withdraw from enrollment are entitled to refunds in accordance with the applicable rules."},{"c":"Student Handbook (Complete)","q":"What are the objectives and services of the OSAS?","a":"Objectives of the OSAS:\n1. Ensure the proper balance between the rights of the University as an institution and the rights of students by promoting the well-being of the students through informative activities designed to facilitate student adjustment to life in an academic setting.\n2. Improve the quality of Student Affairs and Services in the University by providing an environment generally supportive of students' welfare.\n3. Promote access to quality, relevant, efficient and effective student affairs and services by providing opportunities for students to learn skills needed for optimum learning.\n4. Support student development and welfare by helping students utilize their potentials to the fullest, pursuit of further education, economic enterprise development, free expression of one's religious orientation, and activities that cater to marginalized students, persons with disabilities, indigenous people, solo parents, etc.\n5. Ensure that Bicol University provides a holistic approach for Student Affairs and Services and complies with the minimum requirements for SAS.\n\nServices under the OSAS (per CMO No. 9, s. 2013):\nA. Student Welfare Services — basic services and programs needed to ensure and promote the well-being of students, including: (1) Information and Orientation Services; (2) Guidance and Counseling Services (guidance, counseling, appraisal/testing, follow-up, referral); (3) Career and Placement Services; (4) Economic Enterprise Development (student cooperation, entrepreneurial, income generating projects, savings); (5) Multi-Faith Services; and (6) Services for Students with Special Needs and Persons with Disabilities.\nB. Student Development Services — programs designed for the exploration, enhancement and development of the student's full potential, including: (1) Student Activities; (2) Student Organizations and Activities; (3) Leadership Training; (4) Student Council/Government; (5) Student Discipline; (6) Student Publication/Yearbook; (7) Student Handbook Development; and (8) Social and Community Involvement Programs.\nC. Institutional Student Programs and Services — services designed to respond to the basic health, food, shelter and safety concerns of students, including: (1) Scholarship and Financial Assistance; (2) Food Services; (3) Student Housing and Residential Services; (4) Foreign/International Student Services; and (5) Cultural and Arts Program (Artistic Talent Enhancement Program, Artistic Talent Development Program, Supplemental Cultural Education Program, Cultural Awareness Program)."},{"c":"Student Handbook (Complete)","q":"What scholarship categories and incentives does BU offer?","a":"Academic Recognition: Students who obtained a high average rating during two consecutive preceding terms in the University are awarded a medal and a Certificate of Recognition, while those who obtained a high average rating for a preceding semester are awarded a Certificate of Recognition.\n\nAcademic Distinctions: The following academic distinctions are given to non-graduating students who do not have a grade lower than 2.4:\n• President's Lister — 1.00 ≤ Grade ≤ 1.45\n• Dean's Lister — 1.45 < Grade ≤ 1.75\n\nUniversity Athletes: Students who have enrolled in BU for at least one semester and have represented the University in national/regional/city/provincial meets are entitled to this privilege, upon recommendation of the Director of the University Sports and Development Program and application with the OSAS.\n\nMembers of the University Band: Students enrolled in BU for at least one semester and members of the University or College Band for one year are granted 75% free tuition, upon recommendation of the In-charge, BU Band.\n\nMembers of the University Cultural Groups: Students who are active officers and members of any of the University Cultural Groups, who have a GWA of at least a passing grade and do not have annual benefits exceeding Php 15,000.00, are entitled to incentives: Trainee/Novice Performer — Php 1,500.00 per semester or Php 500.00 per month; Resident Performer — Php 3,000.00 per semester or Php 1,000.00 per month (subject to evaluation of attendance and participation)."},{"c":"Student Handbook (Complete)","q":"What is the Tertiary Education Subsidy (TES) and financial aid?","a":"Tertiary Education Subsidy (TES): TES is provided under RA 10931 for eligible students, as administered through the University (see the OSAS / scholarship office for current TES application procedures).\n\nStudent Assistantship: Student Assistants must meet enrollment, conduct and grade conditions and may work up to 100 hours/month and 4 hours/day, adjusted for units. Student Assistantship is a form of financial aid that allows students to work in the University while studying.\n\nStudent Loan Grants: Student loans are available to qualified and deserving but financially disadvantaged students, in accordance with the OSAS student loan program.\n\nScholarship Privileges to Students of Graduate Schools and College of Medicine: as provided in the handbook."},{"c":"Student Handbook (Complete)","q":"How do I enlist in the NSTP?","a":"The University NSTP Office shall forward the schedule of NSTP orientation of the different units/colleges of the University to all incoming first year students, enclosed at the BUCET results mailed by the Admissions Office. The incoming first year students are required to attend the said orientation, for it includes enlistment to the different components of their choice. The enlistment shall be on a first come, first served basis."},{"c":"Student Handbook (Complete)","q":"How does the BU Library System work (privileges, card, borrowing, hours)?","a":"The University Library System is composed of the University Library and ten (10) Unit/College libraries: College of Education Library, College of Nursing Library, the ILS-Elementary Department Library and the ILS-High School Department (Main Campus); the East Campus Library (CEng & CIT); Daraga Campus Library (CSSP & CBEM); College of Agriculture and Forestry Library; Polangui Campus Library; Tabaco Campus Library; and the Gubat Campus Library.\n\nLibrary Privileges: All bona fide students of Bicol University (Graduate, Medicine, Undergraduate, Secondary and Elementary) are entitled to use the facilities of the libraries in all units/colleges, provided they present the library card duly countersigned by the Librarian-in-charge and validated for the current semester/summer.\n\nApplication for Library Card: Students shall secure an application from the unit/college librarian concerned by presenting the Certificate of Registration (COR). High school and elementary pupils will be given an application form once the Principal provides the Librarian-in-charge the official list of enrollees. The library cards will be issued after the students have submitted the duly accomplished form together with two copies of recent 1x1 ID photos.\n\nUse of Library Card: The library card will be used throughout the student's stay in the University. It is non-transferrable. It shall be used as identification and passport when entering the unit/college libraries and in borrowing book/s for overnight or over-weekend use. Any student who wishes to seek a University Clearance and Honorable Dismissal shall submit/surrender the Library card to their respective Librarians.\n\nLibrary Hours: University Library — 8:00 AM – 7:00 PM (no NOON BREAK) Monday–Friday; 8:00 AM – 5:00 PM Saturday. Tabaco Campus — 8:00 AM – 6:00 PM (no NOON BREAK) Mon–Fri. East Campus — 8:00 AM – 6:00 PM. Nursing — 8:00 AM – 5:00 PM. ILS-Children's Library — 7:40 AM – 5:00 PM. ILS-High School — 8:00 AM–12:00 NN, 1:00 PM–5:00 PM. Daraga Campus — 8:00 AM – 6:00 PM (no NOON BREAK); 9:00 AM – 4:00 PM Saturday. College of Agriculture & Forestry — 7:00 AM – 6:00 PM. Polangui Campus — 8:00 AM – 5:00 PM. Gubat Campus — 8:00 AM – 5:00 PM (including Sunday)."},{"c":"Student Handbook (Complete)","q":"What are the borrowing procedures and responsibilities of library users?","a":"Borrowing Procedure: Any student who wi
