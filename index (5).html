UCM College Registrar**.\n\n**Source:** Information provided by the BU Admissions Office.\n\n> This is an estimate — tuition and fee details may change. Confirm the complete breakdown with the BUCM College Registrar or through official BU announcements."},{"c":"About Bicol University","q":"When was Bicol University founded?","a":"Bicol University was founded on June 21, 1969 through Republic Act No. 5521 and institutionalized on September 22, 1970 through BOR Resolution No. 1."},{"c":"About Bicol University","q":"Who were BU’s founding fathers and founding president?","a":"The founding fathers were Senator Dominador R. Aytona, Congressman Carlos R. Imperial, and Congressman Jose M. Alberto. Atty. Ricardo A. Arcilla was the founding president, appointed on March 24, 1971."},{"c":"About Bicol University","q":"What schools were integrated to form BU?","a":"The Bicol Teacher’s College, Bicol Regional School of Arts and Trades, Roxas Memorial Agricultural School in Guinobatan, and the School of Fisheries in Tabaco City were integrated to form BU."},{"c":"About Bicol University","q":"What are BU’s main fields and profile recognitions?","a":"BU is a comprehensive university covering technology, engineering, architecture, sciences, arts, letters, culture, sports, agriculture, forestry, fisheries, business, health, medicine, social sciences, education and more. The 2025 handbook lists, among others, COE in Teacher Education; COD in Nursing and Fisheries; SUC Level IV; QS 3-Star Certification; and Level IV AACCUP institutional accreditation."},{"c":"Vision, Mission, Quality Policy & Governance","q":"What is Bicol University’s Vision?","a":"A University for Humanity characterized by productive scholarship, transformative leadership, collaborative service and distinctive character for sustainable societies."},{"c":"Vision, Mission, Quality Policy & Governance","q":"What is BU’s Mission and Quality Policy?","a":"Mission (RA 5521): to provide professional and technical training, advanced and specialized instruction in literature, philosophy, sciences and arts, and promote scientific and technological research.\n\nQuality Policy: BU continually strives for excellence in Instruction, Research and Extension by meeting the highest level of clientele satisfaction and adhering to quality standards and applicable statutory and regulatory requirements."},{"c":"Vision, Mission, Quality Policy & Governance","q":"Who is BU’s highest governing body?","a":"The Board of Regents (BOR), mandated by RA 8292, is the highest governing body. The University President chairs the Administrative and Academic Councils. The USC Chairperson serves as Student Regent on the BOR and is a non-voting invitee to the Administrative and Academic Councils."},{"c":"Admission — Undergraduate (BUCET)","q":"What is the BUCET and who must take it?","a":"The Bicol University College Entrance Test is a three-hour examination for incoming first-year students. It has sub-tests in English Language Proficiency, Mathematics, Science, and Reading Comprehension."},{"c":"Admission — Undergraduate (BUCET)","q":"How is the BUCET Composite Rating computed?","a":"It uses: (1) BUCET examination result; (2) General Weighted Average in Grades 9–11; and (3) Socio-Economic Profile score. Cut-off ratings are recommended by the Admissions Office using normative data for licensure and non-licensure courses."},{"c":"Admission — Undergraduate (BUCET)","q":"Who may apply as a first-year BUCET applicant?","a":"Eligible applicants include senior high school students from DepEd-recognized schools expected to graduate; SHS graduates not taking or who have not taken post-secondary subjects; and PEPT/ALS certificate holders eligible for college admission."},{"c":"Admission — Undergraduate (BUCET)","q":"What happens to qualified, waitlisted, and below-quota applicants?","a":"Qualified or waitlisted applicants who do not register on schedule forfeit their slot. Below-quota applicants may be considered for remaining vacancies after screening and evaluation by the concerned college/unit. Only applicants approved through this process may enroll."},{"c":"Admission — Medicine, Dental Medicine, Veterinary Medicine & Law","q":"What are the core Doctor of Medicine admission requirements?","a":"Applicants must have good moral character and no criminal record/final conviction; a baccalaureate degree with GWA of at least 85% or equivalent; and an NMAT score of at least the 65th percentile taken within two years before admission. Ranking is 40% NMAT, 40% GWA, and 20% interview. The handbook states the application period is December 1 to July 15, with a non-refundable ₱1,500 application fee."},{"c":"Admission — Medicine, Dental Medicine, Veterinary Medicine & Law","q":"What are the Doctor of Dental Medicine requirements?","a":"Applicants must meet the BOR-approved BUCET cut-off and be STEM graduates. Non-STEM graduates must pass a special Science and Mathematics aptitude test. The second-level screening includes visual acuity, psychological, dexterity, and oral interview assessments."},{"c":"Admission — Medicine, Dental Medicine, Veterinary Medicine & Law","q":"How does Doctor of Veterinary Medicine admission work?","a":"DVM follows undergraduate admission rules plus second-level screening. Criteria may include BUCET rating, physical/visual, psychological, aptitude and dexterity examinations, non-technical skills, and the capacity to sustain the program. VetMed Proper students need pre-exposure anti-rabies and tetanus immunizations."},{"c":"Admission — Medicine, Dental Medicine, Veterinary Medicine & Law","q":"What are Juris Doctor admission requirements?","a":"Applicants need a completed pre-law degree with GWA of 85% or BU equivalent (30%), a passed Law Entrance Examination (40%), and a passed panel interview (30%). Required documents include application and data privacy forms, TOR/GWA certification, PSA birth certificate, two 2×2 photos, and application fee. Law maximum residence is 1.5 times the normal course duration, excluding approved LOA."},{"c":"Transfer Students, Shifters, Returning Students & Credits","q":"Are transferees accepted and what are the basic requirements?","a":"Admission depends on an available slot declared by the Dean/Director. Submit a letter of intent, slot-availability certification, certified grades or OTR, Certificate of Honorable Dismissal, and pay the processing fee. Colleges may also require aptitude tests/interviews."},{"c":"Transfer Students, Shifters, Returning Students & Credits","q":"What are key eligibility rules for transferees?","a":"Assessment may include GPA of 2.0 or 89%, no failing grade, completion of at least 25% but at most 50% of required program units, and other college requirements. College of Medicine, College of Law, and BUCEILS do not accept transferees. Transfer credit is generally limited to 50% of total program units."},{"c":"Transfer Students, Shifters, Returning Students & Credits","q":"What is required for shifting?","a":"A shifter is an internal transferee. Submit a letter of intent explaining the reason, slot-availability certification, certified grades, and ₱250 processing fee after slot confirmation. The handbook also requires no two or more failing grades, less than 50% completion of current-program units, GWA of at least 2.4, and compliance with the receiving program’s requirements."},{"c":"Transfer Students, Shifters, Returning Students & Credits","q":"How can a returning student seek re-admission?","a":"Provide supporting medical or other documents explaining the period away. Re-admission depends on prior performance and compliance with rules; a clearance signed by concerned officials is required."},{"c":"Foreign / International Students & Outbound Travel","q":"What are general requirements for foreign students?","a":"New regular foreign students submit original TOR, Personal Data Sheet, Affidavit of Support, English-proficiency proof where applicable, and CHED-approved Study Permit. Foreign high school graduates also need secondary-completion certification and a qualifying BUCET score or recognized international equivalent."},{"c":"Foreign / International Students & Outbound Travel","q":"What is required for student travel abroad?","a":"An outbound student submits a letter of intent and request for Travel Order/Authority to Travel Abroad to the President through the department, Dean/Director, OSAS, International Relations Office and VPAA. IRO pre-departure orientation is required; within 15 days after return, submit the travel report and re-entry action plan."},{"c":"Academic Year, Uniform, Load & Classification","q":"How is the academic year structured?","a":"BU generally follows a semestral system: First Semester, Second Semester, and Midyear Term. One credit unit is at least 18 full hours of instruction per semester."},{"c":"Academic Year, Uniform, Load & Classification","q":"What are the academic load rules?","a":"The regular load is the load prescribed in the curriculum. Graduating students with satisfactory records may take one or two extra subjects in the last semester; Dean/Director approval is needed when total units exceed 30. Midyear regular load is up to 6 units, or up to 9 in justifiable cases with written approval."},{"c":"Academic Year, Uniform, Load & Classification","q":"What are regular, irregular and non-regular students?","a":"A regular undergraduate carries the curriculum-prescribed load. An irregular student is enrolled for formal credits but does not carry the prescribed full load. Non-regular students are not enrolled in a degree program or do not receive formal academic credit."},{"c":"Cross-Registration, Adding, Dropping & Substitution","q":"Can I cross-register?","a":"Within BU, cross-registration requires written permission from the Dean/Director and must not exceed the prescribed load; no cross-enrollment is allowed beyond one week after registration closes. Students from outside BU need a written permit from their home school. BU students need written authorization from both their Dean/Director and the University Registrar to receive credit outside BU."},{"c":"Cross-Registration, Adding, Dropping & Substitution","q":"When can I add, change, or substitute subjects?","a":"Changing, transferring, or adding subjects is generally allowed only within one week after registration closes, with written approval and payment of the fee. Substitution must be approved before the third class meeting and is limited to specified valid reasons. Unofficially added subjects earn no credit."},{"c":"Cross-Registration, Adding, Dropping & Substitution","q":"When can subjects be dropped?","a":"Before midterms, complete the required form with faculty recommendation and Dean/Director approval. After midterms, valid reasons must be certified by the concerned authority. Unofficial dropping after midterm receives a grade of 5.0. Absences reaching 20% of required hours may result in automatic dropping."},{"c":"Attendance, LOA & Scholastic Deficiency","q":"What should I do after an absence?","a":"Obtain an excuse letter from the adviser or guidance coordinator and show it to instructors not later than the second session after returning. Illness absences of 5 days to one month require a medical certificate. Excuses do not remove the duty to complete missed work."},{"c":"Attendance, LOA & Scholastic Deficiency","q":"What is the attendance 20% rule?","a":"A student may be dropped when lost hours reach 20% of scheduled work in a subject. If the majority of absences are excused, the dropped student must not receive a 5.0."},{"c":"Attendance, LOA & Scholastic Deficiency","q":"How long may a Leave of Absence last?","a":"An LOA is a temporary discontinuance for illness, employment, pregnancy, or other meritorious reasons. File a written petition before leaving. It may not exceed one academic year, but may be renewed for very meritorious reasons."},{"c":"Attendance, LOA & Scholastic Deficiency","q":"What are the probation and dismissal rules?","a":"One failed subject reduces the next-term load by equivalent units. Two failing marks place a student on probation with a maximum 12-unit load. A probationer who fails any subject may be dropped. Three or more failures in one semester may allow a petition to the Academic Petitions Committee under handbook conditions; an approved petition allows a maximum 9-unit load."},{"c":"Academic Integrity, Maximum Residence & Curriculum","q":"What counts as academic dishonesty?","a":"It includes plagiarism; unauthorized giving/receiving of examination information; unauthorized materials or communication during an examination; improper substantive aid; and taking, concealing, defacing or destroying assignment, research or examination materials."},{"c":"Academic Integrity, Maximum Residence & Curriculum","q":"What are sanctions for academic dishonesty?","a":"Possible sanctions include written warning, loss of credit, grade reduction, failing grade, suspension, dismissal, and other university sanctions. A notation becomes part of the permanent record."},{"c":"Examinations & Grading System","q":"How many regular examinations are there?","a":"Two regular examinations are prescribed per semester or term: midterm and final. Instructors may give additional written, oral or practical examinations."},{"c":"Examinations & Grading System","q":"Can a missed examination be made up?","a":"A make-up examination may be given within the same term for justifiable reasons, at the instructor’s discretion."},{"c":"Examinations & Grading System","q":"What is BU’s grading scale?","a":"BU uses number grades 1.0 (highest) to 5.0 (failure). Passing is 3.0 or 75. The final grade is computed as ⅓ Midterm Grade plus ⅔ Tentative Final Grade."},{"c":"Examinations & Grading System","q":"What is an INC and when must it be completed?","a":"INC means only a small portion of otherwise passing coursework remains. Complete it before the end of the succeeding semester, excluding midyear; otherwise it converts automatically to 5.0. It is excluded from GWA until replaced by a final grade."},{"c":"Graduation, Honors, Records & Cost-Recovery Courses","q":"What are the basic graduation requirements?","a":"Complete all academic and prescribed requirements; clear deficiencies at least five weeks before the end of the final term (except subjects currently enrolled); be in residence during the last two terms/semesters; and file the formal application within three weeks after enrollment in the final term."},{"c":"Graduation, Honors, Records & Cost-Recovery Courses","q":"What are the Latin honors ranges?","a":"Summa Cum Laude: 1.0000–1.2500; Magna Cum Laude: above 1.2500–1.5000; Cum Laude: above 1.5000–1.7500. Additional rules include no final grade lower than 3.0, conditions relating to INC grades and conduct, and other handbook requirements. Eligible transferees/irregular students may receive With Academic Distinction."},{"c":"Graduation, Honors, Records & Cost-Recovery Courses","q":"How do I request a Transcript of Records?","a":"Apply with student clearance and official receipt for transcript payment. Records are confidential and released only on the student’s request or to authorized institutions/officials."},{"c":"Graduation, Honors, Records & Cost-Recovery Courses","q":"What is a cost-recovery/petition course?","a":"A Dean/Director may approve a cost-recovery course for graduating students with deficiencies in courses not programmed or qualifying irregular students. Petition at least two weeks before enrollment. The handbook sets conditions on faculty load, costs, and use of fees."},{"c":"Financial Information, Free Higher Education & Refunds","q":"Who is eligible for free higher education?","a":"Under RA 10931, eligible undergraduates receive tuition and 13 approved miscellaneous fees subject to the IRR. Students must meet admission/retention rules, have no prior undergraduate degree, and not be overstaying."},{"c":"Financial Information, Free Higher Education & Refunds","q":"What is the RA 10931 one-year grace period?","a":"Free Higher Education benefits extend one year beyond the prescribed program length—for example, five years for a four-year course. Beyond this, the student pays tuition and other school fees."},{"c":"Financial Information, Free Higher Education & Refunds","q":"Can fees be paid by installment?","a":"Generally fees are paid in full at enrollment. For programs not covered by Free Higher Education, the Dean/Director may approve 50% at enrollment, 30% before midterms, and 20% before finals. Personal checks are not accepted for post-baccalaureate and graduate programs."},{"c":"Financial Information, Free Higher Education & Refunds","q":"What is the refund schedule?","a":"Except entrance and matriculation fees: 80% within one week from class opening; 50% within the second to fourth weeks; no refund after the fourth week. Handbook special rules cover late registration, death, authorized dropping, laboratory fees, and scholars."},{"c":"OSAS, Scholarships & Student Assistantship","q":"What does OSAS do?","a":"The Office of Student Affairs and Services supports holistic student development through Student Welfare Services, Student Development Services, and Institutional Student Programs and Services. It covers guidance, counseling, career placement, organizations, leadership, discipline, publications, scholarships, housing, sports, culture and arts."},{"c":"OSAS, Scholarships & Student Assistantship","q":"What are President’s Lister and Dean’s Lister distinctions?","a":"For non-graduating students with no grade lower than 2.400: President’s Lister is 1.000–1.4500; Dean’s Lister is above 1.4500–1.7500."},{"c":"OSAS, Scholarships & Student Assistantship","q":"What are key scholarship and aid options?","a":"The handbook covers TES, academic recognition, athlete/band/cultural-group benefits, Graduate School and BUCM tuition privileges, CGMS, MSRS, externally funded scholarships, and student loan programs including SLF-RV, SLP-COE, SELAF, ELELAP, STUFAP and SAFE. Apply through OSAS; complete applications and renewal conditions apply."},{"c":"NSTP & Library Services","q":"What is NSTP and who must take it?","a":"All incoming first-year students must complete NSTP as a graduation requirement under RA 9163. Components are CWTS, LTS and ROTC. Enlistment during orientation is first-come, first-served. CWTS and LTS graduates become members of the National Service Reserve Corps."},{"c":"NSTP & Library Services","q":"Who may use BU libraries and what are key rules?","a":"Bona fide BU students with a valid BU ID may use libraries. Observe silence and conduct rules; do not use another person’s ID; do not smoke, eat or drink except in designated areas; and follow library gadget, security and property rules."},{"c":"NSTP & Library Services","q":"What online library services are available?","a":"The handbook lists book reservation/borrowing, document scanning, online-resource access, and seat/facility reservations through AskRISA and related forms. Theses, dissertations and print journals are generally for on-site use only."},{"c":"NSTP & Library Services","q":"What are Fair Use scanning limits?","a":"Books: up to 20 pages or 10% of total pages, whichever is higher. Journals: one article or 10% of pages. A maximum of three materials may be requested; service is free and normally delivered by email in 2–3 days."},{"c":"Medical, Dental & Other Campus Facilities","q":"What health services are available?","a":"BU Health Services provides pre-enrollment medical/dental examinations, consultations, follow-ups, first aid, referral, free medicines for the first three treatment days, oral prophylaxis and dental extraction. The handbook lists a main clinic behind the University Library and satellites at BU Tabaco, East, Daraga, Guinobatan, Polangui and Gubat."},{"c":"Medical, Dental & Other Campus Facilities","q":"What documents/labs are generally required for pre-enrollment health clearance?","a":"The handbook lists the Student Health Record and Individual Dental Health Record, chest X-ray PA, CBC with blood typing, urinalysis, and program-specific requirements such as Hepatitis A/B screening, tetanus, COVID-19 vaccination proof and specialist clearance. Check the current student portal/UHS instructions because requirements and validity periods vary by program."},{"c":"Medical, Dental & Other Campus Facilities","q":"What dormitory, guestel and sports facilities are described?","a":"The handbook describes four dormitories, the main-campus Guestel/Hostel, Manila Extension Office transient house, sports facilities including courts, oval, field, pools and gymnasium, an amphitheater, AV/language facilities, canteens, reprographic services, and 24-hour Civil Security Unit support."},{"c":"Student Conduct, Discipline & Grievances","q":"What are examples of minor offenses?","a":"Examples include smoking on campus, unexcused absence from required activities, unapproved postings/representation, uniform or ID violations, and littering/vandalism. The handbook’s progression is: first offense written reprimand; second community service; third one day to one week suspension."},{"c":"Student Conduct, Discipline & Grievances","q":"What are examples of major offenses?","a":"The handbook lists bullying/cyberbullying, cybercrime, weapons, disorder, property destruction, disobedience, dishonesty, alcohol, falsification, gambling, hazing, malversation, voyeurism, plagiarism, illegal drugs, sexual harassment, stalking, theft, unauthorized solicitation, intellectual-property violations, Safe Spaces Act violations and data-privacy violations. Hazing is dismissal on the first offense."},{"c":"Student Conduct, Discipline & Grievances","q":"What due-process rights does a student have in a disciplinary case?","a":"The student must be informed in writing of the accusation, may answer with counsel if desired, must be informed of evidence, may present evidence, and has the right to have evidence duly considered. Cases start from a written/sworn complaint to the Dean/Director and are referred to the College/Unit Disciplinary Committee."},{"c":"Student Conduct, Discipline & Grievances","q":"How do I file a grievance or grade appeal?","a":"For non-academic concerns, file with OSAS in person or in writing; it acts within five days, after which unresolved matters may go to the University Grievance Committee. For grade concerns: raise the issue with the subject teacher, then Department Chair, then Dean/Director, and finally the University Grievance Council at VPAA if unresolved."},{"c":"Student Rights, Organizations, USC & Publications","q":"What are students’ fundamental rights and responsibilities?","a":"Rights include quality education, guidance, free speech and press subject to order, representation, lawful organizations, safety, information, due process, access to records, timely credentials, protection against discrimination and harassment, and intellectual-property rights. Responsibilities include upholding BU’s good name, respecting others and authorities, participating in civic affairs, and exercising rights responsibly."},{"c":"Student Rights, Organizations, USC & Publications","q":"How do I establish a student organization?","a":"At least 15 students may apply. Submit BU-F-OSAS-18 in triplicate, Constitution and By-Laws, officers/members/adviser list, two-semester activity plan and flyer. UBOs are handled by the University Committee on Accreditation; CBOs by the College Committee. Existing organizations renew within 30 days after regular first-semester classes start."},{"c":"Student Rights, Organizations, USC & Publications","q":"What are the adviser rules?","a":"Advisers are generally regular full-time BU personnel/faculty with relevant experience, may advise no more than two organizations, and should serve at least one year. They consult, attend activities, guide planning, are present for off-campus representation, and co-sign bank transactions."},{"c":"Student Rights, Organizations, USC & Publications","q":"What are the USC and Bicol Universitarian?","a":"The University Student Council is the official student government. Its elected Chairperson is the Student Regent. Bicol Universitarian (Unibe) is the official university student publication under RA 7079."},{"c":"Off-Campus Activities, Projects & Prohibitions","q":"What are the requirements for off-campus activities?","a":"Activities need minimal class disruption, notarized parental permit, group insurance, required approvals, and a written proposal covering objectives, participants, safety/security, budget and funding. Non-participation must not result in a failing or incomplete grade; a comparable alternative should be provided."},{"c":"Off-Campus Activities, Projects & Prohibitions","q":"Who approves local and foreign student travel?","a":"Within the region for up to seven days: Dean/Director; within the region beyond seven days up to one month: VPAA; outside the region: University President. Foreign travel of one month or less is approved by the University President upon recommendation; longer travel follows applicable government issuances."},{"c":"Off-Campus Activities, Projects & Prohibitions","q":"What timing and safety rules apply?","a":"Start preparation at least one month before departure and finalize papers at least two weeks before. No activities two weeks before midterms or one month before finals. The handbook gives requirements for chaperons, transport, first aid/safety training, itinerary, enrollment verification and insurance."},{"c":"Off-Campus Activities, Projects & Prohibitions","q":"What is prohibited in curricular projects and activities involving student money?","a":"Projects must appear in the syllabus with cost limits and approved sourcing. Materials paid by students belong to students and must be charged at cost. Prohibited practices include compelling participation, punitive action for non-participation, exorbitant contributions, conflicts of interest involving certain relatives of officials/employees, participation by unenrolled or unfit students, and unapproved side trips."},{"c":"Appendices & Official Reference","q":"What is included in the handbook appendices?","a":"Appendix A: supporting BOR resolutions/administrative orders; B: Student Internship Program checklist; C: externally funded scholarships; D: undergraduate fees; E: prescribed uniforms; F: handbook reply slip."},{"c":"Appendices & Official Reference","q":"Where should I verify a policy or implementing requirement?","a":"Use the official 2025 Student Handbook first, then contact the concerned College/Unit, Office of Admissions, OSAS, UHS, University Registrar, Library, International Relations Office, or other responsible office. Policies, fees, schedules and implementing procedures may change."},{"c":"Conversations","q":"What is the Conversations section?","a":"The **Conversations** section is reserved for approved updates and frequently asked questions submitted through ISKO Help Center. It is not an instant chat or automatic publication channel.\n\n**What happens after submission:** Your question is sent to the review channel. When an answer or update is approved for public sharing, it may be added to this section or to the most relevant FAQ category.\n\n**What to do:** After submitting, watch official BU announcements and revisit ISKO Help Center for future updates. For urgent or personal concerns, contact the responsible BU office directly."},{"c":"Conversations — BUCET & Admissions Questions","q":"May I ask what requirements are needed since my parents are married but separated (father with new family), my mother is an OFW, and I am currently living with my grandmother?","a":"Since your mother is an OFW and you are currently living with your grandmother, the applicable requirements depend on whether your grandmother is officially your guardian.\n\n**If your grandmother is your legal guardian:**\n• Affidavit of Guardianship\n• Your grandmother's applicable financial document, such as ITR or CTE, depending on her employment/income status\n• Your mother's latest OFW employment contract indicating her salary or compensation\n\n**For your father:** If he is not providing financial support or is otherwise unavailable, kindly indicate the circumstances in the application and submit the applicable supporting documents, if required.\n\n**Important note:** Being separated does not automatically make your mother a solo parent. A valid Solo Parent ID is required if claiming the Solo Parent provision.\n\nIf your grandmother is only providing temporary care and is not your legal guardian, please let us know so we can advise you on the appropriate documentary requirements."},{"c":"Conversations — BUCET & Admissions Questions","q":"I would like to request cancellation of my scheduled appointment for submission of college admission requirements and have it rescheduled to a later date. Some of my documents are not yet ready, and I was unable to cancel within the 48-hour period due to technical difficulties with my Google account.","a":"If your required documents are not yet complete, kindly wait for a new available appointment schedule in the **iBU Admissions Portal** and book a later date once your requirements are ready.\n\n**Please note:**\n• Appointments are subject to the available schedules in the system.\n• Monitor your portal regularly for newly opened slots.\n\nThank you for your understanding and cooperation."},{"c":"Conversations — BUCET & Admissions Questions","q":"I am an incoming first-year applicant for BUCET SY 2027–2028. My parents are separated, my mother is a housewife with no income, and I am financially supported by my OFW stepfather. I have no contact with my biological father and cannot obtain his 2025 ITR. What documents should I submit in place of my biological father's ITR?","a":"Since your parents are separated and you are currently financially supported by your stepfather, kindly submit the following documents, as applicable:\n\n• **Mother:** Certificate of Tax Exemption (CTE), since she is a housewife with no income.\n• **Stepfather:** Latest Certificate of Employment/Employment Contract indicating his salary or compensation, since he is an OFW and is currently providing financial support.\n• **Biological father:** If you have no contact with him and are unable to secure his 2025 ITR, please provide a written explanation or supporting document regarding his absence/unavailability, if available.\n\n**Please note:** The information in your application should remain consistent with your legal and family circumstances. Your stepfather's financial document may be submitted to establish the source of your current financial support. Upon submission, our office will verify the documents and advise you if any additional supporting document is needed."},{"c":"Conversations — BUCET & Admissions Questions","q":"FOLLOW-UP: My grandmother is only providing temporary care, and my father is providing financial support. What specific requirements do I need?","a":"Since your grandmother is only providing temporary care and is not your legal guardian, you do not need to submit an Affidavit of Guardianship.\n\nSince your father is providing financial support, the applicable requirements are based on your parents' employment/income status:\n\n• **Father:** Submit his applicable financial document, such as the 2025 ITR if he is working and files taxes.\n• **Mother:** If she is an OFW, submit her latest employment contract indicating her salary or compensation. If she is not working, submit her Certificate of Tax Exemption (CTE), as applicable.\n• **Grandmother:** No financial document is required if she is only providing temporary care and is not your legal guardian.\n\nPlease make sure that the information in your application accurately reflects your family circumstances. Thank you, and please let us know if you have any further concerns."},{"c":"Conversations — BUCET & Admissions Questions","q":"I would like to ask about the Contract of Service requirement for my mother, who is an OFW in Turkey. We only have an old photo of her original contract. May I submit the photo for now and submit a clearer copy later?","a":"You may submit the available clear photo/copy of your mother's Contract of Service for **initial reference**, provided that the relevant details, particularly her salary or compensation, are readable.\n\nOnce your mother is able to retrieve the original or a clearer copy, kindly submit it to the Admissions Office for verification and completion of your records.\n\nPlease ensure that the copy you initially submit is as clear and complete as possible. Our office will verify the document upon submission and advise you if a clearer or authenticated copy is still necessary."},{"c":"Conversations — BUCET & Admissions Questions","q":"I would like to reschedule my BUCET application appointment because I have a school presentation at the same time. Is there another available date or time?","a":"You may check your **iBU Admissions Portal** for available appointment schedules and select another date or time, if a new slot becomes available.\n\n**Please also note:**\n• Appointments are subject to the available slots in the system — kindly monitor your portal regularly.\n• Appointment schedules should be strictly followed once booked.\n• If you need to cancel or reschedule, do so within the required 48-hour period when possible."},{"c":"Conversations — BUCET & Admissions Questions","q":"I am a BUCET applicant for AY 2027–2028. My father is a tricycle driver and my mother is a housewife — they do not have an Income Tax Return (ITR). Should we submit an ITR, a Certificate of Tax Exemption (CTE), or both?","a":"If both parents are not filing an Income Tax Return, kindly submit a **Certificate of Tax Exemption (CTE)** for both parents.\n\nSince your father is a tricycle driver and your mother is a housewife, they may secure the appropriate CTE as proof of their tax-exempt/non-filing status. **No ITR is required** if they are not required to file one."},{"c":"Conversations — BUCET & Admissions Questions","q":"My parents cannot get a CTE or ITR. Are there any alternatives? I am worried about missing the deadline.","a":"We understand your concern. However, the required financial documents are part of the BUCET requirements and should be submitted based on your parents' employment or income status.\n\nIf your parent is not required to file an ITR, the appropriate document is the **Certificate of Tax Exemption (CTE)**. There is no general substitute for the ITR/CTE indicated in the requirements.\n\nIf the documents are still being processed, kindly secure **proof that you have already requested or applied** for the appropriate document and submit the required document as soon as it becomes available.\n\nPlease note that incomplete requirements may not be processed. We encourage you to process the documents as early as possible to avoid missing the submission deadline."},{"c":"Conversations — BUCET & Admissions Questions","q":"The last part of my BUCET application form is cut off when I print it. May I request a reformatted version that fits into two pages?","a":"Thank you for bringing this to our attention.\n\nThe final section of the BUCET application form should not be intentionally cut off. If the downloaded or printed form appears to have missing content, kindly:\n\n• Try **downloading the application form again** from your **iBU Admissions Portal** and print it using the prescribed paper size.\n• The application form should be printed **back-to-back on 8.5 × 13-inch long bond paper**.\n• Make sure that the printer settings are set to the correct paper size and that **no scaling or cropping** is applied.\n\nIf the section is still cut off after re-downloading and printing with the correct settings, kindly send us a screenshot or copy of the affected page so we can assist you further. Thank you!"},{"c":"Conversations — BUCET & Admissions Questions","q":"Can my parent submit my BUCET requirements on my behalf?","a":"Yes, your parent may submit your BUCET requirements on your behalf, provided that:\n• The requirements are complete.\n• The submission is made according to your scheduled appointment.\n\nPlease make sure your parent brings all the required documents and your application form for submission and verification."},{"c":"Conversations — BUCET & Admissions Questions","q":"Is it possible to submit requirements without an appointment? Also, can the grades on the second page of the application form be handwritten instead of printed?","a":"**Regarding walk-in submissions:** For the submission of requirements, walk-ins without an appointment will not be accommodated. Kindly secure an appointment through your **iBU Admissions Portal** and follow your scheduled submission date and time.\n\n**Regarding the grades on the second page:** The school registrar/authorized school personnel should fill out the grades for Grades 9 to 11 and affix the required signature and school dry seal. The entries **may be handwritten**, provided that they are clear and properly accomplished. Thank you for your understanding and cooperation."},{"c":"Conversations — BUCET & Admissions Questions","q":"Both of my parents are employed in Spain and no longer have copies of their OFW employment contracts. They have official Spanish employer documents showing the employer's name and their base salary. May we submit these instead of the OFW Contract/ITR?","a":"Yes. If your parents are OFWs and no longer have copies of their employment contracts, you may submit the **official Spanish employer documents** showing their employment and corresponding salary/base compensation for evaluation.\n\nPlease submit the available documents for both parents, ensuring that the employer's name and salary/compensation are clearly indicated. If the documents are in Spanish, it would also be helpful to provide an **English translation** if available.\n\nThe Admissions Office will verify the documents upon submission and advise you if any additional supporting document is needed."},{"c":"Conversations — BUCET & Admissions Questions","q":"My relative graduated from Senior High School in 2024. She briefly processed her credentials at another school last year but withdrew after a few days without attending classes or earning any college units. Is she still eligible to apply and take the BUCET for AY 2027–2028?","a":"Yes. If your relative graduated from Senior High School in 2024 and has not taken or earned any college subjects/units, she may still apply for and take the BUCET for AY 2027–2028, subject to the applicable admission requirements.\n\nSince she did not officially attend classes or earn college units at the other school, she should secure her **Grade 12 report card (SF9/Form 138)**, as this will be required for the BUCET application. She should also prepare the other required documents and complete the online application through the **iBU Admissions Portal**. Thank you, and we wish her the best in her application."},{"c":"Conversations — General Application (BUCET)","q":"Who can apply for BUCET?","a":"Incoming first-year applicants who are:\n\n• Grade 12 students from DepEd-recognized high schools who are expected to graduate at the end of the school year.\n• Senior high school graduates who have not taken or are not taking any college subject/s.\n• ALS graduates who have not enrolled in any college course.\n\nApplicants who have already earned college subjects or units may not qualify as first-year BUCET applicants."},{"c":"Conversations — General Application (BUCET)","q":"How do I apply for BUCET?","a":"You need to create an account and complete your application through the **iBU Admissions Portal** at ibu.bicol-u.edu.ph. After completing the online application, follow the instructions in your account regarding your application form, documentary requirements, submission mode, appointment, and examination schedule."},{"c":"Conversations — General Application (BUCET)","q":"Where can I find the complete list of requirements?","a":"You may check the official Bicol University admission requirements page at ibu.bicol-u.edu.ph/admission-requirements and the official Bicol University announcement for BUCET 2027-2028 on the official Bicol University Facebook page."},{"c":"Conversations — General Application (BUCET)","q":"I graduated from senior high school years ago but never earned college units. Can I still apply?","a":"Yes. If you meet the eligibility requirements and have not taken or earned college subjects/units, you may still be eligible to apply. You will need to submit the required senior high school records, including the applicable Grade 12 report card (SF9/Form 138)."},{"c":"Conversations — General Application (BUCET)","q":"I processed enrollment at another college but withdrew before attending classes. Can I still apply as a first-year BUCET applicant?","a":"Yes. If you did not attend classes and did not earn any college subjects or units, and did not request a transfer credential from that institution, you may still be eligible. Secure your Grade 12 report card/SF9 and other required documents for verification."},{"c":"Conversations — General Application (BUCET)","q":"What does \"waitlisted\" mean for BUCET?","a":"A waitlisted applicant is one who has a high composite rating but is not initially included because of the limited number of available slots. If qualified applicants do not enroll, waitlisted applicants may be accommodated according to their rank to fill the available slots."},{"c":"Conversations — General Application (BUCET)","q":"I qualified for Bicol University last year but did not enroll. Can I automatically use my previous BUCET result?","a":"No. A previous BUCET qualification does not automatically mean that it can be used for a new academic year's admission. Applicants should coordinate with the Admissions Office regarding their specific case and current admission cycle."},{"c":"Conversations — Application Form & Personal Information","q":"What name should I enter in the application?","a":"Always use your complete legal name, exactly as reflected in your official birth certificate or PSA record. Do not use nicknames, shortened names, or a second given name as your middle name."},{"c":"Conversations — Application Form & Personal Information","q":"I entered the wrong name in my application. Can it still be corrected?","a":"If the portal still allows you to edit your profile, correct the information there. If editing is no longer available, contact the Admissions Office and provide a screenshot of the incorrect information so the concern can be properly assessed."},{"c":"Conversations — Application Form & Personal Information","q":"I entered my second given name as my middle initial. Is that okay?","a":"No. The application should contain your legal name, not merely initials or an assumed middle name. For example, if your legal name is Juan Dela Cruz with middle initial A., the middle name is A., not your second given name. The information should follow your official legal documents."},{"c":"Conversations — Application Form & Personal Information","q":"Can I change my photograph after submitting it?","a":"If the portal allows you to re-upload the photograph, you may upload the correct photo again. Make sure that the photograph follows the prescribed specifications and is clear, recent, unedited or unfiltered, and taken against a white background."},{"c":"Conversations — Application Form & Personal Information","q":"My downloaded application form looks different or cut off when printed. What should I do?","a":"Try downloading the application form again from your **iBU Admissions Portal**. The application form should be printed back-to-back on 8.5 x 13-inch long bond paper. Make sure that the printer settings are set to the correct paper size and that no scaling or cropping is applied. If the section is still cut off after re-downloading and printing with the correct settings, kindly send a screenshot or copy of the affected page to the Admissions Office for assistance."},{"c":"Conversations — Application Form & Personal Information","q":"My application form has slightly different margins after printing. Will it be rejected?","a":"A slight difference in the margins due to printing is generally acceptable as long as the entire form and all required information are clearly visible and readable. Make sure that no portion of the form is actually cut off."},{"c":"Conversations — Application Form & Personal Information","q":"Do I need to print two copies of the application form?","a":"No. Only one accomplished copy of the BUCET Application Form is required unless otherwise instructed. The form should be printed back-to-back on 8.5 x 13-inch long bond paper."},{"c":"Conversations — Application Form & Personal Information","q":"Can the school write the grades by hand?","a":"Yes. The required Grades 9 to 11 academic ratings may be filled out by the school registrar or authorized school personnel, provided that the entries are clear and properly signed and sealed as required. The entries may be handwritten, provided that they are clear and properly accomplished."},{"c":"Conversations — Application Form & Personal Information","q":"Can I sign the form using black ink?","a":"Yes. Either black or blue ink may be used for the signature and for the grades filled out by the authorized school personnel. There is no specific requirement that the signature must be in blue ink."},{"c":"Conversations — Application Form & Personal Information","q":"I cannot generate my application form properly or some information is missing. What should I do?","a":"If the application form does not fully reflect the information you entered in the iBU website, try generating the form again at a later time. If information is still missing, report the issue to the Admissions Office and provide a screenshot. The concern can then be referred to the technical team for checking."},{"c":"Conversations — School Records","q":"Does the school need to submit Form 137 or SF10?","a":"If the school chooses to submit the SF10 or Learner's Permanent Academic Record, it should be a certified true copy. For the BUCET application form, the school should accomplish the portion for the Grades 9 to 11 academic ratings as instructed."},{"c":"Conversations — School Records","q":"Does Bicol University issue a request letter for Form 137?","a":"No. Bicol University does not issue a separate request letter for the release of Form 137 or SF10 for this purpose. The applicant should submit the BUCET form to the school and have the appropriate school officer accomplish the required portion for Grades 9 to 11."},{"c":"Conversations — School Records","q":"What if our school is implementing the Strengthened Senior High School Curriculum and the subjects are not available in the portal?","a":"Concerns regarding missing subjects under the Strengthened Senior High School Curriculum are being noted for coordination with the technical team. If the appropriate subject is not available in the dropdown, you may attach or provide the SF9 for complete academic reference, as applicable."},{"c":"Conversations — Appointment & Submission of Requirements","q":"Where do I submit my BUCET requirements?","a":"Your submission venue depends on the submission mode selected and indicated in your **iBU Admissions Portal**. Applicants may be assigned to onsite submission at a designated venue or submission through their school coordinator. Always follow the submission details reflected in your portal."},{"c":"Conversations — Appointment & Submission of Requirements","q":"Do I need an appointment before submitting my requirements?","a":"Yes. For onsite submission, applicants should follow the appointment schedule indicated in the **iBU Admissions Portal**. Walk-in submissions without an appointment will not be accommodated."},{"c":"Conversations — Appointment & Submission of Requirements","q":"Can I change my submission appointment or reschedule to a later date?","a":"You may check your **iBU Admissions Portal** for available appointment slots. If another date or time becomes available, you may select the available slot, subject to the system's availability. Monitor your portal regularly for newly opened slots. Appointments are subject to available schedules in the system."},{"c":"Conversations — Appointment & Submission of Requirements","q":"My required documents are not yet ready and I cannot reschedule within 48 hours. What should I do?","a":"If your required documents are not yet complete, kindly wait for a new available appointment schedule in the **iBU Admissions Portal** and book a later date once your requirements are ready. Appointments are subject to the available schedules in the system. Monitor your portal regularly for newly opened slots."},{"c":"Conversations — Appointment & Submission of Requirements","q":"I want an earlier appointment, but there are no available slots. What should I do?","a":"Please check your **iBU Admissions Portal** from time to time. If an earlier slot becomes available because of cancellations or additional schedules, you may book it through the portal."},{"c":"Conversations — Appointment & Submission of Requirements","q":"My examination is earlier than my documentary submission appointment. Is that possible?","a":"Yes. The BUCET examination schedule and documentary submission appointment are separate schedules. An applicant may have an examination schedule before the date of the documentary submission appointment. However, the applicant must still submit the complete documentary requirements within the prescribed period."},{"c":"Conversations — Appointment & Submission of Requirements","q":"Can I take the examination even if I have not submitted my documents yet?","a":"Yes. The BUCET testing schedule is separate from the submission of documentary requirements. You may receive or be assigned a testing schedule even if the documentary requirements have not yet been submitted, provided that the online application has been properly completed and processed. However, you must still submit the complete documentary requirements within the prescribed submission period to complete the application process."},{"c":"Conversations — Appointment & Submission of Requirements","q":"Can I submit my requirements before my scheduled appointment?","a":"Please follow the appointment schedule reflected in your **iBU Admissions Portal**. If you want an earlier schedule, check the portal for an available appointment and book it if the system allows."},{"c":"Conversations — Appointment & Submission of Requirements","q":"Can my parent submit my requirements for me?","a":"Yes. A parent may submit the applicant's requirements on the applicant's behalf, provided that the complete requirements are brought and the scheduled appointment is followed. Please make sure your parent brings all the required documents and your application form for submission and verification."},{"c":"Conversations — Appointment & Submission of Requirements","q":"Can my cousin or another relative submit my requirements?","a":"Yes. A representative may submit the requirements on the applicant's behalf, subject to the applicable authorization and identification requirements. It is advisable for the representative to bring an authorization letter from the applicant, together with the complete requirements and applicable IDs."},{"c":"Conversations — Appointment & Submission of Requirements","q":"I cannot personally attend because I have an important appointment. Can someone else submit for me?","a":"Yes. You may have an authorized representative submit your requirements, provided that the representative follows the scheduled appointment and brings the necessary documents and authorization."},{"c":"Conversations — Appointment & Submission of Requirements","q":"Can I submit my requirements through a courier?","a":"Applicants who are allowed to use courier submission should follow the instructions indicated in the **iBU Admissions Portal**. Authenticated copies by the school may be accepted. Applicants who are not yet senior high school graduates do not need to submit original copies of documents that are not required in original form. The courier tracking number is optional unless specifically required by the system."},{"c":"Conversations — Appointment & Submission of Requirements","q":"Do I need to submit original documents if I use a courier?","a":"For applicants who are not yet senior high school graduates, authenticated copies by the school are accepted and original copies need not be provided for the submission. Applicants should still keep their original documents for verification when required."},{"c":"Conversations — Appointment & Submission of Requirements","q":"My scheduled appointment is after the deadline for my nearest submission venue. What should I do?","a":"Kindly check your **iBU Admissions Portal** from time to time for an earlier available appointment. If an earlier slot becomes available, you may book it through the portal, subject to availability. Walk-ins will not be accommodated, as submission schedules are strictly followed. You may also check if another designated submission venue with an available schedule is accessible to you."},{"c":"Conversations — Appointment & Submission of Requirements","q":"Is it possible to submit requirements without an appointment or as a walk-in?","a":"No. For the submission of requirements, walk-ins without an appointment will not be accommodated. Kindly secure an appointment through your **iBU Admissions Portal** and follow your scheduled submission date and time."},{"c":"Conversations — Testing Schedule & Venue","q":"How is the examination venue assigned?","a":"Applicants are assigned to testing centers pre-determined by the system based on their address or location. Applicants generally cannot freely choose any testing center if the system has already assigned a venue."},{"c":"Conversations — Testing Schedule & Venue","q":"Can I request a particular testing venue?","a":"You may request a venue if the system or Admissions Office provides that option. However, testing center assignments are generally determined by the system based on the applicant's address or location."},{"c":"Conversations — Testing Schedule & Venue","q":"I want to take the examination in a specific city. Can I choose it?","a":"Testing assignments are based on the system's predetermined assignment according to the applicant's address or location. If your preferred city is available and assigned to you, follow the testing details shown in your portal."},{"c":"Conversations — Testing Schedule & Venue","q":"Are the testing slots already full?","a":"Applicants should rely on official Bicol University announcements and their **iBU Admissions Portal**, rather than unverified information circulating on social media. As long as an applicant has properly submitted the application within the prescribed deadline and is assigned a testing schedule, the applicant will be accommodated according to the official process."},{"c":"Conversations — Testing Schedule & Venue","q":"Can I go directly to BU and request to take the examination earlier?","a":"No. Please follow the examination schedule assigned through the official process. The documentary submission appointment and examination schedule should not be confused with one another."},{"c":"Conversations — Income, ITR & CTE Requirements","q":"What if both parents are working?","a":"Submit the 2025 ITR of both parents, as applicable."},{"c":"Conversations — Income, ITR & CTE Requirements","q":"What if only one parent is working?","a":"Submit the 2025 ITR of the working parent and the CTE of the non-working parent, as applicable."},{"c":"Conversations — Income, ITR & CTE Requirements","q":"What if both parents are not working?","a":"Submit the CTE for both parents."},{"c":"Conversations — Income, ITR & CTE Requirements","q":"My father is a tricycle driver and has no ITR. What should we submit?","a":"If your father is a tricycle driver and is not required to file an ITR, you may submit a Certificate of Tax Exemption (CTE) in place of the ITR. If your mother is also not working or not required to file an ITR, her applicable CTE should also be submitted."},{"c":"Conversations — Income, ITR & CTE Requirements","q":"My mother is a housewife and has no income. Does she need an ITR?","a":"If she is not required to file an ITR, the appropriate CTE should be submitted."},{"c":"Conversations — Income, ITR & CTE Requirements","q":"My parent is a minimum-wage earner. Should we submit an ITR or CTE?","a":"The applicable document depends on the parent's tax-filing status. If the parent is not required to file an ITR, submit the appropriate CTE. If an ITR is applicable, submit the required 2025 ITR."},{"c":"Conversations — Income, ITR & CTE Requirements","q":"My parent is employed under substituted filing. Can we submit BIR Form 2316?","a":"Yes. If the parent is under substituted filing and does not have a separately filed ITR, the 2025 **BIR Form 2316** may be submitted as proof of income."},{"c":"Conversations — Income, ITR & CTE Requirements","q":"My parent has no ITR because the income is non-taxable. Is a Certificate of Employment enough?","a":"No. A Certificate of Employment alone is not the prescribed substitute for the ITR. If the parent is not required to file an ITR, submit the applicable CTE. If the parent is required to file an ITR, submit the applicable 2025 ITR."},{"c":"Conversations — Income, ITR & CTE Requirements","q":"If one parent is working but the salary is within the non-taxable income bracket, would the Certificate of Employment suffice?","a":"No. If the parent is employed but the income is non-taxable, a Certificate of Employment alone is not the prescribed substitute for the ITR. Kindly submit the appropriate Certificate of Tax Exemption (CTE) for the parent who is not required to file an ITR. If the parent is required to file an ITR, submit the applicable 2025 ITR."},{"c":"Conversations — Income, ITR & CTE Requirements","q":"My parent is an OFW. What should we submit?","a":"For an OFW parent, submit the latest Certificate of Employment or Employment Contract with the corresponding salary or compensation indicated."},{"c":"Conversations — Income, ITR & CTE Requirements","q":"My OFW parent's employment contract is unavailable. What can we do?","a":"If the original contract is unavailable, submit an official employment document showing the employer and the corresponding salary or compensation, if available. The document will be evaluated upon submission. Additional supporting documents may be requested if necessary."},{"c":"Conversations — Income, ITR & CTE Requirements","q":"My OFW parent is abroad and cannot send the original contract yet. Can I submit a copy first?","a":"Yes. Submit the clearest available copy or official employment document and inform the receiving personnel that the original or clearer copy is currently unavailable. The document will be subject to verification. You may submit the available clear photo or copy of the contract for initial reference, provided that the relevant details, particularly salary or compensation, are readable. Once the original or clearer copy is available, kindly submit it to the Admissions Office for verification and completion of your records."},{"c":"Conversations — Income, ITR & CTE Requirements","q":"Both of my parents are employed abroad and their documents are not in English. Can we submit them?","a":"Yes. You may submit the official foreign employer documents showing their employment and corresponding salary or base compensation for evaluation. If the documents are in another language, it would also be helpful to provide an English translation if available. The Admissions Office will verify the documents upon submission and advise you if any additional supporting document is needed."},{"c":"Conversations — Income, ITR & CTE Requirements","q":"What if I cannot secure my parents' ITR or CTE due to conflicts and might not meet the deadline? Are there alternatives?","a":"The required financial documents are part of the BUCET requirements and should be submitted based on your parents' employment or income status. If your parent is not required to file an ITR, the appropriate document is the CTE. There is no general substitute for the ITR or CTE indicated in the requirements. If the documents are still being processed, kindly secure proof that you have already requested or applied for the appropriate document and submit the required document as soon as it becomes available. Incomplete requirements may not be processed. Process the documents as early as possible to avoid missing the deadline."},{"c":"Conversations — Income, ITR & CTE Requirements","q":"My parent is a 4Ps member. Do we still need an ITR or CTE?","a":"No. For applicants whose parent or parents are members of 4Ps, the **Oath of Commitment** is the applicable document indicated in the requirements. 4Ps membership is understood to identify the household as belonging to a low-income group eligible for the program."},{"c":"Conversations — Income, ITR & CTE Requirements","q":"If both parents are 4Ps members, do they need separate documents?","a":"The 4Ps **Oath of Commitment** may serve as the supporting document for the family's 4Ps status. Submit the document applicable to your family's circumstances."},{"c":"Conversations — Income, ITR & CTE Requirements","q":"Is a Certificate of Indigency a substitute for a CTE?","a":"No. A Certificate of Indigency is not automatically a substitute for the required CTE. If a CTE is required based on the parent's tax status, the appropriate CTE should be secured and submitted."},{"c":"Conversations — Income, ITR & CTE Requirements","q":"My parent is retired. What should we submit?","a":"Submit the applicable CTE for a retired parent, as indicated in the BUCET requirements."},{"c":"Conversations — Income, ITR & CTE Requirements","q":"What if one or both parents are deceased?","a":"Submit the Death Certificate of the deceased parent or parents. Additional financial documentation may be required from the surviving parent or person providing financial support, depending on the circumstances."},{"c":"Conversations — Separated Parents, Stepparents & Guardians","q":"My parents are separated. Whose financial documents should I submit?","a":"The requirements depend on your actual family and financial circumstances. If your parent remains the parent financially responsible for you, submit the applicable financial document for that parent. If a parent is unavailable and cannot provide the required document, provide an explanation and any available supporting documents for evaluation."},{"c":"Conversations — Separated Parents, Stepparents & Guardians","q":"My biological father is no longer in contact with me. I cannot get his ITR. What should I do?","a":"If you genuinely have no contact with your biological father and cannot obtain his financial document, provide a written explanation of the situation and any available supporting documents. The Admissions Office may advise you if additional documentation is needed."},{"c":"Conversations — Separated Parents, Stepparents & Guardians","q":"My parents are separated, my mother is an OFW, and I live with my grandmother. What should I submit?","a":"Submit the applicable financial document of your mother as an OFW, such as her latest employment contract or official employment document showing salary or compensation. If your father is unavailable, provide an explanation and any available supporting documentation. If your grandmother is your legal guardian, an **Affidavit of Guardianship** and her corresponding financial documents may be required. If your grandmother is only providing temporary care and is not your legal guardian, the situation is different and the parents' financial circumstances should generally remain the basis of the application."},{"c":"Conversations — Separated Parents, Stepparents & Guardians","q":"My grandmother is taking care of me temporarily, but my father provides financial support. Do I need an Affidavit of Guardianship?","a":"If your grandmother is only providing temporary care and is not your legal guardian, an **Affidavit of Guardianship** may not be applicable. Since your father provides financial support, submit the applicable financial documents based on his employment or income status, such as his 2025 ITR if he is working and files taxes. For your mother, if she is an OFW submit her latest employment contract with salary; if she is not working submit her CTE. No financial document is required from your grandmother if she is only providing temporary care."},{"c":"Conversations — Separated Parents, Stepparents & Guardians","q":"My mother is an OFW and my father has a new family. I live with my grandmother. What are the requirements?","a":"Since your mother is an OFW and you are currently living with your grandmother, the applicable requirements depend on whether your grandmother is officially your guardian. If your grandmother is your legal guardian, you need: **Affidavit of Guardianship**, your grandmother's applicable financial document such as ITR or CTE depending on her employment or income status, and your mother's latest OFW employment contract indicating her salary or compensation. For your father, if he is not providing financial support or is otherwise unavailable, kindly indicate the circumstances in the application and submit the applicable supporting documents if required. Being separated does not automatically make your mother a solo parent; a valid **Solo Parent ID** is required if claiming the Solo Parent provision. If your grandmother is only providing temporary care and is not your legal guardian, please inform the office so you can be advised on the appropriate documentary requirements."},{"c":"Conversations — Separated Parents, Stepparents & Guardians","q":"Can I use my stepfather's income instead of my biological father's?","a":"If your stepfather is the person actually providing financial support, disclose the situation accurately in your application and provide the applicable supporting documents. For an OFW stepfather, this may include an employment contract or official employment document showing salary or compensation. The Admissions Office may request additional documents to establish the family and financial circumstances."},{"c":"Conversations — Separated Parents, Stepparents & Guardians","q":"Can I put my stepfather as my father in the application?","a":"The application should reflect your legal and actual family information. Your biological or legal father should not simply be replaced by a stepfather if that is not legally accurate. If the situation is unusual, provide the appropriate explanation and supporting documents."},{"c":"Conversations — Separated Parents, Stepparents & Guardians","q":"When is an Affidavit of Guardianship required?","a":"An **Affidavit of Guardianship** is required when the applicant is living with a guardian rather than with the parent or parents who are responsible for the applicant. The guardian's corresponding financial documents, such as an ITR or CTE depending on the guardian's employment status or source of income, should also be submitted."},{"c":"Conversations — Separated Parents, Stepparents & Guardians","q":"I live with both of my grandparents. Do they both need separate Affidavits of Guardianship?","a":"If both grandparents are legally acting as guardians, the appropriate guardianship documentation should reflect the actual arrangement. Their corresponding financial documents should also be provided based on their employment or income status. If only one grandparent is the legal guardian and the other is merely living in the same household, the documentation should reflect the actual legal arrangement."},{"c":"Conversations — Separated Parents, Stepparents & Guardians","q":"Is it okay to choose between grandparents or parents when submitting CTE and ITR?","a":"No. The financial documents should generally be based on the parent or parents indicated in your application, not simply chosen between grandparents and parents. If you are living with and financially supported by your parents, submit the applicable ITR or CTE of your parent or parents based on their employment or income status. If you are living with a grandparent who is your legal guardian, an **Affidavit of Guardianship** and the guardian's corresponding financial documents may be required. If your grandparents are only providing temporary care and are not your legal guardians, you do not need to use their CTE or ITR in place of your parents' documents."},{"c":"Conversations — Special Circumstances","q":"What if my parent is a solo parent?","a":"If applicable, submit a valid and unexpired **Solo Parent ID** pursuant to RA No. 11861."},{"c":"Conversations — Special Circumstances","q":"My mother's Solo Parent ID expired. Can I still use it?","a":"No. The requirement specifies a valid and unexpired **Solo Parent ID**. If the ID has expired, secure the appropriate updated documentation if applicable."},{"c":"Conversations — Special Circumstances","q":"My parents are separated. Does that automatically make my mother a solo parent?","a":"Not necessarily. Being separated does not automatically establish eligibility as a solo parent under the applicable law. The applicant should provide accurate information and submit a valid **Solo Parent ID** if the parent qualifies and has one."},{"c":"Conversations — Special Circumstances","q":"My parent is deceased. Does the surviving parent still need to submit financial documents?","a":"Yes. The Death Certificate of the deceased parent should be submitted. The surviving parent's applicable financial document should also be submitted based on their employment or income status."},{"c":"Conversations — Special Circumstances","q":"I am a 4Ps member but I do not have an ITR. Is that okay?","a":"Yes. For 4Ps members, the **Oath of Commitment** is the applicable document indicated in the BUCET requirements."},{"c":"Conversations — Special Circumstances","q":"I am a PWD applicant. What should I submit?","a":"Submit a photocopy of the valid PWD ID, if applicable."},{"c":"Conversations — Special Circumstances","q":"I am an Indigenous Peoples applicant. What should I submit?","a":"Submit the applicable NCIP Certificate of Membership or Certificate of Membership from the NCIP Regional Office or the required NCIP COC Form 4, as indicated in the requirements."},{"c":"Conversations — Special Circumstances","q":"I am an ALS graduate. What documents should I submit?","a":"ALS graduates should submit their ALS Certificate of Rating and Certificate of Completion. These requirements apply specifically to ALS graduates."},{"c":"Conversations — Special Circumstances","q":"I am not an ALS graduate, but I see ALS documents in the checklist. Do I need them?","a":"No. The ALS requirements apply to ALS applicants. If your checklist incorrectly reflects requirements that do not apply to your circumstances, contact the Admissions Office or provide a screenshot of the checklist for checking."},{"c":"Conversations — Account & Technical Concerns","q":"I cannot create an iBU account. What should I do?","a":"Try registering again. If the problem continues, send a screenshot of the error message so the issue can be checked and, if necessary, escalated to the technical team."},{"c":"Conversations — Account & Technical Concerns","q":"I cannot log in to my account. What should I do?","a":"First, verify that you are using the correct registered email address and credentials. If you still cannot sign in, send a screenshot of the error message to the Admissions Office so you can be assisted further."},{"c":"Conversations — Account & Technical Concerns","q":"I deleted the email containing my sign-in instructions. Can it be resent?","a":"Try accessing the **iBU Admissions Portal** using your registered email address. If you cannot access your account or the sign-in instructions are no longer available, contact the Admissions Office and provide a screenshot of the issue for assistance."},{"c":"Conversations — Account & Technical Concerns","q":"I cannot receive the verification code in my email. What should I do?","a":"Check your Inbox, Spam or Junk folder, and Promotions or other filtered folders. If the verification code still does not arrive, try again. If the problem persists, provide a screenshot so the concern can be checked and escalated to the technical team if necessary."},{"c":"Conversations — Account & Technical Concerns","q":"I lost access to the email account I used for my application. Can I change my email?","a":"Contact the Admissions Office and explain the situation. Provide the necessary application details and proof of identity as requested. Do not create multiple applications unless instructed to do so."},{"c":"Conversations — Account & Technical Concerns","q":"My application form has the wrong school year. What should I do?","a":"Please try downloading the application form again. If the system has already been corrected, the newly downloaded form should reflect the correct school year."},{"c":"Conversations — Account & Technical Concerns","q":"I cannot see my examination date or venue yet. What should I do?","a":"Testing schedules may be assigned through the system based on the applicant's information and testing-center availability. Check your **iBU Admissions Portal** regularly for updates."},{"c":"Conversations — Account & Technical Concerns","q":"I cannot access my portal and my grades are handwritten. Is that allowed?","a":"For the submission of requirements, walk-ins without an appointment will not be accommodated. Kindly secure an appointment through your **iBU Admissions Portal**. Regarding the grades on the second page of the application form, the school registrar or authorized school personnel should fill out the grades for Grades 9 to 11 and affix the required signature and school dry seal. The entries may be handwritten, provided that they are clear and properly accomplished."},{"c":"Conversations — Deadlines & Late Application","q":"I submitted my application late. Can I still get my preferred examination date?","a":"Your preferred date is subject to available testing slots. If your preferred date is no longer available, you may only select from the schedules currently made available by the system."},{"c":"Conversations — Deadlines & Late Application","q":"I was assigned a later examination date but I want an earlier one. Can I still change it?","a":"Check your **iBU Admissions Portal** from time to time. If your preferred earlier schedule becomes available, you may book it, subject to availability."},{"c":"Conversations — Deadlines & Late Application","q":"My submission appointment is after the deadline for my nearest submission venue. What should I do?","a":"Check the portal for an earlier available appointment or another designated submission venue that is accessible to you. Do not rely on walk-in submission unless officially instructed."},{"c":"Conversations — Forms & Document Submission","q":"Can I submit only one copy of the BUCET form?","a":"Yes. One accomplished copy is required unless otherwise instructed."},{"c":"Conversations — Forms & Document Submission","q":"Can my school submit the BUCET forms of several students?","a":"Yes, if the school is the designated submission coordinator and follows the prescribed submission procedure."},{"c":"Conversations — Forms & Document Submission","q":"Can my parent submit the requirements even if I am not present?","a":"Yes, a parent may submit on behalf of the applicant, provided that the requirements are complete and the appointment schedule is followed."},{"c":"Conversations — Forms & Document Submission","q":"Can a representative submit without the applicant?","a":"Yes, an authorized representative may submit on behalf of the applicant, subject to the applicable authorization and identification requirements."},{"c":"Conversations — College of Medicine (BUCM)","q":"Is Bicol University College of Medicine still accepting applications for SY 2026-2027?","a":"No. The application period for SY 2026-2027 has already closed. The deadline was June 13, 2026, as announced through the official BU Admissions Office and BU College of Medicine channels. Applicants who were unable to submit their complete requirements within the prescribed period may try again during the next admission cycle."},{"c":"Conversations — College of Medicine (BUCM)","q":"Can I still submit my application after the deadline?","a":"Generally, no. BUCM does not accept late applications after the prescribed deadline. Any request for reconsideration or extension is subject to the approval of the Dean of the College of Medicine, but applicants should not assume that an extension will be granted."},{"c":"Conversations — College of Medicine (BUCM)","q":"I already paid the application fee, but I was unable to submit my requirements before the deadline. Can I still be processed?","a":"No. Payment of the application fee does not automatically constitute a completed application. Only applications with the required documents submitted within the prescribed period can be processed, subject to the College's admission policies."},{"c":"Conversations — College of Medicine (BUCM)","q":"Can I submit my requirements first and follow the other documents later?","a":"Only complete applications may be processed unless the College specifically authorizes an applicant to submit a particular document at a later date."},{"c":"Conversations — College of Medicine (BUCM)","q":"What undergraduate degree is required for BUCM?","a":"Applicants must have completed a baccalaureate degree. The previous undergraduate degree does not necessarily have to be in a health-related field."},{"c":"Conversations — College of Medicine (BUCM)","q":"What is the minimum GWA requirement for BUCM?","a":"The applicant must have a **GWA** of at least 85 percent or its equivalent, subject to the University's evaluation and admission policies."},{"c":"Conversations — College of Medicine (BUCM)","q":"My GWA is below 85 percent. Can I still apply?","a":"Applicants who do not meet the minimum academic requirement may not satisfy the basic eligibility requirements. Any appeal or request for consideration is subject to the College's policies and the decision of the appropriate authority. Recommendation letters may support an application, but they do not automatically override the College's minimum admission requirements."},{"c":"Conversations — College of Medicine (BUCM)","q":"What is the minimum NMAT score required?","a":"The required **NMAT** percentile rank is not lower than the 65th percentile, subject to the admission policies applicable to the academic year."},{"c":"Conversations — College of Medicine (BUCM)","q":"Is an NMAT score of 65 enough to get admitted?","a":"Meeting the minimum **NMAT** requirement makes an applicant eligible to participate in the admission process, but it does not guarantee admission. BUCM uses a competitive screening process, and applicants are evaluated based on the College's established admission criteria."},{"c":"Conversations — College of Medicine (BUCM)","q":"Does having a high NMAT guarantee admission?","a":"No. Admission is competitive. **NMAT** performance is considered together with academic credentials, interview performance, and other criteria established by the College."},{"c":"Conversations — College of Medicine (BUCM)","q":"How long is my NMAT result valid?","a":"The official **NMAT** result must have been taken within two years prior
