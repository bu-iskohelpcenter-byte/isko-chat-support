of the client. (Fee: None; Time: 40 Minutes; Person: Dentist I/Dentist II, University Health Services)\n7. Submit medical/dental certificate or/and diagnostic test results of the referred case (if referred).\n   → 7. Dentist receive, assess and document results of the case/s referred. (Fee: None; Time: 5 Minutes; Person: Dentist I/Dentist II, University Health Services)\n8. Receive dental education.\n   → 8. Dentist conducts dental education and promote dental health consciousness. (Fee: None; Time: 5 Minutes; Person: Dentist I/Dentist II, University Health Services)\n\n**Total:** Fee: None • Processing time: 2 Hours\n\n> Source: BU Citizen's Charter 2024 (1st Edition), Bicol University Health Services. Fees, requirements, and processing times may be updated by the University — always verify with the responsible office before transacting."},{"c":"Citizen's Charter Services","q":"How do I avail a dental examination at the University Health Services?","a":"**Who may avail:** BU Students\n**Classification / type of transaction:** Simple • G2C - Government to Citizen\n\n**Checklist of requirements (where to secure):**\n- Identification Card (1 Original copy) — Office of Student Affairs Services\n- Certificate of Registration (1 Original copy) — Registrar Office\n- Incoming freshmen/new entrants: BUCET/SHAT/HISET/KAT Result (1 original or photocopy) — BU Admission\n- Incoming freshmen/new entrants: Long Brown Envelope (1 pc) — Educational Store\n- Incoming freshmen/new entrants: Individual Dental Health Record Form No.: BU-F-UHS-21 (1 original copy) — Downloadable at BU Health Services Facebook Page\n\n**Steps, fees and processing time:**\n1. Present identification card or certificate of registration.\n   → 1. Validate the client status from the documents submitted. (Fee: None; Time: 5 Minutes; Person: Dental Aide, University Health Services)\n2. Submits for interview.\n   → 2. Conducts interview and check veracity of forms and documents. (Fee: None; Time: 15 Minutes; Person: Dental Aide/Dentist I/Dentist II, University Health Services)\n3. Submits for vital signs taking.\n   → 3. Conduct vital signs checking and evaluation of the client. (Fee: None; Time: 15 Minutes; Person: Dental Aide/Dentist I/Dentist II, University Health Services)\n4. Client undergoes dental examination.\n   → 4. Dentist conducts dental examination and perform diagnosis. (Fee: None; Time: 40 Minutes; Person: Dentist I/Dentist II, University Health Services)\n5. Client receives medication and/or treatment (If with dental findings).\n   → 5. Dentist perform dental treatment/s and/or gives medication/s or schedules client for appointment. (Fee: None; Time: 40 Minutes; Person: Dentist I/Dentist II, University Health Services)\n6. Client receives dental certificate.\n   → 6. Releases dental certificate. (Fee: None; Time: 5 Minutes; Person: Dental Aide, University Health Services)\n\n**Total:** Fee: None • Processing time: 2 Hours\n\n> Source: BU Citizen's Charter 2024 (1st Edition), Bicol University Health Services. Fees, requirements, and processing times may be updated by the University — always verify with the responsible office before transacting."},{"c":"Citizen's Charter Services","q":"How do I avail medical consultation and treatment at the University Health Services?","a":"**Who may avail:** Non-BU Personnel; BU Students\n**Classification / type of transaction:** Simple • G2C - Government to Citizen\n\n**Checklist of requirements (where to secure):**\n- Bicol University Student Identification Card (1 Original) — Office of Student Affairs Services\n- Student Certificate of Registration (1 Original Copy) — Registrar Office\n\n**Steps, fees and processing time:**\n1. Present identification card or certificate of registration.\n   → 1. Verify the patient status. (Fee: None; Time: 5 Minutes; Person: Nurse I/Nurse II/Nurse III, University Health Services)\n2. Submit for interview and fill up medical patient record.\n   → 2. Conduct interview and review medical patient record for accuracy of information. (Fee: None; Time: 15 Minutes; Person: Nurse I/Nurse II/Nurse III, University Health Services)\n3. Submit for checking of vital signs.\n   → 3. Take vital signs of the patient. (Fee: None; Time: 15 Minutes; Person: Nurse I/Nurse II/Nurse III, University Health Services)\n4. Proceed to consultation area.\n   → 4. Medical officer conducts examination, diagnosis and treatment. May perform minor procedure/s if necessary. (Fee: None; Time: 1 Hour & 15 Minutes; Person: Medical Officer IV, University Health Services)\n5. Standby for monitoring and/or referral to specialized institution/s if needed.\n   → 5. Medical Officer monitors/explains to the patient the reason for referral (if needed) to specialized institution. Emergency cases will be referred within 30 minutes. Non-emergency cases will be referred within 1 day. (Fee: None; Time: 15 Minutes; Person: Medical Officer IV/Nurse I/Nurse II/Nurse III, University Health Services)\n6. Report to Nurse.\n   → 6. Carry out Medical Officer's order, dispense medicines as prescribed if available and conduct health education. (Fee: None; Time: 5 Minutes; Person: Nurse I/Nurse II/Nurse III, University Health Services)\n7. Report to Nurse (Referred Patient).\n   → 7. Document clinical findings and release medical certificate if needed. (Fee: None; Time: 5 Minutes; Person: Medical Officer IV/Nurse I/Nurse II/Nurse III, University Health Services)\n\n**Total:** Fee: None • Processing time: 2 Hours and 15 Minutes\n\n> Source: BU Citizen's Charter 2024 (1st Edition), Bicol University Health Services. Fees, requirements, and processing times may be updated by the University — always verify with the responsible office before transacting."},{"c":"Citizen's Charter Services","q":"How do I avail a medical examination at the University Health Services?","a":"**Who may avail:** Non-BU Personnel; BU Students\n**Classification / type of transaction:** Simple • G2C - Government to Citizen\n\n**Checklist of requirements (where to secure):**\n- Identification Card (1 original copy) — Office of Student Affairs Services\n- Certificate of Registration (1 original copy) — Registrar Office\n- New entrants: BUCET/SHAT/HISET/KAT Result (1 Original or Photocopy) — BU Admission Office\n- New entrants: Chest X-ray (PA view) Result (1 Original copy) — Outside Diagnostic & Laboratory Facility\n- New entrants: Complete Blood Count with Blood Typing Result (1 Original copy) — Outside Diagnostic & Laboratory Facility\n- New entrants: Urinalysis Result (1 Original copy) — Outside Diagnostic & Laboratory Facility\n- New entrants: Hepatitis B Screening Result (For Nursing, Food Service Mgt., Food Technology, Entrepreneurship, Fisheries, Medicine & Dentistry courses) (1 Original copy) — Outside Diagnostic & Laboratory Facility\n- New entrants: Medical Clearance (students with comorbidities) (1 Original copy) — Attending Physician\n- New entrants: OB-Gynecologist Clearance (pregnant students) (1 Original copy) — Attending Physician\n- New entrants: Student Health Record (Form No.: BU-F-UHS-05) (1 Original copy or photocopy) — Downloadable at BU Health Services Facebook Page\n- New entrants: Individual Dental Record (Form No.: BU-F-UHS-21) (1 Original copy or photocopy) — Downloadable at BU Health Services Facebook Page\n- New entrants: Ordinary Long Brown Envelope (1 piece) — Educational Store\n- Reinstatement from Sick Leave: Medical Certificate (1 original copy) — From the attending physician\n\n**Steps, fees and processing time:**\n1. Present identification card or certificate of registration.\n   → 1. Verify the client status. (Fee: None; Time: 5 Minutes; Person: Nurse I/Nurse II/Nurse III, University Health Services)\n2. Submit for interview and present laboratory and diagnostic results.\n   → 2. Conduct interview and review documents presented. (Fee: None; Time: 15 Minutes; Person: Nurse I/Nurse II/Nurse III, University Health Services)\n3. Submit for checking of vital signs.\n   → 3. Take vital signs of the client. (Fee: None; Time: 15 Minutes; Person: Nurse I/Nurse II/Nurse III, University Health Services)\n4. Proceed to medical examination area.\n   → 4. Medical Officer conducts medical examination and treatment (if needed). (Fee: None; Time: 1 Hour & 15 Minutes; Person: Medical Officer IV, University Health Services)\n5. Report to nurse (with findings).\n   → 5. Carry out Medical Officer's order, dispense medicines as prescribed if available and conduct health education. May issue medical certificate if needed. (Fee: None; Time: 5 Minutes; Person: Nurse I/Nurse II/Nurse III, University Health Services)\n6. Report to nurse (without findings).\n   → 6. Releases medical certificate. (Fee: None; Time: 5 Minutes; Person: Nurse I/Nurse II/Nurse III, University Health Services)\n\n**Total:** Fee: None • Processing time: 2 Hours\n\n> Source: BU Citizen's Charter 2024 (1st Edition), Bicol University Health Services. Fees, requirements, and processing times may be updated by the University — always verify with the responsible office before transacting."},{"c":"Citizen's Charter Services","q":"How do I get a re-issued official Transcript of Records (TOR)?","a":"**Office of the University Registrar (URO), Second Floor** • Email: bu-uro@bicol-u.edu.ph\n*Window 1 serves PWDs, senior citizens and pregnant women; other applicants proceed to the regular receiving window.* Pay the assessed fee at the **BU College of Education (BUCE) Cashier's Office**, then submit the requirements and official receipt to the URO to receive a **claim stub**. Claim the document at the **URO Releasing Area** by presenting the stub.\n*The **first issuance is free of charge**; the fees below apply to re-issuance.*\n\n**Who may avail:** Students, Graduates, Undergraduates, Local and Foreign Agencies\n**Classification / type of transaction:** Complex • G2C - Government to Citizen • G2B - Government to Business • G2G - Government to Government\n\n**Checklist of requirements (where to secure):**\n- 2x2 recent photo with nametag and white background (2 pieces) — Client (photo booth, printing shops, malls)\n- Documentary stamps worth PHP 30.00 (1 piece per copy) — Post Offices - Cashier / Bureau of Internal Revenue - Cashier Window\n- Original request letter from the receiving school (required for transfer of credentials from BU to another school)\n- Certificate of No Objection if already granted a transfer of credential (1 original copy) — University or College Registrar's Office of the school the client transferred to - Window 1\n- Authorization Letter (1 original copy), with a photocopy of the student's valid government-issued ID bearing three (3) affixed signatures — Client who is sending their representative\n  *Note:* Requests from internal and external offices and for education verification may be submitted online or onsite.\n\n**Steps, fees and processing time:**\n1. Fill-out the request form onsite or online and submit the requirement/s as stated in the said form.\n   → 1.1 Receive and check request form and completeness of requirement/s submitted online or onsite and retrieve student's record on file for assessment. (Fee: None; Time: 1 Hour; Person: Technical Service Provider, URO-Window 1 / Clerical Staff, URO-Window 3)\n2. Wait for the confirmation or assessment for the requested academic credential onsite or online.\n   → 2. Return the request form with assessment and inform the client of the lacking requirement/s (if applicable), date of release and payment method. (Fee: None; Time: 30 Minutes; Person: Technical Service Provider, URO-Window 1 / Clerical Staff, URO-Window 3)\n3. Pay and present the assessed request form.\n   → 3. Receive payment and assessed request form. (Fee: None; Time: 30 Minutes; Person: Cashier, BUCE Patria G. Lorenzo Bldg.)\n4. Submit the request form together with the Official Receipt and lacking requirements (if applicable).\n   → 4. Receive and record duly accomplished request form, Official Receipt and requirements; and forward the same to the personnel-in-charge for appropriate action. (Fee: Bachelor's degree: PHP 30.00 per page (formula: PHP 30 x no. of pages) / Masteral-Doctorate: PHP 50.00, 1 page of OTR (formula: PHP 50 x no. of pages); Time: 3 Days; Person: Technical Service Provider, URO-Window 1 / Clerical Staff, URO-Window 3 / Administrative Aide IV / University Registrar/Associate University Registrar/Registrar III, URO)\n5. Wait for the claim stub or instruction about the date of release of the requested document/s.\n   → 5. Release a claim stub or inform the client to set an online appointment for claiming. (Fee: None; Time: 20 Minutes; Person: Technical Service Provider, URO-Window 1 / Clerical Staff, URO-Window 3)\n6. Present proof of approved appointment or claim stub and valid ID in time of return. If representative, submit the requirements for claiming, signed authorization letter and photocopy of his/her valid ID and of the requesting party.\n   → 6. Check credential if completely signed and affix the date of release and dry seal in the requested document/s. Receive and check the requirements for claiming and release the credential. (Fee: None; Time: 30 Minutes; Person: Technical Service Provider, URO-Window 1 / Clerical Staff, URO-Window 3)\n\n**Total:** Fee: Bachelor's: PHP 30.00 per page / Masteral-Doctorate: PHP 50.00 per page • Processing time: 5 Days, 3 Hours, 20 Minutes\n\n**Note:** Fees are computed per page: PHP 30.00 per page for Bachelor's degree transcripts and PHP 50.00 per page for Masteral/Doctorate (1 page of OTR).\n\n> Source: BU Citizen's Charter 2024 (1st Edition), University Registrar's Office. Fees, requirements, and processing times may be updated by the University — always verify with the responsible office before transacting."},{"c":"Citizen's Charter Services","q":"How do I get a re-issued diploma?","a":"**Office of the University Registrar (URO), Second Floor** • Email: bu-uro@bicol-u.edu.ph\n*Window 1 serves PWDs, senior citizens and pregnant women; other applicants proceed to the regular receiving window.* Pay the assessed fee at the **BU College of Education (BUCE) Cashier's Office**, then submit the requirements and official receipt to the URO to receive a **claim stub**. Claim the document at the **URO Releasing Area** by presenting the stub.\n*The **first issuance is free of charge**; the fees below apply to re-issuance.*\n\n**Who may avail:** Students, Graduates, Undergraduates, Local and Foreign Agencies\n**Classification / type of transaction:** Complex • G2C - Government to Citizen • G2B - Government to Business • G2G - Government to Government\n\n**Checklist of requirements (where to secure):**\n- Affidavit of Loss if lost (1 original copy) — Public Attorney's Office - Window 1\n- Original copy of diploma if damaged — BU-URO - Windows 1 and 3\n- Authorization Letter (1 original copy), with a photocopy of the student's valid government-issued ID bearing three (3) affixed signatures — Client who is sending their representative\n\n**Steps, fees and processing time:**\n1. Fill-out the request form onsite or online and submit the requirement/s as stated in the said form.\n   → 1.1 Receive and check request form and completeness of requirement/s submitted online or onsite and retrieve student's record on file for assessment. (Fee: None; Time: 1 Hour; Person: Technical Service Provider, URO-Window 1 / Clerical Staff, URO-Window 3)\n2. Wait for the confirmation or assessment for the requested academic credential onsite or online.\n   → 2. Return the request form with assessment and inform the client of the lacking requirement/s (if applicable), date of release and payment method. (Fee: None; Time: 30 Minutes; Person: Technical Service Provider, URO-Window 1 / Clerical Staff, URO-Window 3)\n3. Pay and present the assessed request form.\n   → 3. Receive payment and assessed request form. (Fee: None; Time: 30 Minutes; Person: Cashier, BUCE Patria G. Lorenzo Bldg.)\n4. Submit the request form together with the Official Receipt and lacking requirements (if applicable).\n   → 4. Receive and record duly accomplished request form, Official Receipt and requirements; and forward the same to the personnel-in-charge for appropriate action. (Fee: Bachelor's/Masteral/Doctorate degree: PHP 60.00; Time: 5 Days; Person: Technical Service Provider, URO-Window 1 / Clerical Staff, URO-Window 3 / Administrative Aide IV / University Registrar/Associate University Registrar/Registrar III, URO)\n5. Wait for the claim stub or instruction about the date of release of the requested document/s.\n   → 5. Release a claim stub or inform the client to set an online appointment for claiming. (Fee: None; Time: 20 Minutes; Person: Technical Service Provider, URO-Window 1 / Clerical Staff, URO-Window 3)\n6. Present proof of approved appointment or claim stub and valid ID in time of return.\n   → 6. Check credential if completely signed and affix the date of release and dry seal in the requested document/s. (Fee: None; Time: 30 Minutes; Person: Technical Service Provider, URO-Window 1 / Clerical Staff, URO-Window 3)\n\n**Total:** Fee: PHP 60.00 • Processing time: 7 Days, 3 Hours, 20 Minutes\n\n> Source: BU Citizen's Charter 2024 (1st Edition), University Registrar's Office. Fees, requirements, and processing times may be updated by the University — always verify with the responsible office before transacting."},{"c":"Citizen's Charter Services","q":"How do I borrow books from the BU Library?","a":"**Who may avail:** BU Students\n**Classification / type of transaction:** Simple • G2C - Government to Citizen\n\n**Checklist of requirements (where to secure):**\n- Validated Certificate of Registration (1 Hardcopy or Electronic Copy) of Student — College Registrar\n- BU ID (1 Original) — Office of Student Services/Office of the College Student Affairs Coordinator\n- Student Borrower's Card (1 Original) — Library\n- Representative: Authorization Letter (1 Physical Letter Signed by the BU Student) — Requesting Party\n- Representative: BU ID (1 Original) — Requesting Party\n- Representative: Validated Certificate of Registration (Hardcopy or Electronic Copy) of Student — Requesting Party\n- Representative: Student Borrower's Card (1 Original) — Requesting Party\n- Representative: Valid ID (1 Original) — Representative\n\n**Steps, fees and processing time:**\n1. Face-to-Face: 1. Present the book/s to be borrowed along with the Certificate of Registration, BU ID and borrower's card. (If representative, present the requirements for the representative and of the student.)\n   → 1.1 Receive the books and verify patron borrowing requirements. (Fee: None; Time: 5 Minutes; Person: Librarian, Circulation Section, University Library)\n   → 1.2 Check the title, author & accession number of the book/s against the book card/s. (Fee: None; Time: 5 Minutes; Person: Librarian, Circulation Section, University Library)\n2. Accomplish the book card/s with date borrowed, name, college/department and signature.\n   → 2.1 Receive and check the book card/s and fill out the date due slip. (Fee: None; Time: 5 Minutes; Person: Librarian, Circulation Section, University Library)\n   → 2.2 Fill-out the borrower's card. (Fee: None; Time: 5 Minutes; Person: Librarian, Circulation Section, University Library)\n3. Fill-out and sign the Log Book.\n   → 3. Check-out in the BU-iLib System (if applicable) and check correctness of information in the Log Book. (Fee: None; Time: 10 Minutes; Person: Librarian, Circulation Section, University Library)\n4. Receive the book/s and borrower's card.\n   → 4. Release the book/s borrowed and file the book card/s. (Fee: None; Time: 5 Minutes; Person: Librarian, Circulation Section, University Library)\n\n**Total:** Fee: None • Processing time: Face-to-Face: 35 Minutes / Online: 1 Hour, 5 Minutes\n\n**Note:** Online (book reservation): fill out the form of the specific unit/college library (e.g. University Library: tinyurl.com/AskRISA; East Campus: tinyurl.com/bu-ECLAskRISA; Law: tinyurl.com/CLawAskRISA; Health Sciences: tinyurl.com/HSLAskRisa; Guinobatan: tinyurl.com/AskRISAform; Gubat: tinyurl.com/GC-LibraryAskRISA; Polangui: tinyurl.com/PCASkRisaform; Tabaco: https://form.jotform.com/12stephen26/BUTClibraryRISAform). Total processing time for online reservation: 2 Days, 1 Hour, 5 Minutes.\n\n> Source: BU Citizen's Charter 2024 (1st Edition), University Library. Fees, requirements, and processing times may be updated by the University — always verify with the responsible office before transacting."},{"c":"Citizen's Charter Services","q":"How do I pay library overdue fines?","a":"**Who may avail:** BU Students\n**Classification / type of transaction:** Simple • G2C - Government to Citizen\n\n**Checklist of requirements (where to secure):**\n- Order of Payment (1 Original or Electronic Copy) — Library\n- Official Receipt (1 Original Copy) — University/College Cashier\n\n**Steps, fees and processing time:**\n1. Fines below PHP 50.00: 1. Pay fine and fill-out the Overdue Log Sheet.\n   → 1. Receive the payment and check information in the Overdue Log Sheet. (Fee: See Table of Fines (below); Time: 5 Minutes; Person: Librarian, Circulation Section, University Library)\n2. Verify clearance in the OSCS (if applicable).\n   → 2. Clear the accountability. (Fee: None; Time: 3 Minutes; Person: Librarian, Circulation Section, University Library)\n3. Fines above PHP 50.00: 1. Receive the Order of Payment.\n   → 1. Issue Order of Payment. (Fee: See Table of Fines (below); Time: 3 Minutes; Person: Librarian, Circulation Section, University Library)\n4. Present the Order of Payment to the Cashier and pay fine.\n   → 2. Process payment based on Order of Payment and issue Official Receipt. (Fee: See Table of Fines (below); Time: 6 Minutes; Person: Cashier, University/College Cashier's Office)\n5. Go back to the library and present the Official Receipt.\n   → 3. Receive the Official Receipt and indicate the OR number and date in the Overdue Fines Log Sheet. (Fee: See Table of Fines (below); Time: 3 Minutes; Person: Librarian, Circulation Section, University Library)\n6. Retrieve original copy of Official Receipt. Verify clearance in the OSCS (if applicable).\n   → 4. Clear the accountability. (Fee: None; Time: 3 Minutes; Person: Librarian, Circulation Section, University Library)\n\n**Total:** Fee: No. of book/s x Amount of Fine • Processing time: Fines below PHP 50.00: 8 Minutes / Fines above PHP 50.00: 20 Minutes\n\n**Note:** TABLE OF FINES (per book) - Circulation books: Elem/HS/SHS PHP 1.00/day; CCT/Undergraduate PHP 2.00/hour or PHP 16.00/day; Graduate Student/Law/Medicine PHP 5.00/hour or PHP 40.00/day. Fiction books: PHP 1.00/day (Elem/HS/SHS); PHP 5.00/day (CCT/Undergraduate); PHP 5.00/day (Graduate/Law/Medicine).\n\n> Source: BU Citizen's Charter 2024 (1st Edition), University Library. Fees, requirements, and processing times may be updated by the University — always verify with the responsible office before transacting."},{"c":"Citizen's Charter Services","q":"How do I request document delivery from the BU Library?","a":"**Who may avail:** BU Students\n**Classification / type of transaction:** Simple • G2C - Government to Citizen\n\n**Checklist of requirements (where to secure):**\n- Validated Certificate of Registration of Student (1 Electronic Copy) — Requesting Party\n\n**Steps, fees and processing time:**\n1. Fill out the online form of the specific unit/college library you want to request the service (University Library: tinyurl.com/AskRISA; East Campus: tinyurl.com/bu-ECLAskRISA; Law: tinyurl.com/CLawAskRISA; Health Sciences: tinyurl.com/HSLAskRisa; Guinobatan: tinyurl.com/AskRISAform; Gubat: tinyurl.com/GC-LibraryAskRISA; Polangui: tinyurl.com/PCASkRisaform; Tabaco: https://form.jotform.com/12stephen26/BUTClibraryRISAform).\n   → 1. Verify client's identity and check the BU-iLib, library databases, and lists for availability of material/s. (Fee: None; Time: 1 Day; Person: Librarian, Reference and Information Services, University Library)\n2. Confirm to proceed with the request.\n   → 2. Process material for document delivery. (Fee: None; Time: 1 Day; Person: Librarian, Reference and Information Services/Circulation Section/Theses & Dissertation Section/Periodicals Section/Computer & Network Services, University Library)\n3. Receive the requested library material.\n   → 3. Send material/s to the client via email. (Fee: None; Time: 30 Minutes; Person: Librarian, Reference and Information Services, University Library)\n\n**Total:** Fee: None • Processing time: 2 Days, 30 Minutes\n\n**Note:** Free of charge and exclusive to BU students and personnel.\n\n> Source: BU Citizen's Charter, 2023 (2nd Edition), pp. 65-68. Fees, requirements, and processing times may be updated by the University — always verify with the responsible office before transacting."},{"c":"Citizen's Charter Services","q":"How do I use the BU Library as an external researcher?","a":"**Who may avail:** Non-BU Students and BU students not currently enrolled\n**Classification / type of transaction:** Simple • G2C - Government to Citizen\n\n**Checklist of requirements (where to secure):**\n- Students from other schools/Government and private researchers: Referral or Request letter (1 Physical Letter Signed by the Librarian/Research Instructor/Adviser/Head of Agency or Office) — Sending institution\n- Students from other schools/Government and private researchers: Valid ID (Original) — Sending institution\n- BU student not currently enrolled: Certificate of Registration during the previous semester (1 Original or Electronic Copy) — Requesting Party\n- BU student not currently enrolled: BU ID (1 Original) — Office of Student Services/Office of the College Student Affairs Coordinator\n- Out-of-School Youth (OSY): Valid ID (1 Original) — Requesting Party\n- Out-of-School Youth (OSY): Certification as OSY issued by authorized Barangay Official where OSY resides (1 Physical Letter with Original Signature) — Requesting Party\n- Temporary Receipt (1 Original or Electronic Copy, if applicable) — Library\n- Researcher's ID pass (1 Original, applicable to University Library only) — University/College Cashier's Office\n- Official Receipt (1 Original) — University/College Cashier's Office\n\n**Steps, fees and processing time:**\n1. Present the requirements.\n   → 1. Verify identity of client and validity of ID and other requirements. (Fee: None; Time: 10 Minutes; Person: Librarian, Reference and Information Services, University Library)\n2. Pay researcher's fee (if applicable).\n   → 2. Process payment and issue temporary receipt or Order of Payment. (Fee: See Table of Researcher's Fee; Time: 10 Minutes; Person: Librarian, Reference and Information Services, University Library)\n3. 1 Present Order of Payment to Cashier.\n   → 2.1 For direct payment to University/College Cashier, process payment based on Order of Payment and issue Official Receipt. (Fee: See Table of Researcher's Fee; Time: 5 Minutes; Person: Cashier, University/College Cashier's Office)\n4. Fill out the Log Book for External Researchers/External User Information in the BU-iLib system.\n   → 3. Check the Log Book/register in the BU-iLib system. (Fee: None; Time: 5 Minutes; Person: Librarian, Reference and Information Services, University Library)\n5. Present receipt to and fill out Visitor's Log Book.\n   → 4. Verify receipt and issue Researcher's ID pass (applicable at University Library only). (Fee: None; Time: 5 Minutes; Person: Librarian/Security Personnel, University Library)\n\n**Total:** Fee: Based on Table of Researcher's Fee • Processing time: 35 Minutes\n\n**Note:** TABLE OF RESEARCHER'S FEE: Elementary/High School PHP 10.00/day or a fraction hereof; Undergraduate PHP 30.00/day or PHP 150.00/month or PHP 300.00/semester or a fraction hereof; Graduate PHP 50.00/day or PHP 300.00/month or PHP 500.00/sem or a fraction hereof; Walk-in or Non-academe-based PHP 100.00/day or PHP 500.00/month or PHP 1,000.00/sem or a fraction hereof; Out-of-School Youth Free. (Based on BOR Resolution No. 018, series of 2008.)\n\n> Source: BU Citizen's Charter 2024 (1st Edition), University Library. Fees, requirements, and processing times may be updated by the University — always verify with the responsible office before transacting."},{"c":"Citizen's Charter Services","q":"How do I get a BU Library Permit (alumni or former personnel)?","a":"**Who may avail:** BU Alumni and Former BU Personnel\n**Classification / type of transaction:** Simple • G2C - Government to Citizen • G2G - Government to Government\n\n**Checklist of requirements (where to secure):**\n- Alumni: Alumni ID (Original ID) — BU Alumni Relation's Office\n- Former BU Faculty & Non-Teaching Personnel: Certification (1 Original) — BU Human Resource Management and Development Office\n- Former BU Faculty & Non-Teaching Personnel: Valid ID (1 Original) — Requesting Party\n- Library Permit (1 Original) — Library\n- Researcher's ID pass (1 Original, applicable to University Library only) — Library\n\n**Steps, fees and processing time:**\n1. Present the requirements.\n   → 1. Verify identity of client and validity of ID and other requirements. (Fee: None; Time: 10 Minutes; Person: Librarian, Reference and Information Services, University Library)\n2. Receive Library Permit and affix signature in Log Book.\n   → 2. Fill-out Library Permit monitoring Log Book and issue Library Permit. (Fee: None; Time: 5 Minutes; Person: Librarian, Reference and Information Services, University Library)\n3. Present Library Permit and Alumni/Valid ID to the Control Desk and fill-out Log Book.\n   → 3. Check Library Permit. Issue Researcher's ID pass (for University Library only). (Fee: None; Time: 5 Minutes; Person: Librarian/Security Personnel, University Library)\n\n**Total:** Fee: None • Processing time: 20 Minutes\n\n**Note:** Free access to library services and facilities, except borrowing of books.\n\n> Source: BU Citizen's Charter, 2023 (2nd Edition), pp. 74-75. Fees, requirements, and processing times may be updated by the University — always verify with the responsible office before transacting."},{"c":"Citizen's Charter Services","q":"How do I get a library referral letter for research in other libraries?","a":"**Who may avail:** BU Students\n**Classification / type of transaction:** Simple • G2C - Government to Citizen\n\n**Checklist of requirements (where to secure):**\n- Validated Certificate of Registration (1 Hardcopy or Electronic Copy) of Student — College Registrar\n- BU ID (1 Original) — Office of Student Services/Office of the College Student Affairs Coordinator\n\n**Steps, fees and processing time:**\n1. Present the requirements and fill-out Request slip.\n   → 1.1 Verify the requirements and the accomplished request slip. (Fee: None; Time: 5 Minutes; Person: Librarian, Reference and Information Services, University Library)\n   → 1.2 Process the request and print the letter/s. (Fee: None; Time: 30 Minutes; Person: Librarian, Reference and Information Services, University Library)\n2. Fill out the Log Book.\n   → 2. Release the referral letter/s. (Fee: None; Time: 5 Minutes; Person: Librarians & University Librarian, University Library)\n3. Electronic Referral Letter: 1. Send the request to the email address of your unit/college library indicating the name of schools or institutions and when you intend to visit them. Attach a photo of your current validated Certificate of Registration in the email. (Emails: bu-library@bicol-u.edu.ph; ec-library@bicol-u.edu.ph; law-library@bicol-u.edu.ph; hs-library@bicol-u.edu.ph; caf-library@bicol-u.edu.ph; gc-library@bicol-u.edu.ph; pc-library@bicol-u.edu.ph; tc-library@bicol-u.edu.ph)\n   → 1. Verify the requirements and respond to email. (Fee: None; Time: 30 Minutes; Person: Librarian, Reference and Information Services, University Library)\n4. Receive the referral letter in your e-mail.\n   → 2.1 Send referral letter in pdf format to client's email. (Fee: None; Time: 30 Minutes; Person: Librarian, Reference and Information Services, University Library)\n   → 2.2 Record the transaction in the logbook or monitoring sheet for online services. (Fee: None; Time: 10 Minutes; Person: Librarian, Reference and Information Services, University Library)\n\n**Total:** Fee: None • Processing time: Walk-in: 40 Minutes / Electronic: 1 Hour, 10 Minutes\n\n> Source: BU Citizen's Charter, 2023 (2nd Edition), pp. 75-78. Fees, requirements, and processing times may be updated by the University — always verify with the responsible office before transacting."},{"c":"Citizen's Charter Services","q":"How do I get my student borrower's card?","a":"**Who may avail:** BU Students\n**Classification / type of transaction:** Simple • G2C - Government to Citizen • G2G - Government to Government\n\n**Checklist of requirements (where to secure):**\n- Validated Certificate of Registration (1 Hardcopy or Electronic Copy) — College Registrar\n- BU ID (1 Original) — Office of Student Services/Office of the College Student Affairs Coordinator\n\n**Steps, fees and processing time:**\n1. Present requirements.\n   → 1. Receive and verify requirements presented. (Fee: None; Time: 5 Minutes; Person: Librarian, Circulation Section, University Library)\n2. Fill-out the online patron record form in the library's designated computer terminal (if applicable). The form can also be filled-up online prior to going to the library. (Links: University Library: tinyurl.com/ULpatronrecord; East Campus: tinyurl.com/ECLPatronrecordform; Law: tinyurl.com/ClawPatronRecord; Health Sciences: tinyurl.com/HSLPatronrecordform; Guinobatan: tinyurl.com/CAFLibpatronrecord; Gubat: tinyurl.com/Gubat-Patron-Record-Form; Polangui: tinyurl.com/PCLibraryPatronRecordform; Tabaco: https://t.ly/VrU4X)\n   → 2. Fill-out the borrower's card. (Fee: None; Time: 15 Minutes; Person: Librarian, Circulation Section, University Library)\n3. Receive borrower's card.\n   → 3. Release borrower's card. (Fee: None; Time: 5 Minutes; Person: Librarian, Circulation Section, University Library)\n\n**Total:** Fee: None • Processing time: 25 Minutes\n\n> Source: BU Citizen's Charter, 2023 (2nd Edition), pp. 78-81. Fees, requirements, and processing times may be updated by the University — always verify with the responsible office before transacting."},{"c":"Citizen's Charter Services","q":"How do I request certifications from the University Registrar?","a":"**Office of the University Registrar (URO), Second Floor** • Email: bu-uro@bicol-u.edu.ph\n*Window 1 serves PWDs, senior citizens and pregnant women; other applicants proceed to the regular receiving window.* Pay the assessed fee at the **BU College of Education (BUCE) Cashier's Office**, then submit the requirements and official receipt to the URO to receive a **claim stub**. Claim the document at the **URO Releasing Area** by presenting the stub.\n*The **first issuance is free of charge**; the fees below apply to re-issuance.*\n\n**Who may avail:** Students, Graduates, Undergraduates, Local and Foreign Agencies\n**Classification / type of transaction:** Highly Technical • G2C - Government to Citizen • G2B - Government to Business • G2G - Government to Government\n\n**Checklist of requirements (where to secure):**\n- Documentary stamps (worth PHP 30.00 per copy) (1 piece) — Post Offices - Cashier / Bureau of Internal Revenue - Cashier\n- For Honorable Dismissal, requirements for the re-issuance of transcript of records — Kindly refer to Checklist A (Re-Issuance of Official Transcript of Records)\n- Authorization Letter (1 original) — Client who is sending their representative\n  *Note:* Requests from internal and external offices and for education verification may be submitted online or onsite.\n\n**Steps, fees and processing time:**\n1. Fill-out the request form onsite or online and submit the requirement/s as stated in the said form.\n   → 1.1 Receive and check request form and completeness of requirement/s submitted online or onsite and retrieve student's record on file for assessment. (Fee: None; Time: 1 Hour; Person: Technical Service Provider, URO-Window 1 / Clerical Staff, URO-Window 3)\n2. Wait for the confirmation or assessment for the requested academic credential onsite or online.\n   → 2. Return the request form with assessment and inform the client of the lacking requirement/s (if applicable), date of release and payment method. (Fee: None; Time: 30 Minutes; Person: Technical Service Provider, URO-Window 1 / Clerical Staff, URO-Window 3)\n3. Pay and present the assessed request form.\n   → 3. Receive payment and assessed request form. (Fee: None; Time: 30 Minutes; Person: Cashier, BUCE Patria G. Lorenzo Bldg.)\n4. Submit the request form together with the Official Receipt and lacking requirements (if applicable).\n   → 4. Receive and record duly accomplished request form, Official Receipt and requirements; and forward the same to the personnel-in-charge for appropriate action. (Fee: Formula: PHP 20.00 per page x no. of pages = Amount; Time: 7 Days; Person: Technical Service Provider, URO-Window 1 / Clerical Staff, URO-Window 3 / Administrative Aide IV / University Registrar, URO)\n5. Wait for the claim stub or instruction about the date of release of the requested document/s.\n   → 5. Release a claim stub or inform the client to set an online appointment for claiming. (Fee: None; Time: 20 Minutes; Person: Technical Service Provider, URO-Window 1 / Clerical Staff, URO-Window 3)\n6. Present proof of approved appointment or claim stub and valid ID in time of return. If representative, submit the requirements for claiming, signed authorization letter and photocopy of his/her valid ID and of the requesting party.\n   → 6. Check credential if completely signed and affix the date of release and dry seal in the requested document/s. Receive and check the requirements for claiming and release the credential. (Fee: None; Time: 30 Minutes; Person: Technical Service Provider, URO-Window 1 / Clerical Staff, URO-Window 3)\n\n**Total:** Fee: PHP 20.00 per page (formula: PHP 20 x no. of pages) • Processing time: 7 Days, 3 Hours, 20 Minutes\n\n> Source: BU Citizen's Charter 2024 (1st Edition), University Registrar's Office. Fees, requirements, and processing times may be updated by the University — always verify with the responsible office before transacting."},{"c":"Citizen's Charter Services","q":"How do I get a CAV (red ribbon) for my academic documents?","a":"**Office of the University Registrar (URO), Second Floor** • Email: bu-uro@bicol-u.edu.ph\n*Window 1 serves PWDs, senior citizens and pregnant women; other applicants proceed to the regular receiving window.* Pay the assessed fee at the **BU College of Education (BUCE) Cashier's Office**, then submit the requirements and official receipt to the URO to receive a **claim stub**. Claim the document at the **URO Releasing Area** by presenting the stub.\n\n**Who may avail:** Students, Graduates, Undergraduates, Local and Foreign Agencies\n**Classification / type of transaction:** Simple • G2C - Government to Citizen • G2B - Government to Business • G2G - Government to Government\n\n**Checklist of requirements (where to secure):**\n- Original documents (e.g., OTR, diploma and certifications) — BU-URO - Windows 1 and 3 or Client\n- Clear photocopies of each original document (2 sets) — Client\n- Documentary stamps (worth PHP 30.00) (2 sets) — Post Offices - Cashier / Bureau of Internal Revenue - Cashier Window\n- Authorization Letter (1 original) — Client who is sending their representative\n  *Note:* Requests from internal and external offices and for education verification may be submitted online or onsite.\n\n**Steps, fees and processing time:**\n1. Fill-out the request form onsite or online and submit the requirement/s as stated in the said form.\n   → 1.1 Receive and check request form and completeness of requirement/s submitted online or onsite and retrieve student's record on file for assessment. (Fee: None; Time: 1 Hour; Person: Technical Service Provider, URO-Window 1 / Clerical Staff, URO-Window 3)\n2. Wait for the confirmation or assessment for the requested academic credential onsite or online.\n   → 2. Return the request form with assessment and inform the client of the lacking requirement/s (if applicable), date of release and payment method. (Fee: None; Time: 30 Minutes; Person: Technical Service Provider, URO-Window 1 / Clerical Staff, URO-Window 3)\n3. Pay and present the assessed request form.\n   → 3. Receive payment and assessed request form. (Fee: None; Time: 30 Minutes; Person: Cashier, BUCE Patria G. Lorenzo Bldg.)\n4. Submit the request form together with the Official Receipt and lacking requirements (if applicable).\n   → 4. Receive and record duly accomplished request form, Official Receipt and requirements; and forward the same to the personnel-in-charge for appropriate action. (Fee: 2 sets CAV (for red ribbon): PHP 20.00 per cert x 2 sets = 40 (PHP 40 x 2 sets = 80); 2 sets photocopy of OTR for Authentication: PHP 10.00 per page (PHP 10 x no. of pages = amount); Time: 2 Days; Person: Technical Service Provider, URO-Window 1 / Clerical Staff, URO-Window 3 / Administrative Aide IV / University Registrar, URO)\n5. Wait for the claim stub or instruction about the date of release of the requested document/s.\n   → 5. Release a claim stub or inform the client to set an online appointment for claiming. (Fee: None; Time: 20 Minutes; Person: Technical Service Provider, URO-Window 1 / Clerical Staff, URO-Window 3)\n6. Present proof of approved appointment or claim stub and valid ID in time of return. If representative, submit the requirements for claiming, signed authorization letter and photocopy of his/her valid ID and of the requesting party.\n   → 6. Check credential if completely signed and affix the date of release and dry seal in the requested document/s. Receive and check the requirements for claiming and release the credential. (Fee: None; Time: 30 Minutes; Person: Technical Service Provider, URO-Window 1 / Clerical Staff, URO-Window 3)\n\n**Total:** Fee: 2 sets CAV (red ribbon): PHP 80.00 + 2 sets photocopy of OTR for Authentication: PHP 10.00 per page • Processing time: 2 Days, 4 Hours, 20 Minutes\n\n> Source: BU Citizen's Charter 2024 (1st Edition), University Registrar's Office. Fees, requirements, and processing times may be updated by the University — always verify with the responsible office before transacting."},{"c":"Citizen's Charter Services","q":"How do I get my academic documents authenticated by the Registrar?","a":"**Office of the University Registrar (URO), Second Floor** • Email: bu-uro@bicol-u.edu.ph\n*Window 1 serves PWDs, senior citizens and pregnant women; other applicants proceed to the regular receiving window.* Pay the assessed fee at the **BU College of Education (BUCE) Cashier's Office**, then submit the requirements and official receipt to the URO to receive a **claim stub**. Claim the document at the **URO Releasing Area** by presenting the stub.\n\n**Who may avail:** Students, Graduates, Undergraduates, Local and Foreign Agencies\n**Classification / type of transaction:** Complex • G2C - Government to Citizen • G2B - Government to Business • G2G - Government to Government\n\n**Checklist of requirements (where to secure):**\n- Original document/s (e.g., OTR, diploma and certifications) — BU-URO - Windows 1 and 3 or Client\n- Clear photocopies of the original document/s — Client\n  *Note:* Requests from internal and external offices and for education verification may be submitted online or onsite.\n\n**Steps, fees and processing time:**\n1. Fill-out the request form onsite or online and submit the requirement/s as stated in the said form.\n   → 1.1 Receive and check request form and completeness of requirement/s submitted online or onsite and retrieve student's record on file for assessment. (Fee: None; Time: 1 Hour; Person: Technical Service Provider, URO-Window 1 / Clerical Staff, URO-Window 3)\n2. Wait for the confirmation or assessment for the requested academic credential onsite or online.\n   → 2. Return the request form with assessment and inform the client of the lacking requirement/s (if applicable), date of release and payment method. (Fee: None; Time: 30 Minutes; Person: Technical Service Provider, URO-Window 1 / Clerical Staff, URO-Window 3)\n3. Pay and present the assessed request form.\n   → 3. Receive payment and assessed request form. (Fee: None; Time: 30 Minutes; Person: Cashier, BUCE Patria G. Lorenzo Bldg.)\n4. Submit the request form together with the Official Receipt and lacking requirements (if applicable).\n   → 4. Receive and record duly accomplished request form, Official Receipt and requirements; and forward the same to the personnel-in-charge for appropriate action. (Fee: PHP 10.00 per page (formula: PHP 10 x no. of pages = amount); Time: 3 Days; Person: Technical Service Provider, URO-Window 1 / Clerical Staff, URO-Window 3 / Administrative Aide IV / University Registrar, URO)\n5. Wait for the claim stub or instruction about the date of release of the requested document/s.\n   → 5. Release a claim stub or inform the client to set an online appointment for claiming. (Fee: None; Time: 20 Minutes; Person: Technical Service Provider, URO-Window 1 / Clerical Staff, URO-Window 3)\n6. Present proof of approved appointment or claim stub and valid ID in time of return. If representative, submit the requirements for claiming, signed authorization letter and photocopy of his/her valid ID and of the requesting party.\n   → 6. Check credential if completely signed and affix the date of release and dry seal in the requested document/s. Receive and check the requirements for claiming and release the credential. (Fee: None; Time: 30 Minutes; Person: Technical Service Provider, URO-Window 1 / Clerical Staff, URO-Window 3)\n\n**Total:** Fee: PHP 10.00 per page (formula: PHP 10 x no. of pages) • Processing time: 3 Days, 3 Hours, 20 Minutes\n\n> Source: BU Citizen's Charter 2024 (1st Edition), University Registrar's Office. Fees, requirements, and processing times may be updated by the University — always verify with the responsible office before transacting."},{"c":"Citizen's Charter Services","q":"How do companies or agencies verify my education records?","a":"**Office of the University Registrar (URO), Second Floor** • Email: bu-uro@bicol-u.edu.ph\n*Window 1 serves PWDs, senior citizens and pregnant women; other applicants proceed to the regular receiving window.* **This service carries no fee.** Requests may be made by mail, e-mail or over the counter. Submit the requirements to the URO to receive a **claim stub**, then claim the result at the **URO Releasing Area**.\n\n**Who may avail:** Students, Graduates, Undergraduates, Local and Foreign Agencies\n**Classification / type of transaction:** Complex • G2C - Government to Citizen • G2B - Government to Business • G2G - Government to Government\n\n**Checklist of requirements (where to secure):**\n- Letter Request (2 copies) — Client\n- Company Profile (1 authenticated copy) — Company\n- Business Permit (1 authenticated copy) — DTI - Window 1\n- SEC Registration (1 authenticated copy) — Client\n- Scanned copy of the OTR of the Student/Graduate (1 set) — Client\n- Signed Authorization Letter/Consent of the Student/Graduate — Client. The consent of the student or graduate is required before the University releases any verification, consistent with the Data Privacy Act of 2012 (RA 10173).\n  *Note:* Requests from internal and external offices and for education verification may be submitted online or onsite.\n\n**Steps, fees and processing time:**\n1. Fill-out the request form onsite or online and submit the requirement/s as stated in the said form.\n   → 1.1 Receive and check request form and completeness of requirement/s submitted online or onsite and retrieve student's record on file for assessment. (Fee: None; Time: 1 Hour; Person: Technical Service Provider, URO-Window 1 / Clerical Staff, URO-Window 3)\n2. Wait for the confirmation or assessment for the requested academic credential onsite or online.\n   → 2. Return the request form with assessment and inform the client of the lacking requirement/s (if applicable), date of release and payment method. (Fee: None; Time: 30 Minutes; Person: Technical Service Provider, URO-Window 1 / Clerical Staff, URO-Window 3)\n3. Pay and present the assessed request form.\n   → 3. Receive payment and assessed request form. (Fee: None; Time: 30 Minutes; Person: Cashier, BUCE Patria G. Lorenzo Bldg.)\n4. Submit the request form together with the Official Receipt and lacking requirements (if applicable).\n   → 4. Receive and record duly accomplished request form, Official Receipt and requirements; and forward the same to the personnel-in-charge for appropriate action. (Fee: None; Time: 3 Days; Person: Technical Service Provider, URO-Window 1 / Clerical Staff, URO-Window 3 / Administrative Aide IV / University Registrar, URO)\n5. Wait for the claim stub or instruction about the date of release of the requested document/s.\n   → 5. Release a claim stub or inform the client to set an online appointment for claiming. (Fee: None; Time: 20 Minutes; Person: Technical Service Provider, URO-Window 1 / Clerical Staff, URO-Window 3)\n6. Present proof of approved appointment or claim stub and valid ID in time of return. If representative, submit the requirements for claiming, signed authorization letter and photocopy of his/her valid ID and of the requesting party.\n   → 6. Check credential if completely signed and affix the date of release and dry seal in the requested document/s. Receive and check the requirements for claiming and release the credential. (Fee: None; Time: 30 Minutes; Person: Technical Service Provider, URO-Window 1 / Clerical Staff, URO-Window 3)\n\n**Total:** Fee: None • Processing time: 3 Days, 3 Hours, 50 Minutes\n\n> Source: BU Citizen's Charter 2024 (1st Edition), University Registrar's Office. Fees, requirements, and processing times may be updated by the University — always verify with the responsible office before transacting."},{"c":"Citizen's Charter Services","q":"Where and how do I pay fees at the BU Cashier's Office?","a":"**Who may avail:** All\n**Classification / type of transaction:** Simple • G2C - Government to Citizen\n\n**Checklist of requirements (where to secure):**\n- Bid Documents (Order of Payment) — PRMO/BAC Office\n- Rentals (Statement of Account) — Business Affairs Office\n- External Researchers/Library Fines/Lost Books (Order of Payment) — University Library\n- Application fee (College of Law/College of Medicine/HISET/SHAT/KAT/NAT) — Admissions Office\n- Psychological Testing (Order of Payment) — Admissions Office\n- Shifting/Transferee Fee (Application Form) — Admissions Office\n- Evaluation of Folders for NBC (Individual print-out for NBC, QCE Folders and CCE Folders) — Zonal/IQA Office\n\n**Steps, fees and processing time:**\n1. Pay the corresponding authorized fees and charges.\n   → 1.1 Review assessment of fees/order of payment made. (Fee: Bid Documents (depending on the approved budget for the Contract): PHP 500 (500,000 and below); PHP 1,000 (more than 500,000 up to 1 Million); PHP 5,000 (more than 1 Million up to 5 Million); PHP 10,000 (more than 5 Million up to 10 Million); PHP 25,000 (more than 10 Million up to 50 Million); PHP 50,000 (more than 50 Million up to 500 Million); PHP 75,000 (more than 500 Million). Rentals: Dormitory PHP 1,600/head/month (additional charge for electricity per month depending on computed consumption); Guestel PHP 800/room/night (2pax), PHP 1,200 (3pax), PHP 1,600 (4pax), PHP 200.00 additional charge for extra bed/night/head; Stall/Space rentals (per statement of account issued by Business Affairs Office). BU Vehicle (Coaster): PHP 1,500/day within Daraga and Legazpi; PHP 2,500/day within the region; PHP 5,000/day Legazpi to Manila. External Researchers and Library Fines: see tables in the Library section. Lost Books: acquisition price/assigned amount if undetermined. Application Fee: College of Law PHP 750.00; College of Medicine PHP 1,500.00; HISET PHP 100.00; SHAT PHP 200.00; KAT PHP 200.00; NAT PHP 200.00. Psychological Testing: see fee table. Shifting/Transferee Fee: PHP 100.00. Evaluation of Folders for NBC: Individual print-out PHP 100.00; CCE Folders PHP 150.00; QCE Folders PHP 275.00.; Time: 5 Minutes; Person: Admin. Officer V/Admin. Asst. I/Admin. Aide III, University Cashier's Office)\n   → 1.2 Receive the payment and issues the corresponding Official Receipt. (Fee: None; Time: 5 Minutes; Person: Admin. Officer V/Admin. Asst. I/Admin. Aide III, University Cashier's Office)\n\n**Total:** Fee: Amount of assessed fees/charges (see fee schedule in the description) • Processing time: 10 Minutes\n\n**Note:** Psychological Testing fees (outside clients): Intelligence/Test of General Mental Ability PHP 400.00; Achievement/Aptitude Test PHP 400.00; Personality test PHP 600.00; Interest/Motivation test PHP 600.00; Special Test (ADHD/ADD, Dyslexia, Autism, Stanford-Binet) PHP 1,100.00. (BU Students): Intelligence/GMA PHP 200.00; Achievement/Aptitude PHP 300.00; Personality PHP 300.00; Interest/Motivation PHP 400.00; Special Test PHP 400.00.\n\n> Source: BU Citizen's Charter, 2023 (2nd Edition), pp. 131-141. Fees, requirements, and processing times may be updated by the University — always verify with the responsible office before transacting."},{"c":"Citizen's Charter Services","q":"How are employee premiums and loan amortizations remitted to agencies?","a":"**Who may avail:** Creditors and External Agencies\n**Classification / type of transaction:** Highly Technical • G2B - Government to Business • G2G - Government to Government\n\n**Checklist of requirements (where to secure):**\n- Updated monthly billings — Creditors/External Agencies\n- Abstract of remittances (7 printed copies) — Creditors/External Agencies\n\n**Steps, fees and processing time:**\n1. Email or transmit updated monthly billings.\n   → 1.1 Receive, review and record documents submitted. (Fee: None; Time: 24 days for the 19 Units/Colleges; Person: Payroll Admin Office Senior Staff, Payroll Administration Office)\n   → 1.2 Check and update monthly billing. (Fee: None; Time: 4 days for the 19 Units/Colleges; Person: Payroll Admin Office Senior Staff, Payroll Administration Office)\n   → 1.3 Review and print remittance/s. (Fee: None; Time: 1 day; Person: Payroll Admin Office Senior Staff, Payroll Administration Office)\n   → 1.4 Sign the monthly remittance per college/unit. (Fee: None; Time: 6 hours; Person: Payroll Admin Officer, Payroll Administration Office)\n   → 1.5 Record and forward the payroll to the Budget Office for Obligation Slip. (Fee: None; Time: 2 hours; Person: Payroll Admin Office Staff, Payroll Administration Office)\n\n**Total:** Fee: None • Processing time: 8 Days\n\n**Note:** Documents for receiving shall be disinfected using the UVC disinfection box. Clients are advised to adhere to government Covid-19 health and safety protocols when transacting at the office (e.g., wearing of face mask and observance of physical distancing); transactions shall be thru window transactions only.\n\n> Source: BU Citizen's Charter, 2023 (2nd Edition), pp. 145-147. Fees, requirements, and processing times may be updated by the University — always verify with the responsible office before transacting."},{"c":"Citizen's Charter Services","q":"How do I file an accident insurance claim as a BU student?","a":"**Who may avail:** Officially enrolled students\n**Classification / type of transaction:** Highly Technical • G2C - Government to Citizen\n\n**Checklist of requirements (where to secure):**\n- Application form (1 original copy) — Office of the College Student Affairs and Services Coordinator, BU website, ISPSD Office\n- Incident report (1 original copy) — PNP (if outside the campus) / CSAC (if within the campus)\n- Receipt of purchased medicine (1 original copy) — Pharmacy / Hospital\n- Doctor's Prescription (1 original copy) — Hospital/Medical Clinic/Local Government Units/Accredited Health Services\n- Medical Certificate (1 original copy) — Hospital / Medical Clinic\n- Statement of Account (if hospitalized, 1 original copy) — Hospital\n- Official Receipt and Certificate of Registration (if due to motorcycling) — LTFRB\n- Driver's License and Official Receipt (if due to motorcycling) — LTFRB\n\n**Steps, fees and processing time:**\n1. Accomplish and submit request/application form and other supporting documents to the UISPS Division Window 1.\n   → 1.1 Accept and review documents if compliant to requirements. (Fee: None; Time: 15 Minutes; Person: Director, University Inst. Student Programs and Services Division)\n   → 1.2 Inform and prepare an endorsement of documents to the university insurance provider. (Fee: None; Time: 30 Minutes; Person: Director, University Inst. Student Programs and Services Division)\n   → 1.3 Pick-up documents and process application of client. (Fee: None; Time: 22 Days; Person: Branch Manager, Insurance Provider)\n   → 1.4 Receive check of payment from the insurance provider. (Fee: None; Time: 15 Minutes; Person: Director, University Inst. Student Programs and Services Division)\n   → 1.5 Notify claimant/beneficiary of check and schedule date of release. (Fee: None; Time: 10 Minutes; Person: Director, University Inst. Student Programs and Services Division)\n2. Go to window 1 to receive the check and register in the logbook to acknowledge payment.\n   → 2. Release the check to the client. (Fee: None; Time: 5 Minutes; Person: Director, University Inst. Student Programs and Services Division)\n\n**Total:** Fee: None • Processing time: 22 Days, 1 Hour and 15 Minutes\n\n> Source: BU Citizen's Charter 2024 (1st Edition), Office of Student Affairs and Services. Fees, requirements, and processing times may be updated by the University — always verify with the responsible office before transacting."},{"c":"Citizen's Charter Services","q":"How do I apply for a BU student loan?","a":"**Who may avail:** All officially enrolled students\n**Classification / type of transaction:** Complex • G2C - Government to Citizen\n\n**Checklist of requirements (where to secure):**\n- BU-F-OSAS-05 / BU-F-OSAS-06 / BU-F-OSAS-07 / BU-F-OSAS-08 / BU-F-OSAS-09 / BU-F-OSAS-10 (3 original copies) — BU website / Window 3, Student Union Center\n- Certificate of Registration (1 copy - Certified True copy) — Registrar\n- 2x2 picture (3 pieces original copies) — Photo studio/print shop\n\n**Steps, fees and processing time:**\n1. Submit the application form and other supporting documents to the Student Union Center window 3 or email to bu_osas@bicol-u.edu.ph.\n   → 1.1 Accept and verifies applications submitted per the approved guidelines. (Fee: None; Time: 30 Minutes; Person: University Scholarship and Grants-in-Aid Coordinator, University Inst. Student Programs and Services Division)\n   → 1.2 Recommend to the Office of the President thru the VPAA the approval of the application. (Fee: None; Time: 1 Day; Person: University Scholarship and Grants-in-Aid Coordinator, University Inst. Student Programs and Services Division)\n   → 1.3 Prepare voucher/payroll, other docs for the processing of approved loan grants. (Fee: None; Time: 7 Days; Person: University Scholarship and Grants-in-Aid Coordinator, University Inst. Student Programs and Services Division)\n\n**Total:** Fee: None • Processing time: 8 Days and 30 Minutes\n\n**Note:** Application forms may be secured from the BU website or Window 3, Student Union Center; or email bu_osas@bicol-u.edu.ph.\n\n> Source: BU Citizen's Charter 2024 (1st Edition), University Scholarship and Financial Assistance Unit. Fees, requirements, and processing times may be updated by the University — always verify with the responsible office before transacting."},{"c":"Citizen's Charter Services","q":"How do I file my Acknowledgement of Scholarship?","a":"**Who may avail:** Students and personnel with scholarship grants/tuition privileges/discounts\n**Classification / type of transaction:** Simple • G2C - Government to Citizen\n\n**Checklist of requirements (where to secure):**\n- Application Form (1 original copy) — College Student Affairs and Services Coordinator, BU website, ISPSD Office\n- Certificate of Registration for the current semester (1 duly certified copy) — Registrar's Office\n- Proof of Scholarship/Letter from Benefactor/Sponsor (if new applicant) — Respective benefactors\n- 2x2 picture with name tag (1 copy) — Photo Center/Print Shop\n- Long folder (1 piece) — To be provided by the applicant\n\n**Steps, fees and processing time:**\n1. Submit the application form and other supporting documents to the Student Union Center, window 1/2/3 or email to bu_osas@bicol-u.edu.ph.\n   → 1.1 Verify submitted documents. (Fee: None; Time: 5 Minutes; Person: University Scholarship and Grants-in-Aid Coordinator, University Inst. Student Programs and Services Division)\n   → 1.2 Tag and post details of the scholarship and discount. (Fee: None; Time: 5 Minutes; Person: University Scholarship and Grants-in-Aid Coordinator, University Inst. Student Programs and Services Division)\n2. Register and sign the Monitoring Sheet.\n   → 2. Issue the Notice of Acknowledgment or email client a copy of the Notice of Acknowledgment. (Fee: None; Time: 5 Minutes; Person: University Scholarship and Grants-in-Aid Coordinator, University Inst. Student Programs and Services Division)\n\n**Total:** Fee: None • Processing time: 15 Minutes\n\n**Note:** Filed every semester of the school year.\n\n> Source: BU Citizen's Charter 2024 (1st Edition), University Scholarship and Financial Assistance Unit. Fees, requirements, and processing times may be updated by the University — always verify with the responsible office before transacting."},{"c":"Citizen's Charter Services","q":"How do I get my BU ID (first issuance)?","a":"**Who may avail:** First Year students; Newly Hired Personnel\n**Classification / type of transaction:** Simple • G2C - Government to Citizen\n\n**Checklist of requirements (where to secure):**\n- Certificate of Registration — Registrar\n- Official Receipt — Cashier\n- Claim stub from the HRMO (for Personnel) — Office of the Human Resource and Management\n\n**Steps, fees and processing time:**\n1. Present copy of the Certificate of Registration/Claim Stub issued by HRMO.\n   → 1. Verify presented documents. (Fee: None; Time: 1 Minute; Person: Director, University Inst. Student Programs and Services Division)\n2. Verify correctness of personal data encoded.\n   → 2. Encode information of client into the ID data system. (Fee: None; Time: 1 Minute; Person: Director, University Inst. Student Programs and Services Division)\n3. Pose for photo.\n   → 3. Take photo of the client. (Fee: None; Time: 1 Minute; Person: Director, University Inst. Student Programs and Services Division)\n4. Sign on the signature pad.\n   → 4.1 Affix signature onto client profile. (Fee: None; Time: 1 Minute; Person: Director, University Inst. Student Programs and Services Division)\n   → 4.2 Print data of client onto the PVC ID card. (Fee: None; Time: 1 Minute; Person: Director, University Inst. Student Programs and Services Division)\n5. Register in the Registry Sheet.\n   → 5. Release ID to client. (Fee: None; Time: 1 Minute; Person: Director, University Inst. Student Programs and Services Division)\n\n**Total:** Fee: None • Processing time: 5 Minutes\n\n> Source: BU Citizen's Charter, 2023 (2nd Edition), pp. 199-200. Fees, requirements, and processing times may be updated by the University — always verify with the responsible office before transacting."},{"c":"Citizen's Charter Services","q":"How do I get my BU ID re-printed?","a":"**Who may avail:** Students enrolled for the current semester/midyear; Personnel\n**Classification / type of transaction:** Highly Technical • G2C - Government to Citizen\n\n**Checklist of requirements (where to secure):**\n- Certificate of Registration for current semester — Registrar\n- Official Receipt for ID reprinting — Cashier\n- Affidavit of Loss (1 original copy) — Public Attorney's Office/Notary Public\n- Endorsement from CSASC/Dean/Director (1 original copy) — CSASC/Dean's Office/Director's Office\n- ID Claim Stub from HRMO (For personnel only) — Office of the Human Resource Management\n\n**Steps, fees and processing time:**\n1. Student-client pays to the cashier the ID printing fee and proceeds to the Student Union Center, 2nd Floor USDS office and submits all other requirements.\n   → 1. Review and accept documents for completeness. (Fee: PHP 75.00; Time: 15 Minutes; Person: Director, University Inst. Student Programs and Services Division)\n2. Review data for correctness.\n   → 2.1 Enter new information/change in the client ID profile. (Fee: None; Time: 1 Minute; Person: Director, University Inst. Student Programs and Services Division)\n   → 2.2 Print data to PVC card ID. (Fee: None; Time: 1 Minute; Person: Director, University Inst. Student Programs and Services Division)\n3. Register in the Monitoring Sheet and receive the printed ID.\n   → 3. Release printed ID to client. (Fee: None; Time: 1 Minute; Person: Director, University Inst. Student Programs and Services Division)\n\n**Total:** Fee: PHP 75.00 • Processing time: 18 Minutes\n\n> Source: BU Citizen's Charter, 2023 (2nd Edition), pp. 200-201. Fees, requirements, and processing times may be updated by the University — always verify with the responsible office before transacting."},{"c":"Citizen's Charter Services","q":"How do I audition for a BU Performing Arts Group?","a":"**Who may avail:** Students with inclination to music, arts, and performances.\n**Classification / type of transaction:** Highly Technical • G2C - Government to Citizen\n\n**Checklist of requirements (where to secure):**\n- Accomplished BU PAG Form — University Culture and Arts Office, 2nd Floor, BU Student Union Center\n\n**Steps, fees and processing time:**\n1. Submit application form.\n   → 1. Accepts and verifies application for the audition process. (Fee: None; Time: 3 Minutes; Person: University Culture and the Arts Coordinator, University Inst. Student Programs and Services Division)\n2. Report for the scheduled audition.\n   → 2. Conduct initial audition activities. (Fee: None; Time: 7 Days; Person: University Culture and the Arts Coordinator, University Inst. Student Programs and Services Division)\n3. Attend workshops/rehearsals.\n   → 3. Organize series of workshops and trainings. (Fee: None; Time: 22 Days; Person: University Culture and the Arts Coordinator, University Inst. Student Programs and Services Division)\n4. Perform in university activities, off-campus invites, and other college events/functions.\n   → 4. Facilitate/supervise group performances in the university and outside invitations. (Fee: None; Time: None; Person: University Culture and the Arts Coordinator, University Inst. Student Programs and Services Division)\n\n**Total:** Fee: None • Processing time: 29 Days, 3 Minutes\n\n> Source: BU Citizen's Charter, 2023 (2nd Edition), pp. 202-203. Fees, requirements, and processing times may be updated by the University — always verify with the responsible office before transacting."},{"c":"Citizen's Charter Services","q":"How do I get my student organization accredited or re-accredited?","a":"**Who may avail:** Students who may want to form into a Group, Society, Guild, promote advocacy, and the like.\n**Classification / type of transaction:** Highly Technical • G2C - Government to Citizen\n\n**Checklist of requirements (where to secure):**\n- A. Accreditation of a new organization: Accomplished BU-F-OSAS-18 (3 original copies) — USDS Office, BU Website, College Student Affairs and Services Coordinator, Student Council Offices\n- A. Constitution-and-by-Laws (1 set original copy duly signed by founding officers/members and adviser) — Applying organization\n- A. List of Founding Officers and Adviser (1 original copy, follow format in the form) — Applying organization\n- A. List of Members (1 original copy, follow format in the form) — Applying organization\n- A. Program of Activities for 2 semesters (2 original copies) — Applying organization\n- A. Flyer of the Organization (1 original copy) — Applying organization\n- B. Re-accreditation of organization: Accomplished BU-F-OSAS-18 (3 original copies) — Applying organization\n- B. Constitution-and-by-Laws (if amended, with signature of officers, members, and adviser, 1 set original copy) — Applying organization\n- B. Accomplishment Reports for 2 semesters of the last school year accredited (1 set photocopy duly signed by concerned officers) — Applying organization\n- B. Audited Financial Reports for 2 semesters of the last school year based on their program of activities (1 set photocopy) — Applying organization\n- B. List of Officers (1 original copy, follow format in the form) — Applying organization\n- B. List of Members (1 original copy, follow format in the form) — Applying organization\n- B. Program of Activities for 2 semesters for the current school year — Applying organization\n- B. Recent Flyer of the organization (1 copy original) — Applying organization\n- B. Bank book in the name of the organization (1 photocopy cover page and transaction for the school year accredited) — Applying organization\n  *Note:* Accreditation/Re-accreditation is conducted in the 1st semester of the school year.\n\n**Steps, fees and processing time:**\n1. Submit/upload the application form and other supporting documents for accreditation/re-accreditation to the USDS office or email to usds.buosas@bicol-u.edu.ph.\n   → 1.1 Accept and review submitted/uploaded documents for completeness. (Fee: None; Time: 5 Days; Person: Director, University Student Development Services)\n   → 1.2 The University Accreditation Committee convenes to evaluate applications. (Fee: None; Time: 15 Days; Person: Dean, Office of Student Affairs and Services)\n   → 1.3 Prepare and release list of organizations with requirement deficiencies. (Fee: None; Time: 2 Days; Person: Director, University Student Development Services)\n2. Comply with document deficiencies.\n   → 2.1 Verify document compliance. (Fee: None; Time: 3 Minutes; Person: Director, University Student Development Services)\n   → 2.2 Post/disseminate to the different colleges/units List of Accredited and Re-accredited UBO for the current school year. (Fee: None; Time: 5 Days; Person: Director, University Student Development Services)\n\n**Total:** Fee: None • Processing time: 27 Days, 3 Minutes\n\n> Source: BU Citizen's Charter, 2023 (2nd Edition), pp. 203-206. Fees, requirements, and processing times may be updated by the University — always verify with the responsible office before transacting."},{"c":"Citizen's Charter Services","q":"How do I get an Authority to Travel for an off-campus activity?","a":"**Who may avail:** Students/Class planning to conduct a curricular or non-curricular off-campus activity.\n**Classification / type of transaction:** Simple • G2C - Government to Citizen\n\n**Checklist of requirements (where to secure):**\n- A. Curricular: Letter to the President (2 copies original) — Requesting party\n- A. Syllabus (1 copy photocopy) — Faculty-in-Charge\n- A. Approved proposal (1 set photocopy) — Dean's office/OP\n- A. Endorsement by the College Crisis Management — Dean's office\n- A. Risk Management Plan — Requesting party\n- A. Letter to LGU's/Agencies/Officials with acknowledgment/response — Concerned LGU/Agencies/Officials\n- A. Certification that participants are officially enrolled (1 copy original) / Certificate of Registration duly signed by Registrar (1 copy photocopy) — College Registrar\n- A. Parents permit/JURAT (1 copy original, notarized) — BU website / USDS Office\n- A. Medical clearance/certification (1 copy original) — University Health Office\n- A. Insurance coverage for current school year with list of student insured (1 copy photocopy) — College Student Council\n- A. LTFRB official receipts, Certificate of Registration, Certificate of Public Convenience, Certificate of Road Worthiness, Driver's License, DOT Accreditation (clear photocopies) — Travel and Tour Operator/Third Party or Subcontracting/Department of Tourism\n- A. Authority to Travel for Faculty Chaperones (1 copy original) — College Dean\n- A. Designation of Faculty-in-Charge/Chaperone (1 copy original) — College Dean\n- A. Training Certificate of First Aid/BLS for Faculty-in-Charge/Chaperone (1 copy photocopy) — Phil. Red Cross / Medical Health Units / Bureau of Fire and Protection\n- B. Non-curricular: Letter to the President (2 copies original); Approved proposal (1 set photocopy); Endorsement by the College Crisis Management (1 copy original); Risk Management Plan (1 copy original); Invitation from organizing group with program (1 photocopy); Letter to LGU's/Agencies/Officials with acknowledgment/response; Certification that participants are officially enrolled / Certificate of Registration duly signed by Registrar; Parents permit/JURAT (notarized); Medical clearance/certification; Insurance coverage; LTFRB official receipts, COR, CPC, Road Worthiness, Driver's License, DOT Accreditation; Authority to Travel for Faculty Chaperones; Designation of Faculty-in-Charge/Chaperone; Training Certificate of First Aid/BLS — As listed for curricular activities (requesting party, Dean's office, concerned LGUs/agencies, College Registrar, BU website/USDS Office, University Health Office, College Student Council, Travel and Tour Operator, Department of Tourism, College Dean, Phil. Red Cross/Medical Health Units/BFP)\n  *Note:* Compliance with CMO No. 63, series of 2017 is verified.\n\n**Steps, fees and processing time:**\n1. Submit letter request and other documents to the OSAS Dean, Ground Floor, Student Union Center.\n   → 1.1 Receives and verifies document compliance to CMO 63, series 2017. (Fee: None; Time: 3 Minutes; Person: Director, University Student Development Services)\n   → 1.2 Prepare Authority to Travel of participants and endorsement of the OSAS Dean to OP thru VPAA and UCMC recommending approval of the off-campus activity. (Fee: None; Time: 3 Days; Person: Director, University Student Development Services)\n   → 1.3 Forward all documents to the VPAA. (Fee: None; Time: 2 Hours; Person: Director, University Student Development Services)\n\n**Total:** Fee: None • Processing time: 3 Days, 2 Hours and 3 Minutes\n\n> Source: BU Citizen's Charter 2024 (1st Edition), Programs and Services Division. Fees, requirements, and processing times may be updated by the University — always verify with the responsible office before transacting."},{"c":"Citizen's Charter Services","q":"What is the Student Individual Inventory service?","a":"**Who may avail:** All Students of Bicol University\n**Classification / type of transaction:** Complex • G2C - Government to Citizen\n\n**Checklist of requirements (where to secure):**\n- Fully accomplished Student Profile Form (1 copy original) — Office of Student Welfare Services Division/College Guidance Offices\n- 2x2 picture (1 piece) — Local Photo Center/Print Shop\n\n**Steps, fees and processing time:**\n1. Sign in the Visitor's Log Book in the receiving area of the office.\n   → 1.1 Give the Visitor's Log book to the client. (Fee: None; Time: 1 Minute; Person: Director, University Student Welfare Services Division)\n   → 1.2 Give a copy of the Student Profile Form to the students per block. (Fee: None; Time: 5 Minutes; Person: Director, University Student Welfare Services Division)\n2. Fill-out the Student Profile Form and submit to your College Guidance Office.\n   → 2.1 Receive the required documents by block and check for completeness. (Fee: None; Time: 2 Days; Person: Director, University Student Welfare Services Division)\n   → 2.2 Collate and summarize the data. (Fee: None; Time: 2 Days; Person: Director, University Student Welfare Services Division)\n   → 2.3 Place the students' profiles in the student inventory folders and all folders are organized in the steel cabinets. (Fee: None; Time: 30 Minutes; Person: Director, University Student Welfare Services Division)\n\n**Total:** Fee: None • Processing time: 4 Days, 36 Minutes\n\n> Source: BU Citizen's Charter, 2023 (2nd Edition), pp. 211-213. Fees, requirements, and processing times may be updated by the University — always verify with the responsible office before transacting."},{"c":"Citizen's Charter Services","q":"How do I avail the BU counseling service?","a":"**Who may avail:** All Students of Bicol University\n**Classification / type of transaction:** Simple • G2C - Government to Citizen\n\n**Checklist of requirements (where to secure):**\n- Fully accomplished counseling intake form or referral form (1 original copy or fill out link: bitly.bucounselingintakeform) — Office of Student Welfare Services Division / College Guidance Offices\n\n**Steps, fees and processing time:**\n1. Accomplishing of Counseling Intake Form/Referral Form.\n   → 1.1 Download or print the counseling intake form response or referral form response of the student. (Fee: None; Time: 5 Minutes; Person: Director, University Student Welfare Services Division)\n   → 1.2 Send thru the email the counseling intake form response of the student to the respective Registered Guidance Counselor. (Fee: None; Time: 2 Minutes; Person: Director, University Student Welfare Services Division)\n   → 1.3 Contact and schedule for counseling. (Fee: None; Time: 10 Minutes; Person: Director, University Student Welfare Services Division)\n2. Respond to the message of the Guidance Counselor and report on the scheduled counseling session in the respective College Guidance Office or thru telephone or online.\n   → 2.1 Start the online or tele-counseling or face-to-face counseling session (Intake to Termination). (Fee: None; Time: 2 Hours; Person: Director, University Student Welfare Services Division)\n   → 2.2 Assess the case if it is within professional capability. (Fee: None; Time: 15 Minutes; Person: Director, University Student Welfare Services Division)\n   → 2.3 Assess if there's a need for further session or referral to other professionals. (Fee: None; Time: 15 Minutes; Person: Director, University Student Welfare Services Division)\n   → 2.4 Check on students after termination of counseling (follow-up). (Fee: None; Time: 15 Minutes; Person: Director, University Student Welfare Services Division)\n\n**Total:** Fee: None • Processing time: 3 Hours, 2 Minutes\n\n**Note:** Intake form link: bitly.bucounselingintakeform\n\n> Source: BU Citizen's Charter, 2023 (2nd Edition), pp. 213-214. Fees, requirements, and processing times may be updated by the University — always verify with the responsible office before transacting."},{"c":"Citizen's Charter Services","q":"How do I rent a BU facility (stall, kiosk, canteen)?","a":"**Who may avail:** All\n**Classification / type of transaction:** Highly Technical • G2C - Government to Citizen • G2G - Government to Government • G2B - Government to Business\n\n**Checklist of requirements (where to secure):**\n- Letter of Intent (1 Original Copy) — BAO\n- Official Receipt for 3 months Deposit (1 Copy - Photocopy) — BU Cashier\n- DTI Registration (1 Copy - Photocopy) — DTI\n- Health Clearance (1 copy - Photocopy) — LGU\n\n**Steps, fees and processing time:**\n1. Submit Requirements.\n   → 1. Receives complete Requirements. (Fee: None; Time: 15 Minutes; Person: College Business Manager, Business Affairs Office)\n2. Client pays the 3 months deposit at the cashier.\n   → 2.1 Issue Official Receipt. (Fee: See Table *Rental Rate with Surcharge; Time: 15 Minutes; Person: Cashiers Office, University Cashier's Office)\n   → 2.2 Check/review the requirements submitted by the clients.
