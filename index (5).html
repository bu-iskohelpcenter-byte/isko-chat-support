<style>
/* ============================================================
   ISKO CHAT — chat-only support app
   Brand palette from the official ISKO Help Center
   ============================================================ */
:root{
  --blue-900:#002c52; --blue-800:#003a6b; --blue-700:#004880; --blue-600:#005f9e;
  --blue-500:#0087c9; --blue-100:#e6f2fa; --blue-50:#f2f7fb;
  --orange:#fe6f19; --orange-soft:#fff1e6; --green:#0b7a3e; --green-soft:#e7f7ee;
  --ink:#14212b; --ink-soft:#4a5b68; --line:#dbe6ee;
  --bg:#eef4f9; --card:#ffffff; --bubble-bot:#ffffff; --bubble-user:linear-gradient(135deg,#0087c9,#005f9e);
  --chip-bg:#ffffff; --chip-line:#bcd8ea; --chip-ink:#004d80;
  --shadow:0 10px 30px rgba(0,60,110,.14);
  --danger:#b00020;
}
[data-theme="dark"]{
  --blue-900:#0a2846; --blue-800:#0e3560; --blue-700:#123f6e; --blue-600:#1c5b95;
  --blue-500:#2e86d8; --blue-100:#12324f; --blue-50:#0e2438;
  --orange:#ff8a45; --orange-soft:#3a2414; --green:#3fbf7f; --green-soft:#0f2e20;
  --ink:#e9f1f7; --ink-soft:#9fb3c2; --line:#24465f;
  --bg:#0b1622; --card:#122439; --bubble-bot:#182f47; --bubble-user:linear-gradient(135deg,#1c5b95,#123f6e);
  --chip-bg:#16293d; --chip-line:#2c5575; --chip-ink:#9ecdea;
  --shadow:0 10px 30px rgba(0,0,0,.5);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:'Segoe UI',system-ui,-apple-system,Roboto,'Helvetica Neue',Arial,sans-serif;
  background:
    radial-gradient(1200px 500px at 85% -10%, rgba(0,135,201,.16), transparent 60%),
    radial-gradient(900px 420px at -10% 110%, rgba(254,111,25,.12), transparent 55%),
    var(--bg);
  color:var(--ink);
  display:flex;align-items:center;justify-content:center;
  padding:0;
  min-height:100dvh;
}
.shell{
  width:min(820px,100%);height:min(920px,100dvh);
  display:flex;flex-direction:column;
  background:var(--card);
  box-shadow:var(--shadow);
  border:1px solid var(--line);
  position:relative;overflow:hidden;
}
@media (min-width:900px){ .shell{border-radius:22px;margin:18px auto;height:calc(100dvh - 36px);} }

/* ---------- header ---------- */
.head{
  background:linear-gradient(120deg,var(--blue-800),var(--blue-600));
  color:#fff;padding:14px 16px 12px;
  display:flex;align-items:center;gap:12px;
  flex:0 0 auto;position:relative;z-index:5;
}
.head .logo{width:46px;height:46px;border-radius:12px;background:#fff;padding:3px;box-shadow:0 2px 8px rgba(0,0,0,.25);flex:0 0 auto}
.head .id{flex:1 1 auto;min-width:0}
.head .id h1{font-size:17px;font-weight:700;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.head .id .sub{display:flex;align-items:center;gap:6px;font-size:11.5px;opacity:.92;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:8px;height:8px;border-radius:50%;background:#3ddc84;box-shadow:0 0 0 3px rgba(61,220,132,.25);flex:0 0 auto}
.head .ctrls{display:flex;gap:6px;flex:0 0 auto}
.hbtn{
  background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28);color:#fff;
  border-radius:10px;padding:6px 9px;font-size:12.5px;cursor:pointer;line-height:1;
  display:inline-flex;align-items:center;gap:5px;transition:background .15s;
}
.hbtn:hover{background:rgba(255,255,255,.26)}
.hbtn .ic{font-size:13px}

/* ---------- messages ---------- */
.msgs{
  flex:1 1 auto;overflow-y:auto;overscroll-behavior:contain;
  padding:18px 16px 10px;scroll-behavior:smooth;
  display:flex;flex-direction:column;gap:12px;
  background:linear-gradient(180deg,var(--blue-50),var(--card) 140px);
}
.row{display:flex}.row.bot{justify-content:flex-start}.row.user{justify-content:flex-end}
.row.sys{justify-content:center}
.av{width:32px;height:32px;border-radius:10px;background:#fff;border:1px solid var(--line);padding:2px;margin-right:8px;flex:0 0 auto;align-self:flex-end;box-shadow:0 2px 6px rgba(0,0,0,.08)}
.msg{max-width:82%;display:flex;flex-direction:column;gap:4px}
.bubble{
  padding:10px 13px;border-radius:16px;font-size:14.5px;line-height:1.55;
  word-wrap:break-word;overflow-wrap:anywhere;box-shadow:0 2px 8px rgba(0,30,60,.08);
}
.row.bot .bubble{background:var(--bubble-bot);border:1px solid var(--line);border-bottom-left-radius:5px}
.row.user .bubble{background:var(--bubble-user);color:#fff;border-bottom-right-radius:5px}
.t{font-size:10.5px;color:var(--ink-soft);padding:0 4px;opacity:.8}
.row.user .t{text-align:right}
.sysnote{
  font-size:11.5px;color:var(--ink-soft);background:var(--blue-100);
  border:1px solid var(--line);border-radius:999px;padding:5px 12px;max-width:92%;text-align:center;
}
/* ---------- formatted answer ---------- */
.ans{display:block}
.ans b,.ans strong{font-weight:700}
.ans p{margin:6px 0 0}.ans p:first-child{margin-top:0}
.ans ul{margin:6px 0 0 20px;list-style:disc}
.ans ol{margin:6px 0 0 20px;list-style:decimal}
.ans li{margin:3px 0}
.ans a{color:var(--blue-500)}
.ans .src{font-size:11px;color:var(--ink-soft);border-top:1px dashed var(--line);margin-top:8px;padding-top:6px}
.badge{
  display:inline-block;font-size:10.5px;font-weight:600;color:var(--blue-700);
  background:var(--blue-100);border:1px solid var(--line);border-radius:999px;padding:2px 8px;margin-bottom:6px;
}
.badge.ai{background:var(--green-soft);border-color:var(--green);color:var(--green)}
.srcline{font-size:11px;color:var(--ink-soft);border-top:1px dashed var(--line);margin-top:8px;padding-top:6px}
/* ---------- chips ---------- */
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:6px}
.chip{
  background:var(--chip-bg);border:1px solid var(--chip-line);color:var(--chip-ink);
  border-radius:999px;padding:7px 12px;font-size:13px;cursor:pointer;
  transition:all .15s;text-align:left;
}
.chip:hover{background:var(--blue-100);border-color:var(--blue-500);transform:translateY(-1px)}
.chip.primary{background:var(--orange);border-color:var(--orange);color:#fff}
.chip.primary:hover{filter:brightness(1.06);background:var(--orange)}
/* ---------- helpful row ---------- */
.helprow{display:flex;align-items:center;gap:8px;margin-top:7px;flex-wrap:wrap}
.helprow .q{font-size:12.5px;color:var(--ink-soft)}
.hbtn2{
  border:1px solid var(--chip-line);background:var(--chip-bg);color:var(--chip-ink);
  border-radius:999px;padding:5px 11px;font-size:12.5px;cursor:pointer;transition:all .15s;
}
.hbtn2:hover{border-color:var(--blue-500);background:var(--blue-100)}
.hbtn2.on{background:var(--green-soft);border-color:var(--green);color:var(--green)}
/* ---------- stars ---------- */
.stars{display:flex;gap:4px;margin-top:8px}
.star{font-size:24px;background:none;border:none;cursor:pointer;color:var(--chip-line);transition:transform .12s}
.star.on{color:#f5a623;transform:scale(1.12)}
.star:hover{transform:scale(1.18)}
/* ---------- typing ---------- */
.typing{display:inline-flex;gap:4px;padding:12px 14px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--blue-500);animation:blink 1.1s infinite}
.typing i:nth-child(2){animation-delay:.18s}.typing i:nth-child(3){animation-delay:.36s}
@keyframes blink{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}
/* ---------- composer ---------- */
.comp{
  flex:0 0 auto;border-top:1px solid var(--line);background:var(--card);
  padding:10px 12px calc(10px + env(safe-area-inset-bottom));
  display:flex;gap:8px;align-items:flex-end;
}
.comp input{
  flex:1;border:1px solid var(--line);background:var(--chip-bg);color:var(--ink);
  border-radius:16px;padding:11px 14px;font-size:14.5px;outline:none;transition:border .15s;
}
.comp input:focus{border-color:var(--blue-500);box-shadow:0 0 0 3px rgba(0,135,201,.15)}
.send{
  width:44px;height:44px;border-radius:50%;border:none;cursor:pointer;flex:0 0 auto;
  background:linear-gradient(135deg,var(--blue-500),var(--blue-600));color:#fff;
  font-size:17px;display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 12px rgba(0,110,180,.35);transition:transform .12s;
}
.send:hover{transform:scale(1.06)}
.send:disabled{opacity:.5;cursor:default;transform:none}
.hint{font-size:11px;color:var(--ink-soft);padding:6px 6px 2px;text-align:center;flex:0 0 auto}
.foot{
  flex:0 0 auto;text-align:center;font-size:10.5px;color:var(--ink-soft);
  padding:5px 10px 8px;border-top:1px solid var(--line);background:var(--card);
}
/* ---------- scrollbar ---------- */
.msgs::-webkit-scrollbar{width:8px}
.msgs::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px}
@media (max-width:520px){
  .msg{max-width:92%}
  .head .id .sub{max-width:150px}
}
</style>
</head>

var FAQLIB = [{"c":"BUCET & Admissions","q":"Is the BUCET online application portal open for SY 2027-2028?","a":"**Yes.** With the approval of the Office of the SUC President IV, the **Bicol University College Entrance Test (BUCET) Online Application Portal is now open** for School Year 2027-2028 (Public Advisory, July 23, 2026).\n\nBefore applying, review the application guidelines, eligibility, and documentary requirements. Applicants are advised to:\n- Read and follow all instructions in the portal carefully.\n- Provide complete, accurate, and truthful information.\n- Submit all required documents within the prescribed period.\n\n**Any false, misleading, or falsified information or documents is ground for automatic disqualification** from taking the BUCET."},{"c":"BUCET & Admissions","q":"What is the BUCET and who needs to take it?","a":"Incoming **first year college students** are required to take the **Bicol University College Entrance Test (BUCET)**.\n\nIt is a **three-hour examination** with sub-tests in:\n- Language Proficiency in English\n- Mathematics\n- Science\n- Reading Comprehension"},{"c":"BUCET & Admissions","q":"How is admission / the Composite Rating computed?","a":"Admission is based on the applicant's **BUCET Composite Rating**, which consists of:\n- The **BUCET score**\n- The applicant's **General Weighted Average (GWA) in Grades 9 to 11**\n- The applicant's **socio-economic profile**"},{"c":"BUCET & Admissions","q":"Who is eligible to apply for the BUCET?","a":"You are eligible if you are any of the following:\n- A student of a **DepEd-recognized high school** who is a senior expecting to graduate at the end of the school year; **OR**\n- A **senior high school graduate** who has not taken and is not taking any college subjects; **OR**\n- An **ALS graduate** who has not enrolled in any college course."},{"c":"BUCET & Admissions","q":"What are the documentary requirements for the BUCET application?","a":"**1.** Correctly and completely accomplished **BUCET Application Form**.\n**2.** One (1) **2x2 recent, unedited/unfiltered studio-taken photo** on a white background, with the applicant's signature and name tag - uploaded to the iBU portal.\n**3.** **Grades 9-11** high school academic ratings affixed on the reverse side of the BUCET Application Form, **duly signed by the School Principal with a school dry seal**.\n**4.** For **SHS graduates**: authenticated photocopies of **SF10 (Form 137)** for Grades 9-11 and **SF9 (Form 138)** for Grade 12. For **ALS graduates**: ALS Certificate of Rating and Certificate of Completion. (Bring originals for authentication.)\n**5.** Photocopy of **PWD ID** (RA 7277), if applicable.\n**6.** Valid, unexpired copy of parent's **Solo Parent ID** (RA 11861), if applicable.\n**7.** **Income documents (ITR 2025 / Certificate of Tax Exemption)** - see the separate question on income requirements.\n**8.** **NCIP Certificate of Membership** (for Indigenous Peoples groups), if applicable.\n\n**Note: No processing of BUCET application with incomplete requirements.**"},{"c":"BUCET & Admissions","q":"What income or tax documents do I need to submit?","a":"Submit **Income Tax Return (ITR) 2025** and/or **Certificate of Tax Exemption (CTE)** and related documents, depending on your parents' status:\n- **Both parents working:** ITR 2025 of both parents.\n- **Only one parent working:** ITR 2025 of the working parent + CTE of the non-working parent.\n- **Both parents not working:** CTE for both parents.\n- **Parent/s is/are OFW:** latest Certificate of Employment Contract with salary/compensation indicated.\n- **4Ps / Listahanan 3.0 member:** Oath of Commitment.\n- **Parent is retired:** CTE.\n- **Parent/s deceased:** Death Certificate of the deceased parent/s.\n- **Living with a guardian:** Affidavit of Guardianship + the guardian's financial documents (ITR or CTE)."},{"c":"BUCET & Admissions","q":"Where do I apply for the BUCET?","a":"Apply through the **BUCET Online Application Portal**.\n\n**Application link:** https://ibu.bicol-u.edu.ph/sign-up\n\nRead the instructions carefully, provide truthful information, and submit complete requirements on time. **No application is processed with incomplete requirements.**"},{"c":"BUCET & Admissions","q":"Will my application be processed if requirements are incomplete, or if I submit false information?","a":"**No.** There is **no processing of BUCET application with incomplete requirements**.\n\nAlso, **any false, misleading, or falsified information or documents is ground for automatic disqualification** from taking the BUCET."},{"c":"BUCET & Admissions","q":"What do Qualified, Waitlisted, Below Quota (BQ), and Failed mean?","a":"**Qualified** - you are eligible for admission to your assigned program based on your ranking and available slots.\n**Waitlisted** - you may still be accommodated if slots become available; admission is not guaranteed and depends on your ranking and slot availability.\n**Below Quota (BQ)** - you did not meet the cut-off for your chosen program; you may still be considered if slots open, depending on ranking and official evaluation by the BU Admissions Office and the concerned college.\n**Failed** - you are not eligible for admission for the current cycle and cannot participate in slot allocation."},{"c":"BUCET & Admissions","q":"Can Below Quota (BQ) applicants still be admitted?","a":"**Yes, but it is not guaranteed.** BQ applicants may be accommodated only if:\n- Slots become available during enrollment.\n- Their ranking qualifies for the available slots.\n- The BU Admissions Office and the concerned college approve the placement."},{"c":"BUCET & Admissions","q":"Can Failed applicants still get a slot?","a":"**No.** Failed applicants are not included in the pool of applicants for slot allocation during enrollment."},{"c":"BUCET & Admissions","q":"Is there slot hunting? Can I walk in and request another course?","a":"**No.** BU has no slot hunting process, and **walk-in requests for another course are not allowed.** Admission is based on the official BUCET result, ranking, available slots, and evaluation by the BU Admissions Office and the concerned college."},{"c":"BUCET & Admissions","q":"Can Below Quota applicants apply to multiple or open slots?","a":"**No.** Applicants cannot manually apply to multiple programs or choose among available slots. There is no separate application for open slots; placement is determined through the admissions process (available slots, ranking, official evaluation)."},{"c":"BUCET & Admissions","q":"Can I choose or change my course if I am Below Quota, or after applying?","a":"**Not automatically.** You may be considered for another course only if the university allows reallocation, slots are available, and you qualify by ranking. Once your BUCET application is processed and evaluated, **course choices are final.**"},{"c":"BUCET & Admissions","q":"Can I change campuses?","a":"Changing campuses is **not automatic.** It depends on available slots and approval by both the receiving college and the BU Admissions Office."},{"c":"BUCET & Admissions","q":"Can I shift to another course after enrolling?","a":"**Yes, but only after you officially enroll** as a BU student. Shifting depends on available slots, academic performance, approval by the receiving college, and university policies."},{"c":"BUCET & Admissions","q":"If I am Waitlisted, what happens and do I need to go onsite?","a":"Waitlisted applicants may still be admitted if slots become available, depending on ranking, available slots, and official evaluation. **You do not need to go onsite immediately** - wait for official instructions and monitor your email and BU announcements."},{"c":"BUCET & Admissions","q":"If only one slot is available and there is a tie, is it first come, first served?","a":"**No.** Admission is based on official ranking and evaluation, **not** on who confirms first."},{"c":"BUCET & Admissions","q":"Do engineering programs or BS Accountancy have Waitlisted applicants?","a":"It depends on the program and admission cycle. Some programs (e.g., certain engineering programs and BS Accountancy) may classify applicants only as **Qualified** or **Below Quota.**"},{"c":"BUCET & Admissions","q":"Can Below Quota Nursing applicants still undergo screening? Is there reconsideration?","a":"**Not automatically** - admission depends on ranking, available slots, and official evaluation. There is **no official reconsideration process** for Nursing applicants."},{"c":"BUCET & Admissions","q":"Can I transfer between Nursing or engineering campuses if I am Below Quota?","a":"**Not automatically.** Each campus has its own ranking and available slots. Placement depends on available slots, ranking, and official approval."},{"c":"BUCET & Admissions","q":"What is the Composite Rating (CR)?","a":"The Composite Rating is part of how admission is determined. **There is no officially released explanation yet** regarding CR cut-offs for board and non-board programs - please wait for the official announcement from the BU Admissions Office."},{"c":"BUCET & Admissions","q":"What is the Percentile Rank?","a":"The **Percentile Rank** shows how your performance compares with other examinees. It is **not your raw score.**"},{"c":"BUCET & Admissions","q":"Can you tell me what course fits my rating?","a":"**No.** Admission cannot be determined by rating alone. It depends on program ranking, available slots, and official evaluation."},{"c":"BUCET & Admissions","q":"Are open courses already available?","a":"**No** official list of available programs is released before enrollment. Availability depends on confirmed enrollees, withdrawn slots, and program capacity."},{"c":"BUCET & Admissions","q":"Can I enroll without taking the BUCET?","a":"**No.** Applicants must take the BUCET and qualify based on university admission policies."},{"c":"BUCET & Admissions","q":"How can I check my BUCET result if I cannot access my email?","a":"Visit the **BU Admissions Office** with a valid ID and your application details. **Results cannot be released through chat.**"},{"c":"BUCET & Admissions","q":"Are BUCET results publicly posted?","a":"**No.** Results are released only through your registered account or official verification by the BU Admissions Office."},{"c":"BUCET & Admissions","q":"Can I change my registered email?","a":"**Yes.** Email changes require identity verification and must be processed by the BU Admissions Office or BU ICT Office."},{"c":"BUCET & Admissions","q":"What if I cannot access my account because I lost my phone or email?","a":"Coordinate with the **BU Admissions Office.** Identity verification is required before any assistance can be provided."},{"c":"BUCET & Admissions","q":"Who can undergo the Physical and Dental Examination?","a":"**Currently, only Qualified applicants.** Waitlisted and Below Quota applicants must first secure a slot before gaining access through the iBU application."},{"c":"BUCET & Admissions","q":"Where do I get the medical request forms, and must I follow my schedule?","a":"Medical request forms become available through the **iBU application** once you are officially accommodated. **Yes** - report during your selected appointment schedule."},{"c":"BUCET & Admissions","q":"What should I wear during the medical examination?","a":"Wear **decent attire.** Avoid sleeveless tops, short shorts, and slippers."},{"c":"BUCET & Admissions","q":"Does BU announce available slots for Below Quota applicants?","a":"There is **no separate slot hunting announcement.** Any possible accommodation is announced only during the enrollment period and depends on official evaluation."},{"c":"BUCET & Admissions","q":"If I miss my scheduled BUCET, is there a make-up exam?","a":"**No.** BU does not administer special or make-up examinations for the BUCET. Take the exam **as scheduled.**"},{"c":"BUCET & Admissions","q":"What if I did not receive the mailed Notice of BUCET Result?","a":"Per **Administrative Order 333**, admission is based solely on official BUCET results. If the mailed copy has not arrived, a printed copy from the iBUSIS portal is valid, subject to verification."},{"c":"BUCET & Admissions","q":"Why can't I log in, or I forgot my Test Permit Number?","a":"Double-check your **Test Permit Number, Name, and Date of Birth** - incorrect or incomplete entries block access. If you forgot your Test Permit Number, check your **BUCET Follow-up Stub** or contact the BU Admissions Office."},{"c":"BUCET & Admissions","q":"How do I correct errors in my iBUSIS profile or contact details?","a":"For contact corrections, visit the BU Admissions Office or email **buao.bucet@gmail.com.** For major corrections (name or date of birth), submit a copy of your **official birth certificate.**"},{"c":"BUCET & Admissions","q":"I'm having trouble accessing my BU email account.","a":"Visit the **BU ICTO** (2nd Floor, BUCS B1) or email **bu-icto@bicol-u.edu.ph.**"},{"c":"Transferees & Shifting","q":"What are the requirements and process for transferees?","a":"Transferees **do not take the BUCET**.\n\n**Eligibility:**\n- GWA of at least **2.0 / 89%**\n- No failing or INC grades\n- Not more than **25%** of BU program units completed\n- Transfer credits only from equal/higher accreditation schools (max 25%)\n\n**Schedule:** Evaluation on the **2nd–3rd week of July**; application period **June 29 to July 3**; probationary for one semester.\n\n**Documents:** Letter of Intent; Certification of Grades/OTR (registrar-signed, sealed); Grading System & Unit Conversion; Application Form + two 2x2 photos; Certification of Available Slot from Dean/Director; Certificate of Honorable Dismissal (on acceptance).\n\n**Fees:** **PHP 200** processing; Nursing applicants take the NAT (**PHP 200**)."},{"c":"Transferees & Shifting","q":"What are the requirements to shift to another program?","a":"**Eligibility:** GWA of at least **2.4 / 85%**; no two or more failing grades; not 50%+ of units completed.\n\n**Process:** Certificate of Grades to Admissions → documents to the receiving college → screening by the Department Chair (interview, skills test, essay).\n\n**Key dates (AY 2026-2027):**\n- Submit documents: **June 29 – July 3, 2026**\n- Screening: **July 6–7**\n- Results: **July 8**\n- Registration & advising: **July 20–31**\n\n**Fee:** **PHP 100** (Nursing shifters also take the NAT, PHP 100). First year students cannot shift before enrollment; shifting may affect Latin Honors."},{"c":"Transferees & Shifting","q":"I am a DOST Scholar but the program I qualified for is not aligned with my DOST course. What should I do?","a":"DOST scholars are **not given priority** in course alignment or reassignment. You may apply through the **Below Quota Screening Process**, subject to availability of slots, BUCET cut-off ratings, and college-specific requirements."},{"c":"Records (TOR/CAV)","q":"Can I request my TOR or Diploma online?","a":"**Partly.** Per the BU Citizen's Charter 2024, the **request form may be filled out online or onsite**, and requests from offices and for education verification may be submitted online. However, the University does **not** release soft copies of academic records: payment, submission of the original requirements and claiming are all done in person at the **Office of the University Registrar, Second Floor** (or through an authorized representative).\n\n**If you cannot go personally:** authorize a representative. They must bring a formal authorization letter, a copy of your valid ID, and their own valid ID for verification.\n\n**What to do:** Prepare complete requirements first, go to the Registrar during office hours, pay only the fees instructed by the office, and keep your official receipt until you receive the record."},{"c":"Records (TOR/CAV)","q":"What are the requirements and fees to request a TOR?","a":"**For a TOR request:** bring two recent 2×2 ID pictures (white background with name tag), University Clearance, documentary stamp(s) worth ₱30 as required for the request, and payment of **₱30 per TOR page**.\n\n**For CAV, authentication or related academic-record requests:** bring original OTR, diploma and/or certifications; **two clear photocopy sets** of every original document; and **two documentary-stamp sets worth ₱30 each**.\n\n**Important:** Bring originals and photocopies together. Requirements vary by document type, so incomplete submissions may delay processing.\n\n**Processing time (per the BU Citizen's Charter):** a complete TOR re-issuance takes **5 days, 3 hours and 20 minutes**. The fee is **₱30 per page** (Bachelor's) or **₱50 per page** (Masteral/Doctorate, 1 page of OTR). A representative may claim on your behalf with a signed authorization letter and valid IDs."},{"c":"Records (TOR/CAV)","q":"What are the requirements for CAV (Certification, Authentication & Verification)?","a":"For CAV, authentication, diploma or certification requests, bring the original documents, **two clear photocopy sets** of each, and **two sets of ₱30 documentary stamps**. If a representative will process the request, include a formal authorization letter, a copy of the student’s valid ID, and the representative’s valid ID.\n\nPer the BU Citizen's Charter, CAV processing takes **2 days, 4 hours and 20 minutes** (fee **₱40** for the usual two sets for red ribbon, at ₱20 per certification per set), while authentication of academic credentials takes **3 days, 3 hours and 20 minutes** (**₱10 per page**). Contact the Registrar before traveling for specialized requests such as education verification so you can confirm the exact document set."},{"c":"Graduate School & Open University","q":"What programs does the BU Graduate School / Open University offer?","a":"**BUOU Master's:**\n- MA in Educational Leadership & Management (MAELM)\n- MA in English Education (MAEngEd)\n- MA in Social Studies Education (MASocStEd)\n- Master in Local Government Management (MLGM)\n- Master in Management (MM)\n- Master in Public Administration (MPA)\n\n**Doctoral:** Doctor of Education in Educational Leadership & Management (EdDELM)."},{"c":"Graduate School & Open University","q":"How do I get admitted to the BU Graduate School?","a":"**Deadlines (strict):**\n- First Semester (August): on or before **May 15**\n- Second Semester (January): on or before **October 15**\n\n**Requirements:** OTR (1 original + 1 photocopy); Honorable Dismissal; Special Order (private school grads only); 2 recommendation letters; PSA/NSO Birth Certificate; Marriage Contract (married females); English Proficiency/TOEFL 460 (international).\n\n**Academic:** maintain **GWA 2.0**; passing grade is **3.0**.\n\nSubmit to **bugs-admission@bicol-u.edu.ph** or the BUGS Office, Aquilino P. Bonto Bldg, Rizal St, Legazpi City."},{"c":"Graduate School & Open University","q":"How much are graduate tuition and thesis defense fees?","a":"Tuition follows **Administrative Order No. 42, s. 2003**. Payment is by cash, postal money order, telegraphic transfer, or cashier's/manager's check (**no personal checks**).\n\n**Discounts:** Summa/Magna Cum Laude or board topnotchers may get **50%–100% off** first semester."},{"c":"Graduate School & Open University","q":"Is BUGS accepting applications for Second Semester, SY 2026-2027? What is the deadline?","a":"**Yes.** The Bicol University Graduate School (BUGS) is now accepting applications for admission to its graduate programs for the **Second Semester, SY 2026-2027** (master's or doctoral).\n\n- **Deadline for submission of applications:** **September 15, 2026**\n- **Release of results starts:** **November 15, 2026**\n\nAdmission requirements, procedures, program offerings, tuition/fees, and forms are on the official BUGS website."},{"c":"ETEEAP","q":"What is ETEEAP and who is qualified?","a":"ETEEAP lets you earn a college degree by crediting **prior learning, work experience, and training**, assessed through a portfolio.\n\n**Eligibility:**\n- Filipino citizen (including abroad)\n- At least **23 years old**\n- At least **5 years** of work experience in the field\n- High school graduate or ALS/PEPT passer qualified for college\n\n**Programs offered:** BS Fisheries; BS Automotive Technology; BS Nursing; AB Communication Arts; BS Agricultural Technology; BS Computer Science."},{"c":"Colleges (Law & Medicine)","q":"What are the BU College of Law admission requirements?","a":"**Qualifications:** GWA of **2.4 / 85%** in a pre-law degree; pass the **Law Entrance Exam**; pass the **panel interview**.\n\n**Requirements:** Application Form (register at buao.bicol-u.edu.ph); Data Privacy Consent; TOR/GWA certificate; PSA/NSO Birth Certificate; two 2x2 photos (white background); **PHP 750** fee (BU Cashier)."},{"c":"Colleges (Law & Medicine)","q":"What are the BU College of Medicine (BUCM) admission requirements?","a":"**Requirements:** CM-AF; two 2x2 photos; certified true copy of TOR (or Certificate of Grades for graduating students); original Certificate of GWA; **NMAT of at least 65 percentile** (within 2 years); NSO/PSA Birth Certificate; NBI Clearance; Good Moral Character; parents' latest ITR (or BIR Tax Exemption); **PHP 1,500** fee (non-refundable).\n\nAny **4-year degree** qualifies. BUCM **does not accept** foreign students or transfers from other medical schools. Results are usually released **monthly** on the BUCM Facebook page."},{"c":"Health Services","q":"Are medical and dental examinations free at BU?","a":"**Yes.** Medical and dental examinations, including check-ups and **free teeth cleaning**, are **free of charge** for all BU students and employees at the BU Health Services Office."},{"c":"Health Services","q":"What are the steps to accomplish the Student Health Record?","a":"1. **Log in** to your student portal at **ibu.bicol-u.edu.ph** and open the Student Health Record Form. Fill it out truthfully.\n2. **Family History:** tick any illness your parents, siblings, or grandparents **have had or currently have** (per the checklist).\n3. **Personal and Social History:** tick any illness you have had (even in childhood) or currently have.\n4. **Download and print** the form on **long bond paper (8.5\"x13\")**, **back-to-back** and in **color**.\n5. Submit **two (2) back-to-back colored copies** to UHS.\n\nMake sure all details are correct. Read and understand the **Consent** section, then both the student and parent/guardian **sign using a BLUE ballpen**. Only the **first and second pages** are filled out by students."},{"c":"Health Services","q":"Can I choose my medical and dental exam schedule and location?","a":"**Yes.** After accomplishing your Student Health Record, you may **choose your schedule** (date and time) and the **BU campus nearest your home** for your medical and dental examination. Check the **available schedules and locations in your student portal**, then go to the UHS on your chosen date and time.\n\n**Important:** Follow your scheduled date and time. **No walk-ins**, and students not on schedule will not be accepted."},{"c":"Health Services","q":"Where can I take the required laboratory tests?","a":"The UHS laboratory requirements may be taken at **any diagnostic laboratory of your choice** (e.g., RHU, CHO, or a private lab).\n\nBring **complete** laboratory and documentary requirements on your scheduled day - **incomplete documents will not be accepted**. The complete list of requirements is in your student portal."},{"c":"Health Services","q":"What if I don't have a COVID-19 vaccination card?","a":"COVID-19 vaccination is required **only for students enrolling in Nursing, Dental Medicine, and Medicine**.\n\n- If you have **no card or are not vaccinated**, simply **inform the UHS personnel** during your medical and dental examination.\n- If you are **vaccinated**, submit a **photocopy of your vaccination card** and bring/present the **original** during the exam.\n- If your card is **lost**, get a **replacement at the RHU/CHO** where you were vaccinated or via **eGov.ph**."},{"c":"Health Services","q":"Do I need to take the medical and dental exam outside of UHS?","a":"The **medical examination is done only at the University Health Services (UHS)**.\n\nThe **dental examination** may be done by a **UHS dentist** OR a **government dentist** (RHU/CHO/public hospital) on the same day as your medical exam. If you choose a **government dentist**, they must fill out the **Dental Health Record (Page 4)** using a **blue ballpen**. **Private dental clinics are not accepted.**"},{"c":"Health Services","q":"How do I label the envelope for my UHS requirements?","a":"Place all laboratory and documentary requirements in an **ordinary (not plastic) long brown envelope**. Label the **back** using a **BLACK permanent marker** in this format:\n\n**SURNAME, FIRST NAME, MIDDLE INITIAL**\n**COURSE COLLEGE - CAMPUS**\n**SCHOOL YEAR**\n\nExample:\nDELA CRUZ, JUAN A.\nBS NURSING BUCN - LEGAZPI WEST\n2026-2027"},{"c":"Health Services","q":"Does finishing the medical and dental exam mean I'm already enrolled?","a":"**No.** The **Health Services Certificate (Medical Certificate)** is just **one of the requirements** for enrollment. After your exam, submit the **original Health Services Certificate to your College Registrar**, then watch Bicol University's announcements for the enrollment schedule."},{"c":"Health Services","q":"What should I bring and follow on my medical/dental exam day?","a":"**Reminders from the University Health Services:**\n- **Follow your scheduled date and time** - no walk-ins or unscheduled students are accepted.\n- **Bring complete laboratory and documentary requirements** - incomplete requirements will not be allowed to take the exam. (Some courses have additional medical requirements; check your portal.)\n- **Bring:** your own **blue ballpen**, an **extra long ordinary (not plastic) brown envelope**, **umbrella**, **water**, and **food**.\n- **Only students may enter the UHS** - parents/companions should wait outside.\n- **Keep your important belongings and documents** with you while in line.\n\nThe medical and dental exam at UHS is **free of charge**."},{"c":"Health Services","q":"Where do I get the Certificate of Completion of Treatment (for TB)?","a":"This is needed **only for students who had and completed treatment for Pulmonary TB**. Get the **Certificate of Completion of Treatment** from the facility where you were treated (**RHU/CHO/other medical facility**)."},{"c":"Facilities","q":"How do I reserve the BU swimming pool and what are the rates?","a":"By reservation at the **BU IPESR admin office**.\n\n**Rates:** Outsiders **PHP 75/head**; BU students **PHP 50/head**.\n\n**Steps:** Submit a Letter of Request to the BUIPESR Director → wait for approval → get a quotation at Business Affairs → pay → submit the approved letter + OR to BUIPESR. Include date/time, participants, contact person, and equipment."},{"c":"Facilities","q":"How do I avail the BU dormitory and how much does it cost?","a":"BU offers **limited dormitory slots** at selected campuses via the Business Affairs Office.\n\n**Requirements:** Dormitory Application Form, Statement of Account, and OR of payment.\n\n**Rate:** **PHP 1,600 per head per month** + electricity (based on actual consumption). Apply early—slots are limited."},{"c":"Facilities","q":"How do I avail the BU GUESTEL and what are the rates?","a":"Via the Business Affairs Office: Reservation Form, Statement of Account, and OR.\n\n**Rates per room per night:**\n- **PHP 800** — good for 2 persons\n- **PHP 1,200** — good for 3 persons\n- **PHP 1,600** — good for 4 persons\n- Plus **PHP 200 per head per night** for an extra bed/person"},{"c":"Facilities","q":"How do I rent a facility (space, kiosk, canteen)?","a":"**Requirements:**\n- Letter of Intent addressed to the University President\n- DTI Business Name Registration\n- LGU Health Clearance\n- OR for the **3-month deposit** (BU Cashier)\n\nRental fees vary by location—visit the Business Affairs Office for details. For **laboratory** use, contact OVPRDE at **buovprde@bicol-u.edu.ph**."},{"c":"Jobs, Grievances & IDs","q":"Where can I find BU job vacancies?","a":"Job vacancies are posted on the official website under the **Careers / Job Opportunities** section."},{"c":"Jobs, Grievances & IDs","q":"How do I file a formal complaint or report a concern?","a":"Prepare a **written statement** with the facts, dates, supporting evidence, prior steps taken, and your desired resolution, then send it to **bu-cpro@bicol-u.edu.ph**. Your concern is handled **confidentially** and forwarded to the appropriate office."},{"c":"Jobs, Grievances & IDs","q":"How do I replace a lost BU ID?","a":"1. Secure an **Affidavit of Loss** from a notary public.\n2. Get an **Endorsement Letter** from your CSAC (College Student Affairs Coordinator).\n3. Pay the **ID re-printing fee of PHP 75.00** at the BU Cashier (per the BU Citizen's Charter).\n4. Proceed to **OSAS** with the affidavit, official receipt, and endorsement letter.\n\n**What happens next (per the Citizen's Charter):** OSAS reviews your documents for completeness (about 15 minutes), updates your ID profile, prints a new PVC ID, and releases it — about **18 minutes** of processing once all requirements are complete."},{"c":"General & Fees","q":"Does Bicol University charge tuition fees?","a":"**Tuition is free** under **Republic Act 10931** (Free Tuition Law) for eligible undergraduate students. However, organization fees and some miscellaneous fees not covered by the law may still apply. Graduate tuition follows **Administrative Order No. 42, s. 2003**."},{"c":"General & Fees","q":"What academic and foreign language programs does BU offer?","a":"BU offers undergraduate, graduate, and post-baccalaureate programs across its campuses. **Foreign language courses** (e.g., Korean, Japanese, Mandarin, French) are offered **subject to availability** via the BU Language Center."},{"c":"General & Fees","q":"How do I send a formal letter or proposal to BU?","a":"Address it to **SUC President IV Baby Boy Benjamin D. Nebres III**.\n\n**Send to:** President's Office — **op@bicol-u.edu.ph**\n**CC:** CPRO — **bu-cpro@bicol-u.edu.ph**"},{"c":"General & Fees","q":"Is there a contact number I can call for a BU office?","a":"Some BU offices do not yet have an active public contact number. For concerns or follow-ups, **email is recommended**.\n\n**Key numbers:**\n- Admissions: **(052) 742-5099** / **(052) 483-0719**\n- Registrar: **(052) 742-6477**"},{"c":"General & Fees","q":"What are the office hours at BU?","a":"**BU Admissions Office:** 8:00 AM – 5:00 PM, Monday to Thursday (work-from-home on Fridays).\n\n**Registrar, UHS, and most offices:** Monday to Thursday.\n\n**The Registrar is closed** on Fridays, Saturdays, and Sundays."},{"c":"General & Fees","q":"When do classes start and when is graduation?","a":"**Classes (AY 2026-2027):** start **August 4, 2026**.\n\n**56th University Commencement:**\n- **June 15, 2026** — Legazpi West campuses\n- **June 16, 2026** — Legazpi East and Daraga campuses\n- Venue: PGA-Bicol University Sports Complex\n\n**BU Charter Day:** **June 21, 2026**.\n\nAlways confirm current dates via official BU announcements."},{"c":"BU Overview & Governance","q":"What are Bicol University's core values and four pillars?","a":"BU is committed to the fullest development of its students based on four pillars:\n- **Scholarship** - academic excellence, continuous learning, and research.\n- **Leadership** - skills and character to guide and inspire others.\n- **Character** - upright, virtuous, disciplined, and morally sound individuals.\n- **Service** - dedicated contributions to the community, region, and nation."},{"c":"BU Overview & Governance","q":"What are the Vision, Mission, and Quality Policy of BU?","a":"**Vision:** A world-class university producing leaders and change agents for social development.\n**Mission:** To give professional and technical training, advanced instruction in literature, philosophy, the sciences, and arts, conduct research, and provide extension services (RA 5521).\n**Quality Policy:** BU commits to quality instruction, research, and extension services through continuous improvement of its quality management system."},{"c":"BU Overview & Governance","q":"What is BU's SUC status and governance?","a":"Bicol University has held the prestigious **SUC Level IV status since 1998**. It is headed by a **SUC President IV** and its highest governing body is the **Board of Regents (BOR)**."},{"c":"BU Overview & Governance","q":"How are students represented in BU's governance?","a":"Students have direct representation:\n- The **University Student Council (USC) Chairperson** sits as a regular member of the **Board of Regents (BOR)**.\n- The USC Chairperson is invited to the **Administrative Council** and **Academic Council** as a non-voting member.\n- Student representatives serve on various university and college committees."},{"c":"Academic Policies","q":"How is the academic year structured and how are credit units defined?","a":"BU follows a **semestral system** (two semesters plus a summer term). Classes are **Monday to Friday** (occasionally Saturdays/Sundays for 3-hour classes).\n\n**Credit unit:** one unit = at least **18 full hours of instruction** per semester.\n\n(Based on the Student Handbook.)"},{"c":"Academic Policies","q":"What is the school uniform and ID policy?","a":"- Wear the **required school uniform** prescribed for your level.\n- **PE uniforms** are worn only during PE classes or games, not in regular academic classes.\n- A **validated ID card** must be worn visibly at all times within school premises."},{"c":"Academic Policies","q":"How are undergraduate students classified by year level?","a":"Classification is by the percentage of units completed:\n- **First Year:** less than 25% of units (4-yr course) or under 20% (5-yr).\n- **Second Year (Sophomore):** 25-49% (4-yr) or 20-39% (5-yr).\n- **Third Year (Junior):** 50-74% (4-yr) or 40-59% (5-yr).\n- **Fourth/Fifth Year (Senior):** at least 75% (4-yr); for 5-yr, pre-senior at 60-79%, senior at 80%+."},{"c":"Academic Policies","q":"What is the policy on academic load?","a":"- **Regular load:** the exact units prescribed in the curriculum.\n- **Graduating students** may add 1-2 subjects, up to a maximum of **33 units**, if graduating that semester.\n- **Summer load:** regular is **9 units**; the Dean may allow up to **12 units**.\n- **Employed students** have their load limited by the Dean."},{"c":"Academic Policies","q":"What are the rules for cross-registration?","a":"- **Within BU:** register in two or more colleges with the Dean's written permission; total units must not exceed the prescribed load (no cross-enrollment beyond one week after registration closes).\n- **From another school to BU:** present a written permit from your home Dean/Registrar.\n- **BU student to another school:** no credit unless authorized in writing by the College Dean and University Registrar.\n- **Graduating residency:** with only 1 subject left, you may cross-enroll outside BU provided you take 1 subject at BU to maintain residency."},{"c":"Academic Policies","q":"How do I change, add, substitute, or drop subjects?","a":"- **Changing/Adding:** allowed within **one week** after registration closes, with the Dean's approval and the corresponding fee. Unofficially added subjects get zero credit.\n- **Substitution:** allowed if a curriculum is superseded, there is a schedule conflict, or the subject is not offered; must be approved before the **3rd class meeting**.\n- **Dropping:** allowed within **75% of total class hours** with the instructor's and Dean's consent. Unofficial dropping after midterm grades = a grade of **5.0 (Failure)**."},{"c":"Academic Policies","q":"What is the attendance policy and the 20% rule?","a":"- Submit an **excuse letter** (from your adviser/guidance coordinator) to instructors no later than the **second session** after returning.\n- Absences of **5 days or more** (up to 1 month) require a **medical certificate**.\n- **Automatic drop:** if absences reach **20%** of total class hours, the student is dropped. If the majority of absences are officially excused, no grade of 5.0 is given."},{"c":"Academic Policies","q":"How do I apply for a Leave of Absence (LOA)?","a":"Submit a written petition to the **College Dean** for temporary discontinuance (illness, employment, pregnancy, etc.). An approved LOA must not exceed **two consecutive semesters/terms**. Leaving without a formal LOA curtails or withdraws your registration privileges."},{"c":"Academic Policies","q":"What are the rules on scholastic deficiency, probation, and dismissal?","a":"- **Failing one subject:** load reduced by one subject of equivalent units next term.\n- **Academic probation (failing two subjects):** placed on probation; load capped at **75%** of the regular load.\n- **Academic dismissal:** a probationer who fails even one subject, or **any student with three or more failing grades**, is automatically dropped from the rolls.\n- Upperclassmen (3rd-5th year) dropped for a first-time failure may petition the **Academic Petitions Committee** to re-enroll (max 9 units)."},{"c":"Academic Policies","q":"What is BU's grading system?","a":"BU uses a **1.0 to 5.0** scale (1.0 = highest, 5.0 = failure):\n- **1.0-1.4:** Outstanding (95-100%)\n- **1.5-1.7:** Superior (92-94%)\n- **1.8-2.5:** Very Satisfactory (84-91%)\n- **2.6-2.8:** Satisfactory (78-83%)\n- **2.9-3.0:** Fair/Average - **3.0 (75%) is the passing grade**\n- **3.1-4.0:** Conditional (below 75)\n- **5.0:** Failure\n\n**Graduate School:** passing is **3.0**; maintain a **GWA of 2.0**; failed subjects may be retaken up to twice."},{"c":"Academic Policies","q":"How are Incomplete (INC) grades resolved?","a":"An **INC** is given only when a small portion of coursework is unfinished and you are otherwise passing; it is excluded from GWA until resolved.\n\nYou have **one school year** from the end of the semester to complete the requirements. After that, the INC is automatically converted to a **failing grade (5.0)** by the College Registrar."},{"c":"Academic Policies","q":"What are the academic requirements for graduation?","a":"- All academic and administrative requirements must be satisfied.\n- **Deficiency deadline:** clear all deficiencies at least **five weeks** before the end of your last semester.\n- **Residency:** you must be in actual residence during the **last two semesters** of your course."},{"c":"Academic Policies","q":"What are the criteria for graduating with Latin Honors?","a":"Candidates are evaluated to the **fourth decimal place** of their GWA:\n- **No grade lower than 3.0** in any subject.\n- Must have carried the **regular load** every semester (underloading disqualifies).\n- **Summa Cum Laude:** GWA not more than 1.2500\n- **Magna Cum Laude:** 1.2500 to 1.4500\n- **Cum Laude:** 1.4500 to 1.7500\n- Students who meet the GWA but not other rules may receive **With Academic Distinction**."},{"c":"Academic Policies","q":"What is the Maximum Residence Rule?","a":"Under **R.A. 10931**, an undergraduate must finish within the **prescribed program length plus one year** (e.g., 5 years for a 4-year course). Exceeding this forfeits Free Higher Education benefits."},{"c":"Academic Policies","q":"What counts as academic dishonesty and what are the penalties?","a":"Examples: plagiarism, giving/receiving exam leaks, using unauthorized references, communicating during exams, and altering materials.\n\nPenalties: written warning, loss of credit, grade reduction, failing grade, suspension, or dismissal, plus a **permanent notation on the transcript**."},{"c":"General & Fees","q":"Who is eligible for Free Higher Education (RA 10931), and who is excluded?","a":"**Eligible:** undergraduates who pass admission/retention, have no prior undergraduate degree, and stay within the maximum residence (program + 1 year). It covers **100% of tuition and 13 approved miscellaneous fees**.\n\n**Excluded:** those who already hold a degree, exceed maximum residency, fail retention policies, and post-graduate students (Graduate School and College of Medicine), who pay regular fees."},{"c":"General & Fees","q":"What is the payment schedule for students paying out-of-pocket?","a":"Fees are ideally paid in full upon enrollment. With the Dean's approval, tuition may be paid in **three installments**:\n- **50%** upon enrollment\n- **30%** before Mid-Term exams\n- **20%** before Final exams\n\nPayments accepted in cash, postal money orders, telegraphic transfers, and cashier's/manager's checks. **Personal checks are not accepted.** You are officially enrolled only upon payment."},{"c":"General & Fees","q":"What is the refund policy for withdrawing students?","a":"Refunds of tuition and other fees (entrance and matriculation fees are non-refundable):\n- **Within 1 week** of class opening: **80%** refund\n- **Within the 2nd-4th week:** **50%** refund\n- **After the 4th week:** **no refund**\n\nSpecial cases: full refund in case of **student death**; full refund for subjects **dropped by force** (e.g., a dissolved class); scholars who paid out-of-pocket may get a full refund if requested by the **4th week**."},{"c":"Scholarships & Financial Aid","q":"What scholarship categories and benefits does BU offer?","a":"- **President's Lister:** GWA 1.00-1.45 (no grade below 2.4).\n- **Dean's Lister:** GWA 1.45-1.75.\n- **University Band Members:** **75% free tuition**.\n- **Cultural Group Performers:** stipends (e.g., resident performer PHP 3,000/semester).\n- **TES (RA 10931):** allowances for eligible students in the DSWD Listahanan 2.0.\n- **BUCM/Postgraduate:** Summa Cum Laude = 100% off (1 sem); Magna = 50%; 1st-place board topnotcher = 75%.\n- **Externally-funded grants:** 30+ private/government scholarships managed by OSAS.\n\nRenew every semester: no failing/INC grades, regular load, and required GPA."},{"c":"Scholarships & Financial Aid","q":"What is the Student Assistantship program?","a":"**Student Assistants** must be enrolled with **no failing or incomplete marks** and carry a regular load.\n\n**Work limits:**\n- Load of 25 units or less: max **4 hours/day**, up to **100 hours/month**.\n- Load of 26 units or more: max **3 hours/day**, up to **60 hours/month**.\n\nBenefits: monthly allowance (DBM student-labor rates), training, and seminar opportunities."},{"c":"Scholarships & Financial Aid","q":"What student loan programs are available?","a":"- **SLF-RV:** up to PHP 5,000/year (poor but deserving Region 5 residents).\n- **SLP-COE:** up to PHP 6,000/year (COE-accredited courses).\n- **SELAF:** short-term emergency loans up to PHP 1,000 (1%/month simple interest, no guarantor).\n- **ELELAP:** PHP 5,000-8,000/semester (max PHP 16,000/year), payable after graduation.\n- **STUFAP / SAFE:** interest-free loans for needy 3rd-4th year and graduating students."},{"c":"Student Affairs & Services","q":"What is OSAS and what services does it offer?","a":"The **Office of Student Affairs and Services (OSAS)** promotes holistic student welfare, development, access, and success (under CHED Memo No. 9 s. 2013). It covers **Student Welfare** (guidance and counseling, career placement, multi-faith, special needs), **Student Development** (organizations, leadership, student council, discipline, publications), and **Institutional Programs** (scholarships, housing, sports, cultural-arts)."},{"c":"Student Affairs & Services","q":"What cultural groups can students join at BU?","a":"Students may apply for active membership in:\n- BU Magayon Dance Troupe\n- Teatro Bueno\n- BUNGCUL Singers\n- BU Kuerdas (Rondalla)\n- Bugkos Ginikanan (indigenous music/gamelan)\n- University Marching Band"},{"c":"Student Affairs & Services","q":"How does the BU Library System work?","a":"BU has the **University Library (Main)** plus **10 unit/college libraries** across campuses.\n\n- Access with a validated **Library Card** (secure with your Certificate of Registration + two 1x1 photos).\n- **University Library hours:** **8:00 AM to 7:00 PM** (no noon break); unit hours vary.\n- Library cards are non-transferrable and needed for overnight/weekend borrowing and clearing records.\n- External researchers may use facilities upon payment of a library fee with valid ID and a referral letter."},{"c":"Student Affairs & Services","q":"What is the NSTP requirement?","a":"Under **RA 9163**, all incoming first-year students must complete the **National Service Training Program (NSTP)** to graduate. Choose from **CWTS** (Civic Welfare), **LTS** (Literacy Training), or **ROTC** (military training). Enlistment is **first-come, first-served** during freshmen orientation."},{"c":"Student Conduct & Discipline","q":"What are minor offenses and their penalties?","a":"**Penalty progression:** 1st = Reprimand; 2nd = Written Warning; 3rd = Community Service; 4th = Suspension (7-14 days).\n\n**Examples of minor offenses:** smoking on campus, unexcused absences from university activities, posting unapproved materials, inappropriate attire on non-uniform days, wearing PE uniforms in regular classes, not wearing a validated ID, and littering."},{"c":"Student Conduct & Discipline","q":"What are major offenses and their sanctions?","a":"Some offenses mean **dismissal on the first offense**: serious dishonesty, falsification of official documents, and hazing.\n\nOther major offenses (bullying, carrying weapons, creating disorder, destruction of property, theft, plagiarism, sexual harassment, stalking, possession of prohibited drugs, alcohol/drunkenness, gambling, voyeurism, malversation of funds, discourtesy, immoral conduct, disobedience) carry escalating penalties from reprimand or suspension up to dismissal."},{"c":"Student Conduct & Discipline","q":"What is the disciplinary process and who handles hearings?","a":"- **Filing:** starts with a written report to the **College Dean**.\n- **College/Unit Disciplinary Committee** handles offenses within college premises (chaired by the Associate Dean/Dept Chair, with faculty and student reps).\n- **University Student Disciplinary Tribunal** reviews appeals and university-wide cases (chaired by the VPAA).\n- **Appeals:** must be filed within **10 working days** of the College decision.\n- Tribunal decisions are final unless reversed or modified by the **Board of Regents**."},{"c":"Student Conduct & Discipline","q":"How do students file grievances?","a":"- **Non-academic grievances:** lodged with the **OSAS Dean** (in person or writing); OSAS acts within **5 days**. Unresolved cases go to the **University Grievance Committee**.\n- **Academic grievances:** lodged with the **Academic Grievance Council**, chaired by the **VPAA**."},{"c":"Student Conduct & Discipline","q":"What are students' fundamental rights and responsibilities?","a":"**Rights include:** quality education; guidance/counseling; free speech (without disrupting discipline); due process in discipline; access to records; protection from discrimination and sexual harassment; and timely issuance of credentials.\n\n**Responsibilities include:** upholding BU's honor, living uprightly, respecting laws and authorities, participating in civic affairs, and exercising rights with regard for others."},{"c":"Student Organizations","q":"How do I establish and accredit a student organization?","a":"A group of **at least 15 students** may form an organization and apply for accreditation.\n- **UBOs** (members from 2+ colleges) go to the University Committee on Accreditation (supervised by OSAS).\n- **CBOs** (one college) go to the College Committee on Accreditation (supervised by the College Dean).\n\nSubmit (in triplicate, renewed every semester): Application Form (BU-F-OSAS-18), Constitution and By-Laws, list of officers/members/adviser, a two-semester Program of Activities, and an organizational flyer."},{"c":"Student Organizations","q":"What are the rules for organization advisers?","a":"- Every recognized organization must have an adviser (if multiple, designate a senior adviser or board chair).\n- Advisers must be **regular, full-time BU** staff/faculty.\n- No faculty member may advise more than **two organizations**, and must serve at least **one year**.\n- The adviser **must travel with members** on off-campus activities and **co-sign all bank transactions**."},{"c":"Off-Campus Activities","q":"What types of off-campus activities are there?","a":"- **Curricular:** required events that are part of the academic program (educational tours, field studies, internships, clinicals).\n- **Non-curricular:** optional events not required by the curriculum (seminars, competitions, team building, cultural performances)."},{"c":"Off-Campus Activities","q":"Who approves student local and foreign travel?","a":"All travel requires safety compliance, parental consent, student accident insurance, and an itinerary.\n- **Local, within Bicol for 7 days or less:** College Dean/Director.\n- **Local, within Bicol for more than 7 days to 1 month:** VPAA.\n- **Local, outside Bicol (national):** University President.\n- **Foreign for 1 month or less:** University President (on VPAA and Dean recommendation).\n- **Foreign for more than 1 month:** Board of Regents."},{"c":"Off-Campus Activities","q":"What guidelines and prohibitions apply to off-campus activities?","a":"**Guidelines:**\n- Signed **parental consent/waiver** from all participants.\n- Submit a full proposal (objectives, itinerary, budget, safety, transport).\n- **No off-campus activities within 2 weeks before major exams** (Mid-term/Final).\n- Non-participation must **not** cause a failing or incomplete grade; provide a comparable alternative task.\n\n**Prohibitions:** no using activities as a substitute for a major exam, no punitive measures for non-attendance, no conflict-of-interest venues (relatives within 3rd civil degree), no exorbitant fees, no side trips, and only enrolled and fit students may join."},{"c":"ICTO & IT Support","q":"Why can't I see the Registration menu in the Student Portal?","a":"Your registration status (Regular or Irregular) may not yet be assigned by your department. Contact your department to verify, or wait until the tagging process is completed."},{"c":"ICTO & IT Support","q":"When will the evaluations open?","a":"Please await the official announcement regarding the evaluation. Hold off on sending individual inquiries about re-opening."},{"c":"ICTO & IT Support","q":"What is ICTO and when is support available?","a":"**ICTO** is the **Information and Communications Technology Office** - the central IT support unit of Bicol University. Support is available **Monday to Friday, 8:00 AM to 5:00 PM (PST)**; emergency support may be available for critical issues."},{"c":"ICTO & IT Support","q":"What does the ICTO privacy policy cover?","a":"The Privacy Policy explains what data is collected, how it is used and protected, and your rights. Data is protected with industry-standard encryption, ICTO complies with data privacy regulations, and you have the right to access and correct your data."},{"c":"ICTO & IT Support","q":"How do I submit a support request?","a":"1. Log in and go to **Support** or **New Request**.\n2. Select your concern type.\n3. Provide details - what you were doing, when, and any error messages.\n4. Upload supporting documents (optional).\n5. Review and **Submit**.\n\nYou will receive a **Request Number** for tracking, plus email confirmation."},{"c":"ICTO & IT Support","q":"What files can I attach, and how large can they be?","a":"You can upload images (**JPG, PNG, GIF, WebP**) and **PDF** documents. Each file must not exceed **10 MB**, and you can upload multiple files at once."},{"c":"ICTO & IT Support","q":"How long does it take to resolve a request?","a":"Simple requests are usually resolved within **1-2 business days**; complex issues may take **3-5 business days**. Track progress in real time under **My Requests**."},{"c":"ICTO & IT Support","q":"Can I cancel, modify, or follow up on a request?","a":"You can **cancel** from the request details page. To **modify**, message the ICTO team via your request page. If you do not get a response in time, use the **follow-up** under Track Requests (enter your request number and email) or email bu-icto@bicol-u.edu.ph."},{"c":"ICTO & IT Support","q":"I'm having trouble accessing the system. What should I do?","a":"First, **clear your browser cache and cookies**, then refresh. Shortcuts: Chrome/Edge **Ctrl+Shift+Delete**; Firefox **Ctrl+Shift+Delete**; Safari **Clear History**. Select 'All time/Everything', clear cookies and cache, then refresh. If it persists, try another browser/device, check your internet, or submit a support request."},{"c":"ICTO & IT Support","q":"What browsers are supported?","a":"Modern, up-to-date browsers work best: **Chrome, Firefox, Safari, and Edge**."},{"c":"ICTO & IT Support","q":"I can't upload files - what's wrong?","a":"Check that the file is **under 10 MB** and a **supported format** (JPG, PNG, GIF, WebP, PDF). Ensure a stable connection, clear your cache, and try another browser. Reduce large files if needed. If it still fails, submit a request with the file name, size, format, browser, and any error."},{"c":"ICTO & IT Support","q":"The website is slow or keeps timing out.","a":"**Quick fixes:** refresh, wait a few moments (server may be busy), close other tabs, and check your connection. **Optimize:** disable browser extensions, clear cache, try another browser, and prefer a wired/closer WiFi connection. Avoid peak hours (12-1 PM and 5-6 PM). If it persists, note the exact time and contact ICTO."},{"c":"ICTO & IT Support","q":"Can I use the system on mobile devices?","a":"**Yes** - the system is fully responsive on smartphones and tablets. Use a modern mobile browser like Chrome or Safari for the best experience."},{"c":"ICTO & IT Support","q":"How is my data secured?","a":"Your data is protected with **industry-standard encryption** and security measures, and the system complies with data privacy regulations. See the Privacy Policy for details."},{"c":"ICTO & IT Support","q":"How do I create an account?","a":"Click **Login** on the homepage and sign in with your Google account or university credentials. If you don't have an account, the system will guide you through registration."},{"c":"ICTO & IT Support","q":"I forgot my password. What should I do?","a":"Reset it on the **Email Password Reset** page: select your user type (Student/Employee), verify your identity, then create a new password. Alternatively, submit a reset request via Support or contact ICTO."},{"c":"ICTO & IT Support","q":"How do I update my profile or email, and what are account types?","a":"After logging in, go to **Settings** to update personal info, photo, contact details, and email (one email per account). Account type (**Student** vs **Employee**) determines available services - e.g., students get diploma/grade requests; employees get DTR and office-equipment requests."},{"c":"ICTO & IT Support","q":"What services does ICTO provide?","a":"Email Account Creation, Password Reset, Eduroam account management, Zoom account creation, network support, software licensing, hardware support, and other administrative IT services. See the Services section for the full list."},{"c":"ICTO & IT Support","q":"How do I request an email account?","a":"Visit the **Email Creation** page, fill in your details, select your account type (Student/Employee), complete verification, and submit. ICTO reviews it and sends your account details by email."},{"c":"ICTO & IT Support","q":"What is Eduroam and how do I access it?","a":"**Eduroam** (Education Roaming) is a secure, encrypted WiFi network available at participating universities worldwide. Create an Eduroam account via ICTO, then on your device go to WiFi, select 'eduroam', enter your credentials, and connect. Contact ICTO for device-specific setup guides."},{"c":"ICTO & IT Support","q":"How do I request a Zoom account?","a":"Go to **New Request**, select **Zoom Account Creation**, choose the type (Individual/Department/Office), provide organization details and number of licenses, upload documents, and submit. For upgrades or support on an existing account, contact ICTO."},{"c":"ICTO & IT Support","q":"How do I track my request, and what do the statuses mean?","a":"Go to **My Requests** and open the request to see a status timeline, or use **Track Request** with your request number. Statuses: **Pending** (waiting for review), **In Progress** (being worked on), **On Hold** (needs more info), **Solved** (completed), **Cancelled**, and **Follow-up** (action needed from you)."},{"c":"ICTO & IT Support","q":"Will I be notified of status changes, and can I see request history?","a":"**Yes** - you get email notifications on every status update (keep your email current in Settings). In **My Requests** you can view all current and past requests, including status changes and messages exchanged with the support team."},{"c":"University Calendar (AY 2026-2027)","q":"What are the key dates for AY 2026-2027 at a glance?","a":"**First Day of Classes (Elem/Secondary/Tertiary):** August 4, 2026 (Tue)\n**1st Sem Midterm:** September 28 - October 3, 2026\n**1st Sem Final:** November 23-28, 2026\n**End of 1st Semester (Tertiary):** November 28, 2026\n**2nd Sem Enrolment (all students):** December 14-17, 2026\n**Christmas Break:** December 18-31, 2026\n**2nd Sem First Day of Classes:** January 4, 2027 (Mon)\n**2nd Sem Midterm:** March 1-6, 2027\n**2nd Sem Final:** April 24-30, 2027\n**End of 2nd Semester / Last Day of Faculty Service:** April 30, 2027\n**University Recognition Program:** April 19, 2027\n**University Commencement Exercises:** June 14-19, 2027\n**Midyear Enrolment:** May 10-15, 2027\n**Midyear Classes:** May 17 - June 26, 2027\n**First Day of Service, AY 2027-2028:** July 12, 2027"},{"c":"University Calendar (AY 2026-2027)","q":"When is enrolment for incoming first-year students?","a":"Enrolment is staggered by status:\n- **Qualified:** June 29-30, 2026 (continues July 1)\n- **Waitlisted:** July 2-3, 2026\n- **Below Quota (BQ) Qualifiers:** July 13-17, 2026"},{"c":"University Calendar (AY 2026-2027)","q":"When do upperclass, irregular, transferee, shifter, and returning students enrol?","a":"- **Regular upperclass students:** July 6-24, 2026\n- **Irregular upperclass, shifters, transferees, second coursers, returning students:** July 20-31, 2026"},{"c":"University Calendar (AY 2026-2027)","q":"When is Graduate School enrolment?","a":"**July 20-31, 2026 (including Saturdays).** The last day of enrolment/registration for graduate students is **August 1, 2026**."},{"c":"University Calendar (AY 2026-2027)","q":"When is the screening for Below Quota applicants, transferees, and shifters?","a":"**July 6-7, 2026.**"},{"c":"University Calendar (AY 2026-2027)","q":"When are the medical and dental examinations for new students?","a":"- **First Year (Qualified and Waitlisted):** June 1-26, 2026\n- **BQ Qualifiers and Transferees:** July 9-10, 2026"},{"c":"University Calendar (AY 2026-2027)","q":"When is enrolment for the Second Semester and Midyear Term?","a":"- **Second Semester (all students):** December 14-17, 2026\n- **Midyear Term:** May 10-15, 2027"},{"c":"University Calendar (AY 2026-2027)","q":"When does AY 2026-2027 start, and when do the semesters begin and end?","a":"- **First Day of Classes (Elem/Secondary/Tertiary):** August 4, 2026 (Tue)\n- **First Semester ends (Tertiary):** November 28, 2026 (Elementary/Secondary: December 17, 2026)\n- **Second Semester starts:** January 4, 2027 (Mon)\n- **Second Semester ends / Last Day of Faculty Service:** April 30, 2027"},{"c":"University Calendar (AY 2026-2027)","q":"How long is the Christmas Break?","a":"**December 18-31, 2026.** Classes resume on January 4, 2027."},{"c":"University Calendar (AY 2026-2027)","q":"Is there a Midyear Term, and when does AY 2027-2028 begin?","a":"**Midyear Term 2027** classes run May 17 - June 26, 2027 (midterms June 3-5; finals June 24-26). The **First Day of Service for AY 2027-2028 is July 12, 2027**."},{"c":"University Calendar (AY 2026-2027)","q":"When are the examinations for AY 2026-2027?","a":"**First Semester:** Midterms September 28-30, 2026 (continuation October 1-3); Finals November 23-28, 2026.\n**Second Semester:** Midterms March 1-6, 2027; Finals April 24-30, 2027.\n**Midyear Term:** Midterms June 3-5, 2027; Finals June 24-26, 2027."},{"c":"University Calendar (AY 2026-2027)","q":"When are the grade submission deadlines and council meetings?","a":"**Grade deadlines (online encoding / Report of Grades):**\n- First Semester: December 12, 2026\n- Second Semester: May 14, 2027\n- Midyear Term (summer 2026): August 1, 2026\n\n**Administrative Council meetings:** August 19, 2026; February 18, 2027; May 14, 2027.\n**Academic Council (for graduates):** September 4, 2026; February 26, 2027; June 1, 2027."},{"c":"University Calendar (AY 2026-2027)","q":"What regular holidays fall within AY 2026-2027?","a":"National Heroes Day (Aug 31, 2026), All Saints' Day (Nov 1), Bonifacio Day (Nov 30), Christmas Day (Dec 25), Rizal Day (Dec 30), New Year's Day (Jan 1, 2027), Maundy Thursday and Good Friday (Mar 25-26, 2027), Araw ng Kagitingan (Apr 9), Labor Day (May 1), and Independence Day (June 12)."},{"c":"University Calendar (AY 2026-2027)","q":"What special non-working days are observed?","a":"Ninoy Aquino Day (Aug 21, 2026), Simeon Ola Day - Albay (Sep 2), All Souls' Day (Nov 2), Feast of the Immaculate Conception (Dec 8), Christmas Eve (Dec 24), Last Day of the Year (Dec 31), Chinese New Year (Feb 6, 2027), Black Saturday (Mar 27), and Albay Day (Apr 3, 2027)."},{"c":"University Calendar (AY 2026-2027)","q":"When is Holy Week 2027, and is EDSA People Power a holiday?","a":"**Holy Week 2027:** Maundy Thursday March 25 and Good Friday March 26 (regular holidays); Black Saturday March 27 (special non-working day). The **EDSA People Power Anniversary (February 25, 2027)** is a **Special Working Day** - offices and classes generally remain open unless announced otherwise."},{"c":"University Calendar (AY 2026-2027)","q":"Are the 2027 holiday dates final, and what do the calendar colors mean?","a":"**2027 holidays are not yet final** - they are listed on their original dates pending the 2027 Presidential Proclamation (2026 dates follow Proclamation No. 1006, s. 2025).\n\n**Calendar legend:** Black = days with classes; Blue = days without classes; Red = holidays."},{"c":"University Calendar (AY 2026-2027)","q":"When are graduation, recognition, and BU Charter Day?","a":"- **University Recognition Program:** April 19, 2027\n- **University Commencement Exercises (graduation):** June 14-19, 2027\n- **BU Charter Day:** June 21, 2026"},{"c":"University Calendar (AY 2026-2027)","q":"Where can I verify the official University Calendar?","a":"This summary is based on the **Approved University Calendar for SY 2026-2027**, prepared by the Office of the University Registrar (Phil V. Morano, M.Sc.) and OSAS (Jazzlyn T. Imperial, M.Sc.), recommended by VPAA Ma. Julieta B. Borres, Ph.D., and approved by SUC President IV Baby Boy Benjamin D. Nebres III, Ed.D. Always confirm via official BU channels, as dates may change."},{"c":"Second Course(s)","q":"What is a second course and who can apply?","a":"A second course is another undergraduate degree program taken at Bicol University after completing a first bachelor's degree. Applicants are admitted as **special students** and are **not covered by the government's free tuition scheme**.\n\n**Eligibility:**\n- Graduate of a bachelor's degree from a CHED-recognized/accredited HEI\n- GWA of **2.5 (84%) or better**\n- Compliance with BU's prevailing minimum general admission requirements\n- Passing the **interview and/or internal admission policy** of the academic department\n\nApplicants are accepted regardless of age, sex/gender, nationality, religious beliefs, socioeconomic status, or political affiliation.\n\n**What to do:** Check whether the target program has unfilled slots, apply through the concerned college/department, complete the interview, and await the Dean/Director's approval.\n\n> Verify slot availability and procedures through official BU announcements and the concerned college."},{"c":"Second Course(s)","q":"How much is the tuition for a second course?","a":"Second coursers are **not covered by the free tuition scheme (RA 10931)** and pay the program's tuition and fees.\n\n**How the rate is set (AO No. 0456, s. 2026):** tuition is charged at the program's existing rate, calculated based on the **graduate student tuition rate**; if the program's tuition rate is **higher than the graduate school rate**, the **program rate** is followed. A **second course fee of ₱125.00 per semester** also applies, and the new fee assessment applies starting **First Semester, SY 2026–2027**.\n\n**What to do:** Ask the concerned college for its current tuition rate and complete fee breakdown.\n\n> Tuition and fee rates vary by program and may change — confirm the complete breakdown with the respective college registrar and through official BU announcements."},{"c":"Second Course(s)","q":"Are second coursers covered by free tuition?","a":"**No.** Students enrolled in a second course are **excluded from the free tuition fee scheme of the government** (RA 10931). You pay the program's tuition rate (graduate-school rate, or the program rate if higher) plus the **₱125.00 per semester** second course fee.\n\n> Verify the current fee schedule through official BU announcements."},{"c":"Second Course(s)","q":"Is there a limit on how many second coursers are admitted?","a":"**Yes.** A program may admit a **maximum of five (5) second coursers at any given time**, and only if there are **unfilled slots**, subject to the approval of the academic Dean/Director.\n\n**What to do:** Before applying, ask the program's department chair whether slots are available."},{"c":"Second Course(s)","q":"Can units from my first degree be credited toward the second course?","a":"**Yes, up to 50% of the total units** required by the second program may be credited from your first undergraduate degree.\n\n**Rules:**\n- Crediting is determined by the **academic Department Head** and validated by the **College Dean/Director** upon acceptance;\n- For **General Education courses (including PE and NSTP)**, certification from the Dean/Director offering the course must be secured before crediting;\n- You must take **at least 50% of the required units** of the prescribed curriculum (within allowed residency) to earn the second degree.\n\n**What to do:** Present your official records during admission for evaluation; secure the required certifications for GE courses."},{"c":"Second Course(s)","q":"How long do I need to study for a second course?","a":"You must have **active enrollment for at least four (4) regular semesters** to earn the second degree. The **maximum allowable residence is one and one-half (1.5) times** the normal program length, exclusive of approved leaves of absence; beyond this, you can no longer re-enroll.\n\n**What to do:** Plan your load with the department so you complete required units within the residency limit.\n\n> Residency counting may vary per program — verify with your department chair."},{"c":"Second Course(s)","q":"What is my classification and academic load as a second courser?","a":"You are classified as a **special student**. Your year level is determined by the department/program chair based on credited courses, and your load is set through the **Official Advising Slip**, with prerequisites and co-requisites observed.\n\n**Employed students:** Those employed in the government or private sectors are limited to **nine (9) units per semester**, unless the employer grants authority to enroll beyond that."},{"c":"Second Course(s)","q":"Can I graduate with honors as a second courser?","a":"**No.** Second coursers are **disqualified from receiving academic honors upon graduation**, regardless of academic performance.\n\n> Related rules (e.g., shifting and honors) are in the BU Student Handbook — verify with your college."},{"c":"Second Course(s)","q":"I work; can I request a special class schedule?","a":"**Yes, on a Cost-Recovery Program (CRP) basis.** If your work schedule prevents you from joining regular classes, you may request a special schedule, subject to the Dean/Director's approval and faculty availability.\n\n**What to do:** Submit your request to the Dean/Director. Excessive CRP approvals are avoided to protect the faculty complement and college operations.\n\n> CRP arrangements may involve additional costs — confirm the assessment with the college."},{"c":"Second Course(s)","q":"When do the second course admission and fee rules take effect?","a":"The guidelines take effect **immediately** (issued **15 July 2026**). The **new assessment of fees applies to existing and incoming second coursers starting First Semester, SY 2026–2027**.\n\n**Legal bases:** BOR Resolution No. 787, s. 2022; BOR Resolution No. 273, s. 2018; BU Code of 2024.\n\n> The Administrative Order remains in force until amended or revoked — always check the latest official BU issuance."},{"c":"Colleges (Law & Medicine)","q":"How much is the tuition for the BU College of Law?","a":"**₱800 per unit.**\n\n**What to do:** For the complete breakdown of tuition and other fees, confirm with the **BUCL Registrar**.\n\n**Source:** Information provided by the BU Admissions Office.\n\n> Tuition and fee details may change — always confirm the complete breakdown with the BUCL Registrar or through official BU announcements."},{"c":"Colleges (Law & Medicine)","q":"How much is the tuition for the BU College of Medicine?","a":"**Estimated at around ₱35,000 per semester.**\n\n**What to do:** For the complete breakdown of tuition and other fees, confirm with the **B
