(Fee: None; Time: 20 Minutes; Person: College Business Manager, Business Affairs Office)\n   → 2.3 Prepare the MOA for approval, witnessed by the Director of BAO, reviewed by Legal and signed by the BU President. (Fee: None; Time: 19 Days; Person: College Business Manager, Director Business Affairs Office / Attorney III, Legal Affairs Office / SUC President IV, Office of the President)\n   → 2.4 Preparation and issuance of SOA (prepared and distributed before the 5th of the month). (Fee: See Table *Rental Rate with Surcharge; Time: 1 Hour; Person: College Business Manager, Business Affairs Office)\n   → 2.5 Recording. Photocopy of Official Receipt filed in individual folders and digitally recorded. (Fee: None; Time: 10 Minutes; Person: College Business Manager, Business Affairs Office)\n\n**Total:** Fee: See Table *Rental Rate with Surcharge • Processing time: 19 Days, 2 Hours\n\n**Note:** Rental rates (monthly, with 1% possible surcharge per rental rate; 30% discount for the months of June and July/summer vacation): e.g., BU Main - BU CS stalls PHP 5,512.00 to 6,945.75; food carts PHP 1,575.00 to 2,625.00; photocopier PHP 1,155.00; canteen (BU CE) PHP 5,512.50; canteen (BU CIELS) PHP 2,756.25; ice cream cart PHP 1,155.00. BU East - BU CENG stalls PHP 1,155.00 to 2,205.00. BU Daraga - BU CBEM stalls PHP 2,431.80 to 2,552.29 and food carts PHP 1,155.00 to 2,500.00; BU CSSP stalls PHP 1,155.00. See the official Citizen's Charter for the complete table.\n\n> Source: BU Citizen's Charter, 2023 (2nd Edition), pp. 216-219. Fees, requirements, and processing times may be updated by the University — always verify with the responsible office before transacting."},{"c":"Citizen's Charter Services","q":"How do I rent the BU dormitory and what is the rate?","a":"**Who may avail:** BU Students\n**Classification / type of transaction:** Simple • G2C - Government to Citizen\n\n**Checklist of requirements (where to secure):**\n- Application form (1 Original Copy) — BAO Dormitory\n- Statement of Account (1 Photocopy) — BAO Dormitory\n- Official Receipt (1 Photocopy) — BU Cashier\n\n**Steps, fees and processing time:**\n1. Submits Application form.\n   → 1.1 Received & process the application/requirements. (Fee: None; Time: 10 Minutes; Person: Dormitory In-Charge, Business Affairs Office Dormitory)\n   → 1.2 Review/Evaluate application. (Fee: None; Time: 10 Minutes; Person: Dormitory In-Charge, Business Affairs Office Dormitory)\n   → 1.3 Approval of application. (Fee: None; Time: 10 Minutes; Person: Dormitory In-charge/BAO Director, Business Affairs Office/Dormitory)\n   → 1.4 Prepare statement of account; prepare monthly statement of account every 5th day of the following month (Dormitory). (Fee: None; Time: 10 Minutes; Person: Dormitory In-Charge, Business Affairs Office)\n   → 1.5 Review and Approval of statement of account. (Fee: None; Time: 10 Minutes; Person: BAO Director, Business Affairs Office)\n2. Pay to the Cashier the amount indicated in the Statement of Account.\n   → 2. Receive payment and issues Official Receipt (OR). (Fee: PHP 1,600.00/head/month (additional charge for electricity based on the computed consumption per appliance); Time: 20 Minutes; Person: BU Cashier, University Cashier's Office)\n3. Present Official Receipt to the Dormitory In-Charge.\n   → 3.1 Receive photocopy of the Official Receipt. (Fee: None; Time: 5 Minutes; Person: Dormitory In-charge, Business Affairs Office Dormitory)\n   → 3.2 File the photocopy of the OR for reference purposes. (Fee: None; Time: 5 Minutes; Person: Dormitory In-charge, Business Affairs Office Dormitory)\n4. Receive the key for the BU Dormitory Room.\n   → 4. Release the key to the client. (Fee: None; Time: 10 Minutes; Person: Dormitory In-charge, Business Affairs Office Dormitory)\n\n**Total:** Fee: PHP 1,600.00/head/month • Processing time: 1 Hour and 30 Minutes\n\n**Note:** Additional charge for electricity per month depending on the computed electricity consumption per appliance as per computation by Business Affairs Office.\n\n> Source: BU Citizen's Charter 2024 (1st Edition), Business Affairs Office. Fees, requirements, and processing times may be updated by the University — always verify with the responsible office before transacting."},{"c":"Citizen's Charter Services","q":"How do I rent the BU Guestel and what are the rates?","a":"**Who may avail:** All\n**Classification / type of transaction:** Simple • G2C - Government to Citizen\n\n**Checklist of requirements (where to secure):**\n- Reservation form (1 Original Copy) — BAO Guestel\n- Statement of Account (1 Photocopy) — BAO Guestel\n- Official Receipt (1 Photocopy) — BU Cashier\n\n**Steps, fees and processing time:**\n1. Submits Reservation form.\n   → 1.1 Received & process the reservation form. (Fee: None; Time: 10 Minutes; Person: House Parent, Business Affairs Office Guestel)\n   → 1.2 Review Reservation form. (Fee: None; Time: 10 Minutes; Person: House Parent, Business Affairs Office Guestel)\n   → 1.3 Approval of Reservation. (Fee: None; Time: 10 Minutes; Person: House Parent & BAO Director, Business Affairs Office Guestel)\n   → 1.4 Prepare the Statement of Account. (Fee: None; Time: 10 Minutes; Person: House Parent, Business Affairs Office Guestel)\n   → 1.5 Review and Approval of Statement of Account. (Fee: None; Time: 10 Minutes; Person: BAO Director, Business Affairs Office)\n2. Pay to the Cashier the amount indicated in the Statement of Account.\n   → 2. Receive payment and issues official receipt. (Fee: PHP 800.00/room/night (2pax cap.); PHP 1,200.00/room/night (3pax cap.); PHP 1,600.00/room/night (4pax cap.); additional charge for extra bed PHP 200.00/night/head; Time: 20 Minutes; Person: BU Cashier, University Cashier's Office)\n3. Present Official Receipt to the Dormitory In-Charge.\n   → 3.1 Receive photocopy of the Official Receipt. (Fee: None; Time: 5 Minutes; Person: House Parent, Business Affairs Office Guestel)\n   → 3.2 File the photocopy of the OR for reference purposes. (Fee: None; Time: 5 Minutes; Person: House Parent, Business Affairs Office Guestel)\n4. Receive the key for the BU Guestel Room.\n   → 4. Release the key to the client. (Fee: None; Time: 10 Minutes; Person: House Parent, Business Affairs Office Guestel)\n\n**Total:** Fee: PHP 800.00-1,600.00/room/night (per capacity) • Processing time: 1 Hour and 30 Minutes\n\n**Note:** Rates: PHP 800.00/room/night (2pax); PHP 1,200.00/room/night (3pax); PHP 1,600.00/room/night (4pax). Additional charge for extra bed PHP 200.00/night/head.\n\n> Source: BU Citizen's Charter 2024 (1st Edition), Business Affairs Office. Fees, requirements, and processing times may be updated by the University — always verify with the responsible office before transacting."},{"c":"Citizen's Charter Services","q":"How do I submit documents to HRMDO and get a response?","a":"**Who may avail:** BU Employees, Students, Applicants and representatives from other agencies (private and public)\n**Classification / type of transaction:** Simple • G2C - Government to Citizen • G2B - Government to Business • G2G - Government to Government\n\n**Checklist of requirements (where to secure):**\n- Application Letters (1 copy each): PDS — Requesting entity\n- Application Letters: Certificate of Employment — Current or previous employer\n- Application Letters: Certificate of Trainings Attended — Requesting entity\n- Application Letters: IPCR (if applicable) — Requesting entity\n- Request for Certificate of Employment: Documentary Stamps — HRMDO\n- Request for Certificate of Employment: Completely filled-up Records Request Form (BU-F-HRMDO-54) — HRMDO\n- Other request from internal offices for action: Duly signed letter-request — Requesting entity\n\n**Steps, fees and processing time:**\n1. For face-to-face: 1. Submits communication and supporting documents through personal delivery. For online submission: scan and attach the document(s) to bu-hrmdo@bicol-u.edu.ph (for applications, email to bu-recruitment@bicol-u.edu.ph).\n   → 1.1 Receive and check the communication/request and supporting documents. (Fee: None; Time: 5 Minutes; Person: Administrative Aide VI, HRMDO)\n   → 1.2 Check the completeness of the attachments. If incomplete, notify the requesting party. (Fee: None; Time: 3 Minutes; Person: Administrative Aide VI / Administrative Aide III, HRMDO)\n   → 1.3 Recording and barcoding of the documents. (Fee: None; Time: 2 Minutes; Person: Administrative Aide VI, HRMDO)\n   → 1.4 Affix the signature to the duplicate copy. (Fee: None; Time: 2 Minutes; Person: Administrative Aide VI, HRMDO)\n   → 1.5 Encoding of the documents to the HRMDO database. (Fee: None; Time: 5 Minutes; Person: Administrative Aide VI, HRMDO)\n   → 1.6 Forward the communication/request to the Head of the HRMDO for action. (Fee: None; Time: 1 Day; Person: Supervising Administrative Officer, HRMDO)\n   → 1.7 Releases and disseminates the communication to concerned officer or staff. (Fee: None; Time: 5 Minutes; Person: Administrative Aide VI, HRMDO)\n   → 1.8 Route the document for action to concerned HR personnel. (Fee: None; Time: 4 Hours; Person: Administrative Aide VI, HRMDO)\n   → 1.9 Retains the copy of the request and supporting documents and file the same. (Fee: None; Time: 5 Minutes; Person: Administrative Aide VI, HRMDO)\n2. Receive the communication/acted request (F2F: indicate name, date and time received; online: acknowledge the email from the official email address).\n   → 2.1 Release the documents to the authorized representative or liaison officer (face-to-face) / 2.2 Send the acted request or requested documents to the official email (online). (Fee: None; Time: 5 Minutes; Person: Administrative Aide VI, HRMDO)\n\n**Total:** Fee: None • Processing time: 1 Day, 4 Hours, 32 Minutes\n\n**Note:** Official email: bu-hrmdo@bicol-u.edu.ph; for applications, email to bu-recruitment@bicol-u.edu.ph. Transactions shall be thru window transactions only.\n\n> Source: BU Citizen's Charter, 2023 (2nd Edition), pp. 230-234. Fees, requirements, and processing times may be updated by the University — always verify with the responsible office before transacting."},{"c":"Citizen's Charter Services","q":"How do I request my Service Record from HRMDO?","a":"**Who may avail:** Former Bicol University Personnel\n**Classification / type of transaction:** Simple • G2C - Government to Citizen\n\n**Checklist of requirements (where to secure):**\n- Records Request Form (BU-F-HRMDO-54) (1 original copy) — HRMDO\n- Documentary Stamp (2 pcs for PHP 15.00; 1 pc for PHP 30.00) — Requesting party\n- Signature of the requesting employee or authorized representative indicating date & time of receipt in the Request Form (Authorization Letter & ID are needed if a representative claims) — Requesting Party\n\n**Steps, fees and processing time:**\n1. Requesting employee fills up the records request form for Service Record or sends request via email or HRMDO official messenger account (online: send the request to bu-hrmdo@bicol-u.edu.ph).\n   → 1.1 Receive and retrieves, check the completeness of the request. (Fee: None; Time: 5 Minutes; Person: Administrative Aide VI, HRMDO)\n   → 1.2 Pull out from file the original Service Record. (Fee: None; Time: 2 Minutes; Person: Administrative Aide VI, HRMDO)\n   → 1.3 Prepares Service Record. (Fee: None; Time: 5 Minutes; Person: Administrative Assistant III (for BUCE, BUPC, BUCS, BUCAL) / Administrative Aide III (for BUCAF, IPESR, JMRIGD, BUGS, OU), HRMDO)\n   → 1.4 Verifies and affixes the documentary stamp to the printed Service Record. (Fee: None; Time: 3 Minutes; Person: Administrative Officer IV (for CSSP, CBEM, BUCENG, BUCIT, Casual) / Administrative Officer I (for GASS, RDMD, EMD, Auxiliary) / Administrative Assistant I (for BUCN, BUCM, BUYC, BU Gubat), HRMDO)\n   → 1.5 Reviews and signs the printed Service Record. (Fee: None; Time: 3 Minutes; Person: Supervising Administrative Officer, HRMDO)\n   → 1.6 Records in the Record Request Form: Date, Name and time and receiving person. (Fee: None; Time: 2 Minutes; Person: Administrative Aide VI, HRMDO)\n2. Receive the Service Record (for the authorized representative: present the ID and authorization).\n   → 2.1 Issues the printed Service Record to the requesting employee or authorized representative. (Fee: None; Time: 2 Minutes; Person: Administrative Aide VI, HRMDO)\n\n**Total:** Fee: None • Processing time: 22 Minutes\n\n**Note:** Transactions shall be thru window transactions only.\n\n> Source: BU Citizen's Charter, 2023 (2nd Edition), pp. 234-237. Fees, requirements, and processing times may be updated by the University — always verify with the responsible office before transacting."},{"c":"Citizen's Charter Services","q":"How do I request a Certificate of Employment from HRMDO?","a":"**Who may avail:** Former BU employee, BU Retiree (part-timer, casual, job order, permanent)\n**Classification / type of transaction:** Simple • G2C - Government to Citizen\n\n**Checklist of requirements (where to secure):**\n- Records Request Form (BU-F-HRMDO-54) (1 original copy) — HRMDO\n- Documentary Stamp (2 pcs for PHP 15.00; 1 pc for PHP 30.00) — Requesting Entity\n- Signature of the requesting employee or authorized representative indicating date & time of receipt in the Record Request Form — Requesting Entity\n- Authorization Letter & ID (if a representative claims) — Requesting Entity\n\n**Steps, fees and processing time:**\n1. Fill up the request for a Certificate of Employment via (a) face to face transaction, (b) email or HRMDO messenger official account (online: send the request to bu-hrmdo@bicol-u.edu.ph).\n   → 1.1 Receives & Records employee's request for a Certificate of Employment. (Fee: None; Time: 2 Minutes; Person: Administrative Aide VI (Permanent Employees) / Administrative Assistant III (Job Orders), HRMDO)\n   → 1.2 Retrieves/Pull out from files the original Service Record. (Fee: None; Time: 3 Minutes; Person: Administrative Aide VI / Administrative Assistant III, HRMDO)\n   → 1.3 Prepares Certificate of Employment and prints. (Fee: None; Time: 4 Minutes; Person: Administrative Aide VI (Permanent) / Administrative Assistant III (Job Orders), HRMDO)\n   → 1.4 Affixes documentary stamp to the Certificate of Employment. (Fee: None; Time: 1 Minute; Person: Administrative Aide VI, HRMDO)\n   → 1.5 Reviews and signs the Certificate of Employment. (Fee: None; Time: 3 Minutes; Person: Administrative Officer IV, HRMDO)\n   → 1.6 Records in the Record Request Form: Date, Time, Name, & Receiving Person. (Fee: None; Time: 2 Minutes; Person: Administrative Aide VI (Permanent) / Administrative Assistant III (Job Orders), HRMDO)\n2. Receive the Certificate of Employment (for the authorized representative: present the authorization and ID).\n   → 2. Releases the certificate of employment to the requesting employee or authorized representative. (Fee: None; Time: 1 Minute; Person: Administrative Aide VI, HRMDO)\n\n**Total:** Fee: None • Processing time: 16 Minutes\n\n**Note:** Transactions shall be thru window transactions only.\n\n> Source: BU Citizen's Charter, 2023 (2nd Edition), pp. 237-239. Fees, requirements, and processing times may be updated by the University — always verify with the responsible office before transacting."},{"c":"Citizen's Charter Services","q":"How are financial claims processed by the Administrative Office?","a":"**Who may avail:** BU Personnel; BU Students; Creditors/External Agencies\n**Classification / type of transaction:** Complex • G2C - Government to Citizen • G2B - Government to Business • G2G - Government to Government\n\n**Checklist of requirements (where to secure):**\n- Utility Expense: Statement of Account/Bill (1 original, 1 photocopy) — Utility Company\n- Utility Expense: Invoice/Official Receipt or machine validated statement of account/bill (1 original, 1 photocopy) — Utility Company\n- Telephone/Communication Expense: Statement of Account/Bill (1 original, 1 photocopy) — Communication Company\n- Telephone/Communication Expense: Invoice/Official Receipt or machine validated statement of account/bill or collection and acknowledgement receipts (1 original, 1 photocopy) — Communication Company\n- Telephone/Communication Expense: Certification by Head of Agency or his authorized representatives that all National Direct Dial (NDD), National Operator Assisted Calls and International Operator Assisted Calls are official calls (1 original, 1 photocopy) — Concerned BU Office\n- Telephone/Communication Expense: Authority from the Head of Agency for entitlement to Mobile phone allowance (2 certified copy of the original) — Office of the BU President\n- Telephone/Communication Expense: Certification from the Chief Accountant or cluster Accountant and Property Officer that the employee was not issued a postpaid plan for mobile phone (3 original) — Central Accounting Office\n- General Support Services (janitorial, security maintenance, garbage collection and disposal and similar services): Performance Appraisal Report (1 original, 1 photocopy) — General Support Agency\n- GSS: Statement of account or Contractor's Bill (1 original, 1 photocopy) — General Support Agency\n- GSS: Record of Attendance Services (1 original, 1 photocopy) — General Support Agency\n- GSS: Proof of remittance to concerned government agencies (BIR/SSS/ECC/Pag-IBIG/PhilHealth) (2 certified copy of the original) — General Support Agency\n\n**Steps, fees and processing time:**\n1. Clients submits documents for processing of financial claim.\n   → 1.1 Review, receive and record documents submitted. (Fee: None; Time: 1 Hour; Person: Administrative Aide, University Administrative Office (GASS & Auxiliary Services))\n   → 1.2 Prepare Disbursement Voucher (DV) and other necessary documents. (Fee: None; Time: 3 Days; Person: Administrative Aide / GASS & Auxiliary Services Administrative Officer, University Administrative Office)\n   → 1.3 Record the Disbursement Voucher (DV) and attach Claim Monitoring Sheet. (Fee: None; Time: 7 Hours; Person: Administrative Aide, University Administrative Office)\n   → 1.4 Review documents and sign Box A of the Disbursement Voucher (DV). (Fee: None; Time: 2 Days; Person: GASS & Auxiliary Services Administrative Officer / Chief Administrative Officer for Administrative Division, University Administrative Office)\n   → 1.5 Forward Disbursement Voucher (DV) to the Budget Office. (Fee: None; Time: 1 Day; Person: Administrative Aide, University Administrative Office)\n\n**Total:** Fee: None • Processing time: 7 Days\n\n**Note:** Transactions shall be thru window transactions only.\n\n> Source: BU Citizen's Charter, 2023 (2nd Edition), pp. 282-285. Fees, requirements, and processing times may be updated by the University — always verify with the responsible office before transacting."},{"c":"Citizen's Charter Services","q":"How do I get a BU vehicle sticker / car pass?","a":"**Who may avail:** BU Students; Private Entity\n**Classification / type of transaction:** Complex • G2C - Government to Citizen • G2B - Government to Business • G2G - Government to Government\n\n**Checklist of requirements (where to secure):**\n- Application, BU form Motorpool-2 (1 Original) — Motorpool Section\n- OR CR (1 Photocopy) — Requesting Student/Private Entity\n- Driver's License (1 Photocopy) — Requesting Student/Private Entity\n- BU Student's ID (1 Photocopy) — Requesting Student/Private Entity\n\n**Steps, fees and processing time:**\n1. Clients submits application.\n   → 1.1 Receipt of application form. Attach photocopy of OR CR, Driver's License, BU ID. (Fee: None; Time: 1 Hour; Person: Administrative Aide I, Administrative Service Division Office / Head Motorpool Section)\n   → 1.2 Evaluated correctness and completeness of submitted documents. (Fee: None; Time: 30 Minutes; Person: Administrative Aide I, Administrative Service Division Office / Head Motorpool Section)\n   → 1.3 Recommends to Business Affairs Office. (Fee: None; Time: 30 Minutes; Person: Head Motorpool Section / Chief Administrative Officer / GASS & Auxiliary Services Administrative Officer, Administrative Service Division Office)\n   → 1.4 The Business Affairs Office prepares the billing statement. (Fee: 4-wheeled - PHP 500.00; Motorcycle/Tricycle - PHP 250.00; Time: 1 Day; Person: BAO Director / Admin. Aide / In-charge Dormitory, Business Affairs Office)\n2. The client shall pay the fees indicated in the billing statement at the Cashier's Office (if applicable).\n   → 2.1 The Cashier's Office receives the payment and issues Official Receipt. (Fee: Amount indicated in the Billing Statement; Time: 1 Day; Person: Administrative Officer V / Administrative Assistant I / Administrative Aide III, University Cashier's Office)\n3. The client submits official receipt to Business Affairs Office.\n   → 3.1 Receipt of official receipt and release of BU Car Pass/Sticker. (Fee: None; Time: 1 Day; Person: BAO Director / Admin. Aide / In-charge Dormitory, Business Affairs Office)\n\n**Total:** Fee: 4-wheeled PHP 500.00; Motorcycle/Tricycle PHP 250.00 • Processing time: 3 Days, 1 Hour\n\n**Note:** Clients are advised to adhere to government Covid-19 health and safety protocols when transacting at the office; transactions shall be thru window transactions only.\n\n> Source: BU Citizen's Charter, 2023 (2nd Edition), pp. 307-309. Fees, requirements, and processing times may be updated by the University — always verify with the responsible office before transacting."},{"c":"Citizen's Charter Services","q":"How do I request a BU vehicle for official travel?","a":"**Who may avail:** Government Agencies and Private Entity\n**Classification / type of transaction:** Complex • G2C - Government to Citizen • G2B - Government to Business • G2G - Government to Government\n\n**Checklist of requirements (where to secure):**\n- Letter Request addressed to the University President (1 Original) — Requesting Agency/Private Entity/Individual\n\n**Steps, fees and processing time:**\n1. Clients submits letter request.\n   → 1.1 Office of the President receives request for approval. (Fee: None; Time: 4 Hours; Person: Administrative Aide IV / Administrative Aide VI, Office of the President)\n   → 1.2 Receipt of request letter. (Fee: None; Time: 1 Hour; Person: Administrative Aide I / Head Motorpool Section, Administrative Service Division Office)\n   → 1.3 Staff check the logbook to verify whether there is previous request and what vehicle is available for the trip. (Fee: None; Time: 4 Hours; Person: Administrative Aide I / Head Motorpool Section, Administrative Service Division Office)\n   → 1.4 Recommend approval of request if vehicle is available. (Fee: None; Time: 1 Hour; Person: Head Motorpool Section / Chief Administrative Officer / GASS & Auxiliary Services Administrative Officer, Administrative Service Division Office)\n   → 1.5 Staff/Driver prepares the pre-inspection report of the vehicle. (Fee: None; Time: 4 Hours; Person: Administrative Aide I, Administrative Service Division Office / Assigned Driver, Motorpool)\n   → 1.6 The Business Affairs Office prepares the billing statement (if applicable). (Fee: For Private Entity (Rate x Day) + driver per diem + Diesel: Rate x Day PHP 1,500.00/day Daraga/Legazpi Area; PHP 2,500.00 within the region; PHP 5,000.00 outside the Region. Driver per diem: PHP 2,200.00/day outside the region; PHP 750.00/day within the region. For Government Agency - None.; Time: 1 Day; Person: BAO Director / Admin. Aide / In-charge Dormitory, Business Affairs Office)\n2. The client shall pay the fees indicated in the billing statement at the Cashier's Office (if applicable).\n   → 2.1 The Cashier's Office receives the payment and issues Official Receipt. (Fee: Amount indicated in the Billing Statement; Time: 1 Day; Person: Administrative Officer V / Administrative Assistant I / Administrative Aide III, University Cashier)\n   → 2.2 The Office of the Vice-President for Administration and Finance shall issue a travel order to the assigned driver if trip is outside the Province of Albay/Region. (Fee: None; Time: 1 Day; Person: Vice-President for Administration and Finance, Office of the VP for Admin and Finance)\n   → 2.3 Trip ticket is numbered and recorded. (Fee: None; Time: 1 Day; Person: Administrative Aide I, Administrative Service Division Office)\n   → 2.4 Trip Ticket is issued to the Guard on Duty. (Fee: None; Time: 1 Hour; Person: Guard on Duty, Ricardo A. Arcilla Building)\n   → 2.5 Guard on Duty releases to the assigned driver the trip ticket and keys and record time of departure. (Fee: None; Time: 30 Minutes; Person: Guard on Duty, Ricardo A. Arcilla Building)\n   → 2.6 Conduct Trip. (Fee: None; Time: As required by the trip; Person: Assigned Driver, Motorpool)\n   → 2.7 The guard on duty records the arrival of the vehicle at the back of the trip ticket and receives the vehicle keys. (Fee: None; Time: 30 Minutes; Person: Guard on Duty, Ricardo A. Arcilla Building)\n\n**Total:** Fee: Private Entity: (Rate x Day) + driver per diem + Diesel; Government Agency: None • Processing time: 3 Days, 1 Hour\n\n**Note:** Rates: PHP 1,500.00/day (Daraga/Legazpi Area); PHP 2,500.00 (within the region); PHP 5,000.00 (outside the Region). Driver per diem: PHP 750.00/day within the region; PHP 2,200.00/day outside the region.\n\n> Source: BU Citizen's Charter, 2023 (2nd Edition), pp. 310-315. Fees, requirements, and processing times may be updated by the University — always verify with the responsible office before transacting."},{"c":"Citizen's Charter Services","q":"How do I buy bidding documents for BU procurement?","a":"**Who may avail:** Prospective Bidders\n**Classification / type of transaction:** Simple • G2B - Government to Business\n\n**Checklist of requirements (where to secure):**\n- Official Receipt of Payment of Bidding Documents (1 Original Copy) — University Cashier\n- One (1) Valid Company Identification Card — Prospective Bidder Company\n\n**Steps, fees and processing time:**\n1. Fill out the Intent and Document Purchase Form provided by the Univ. BAC and present Valid Company ID.\n   → 1. Check if the form is filled out correctly. (Fee: None; Time: 10 Minutes; Person: Admin Aide IV (Infra) / Procurement Management Assistant (Goods and Consulting Services) / Univ. BAC Secretary, PrMO)\n2. Proceed to the University Cashier and pay the corresponding Fee indicated in the Order of Payment Form provided by the Univ. BAC Secretariat.\n   → 2.1 Release the Order of Payment Form to be presented to the Univ. Cashier. (Fee: See the table of Fees for Bidding Documents; Time: 10 Minutes; Person: Univ. Cashier, University Cashier's Office)\n   → 2.2 Issue a copy of the Bidding Document. (Fee: None; Time: 30 Minutes; Person: Admin. Aide IV (Infra) / Procurement Management Assistant (Goods and Consulting Services) / Univ. BAC Secretary, PrMO)\n3. Register in the logbook and acknowledge receipt of the Bidding Documents.\n   → 3. Maintain registry of the Bidders who purchased the Bidding Documents. (Fee: None; Time: 5 Minutes; Person: Admin Aide IV (Infra) / Procurement Management Assistant (Goods and Consulting Services), PrMO)\n\n**Total:** Fee: Per approved budget for the Contract (see fee table) • Processing time: 55 Minutes\n\n**Note:** Maximum cost of bidding documents per Approved Budget for the Contract (PHP): 500,000 and Below - PHP 500.00; More than 500,000.00 up to 1 Million - PHP 1,000.00; More than 1 Million up to 5 Million - PHP 5,000.00; More than 5 Million up to 10 Million - PHP 10,000.00; More than 10 Million up to 50 Million - PHP 25,000.00; More than 50 Million up to 500 Million - PHP 50,000.00; More than 500 Million - PHP 75,000.00. (Based on Section 5.0, Appendix 8 of the 2016 Revised IRR of Republic Act No. 9184.)\n\n> Source: BU Citizen's Charter, 2023 (2nd Edition), pp. 325-327. Fees, requirements, and processing times may be updated by the University — always verify with the responsible office before transacting."},{"c":"Citizen's Charter Services","q":"How do I get my official BU student e-mail account?","a":"**Who may avail:** BU Students\n**Classification / type of transaction:** Simple • G2C - Government to Citizen\n\n**Checklist of requirements (where to secure):**\n- BU Student Identification Card (1 original) OR Certificate of Registration (1 original or 1 photocopy) — Office of Student Affairs Services / Office of the College Registrar\n\n**Steps, fees and processing time:**\n1. Present Identification Card or Certificate of Registration for BU Students for on-site.\n   → 1.1 For on-site requests, assigned staff will entertain the client. (Fee: None; Time: 10 Minutes; Person: Admin. Staff, Information and Communications Technology Office)\n   → 1.2 If the Students send their concerns online, staff will be sending a reply through the email they have provided. (Fee: None; Time: 20 Minutes; Person: Admin. Staff, Information and Communications Technology Office)\n2. Access the Student Center Account to gain access to your official email account, 2 weeks after the scheduled enrollment. (For those officially enrolled students)\n   → 2. Computer is provided for those who want to access at our office, staffs will assist the students. (Fee: None; Time: 15 Minutes; Person: Admin. Staff, Information and Communications Technology Office)\n3. For late enrollees, fill out this google form (tinyurl.com/bu-icto-concerns) to gain access to your official email account. Wait for ICTO's response indicating your Official Email Account Details.\n   → 3. Response from the staff assigned to your concern will email your account details. (Fee: None; Time: 2 Days; Person: Admin. Staff, Information and Communications Technology Office)\n4. Fill out the Clientele Satisfaction Survey using Google Form (tinyurl.com/bu-icto-rating).\n   → 4. After the submission of the form by the client, it will be viewed by the staff in the system for evaluation. (Fee: None; Time: 8 Minutes; Person: Admin. Staff, Information and Communications Technology Office)\n\n**Total:** Fee: None • Processing time: 2 Days, 53 Minutes\n\n**Note:** Official email accounts are activated 2 weeks after the scheduled enrollment for officially enrolled students.\n\n> Source: BU Citizen's Charter, 2023 (2nd Edition), pp. 346-348. Fees, requirements, and processing times may be updated by the University — always verify with the responsible office before transacting."},{"c":"Citizen's Charter Services","q":"How do I reset my BU e-mail / account password?","a":"**Who may avail:** BU Students; BU Alumni\n**Classification / type of transaction:** Simple • G2C - Government to Citizen\n\n**Checklist of requirements (where to secure):**\n- BU Students: BU Student Identification Card (1 original) OR Certificate of Registration (1 original or 1 photocopy) — Office of Student Affairs Services / Office of the College Registrar\n- BU Alumni: Government Issued Identification Card (1 original) — SSS, GSIS, BIR, DFA, Pag-IBIG, Post Office\n\n**Steps, fees and processing time:**\n1. Present Identification Card (for BU Students and Employees) or Certificate of Registration for BU Students for on-site; or fill out the Google Form (tinyurl.com/bu-icto-concerns) for a password reset request.\n   → 1.1 For on-site requests, assigned staff will entertain the client. (Fee: None; Time: 20 Minutes; Person: Admin. Staff, Information and Communications Technology Office)\n   → 1.2 If the Students send their concerns online, staff will be sending a reply through the email they have provided. (Fee: None; Time: 20 Minutes; Person: Admin. Staff, Information and Communications Technology Office)\n2. Wait for the response of ICTO indicating the BU Email Account Details via the provided contact details (text message or email) in the Google Form.\n   → 2. A text/email from us will be sent to clients. (Fee: None; Time: 2 Days; Person: Admin. Staff, Information and Communications Technology Office)\n3. Fill out the Clientele Satisfaction Survey using Google Form (tinyurl.com/bu-icto-rating).\n   → 3. After the submission of the form by the client, it will be viewed by the staff in the system for evaluation. (Fee: None; Time: 20 Minutes; Person: Admin. Staff, Information and Communications Technology Office)\n\n**Total:** Fee: None • Processing time: 3 Days\n\n**Note:** Password reset request form: tinyurl.com/bu-icto-concerns; clientele satisfaction survey: tinyurl.com/bu-icto-rating.\n\n> Source: BU Citizen's Charter 2024 (1st Edition), Information and Communications Technology Office. Fees, requirements, and processing times may be updated by the University — always verify with the responsible office before transacting."},{"c":"Citizen's Charter Services","q":"How do I join the sale of BU's unserviceable properties (bid and refund)?","a":"**Who may avail:** Bidder\n**Classification / type of transaction:** Highly Technical • G2G - Government to Government • G2B - Government to Business\n\n**Checklist of requirements (where to secure):**\n- Letter Request to join the bid (1 original copy) — Bidder\n- Valid ID (1 photocopy - bring the original copy of ID for validation) — Bidder\n- 10% Bid Security — Bidder\n\n**Steps, fees and processing time:**\n1. Submit Letter and photocopy of Valid ID.\n   → 1.1 Issue the Request for Quotation to the bidders. (Fee: None; Time: 1 Day; Person: University Supply Officer, SPMO)\n   → 1.2 Explain the query of the bidder regarding the process of disposal (if any). (Fee: None; Time: 30 Minutes; Person: University Supply Officer, SPMO)\n2. Submit the Request for Quotations with 10% bid security (cash) of the bid price in a sealed envelope.\n   → 2.1 Received the Sealed quotation, put the date and time when it is submitted. (Fee: None; Time: 20 Minutes; Person: University Supply Officer, SPMO)\n   → 2.2 Assist in the opening of the sealed request for quotations submitted by the bidders. (Fee: None; Time: 4 Hours; Person: Administrative Officer I, SPMO)\n   → 2.3 Prepare Minutes of the bidding process. (Fee: None; Time: 4 Hours; Person: Administrative Officer I, SPMO)\n   → 2.4 Refund the 10% bid security of the losing bidders after the bidding process. (Fee: None; Time: 1 Hour; Person: University Supply Officer, SPMO)\n3. Pay the bid security.\n   → 3. Inform the cashier's Office for the details of the payable. (Fee: 10% bid security (refundable); Time: 10 Minutes; Person: Administrative Officer I, SPMO)\n4. Submit Official Receipt (photocopy) of the amount paid.\n   → 4.1 Accept the copy of the Official Receipt and attached in the disposal documents. (Fee: None; Time: 10 Minutes; Person: University Supply Officer, SPMO)\n   → 4.2 Prepare the Abstract of Bids and Forward to the Committee for signature. (Fee: None; Time: 1 Hour; Person: Administrative Officer I, SPMO)\n   → 4.3 Prepare the Notice of Award and Forward to the Head of Agency for signature. (Fee: None; Time: 30 Minutes; Person: Administrative Officer I, SPMO)\n   → 4.4 Inform the winning bidder to sign the Notice of Award. (Fee: None; Time: 10 Minutes; Person: University Supply Officer, SPMO)\n5. Pay the amount of the total bid price.\n   → 5. Furnish the Cashier Office a copy of the Notice of Award to determine the amount to pay. (Fee: Total Bid Price; Time: 15 Minutes; Person: Administrative Officer I, SPMO)\n6. Submit the authenticated copy of the Official Receipt and Valid ID.\n   → 6.1 Prepare the Contract of Sale of the Disposal the winning bidder as buyer. (Fee: None; Time: 1 Hour; Person: Administrative Officer I / University Supply Officer, SPMO)\n   → 6.2 Forward to Head of Agency for signature as seller and to the winning bidder as buyer. (Fee: None; Time: 20 Minutes; Person: Administrative Officer I, SPMO)\n   → 6.3 Have it notarize by the legal office or any authorized notary public. (Fee: None; Time: 1 Hour; Person: Administrative Officer I, SPMO)\n   → 6.4 Release the unserviceable properties and waste materials. (Fee: None; Time: 1 Day; Person: University Supply Officer, SPMO)\n   → 6.5 Finalize the complete documents of the Disposal. (Fee: None; Time: 3 Days; Person: Administrative Officer I / University Supply Officer, SPMO)\n   → 6.6 Review the completeness of the documents of Disposal. (Fee: None; Time: 1 Day; Person: University Supply Officer, SPMO)\n   → 6.7 Submit the Disposal Report to Accounting Office and COA Office. (Fee: None; Time: 20 Minutes; Person: Administrative Officer I, SPMO)\n7. Submit Letter and Original copy of Official Receipt (for refund of bid security).\n   → 7.1 Receive the letter and the Official Receipt. (Fee: None; Time: 10 Minutes; Person: University Supply Officer, SPMO)\n   → 7.2 Recommend the letter for the refund and forward to the Committee Chair, for approval. (Fee: None; Time: 15 Minutes; Person: University Supply Officer, SPMO)\n   → 7.3 Prepare, Review and Sign the Disbursement Voucher for the refund. (Fee: None; Time: 30 Minutes; Person: University Supply Officer, SPMO)\n   → 7.4 Forward to Accounting Office. (Fee: None; Time: 10 Minutes; Person: Administrative Officer I, SPMO)\n\n**Total:** Fee: Total Bid Price • Processing time: 7 Days, 7 Hours, 50 Minutes\n\n> Source: BU Citizen's Charter, 2023 (2nd Edition), pp. 362-365. Fees, requirements, and processing times may be updated by the University — always verify with the responsible office before transacting."},{"c":"Citizen's Charter Services","q":"How do I pay for a lost library book?","a":"**Who may avail:** BU Students\n**Classification / type of transaction:** Simple • G2C - Government to Citizen\n\n**Checklist of requirements (where to secure):**\n- Formal declaration of lost book/s (1 Physical Letter Signed by the student) — Requesting Party\n- Certification from the Barangay (if due to natural/man-made disaster) — Requesting Party's Barangay Secretary/Office of the Barangay Council\n- Order of Payment (1 Original or Electronic Copy) — Library\n- Official Receipt (1 Original Copy) — University Cashier\n\n**Steps, fees and processing time:**\n1. Present formal declaration of lost book/s.\n   → 1.1 Receive formal declaration and retrieve book card/s. (Fee: None; Time: 5 Minutes; Person: Librarian/Library Staff, Circulation Section, University Library)\n   → 1.2 Check the record for cost of book/s. (Fee: Acquisition price/assigned amount if undetermined; Time: 15 Minutes; Person: Librarian, Circulation Section/Technical Section, University Library)\n2. Receive Order of Payment.\n   → 2. Issue Order of Payment. (Fee: Acquisition price/assigned amount if undetermined; Time: 5 Minutes; Person: Librarian/Library Staff, Circulation Section, University Library)\n3. Pay the assessed amount.\n   → 3. Process payment based on Order of Payment and issue Official Receipt. (Fee: Amount indicated in the Order of Payment; Time: 10 Minutes; Person: Cashier, University Cashier's Office)\n4. Go back to the library and present the Official Receipt to the library personnel-in-charge.\n   → 4. Photocopy Official Receipt. Write, \"Declared Lost & Paid with OR# and date paid\" in the book card/s. (Fee: None; Time: 5 Minutes; Person: Librarian/Library Staff, Circulation Section, University Library)\n5. Receive the Official Receipt.\n   → 5.1 Return the Official Receipt and clear the accountability. (Fee: None; Time: 5 Minutes; Person: Librarian/Library Staff, Circulation Section, University Library)\n   → 5.2 Record in the accession record and BU-iLib (if applicable). (Fee: None; Time: 1 Hour; Person: Librarian, Technical Section, University Library)\n\n**Total:** Fee: Acquisition price/assigned amount if undetermined • Processing time: 1 Hour, 45 Minutes\n\n> Source: BU Citizen's Charter 2024 (1st Edition), University Library, pp. 109-110. Fees, requirements, and processing times may be updated by the University — always verify with the responsible office before transacting."},{"c":"Citizen's Charter Services","q":"How do I replace a lost library book?","a":"**Who may avail:** BU Students\n**Classification / type of transaction:** Simple • G2C - Government to Citizen\n\n**Checklist of requirements (where to secure):**\n- Formal declaration of lost book/s (1 Physical Letter Signed by the student) — Requesting Party\n- Certification from the Barangay (if due to natural/man-made disaster) — Requesting Party's Barangay Secretary/Office of the Barangay Council\n- Order of Payment (1 Original or Electronic Copy) — Library\n- Official Receipt (1 Original Copy) — University Cashier\n\n**Steps, fees and processing time:**\n1. Present formal declaration of lost book/s.\n   → 1. Receive formal declaration, retrieve book card/s and verify information in the records. (Fee: None; Time: 15 Minutes; Person: Librarian/Library Staff, Circulation Section, University Library)\n2. Receive the written details of the book/s for replacement.\n   → 2. Give the full bibliographic information of the book/s. (Fee: None; Time: 5 Minutes; Person: Librarian/Library Staff, Circulation Section, University Library)\n3. Hand-in the book/s.\n   → 3.1 Check the title, author, copyright/edition of the book/s if the same with the required replacement. (Fee: None; Time: 5 Minutes; Person: Librarian/Library Staff, Circulation Section, University Library)\n   → 3.2 Clear the accountability in the records. (Fee: None; Time: 5 Minutes; Person: Librarian, Circulation Section, University Library)\n   → 3.3 Prepare the new book/s for mechanical processing/shelving and update the accession record/BU-iLib. (Fee: None; Time: 1 Day; Person: Librarian, University Library)\n\n**Total:** Fee: None • Processing time: 1 Day, 30 Minutes\n\n> Source: BU Citizen's Charter 2024 (1st Edition), University Library, pp. 110-111. Fees, requirements, and processing times may be updated by the University — always verify with the responsible office before transacting."},{"c":"Citizen's Charter Services","q":"How do I borrow books from the BU Guinobatan Library?","a":"**Who may avail:** BU Students\n**Classification / type of transaction:** Simple • G2C - Government to Citizen\n\n**Checklist of requirements (where to secure):**\n- Validated Certificate of Registration (1 Hardcopy or Electronic Copy) — College Registrar\n- BU Student ID (1 Original) — Office of Student Affairs and Services/Office of the College Student Affairs Coordinator\n- Student Borrower's Card (1 Original) — Library\n- If a representative will pick up the book/s: Authorization Letter (1 Physical Letter Signed by the BU Student), the student's BU ID, validated Certificate of Registration and Borrower's Card — Requesting Party; and the representative's Government-Issued ID (1 Original)\n\n**Steps, fees and processing time:**\nFace-to-Face:\n1. Present the book/s to be borrowed along with the Certificate of Registration, BU ID and borrower's card at the Circulation Desk.\n   → 1.1 Receive the books and verify patron borrowing requirements. (Fee: None; Time: 5 Minutes; Person: Librarian/Library Staff, BU Guinobatan Library)\n   → 1.2 Check the title, author & accession number of the book/s against the book card/s. (Fee: None; Time: 5 Minutes; Person: Librarian/Library Staff, BU Guinobatan Library)\n2. Accomplish the book card/s with date borrowed, name, college/department and signature.\n   → 2.1 Receive and check the book card/s and fill out the date due slip. (Fee: None; Time: 5 Minutes; Person: Librarian/Library Staff, BU Guinobatan Library)\n   → 2.2 Fill-out the borrower's card. (Fee: None; Time: 5 Minutes; Person: Librarian/Library Staff, BU Guinobatan Library)\n3. Fill-out and sign the Log Book.\n   → 3. Check-out in the BU-iLib System (if applicable) and check correctness of information in the Log Book. (Fee: None; Time: 10 Minutes; Person: Librarian/Library Staff, BU Guinobatan Library)\n4. Receive the book/s and borrower's card.\n   → 4. Release the book/s borrowed and file the book card/s. (Fee: None; Time: 5 Minutes; Person: Librarian/Library Staff, BU Guinobatan Library)\n\n**Total (Face-to-Face):** Fee: None • Processing time: 35 Minutes\n\nOnline (book reservation):\n1. Fill out the reservation form: tinyurl.com/AskRISAform\n   → 1. Check if the client meets the requirements and if the requested material/s are available. (Fee: None; Time: 2 Days; Person: Librarian/Library Staff, BU Guinobatan Library)\n2. Receive confirmation message.\n   → 2. Send confirmation of availability and inform the client of the next steps. (Fee: None; Time: 35 Minutes; Person: Librarian/Library Staff, BU Guinobatan Library)\n3. Proceed to the library with the Certificate of Registration, BU ID and borrower's card.\n   → 3. Check the borrowing requirements and hand-in the book card/s. (Fee: None; Time: 5 Minutes; Person: Librarian/Library Staff, BU Guinobatan Library)\n4. Accomplish the book card/s and sign the Log Book; receive the book/s.\n   → 4-6. Fill the date due slip and borrower's card, check-out in the BU-iLib System, release the book/s. (Fee: None; Time: 25 Minutes; Person: Librarian/Library Staff, BU Guinobatan Library)\n\n**Total (Online):** Fee: None • Processing time: 2 Days, 1 Hour, 5 Minutes\n\n> Source: BU Citizen's Charter 2024 (1st Edition), BU Guinobatan Library Services, pp. 790-793. Fees, requirements, and processing times may be updated by the University — always verify with the responsible office before transacting."},{"c":"Citizen's Charter Services","q":"How do I settle an overdue fine or lost book at the BU Guinobatan Library?","a":"**Who may avail:** BU Students\n**Classification / type of transaction:** Simple (Face-to-Face) • Complex (Online) • G2C - Government to Citizen\nBorrowing privileges are suspended for students with unreturned books, overdue fines or lost books until the accountability is settled.\n\n**Checklist of requirements (where to secure):**\n- Payment of Overdue Fines above PHP 50.00: Order of Payment (1 Original or Electronic Copy) — Library; Official Receipt (1 Original Copy) — University Cashier\n- Payment for Lost Book: Order of Payment (1 Original or Electronic Copy) — Library; Official Receipt (1 Original Copy) — University Cashier\n- Replacement for Lost Book: Formal declaration of lost book/s (1 Physical Letter Signed by the student) — Requesting Party; Certification from the Barangay (if due to natural/man-made disaster); Order of Payment — Library; Official Receipt — University Cashier\n\n**Steps, fees and processing time:**\nPayment of Overdue Fines below PHP 50.00:\n1. Pay fine and fill-out the Overdue Log Sheet.\n   → 1.1 Receive the payment and check information in the Overdue Log Sheet. (Fee: See Table of Fines; Time: 5 Minutes; Person: Librarian/Library Staff, BU Guinobatan Library)\n   → 1.2 Clear the accountability. (Fee: None; Time: 3 Minutes; Person: Librarian/Library Staff, BU Guinobatan Library)\n**Total:** Fee: No. of book/s x Amount of Fine • Processing time: 8 Minutes\n\nPayment of Overdue Fines above PHP 50.00:\n1. Receive the Order of Payment.\n   → 1. Issue Order of Payment. (Fee: See Table of Fines; Time: 4 Minutes; Person: Librarian/Library Staff, BU Guinobatan Library)\n2. Present the Order of Payment to the Cashier and pay fine.\n   → 2. Process payment based on Order of Payment and issue Official Receipt. (Fee: Amount indicated in the Order of Payment; Time: 10 Minutes; Person: Cashier, BU Guinobatan Cashier's Office)\n3. Go back to the library and present the Official Receipt.\n   → 3. Write the OR number and date in the Overdue Fines Log Sheet. (Fee: None; Time: 3 Minutes; Person: Librarian/Library Staff, BU Guinobatan Library)\n4. Receive the Official Receipt.\n   → 4. Return the Official Receipt and clear the accountability. (Fee: None; Time: 3 Minutes; Person: Librarian/Library Staff, BU Guinobatan Library)\n**Total:** Fee: No. of book/s x Amount of Fine • Processing time: 20 Minutes\n\nPayment of the Cost of Book:\n1. Present formal declaration of lost book/s.\n   → 1.1 Receive formal declaration and retrieve book card/s. (Fee: None; Time: 5 Minutes; Person: Librarian/Library Staff, BU Guinobatan Library)\n   → 1.2 Check the record for cost of book/s. (Fee: Acquisition price/assigned amount if undetermined; Time: 15 Minutes; Person: Librarian/Library Staff, BU Guinobatan Library)\n2. Receive Order of Payment.\n   → 2. Issue Order of Payment. (Fee: Acquisition price/assigned amount if undetermined; Time: 5 Minutes; Person: Librarian/Library Staff, BU Guinobatan Library)\n3. Pay the assessed amount.\n   → 3. Process payment and issue Official Receipt. (Fee: Amount indicated in the Order of Payment; Time: 10 Minutes; Person: Cashier, BU Guinobatan Cashier's Office)\n4. Present the Official Receipt to the library personnel-in-charge.\n   → 4. Photocopy Official Receipt. Write, \"Declared Lost & Paid with OR# and date paid\" in the book card/s. (Fee: None; Time: 5 Minutes; Person: Librarian/Library Staff, BU Guinobatan Library)\n5. Receive the Official Receipt.\n   → 5.1 Return the Official Receipt and clear the accountability. (Fee: None; Time: 5 Minutes; Person: Librarian/Library Staff, BU Guinobatan Library)\n   → 5.2 Record in the accession record and BU-iLib (if applicable). (Fee: None; Time: 1 Hour; Person: Librarian/Library Staff, BU Guinobatan Library)\n**Total:** Fee: Acquisition price/assigned amount if undetermined • Processing time: 1 Hour, 45 Minutes\n\nReplacement for Lost Book:\n1. Present formal declaration of lost book/s.\n   → 1. Receive formal declaration, retrieve book card/s and verify information in the records. (Fee: None; Time: 15 Minutes; Person: Librarian/Library Staff, BU Guinobatan Library)\n2. Receive the written details of the book/s for replacement.\n   → 2. Give the full bibliographic information of the book/s. (Fee: None; Time: 5 Minutes; Person: Librarian/Library Staff, BU Guinobatan Library)\n3. Hand-in the book/s.\n   → 3.1 Check the title, author, copyright/edition of the book/s. (Fee: None; Time: 5 Minutes; Person: Librarian/Library Staff, BU Guinobatan Library)\n   → 3.2 Clear the accountability in the records. (Fee: None; Time: 5 Minutes; Person: Librarian/Library Staff, BU Guinobatan Library)\n   → 3.3 Prepare the new book/s for mechanical processing/shelving and update the accession record/BU-iLib. (Fee: None; Time: 1 Day; Person: Librarian/Library Staff, BU Guinobatan Library)\n**Total:** Fee: None • Processing time: 1 Day, 30 Minutes\n\n> Source: BU Citizen's Charter 2024 (1st Edition), BU Guinobatan Library Services, pp. 794-800. Fees, requirements, and processing times may be updated by the University — always verify with the responsible office before transacting."},{"c":"Citizen's Charter Services","q":"How do I avail dental consultation and treatment at the BU Guinobatan Health Services?","a":"**Who may avail:** BU Students\n**Classification / type of transaction:** Simple • G2C - Government to Citizen\n\n**Checklist of requirements (where to secure):**\n- Identification Card (1 Original Copy); or Certificate of Registration (1 Original Copy) — Office of Student Affairs Services / Registrar Office\n\n**Steps, fees and processing time:**\n1. Present identification card or certificate of registration.\n   → 1. Validate the client status from the documents submitted. (Fee: None; Time: 5 Minutes; Person: Dental Aide, University Health Services)\n2. Submit for interview.\n   → 2. Conduct interview and check veracity of forms and documents. (Fee: None; Time: 15 Minutes; Person: Dental Aide/Dentist I/Dentist II, University Health Services)\n3. Submit for vital signs taking.\n   → 3. Conduct vital signs checking and evaluation of the client. (Fee: None; Time: 15 Minutes; Person: Dental Aide/Dentist I/Dentist II, University Health Services)\n4. Undergo dental examination.\n   → 4. Dentist conducts dental examination and performs diagnosis and treatment planning. (Fee: None; Time: 30 Minutes; Person: Dentist I/Dentist II, University Health Services)\n5. Referral (if needed).\n   → 5. Dentist explains the reason for referral to another specialist. (Fee: None; Time: 5 Minutes; Person: Dentist I/Dentist II, University Health Services)\n6. Receive medication and/or treatment.\n   → 6. Dentist performs dental treatment/s and/or gives medication/s. (Fee: None; Time: 40 Minutes; Person: Dentist I/Dentist II, University Health Services)\n7. Submit medical/dental certificate or diagnostic test results of the referred case (if referred).\n   → 7. Dentist receives, assesses and documents results. (Fee: None; Time: 5 Minutes; Person: Dentist I/Dentist II, University Health Services)\n8. Receive dental education.\n   → 8. Dentist conducts dental education and promotes dental health consciousness. (Fee: None; Time: 5 Minutes; Person: Dentist I/Dentist II, University Health Services)\n\n**Total:** Fee: None • Processing time: 2 Hours\n\n> Source: BU Citizen's Charter 2024 (1st Edition), BU Guinobatan Health Services, pp. 781-782. Fees, requirements, and processing times may be updated by the University — always verify with the responsible office before transacting."},{"c":"Citizen's Charter Services","q":"How do I avail a dental examination at the BU Guinobatan Health Services?","a":"**Who may avail:** BU Students\n**Classification / type of transaction:** Simple • G2C - Government to Citizen\n\n**Checklist of requirements (where to secure):**\n- For BU Students: Identification Card (1 Original copy) — Office of Student Affairs Services; Certificate of Registration (1 Original copy) — Registrar Office\n- For Incoming Freshmen/New Entrants: BUCET/SHAT/HISET/KAT Result (1 original or photocopy) — BU Admission; Long Brown Envelope (1 pc) — Educational Store; Individual Dental Health Record Form No. BU-F-UHS-21 (1 original copy) — Downloadable at BU Health Services Facebook Page\n\n**Steps, fees and processing time:**\n1. Present identification card or certificate of registration.\n   → 1. Validate the client status from the documents submitted. (Fee: None; Time: 5 Minutes; Person: Dental Aide, University Health Services)\n2. Submit for interview.\n   → 2. Conduct interview and check veracity of forms and documents. (Fee: None; Time: 15 Minutes; Person: Dental Aide/Dentist I/Dentist II, University Health Services)\n3. Submit for vital signs taking.\n   → 3. Conduct vital signs checking and evaluation of the client. (Fee: None; Time: 15 Minutes; Person: Dental Aide/Dentist I/Dentist II, University Health Services)\n4. Undergo dental examination.\n   → 4. Dentist conducts dental examination and performs diagnosis. (Fee: None; Time: 40 Minutes; Person: Dentist I/Dentist II, University Health Services)\n5. Receive medication and/or treatment (if with dental findings).\n   → 5. Dentist performs dental treatment/s, gives medication/s, or schedules the client for an appointment. (Fee: None; Time: 40 Minutes; Person: Dentist I/Dentist II, University Health Services)\n6. Receive dental certificate.\n   → 6. Release dental certificate. (Fee: None; Time: 5 Minutes; Person: Dental Aide, University Health Services)\n\n**Total:** Fee: None • Processing time: 2 Hours\n\n> Source: BU Citizen's Charter 2024 (1st Edition), BU Guinobatan Health Services, pp. 783-784. Fees, requirements, and processing times may be updated by the University — always verify with the responsible office before transacting."},{"c":"Citizen's Charter Services","q":"How do I avail medical consultation and treatment at the BU Guinobatan Health Services?","a":"**Who may avail:** BU Students; Non-BU Personnel\n**Classification / type of transaction:** Simple • G2C - Government to Citizen\n\n**Checklist of requirements (where to secure):**\n- Bicol University Student Identification Card (1 Original) — Office of Student Affairs Services\n- Student Certificate of Registration (1 Original Copy) — Registrar Office\n\n**Steps, fees and processing time:**\n1. Present identification card or certificate of registration.\n   → 1. Verify the patient status. (Fee: None; Time: 5 Minutes; Person: Nurse III, BU Guinobatan Health Services)\n2. Submit for interview and fill up medical patient record.\n   → 2. Conduct interview and review medical patient record for accuracy of information. (Fee: None; Time: 15 Minutes; Person: Nurse III, BU Guinobatan Health Services)\n3. Submit for checking of vital signs.\n   → 3. Take vital signs of the patient. (Fee: None; Time: 15 Minutes; Person: Nurse III, BU Guinobatan Health Services)\n4. Proceed to consultation area.\n   → 4. Medical Officer conducts examination, diagnosis and treatment. May perform minor procedure/s if necessary. (Fee: None; Time: 75 Minutes; Person: Medical Officer IV, University Health Services)\n5. Standby for monitoring and/or referral to specialized institution/s if needed.\n   → 5. Medical Officer monitors and explains the reason for referral (if needed). Emergency cases are referred within 30 minutes; non-emergency cases within 1 day. (Fee: None; Time: 15 Minutes; Person: Nurse III, BU Guinobatan Health Services / Medical Officer IV, University Health Services)\n6. Report to Nurse.\n   → 6. Carry out Medical Officer's order, dispense medicines as prescribed if available and conduct health education. (Fee: None; Time: 5 Minutes; Person: Nurse III, BU Guinobatan Health Services)\n7. Report to Nurse (Referred Patient).\n   → 7. Document clinical findings and release medical certificate if needed. (Fee: None; Time: 5 Minutes; Person: Nurse III, BU Guinobatan Health Services / Medical Officer IV, University Health Services)\n\n**Total:** Fee: None • Processing time: 2 Hours and 15 Minutes\n\n> Source: BU Citizen's Charter 2024 (1st Edition), BU Guinobatan Health Services, pp. 785-786. Fees, requirements, and processing times may be updated by the University — always verify with the responsible office before transacting."},{"c":"Citizen's Charter Services","q":"How do I avail a medical examination at the BU Guinobatan Health Services?","a":"**Who may avail:** BU Students; Non-BU Personnel\n**Classification / type of transaction:** Simple • G2C - Government to Citizen\n\n**Checklist of requirements (where to secure):**\n- For Students: Identification Card (1 original copy) — Office of Student Affairs Services; Certificate of Registration (1 original copy) — Registrar Office\n- For New Entrants: BUCET/SHAT/HISET/KAT Result (1 Original or Photocopy) — BU Admission Office; Chest X-ray (PA view) Result (1 Original copy) — Outside Diagnostic & Laboratory Facility; Complete Blood Count with Blood Typing Result (1 Original copy); Urinalysis Result (1 Original copy); Hepatitis B Screening Result (for Nursing, Food Service Mgt., Food Technology, Entrepreneurship, Fisheries, Medicine & Dentistry courses) (1 Original copy); Medical Clearance for students with comorbidities (1 Original copy) — Attending Physician; OB-Gynecologist Clearance for pregnant students (1 Original copy) — Attending Physician; Student Health Record (Form No.: BU-F-UHS-05) and Individual Dental Record (Form No.: BU-F-UHS-21) — Downloadable at BU Health Services Facebook Page; Ordinary Long Brown Envelope (1 piece) — Educational Store\n- Reinstatement from Sick Leave: Medical Certificate (1 original copy) — From the attending physician\n\n**Steps, fees and processing time:**\n1. Present identification card or certificate of registration.\n   → 1. Verify the client status. (Fee: None; Time: 5 Minutes; Person: Nurse III, BU Guinobatan Health Services)\n2. Submit for interview and present laboratory and diagnostic results.\n   → 2. Conduct interview and review documents presented. (Fee: None; Time: 15 Minutes; Person: Nurse III, BU Guinobatan Health Services)\n3. Submit for checking of vital signs.\n   → 3. Take vital signs of the client. (Fee: None; Time: 15 Minutes; Person: Nurse III, BU Guinobatan Health Services)\n4. Proceed to medical examination area.\n   → 4. Medical Officer conducts medical examination and treatment (if needed). (Fee: None; Time: 75 Minutes; Person: Medical Officer IV, University Health Services)\n5. Report to nurse (with findings).\n   → 5. Carry out Medical Officer's order, dispense medicines as prescribed if available and conduct health education. May issue medical certificate if needed. (Fee: None; Time: 5 Minutes; Person: Nurse III, BU Guinobatan Health Services)\n6. Report to nurse (without findings).\n   → 6. Release medical certificate. (Fee: None; Time: 5 Minutes; Person: Nurse III, BU Guinobatan Health Services)\n\n**Total:** Fee: None • Processing time: 2 Hours\n\n> Source: BU Citizen's Charter 2024 (1st Edition), BU Guinobatan Health Services, pp. 787-789. Fees, requirements, and processing times may be updated by the University — always verify with the responsible office before transacting."},{"c":"Citizen's Charter Services","q":"How do I borrow (charge) books at the BU Tabaco Library?","a":"**Who may avail:** BU Students\n**Classification / type of transaction:** Simple • G2C - Government to Citizen\n\n**Checklist of requirements (where to secure):**\n- Validated Certificate of Registration (1 Hardcopy or Electronic Copy) of Student — College Registrar\n- BU ID (1 Original) — Office of Student Services/Office of the College Student Affairs Coordinator\n- Student Borrower's Card (1 Original) — Library\n- Representative: Authorization Letter (1 Physical Letter Signed by the BU Student), the student's BU ID, validated Certificate of Registration and Borrower's Card — Requesting Party; Valid ID (1 Original) — Representative\n\n**Steps, fees and processing time:**\nFace-to-Face:\n1. Present the book/s to be borrowed along with the Certificate of Registration, BU ID and borrower's card.\n   → 1.1 Receive the books and verify patron borrowing requirements. (Fee: None; Time: 5 Minutes; Person: Librarian, Circulation Section, Tabaco Library)\n   → 1.2 Check the title, author & accession number of the book/s against the book card/s. (Fee: None; Time: 5 Minutes; Person: Librarian, Circulation Section, Tabaco Library)\n2. Accomplish the book card/s with date borrowed, name, college/department and signature.\n   → 2.1 Receive and check the book card/s and fill out the date due slip. (Fee: None; Time: 5 Minutes; Person: Librarian, Circulation Section, Tabaco Library)\n   → 2.2 Fill-out the borrower's card. (Fee: None; Time: 5 Minutes; Person: Librarian, Circulation Section, Tabaco Library)\n3. Fill-out and sign the Log Book.\n   → 3. Check-out in the BU-iLib System (if applicable) and check correctness of information in the Log Book. (Fee: None; Time: 10 Minutes; Person: Librarian, Circulation Section, Tabaco Library)\n4. Receive the book/s and borrower's card.\n   → 4. Release the book/s borrowed and file the book card/s. (Fee: None; Time: 5 Minutes; Person: Librarian, Circulation Section, Tabaco Library)\n\n**Total (Face-to-Face):** Fee: None • Processing time: 35 Minutes\n\nOnline (book reservation):\n1. Fill out the reservation form: https://form.jotform.com/12stephen26/BUTClibraryRISAform\n   → 1. Check if the client meets the requirements and if the requested material/s are available. (Fee: None; Time: 2 Days; Person: Librarian, Reference and Information Services, Tabaco Library)\n2. Receive confirmation message.\n   → 2. Send confirmation of availability and inform the client of the next steps. (Fee: None; Time: 35 Minutes; Person: Librarian, Reference and Information Services, Tabaco Library)\n3. Proceed to the library with the Certificate of Registration, BU ID and borrower's card.\n   → 3. Check the borrowing requirements and hand-in the book card/s. (Fee: None; Time: 5 Minutes; Person: Librarian, Circulation Section, Tabaco Library)\n4. Accomplish the book card/s and sign the Log Book; receive the book/s.\n   → 4-6. Fill the date due slip and borrower's card, check-out in the BU-iLib System, release the book/s. (Fee: None; Time: 25 Minutes; Person: Librarian, Circulation Section, Tabaco Library)\n\n**Total (Online):** Fee: None • Processing time: 2 Days, 1 Hour, 5 Minutes\n\n> Source: BU Citizen's Charter 2024 (1st Edition), BU Tabaco Library Services, pp. 878-881. Fees, requirements, and processing times may be updated by the University — always verify with the responsible office before transacting."},{"c":"Citizen's Charter Services","q":"How do I return (discharge) books at the BU Tabaco Library?","a":"**Who may avail:** BU Students\n**Classification / type of transaction:** Simple • G2C - Government to Citizen\nTo avoid paying overdue fines, borrowed books must be returned on time.\n\n**Checklist of requirements (where to secure):**\n- Book/s for return — Requesting Party\n- Student Borrower's Card (1 Original) — Library\n\n**Steps, fees and processing time:**\n1. Present book(s) for return/check-in and borrower's card.\n   → 1. Receive the borrower's card and book/s for return/check-in and inspect for damages. (Fee: None; Time: 5 Minutes; Person: Librarian, Circulation Section, Tabaco Library)\n2. Sign-in on the returned column of the Log Book.\n   → 2. Check-in in the BU-iLib system (if applicable). Indicate the date returned in the borrower's card. If OVERDUE, see the procedure for Payment of Fines. (Fee: None; Time: 6 Minutes; Person: Librarian, Circulation Section, Tabaco Library)\n3. Receive borrower's card.\n   → 3. Insert book card/s and check Log Book entries. Release borrower's card. (Fee: None; Time: 4 Minutes; Person: Librarian, Circulation Section, Tabaco Library)\n\n**Total:** Fee: None • Processing time: 15 Minutes\n\n> Source: BU Citizen's Charter 2024 (1st Edition), BU Tabaco Library Services, pp. 882-883. Fees, requirements, and processing times may be updated by the University — always verify with the responsible office before transacting."},{"c":"Citizen's Charter Services","q":"How do I pay overdue fines at the BU Tabaco Library?","a":"**Who may avail:** BU Students\n**Classification / type of transaction:** Simple • G2C - Government to Citizen\nIf a book is returned beyond the set due date, fines must be paid.\n\n**Checklist of requirements (where to secure):**\n- Order of Payment (1 Original or Electronic Copy) — Library\n- Official Receipt (1 Original Copy) — University/College Cashier\n\n**Steps, fees and processing time:**\nFines below PHP 50.00:\n1. Pay fine and fill-out the Overdue Log Sheet.\n   → 1. Receive the payment and check information in the Overdue Log Sheet. (Fee: See Table of Fines; Time: 5 Minutes; Person: Librarian, Circulation Section, Tabaco Library)\n2. Verify clearance in the OSCS (if applicable).\n   → 2. Clear the accountability. (Fee: None; Time: 3 Minutes; Person: Librarian, Circulation Section, Tabaco Library)\n**Total:** Fee: No. of book/s x Amount of Fine • Processing time: 8 Minutes\n\nFines above PHP 50.00:\n1. Receive the Order of Payment.\n   → 1. Issue Order of Payment. (Fee: See Table of Fines; Time: 3 Minutes; Person: Librarian, Circulation Section, Tabaco Library)\n2. Present the Order of Payment to the Cashier and pay fine.\n   → 2. Process payment based on Order of Payment and issue Official Receipt. (Fee: See Table of Fines; Time: 6 Minutes; Person: Cashier, University/College Cashier's Office)\n3. Go back to the library and present the Official Receipt.\n   → 3. Receive the Official Receipt and indicate the OR number and date in the Overdue Fines Log Sheet. (Fee: None; Time: 3 Minutes; Person: Librarian, Circulation Section, Tabaco Library)\n4. Retrieve original copy of Official Receipt. Verify clearance in the OSCS (if applicable).\n   → 4. Clear the accountability. (Fee: None; Time: 3 Minutes; Person: Librarian, Circulation Section, Tabaco Library)\n**Total:** Fee: No. of book/s x Amount of Fine • Processing time: 15 Minutes\n\n**Table of Fines (per book):** Circulation books — Elem/HS/SHS PHP 1.00/day; CCT/Undergraduate PHP 2.00/hour or PHP 16.00/day; Graduate Student/Law/Medicine PHP 5.00/hour or PHP 40.00/day. Fiction books — PHP 1.00/day (Elem/HS/SHS); PHP 5.00/day (CCT/Undergraduate); PHP 5.00/day (Graduate/Law/Medicine).\n\n> Source: BU Citizen's Charter 2024 (1st Edition), BU Tabaco Library Services, pp. 883-885. Fees, requirements, and processing times may be updated by the University — always verify with the responsible office before transacting."},{"c":"Citizen's Charter Services","q":"How do I pay for or replace a lost book at the BU Tabaco Library?","a":"**Who may avail:** BU Students\n**Classification / type of transaction:** Simple • G2C - Government to Citizen\nLost books must be settled before a library clearance can be issued. The client can either replace the book (same title, author, copyright, or latest edition if already out-of-print) or pay the corresponding fee.\n\n**Checklist of requirements (where to secure):**\n- Formal declaration of lost book/s (1 Physical Letter Signed by the student) — Requesting Party\n- Certification from the Barangay (if due to natural/man-made disaster) — Requesting Party's Barangay Secretary\n- Order of Payment (1 Original or Electronic Copy) — Library\n- Official Receipt (1 Original Copy) — University/College Cashier\n\n**Steps, fees and processing time:**\nFor Payment of the Cost of Book:\n1. Present formal declaration of lost book/s.\n   → 1.1 Receive formal declaration and retrieve book card/s. (Fee: None; Time: 5 Minutes; Person: Librarian, Circulation Section, Tabaco Library)\n   → 1.2 Check the record for cost of book/s. (Fee: Acquisition price/assigned amount if undetermined; Time: 15 Minutes; Person: Librarian, Circulation Section/Technical Section, Tabaco Library)\n2. Receive Order of Payment.\n   → 2. Issue Order of Payment. (Fee: Acquisition price/assigned amount if undetermined; Time: 5 Minutes; Person: Librarian, Circulation Section/Technical Section, Tabaco Library)\n3. Pay the assessed amount.\n   → 3. Process payment based on Order of Payment and issue Official Receipt. (Fee: Amount indicated in the Order of Payment; Time: 6 Minutes; Person: Cashier, University/College Cashier's Office)\n4. Present the Official Receipt to the library personnel-in-charge.\n   → 4. Photocopy Official Receipt. Write, \"Declared Lost & Paid with OR# and date paid\" in the book card/s. (Fee: None; Time: 5 Minutes; Person: Librarian, Circulation Section, Tabaco Library)\n5. Retrieve original copy of Official Receipt and verify clearance in the OSCS (if applicable).\n   → 5.1 Clear the accountability. (Fee: None; Time: 5 Minutes; Person: Librarian, Circulation Section, Tabaco Library)\n   → 5.2 Record in the accession record and BU-iLib (if applicable). (Fee: None; Time: 1 Hour; Person: Librarian, Technical Section, Tabaco Library)\n**Total:** Fee: Acquisition price/assigned amount if undetermined • Processing time: 1 Hour, 41 Minutes\n\nFor Replacement:\n1. Present formal declaration of lost book/s.\n   → 1. Receive formal declaration, retrieve book card/s and verify information in the records. (Fee: None; Time: 15 Minutes; Person: Librarian, Circulation Section, Tabaco Library)\n2. Receive the written details of the book/s for replacement.\n   → 2. Give the full bibliographic information of the book/s. (Fee: None; Time: 5 Minutes; Person: Librarian, Circulation Section, Tabaco Library)\n3. Hand-in the book/s.\n   → 3. Check the title, author, copyright/edition of the book/s if the same with the lost book/s. (Fee: None; Time: 5 Minutes; Person: Librarian, Circulation Section, Tabaco Library)\n4. Verify clearance in the OSCS (if applicable).\n   → 4.1 Clear the accountability in the records. (Fee: None; Time: 5 Minutes; Person: Librarian, Circulation Section, Tabaco Library)\n   → 4.2 Prepare the new book/s for mechanical processing/shelving and update the accession record/BU-iLib. (Fee: None; Time: 1 Day; Person: Librarian, Tabaco Library)\n**Total:** Fee: None • Processing time: 1 Day, 30 Minutes\n\n> Source: BU Citizen's Charter 2024 (1st Edition), BU Tabaco Library Services, pp. 886-888. Fees, requirements, and processing times may be updated by the University — always verify with the responsible office before transacting."},{"c":"Citizen's Charter Services","q":"How do I get my student clearance signed by the BU Tabaco Library?","a":"**Who may avail:** BU Students\n**Classification / type of transaction:** Simple • G2C - Government to Citizen\nAccountabilities must be settled before a clearance can be issued for graduation, honorable dismissal, transfer, shifting, or when requesting school credentials.\n\n**Checklist of requirements (where to secure):**\n- Clearance form (1 Original) — College Registrar/Office of the Department Chairperson\n\n**Steps, fees and processing time:**\nWalk-in:\n1. Present the clearance form.\n   → 1. Check the List of Accountabilities or Online Student Clearance System. (Fee: None; Time: 5 Minutes; Person: Librarian, Reference and Information Services, Tabaco Library)\n2. Fill out the Log Book.\n   → 2. Sign the clearance if student has no accountability. IF WITH ACCOUNTABILITY, refer the student to process for \"Discharging (Returning) of Books\", \"Payment for Fines\" or \"Payment/Replacement for Lost Books\". (Fee: None; Time: 5 Minutes; Person: Librarians & University Librarian, Tabaco Library)\n3. Receive the signed clearance.\n   → 3. Release the signed clearance. (Fee: None; Time: 1 Minute; Person: Librarian, Reference and Information Services, Tabaco Library)\n**Total (Walk-in):** Fee: None • Processing time: 11 Minutes\n\nOnline Clearance:\n1. Send the request through the email of the unit/college library and attach a pdf copy of the clearance form. If with accountability, settle accountability first.\n   → 1. Respond to email. If with accountability, refer the student to the discharging/fines/lost-book processes. (Fee: None; Time: 2 Days; Person: Librarian, Reference and Information Services, Tabaco Library)\n2. Receive the signed clearance form in your e-mail.\n   → 2.1 Send the signed clearance form to the client's email. (Fee: None; Time: 30 Minutes; Person: Librarian, Reference and Information Services, Tabaco Library)\n   → 2.2 Record the transaction in the logbook or monitoring sheet for online services. (Fee: None; Time: 10 Minutes; Person: Librarian, Reference and Information Services, Tabaco Library)\n**Total (Online):** Fee: None • Processing time: 2 Days, 40 Minutes\n\nLibrary clearance e-mails: University Library: bu-library@bicol-u.edu.ph • East Campus: ec-library@bicol-u.edu.ph • Law: law-library@bicol-u.edu.ph • Health Sciences: hs-library@bicol-u.edu.ph • Guinobatan: caf-library@bicol-u.edu.ph • Gubat: gc-library@bicol-u.edu.ph • Polangui: pc-library@bicol-u.edu.ph • Tabaco: tc-library@bicol-u.edu.ph\n\n> Source: BU Citizen's Charter 2024 (1st Edition), BU Tabaco Library Services, pp. 891-893. Fees, requirements, and processing times may be updated by the University — always verify with the responsible office before transacting."},{"c":"Citizen's Charter Services","q":"How do I avail dental consultation and treatment at the BU Tabaco Health Services?","a":"**Who may avail:** BU Students\n**Classification / type of transaction:** Simple • G2C - Government to Citizen\n\n**Checklist of requirements (where to secure):**\n- Identification Card (1 Original Copy); or Certificate of Registration (1 Original Copy) — Office of Student Affairs Services / Registrar Office\n\n**Steps, fees and processing time:**\n1. Present identification card or certificate of registration.\n   → 1. Validate the client status from the documents submitted. (Fee: None; Time: 5 Minutes; Person: Dental Aide, University Health Services)\n2. Submit for interview.\n   → 2. Conduct interview and check veracity of forms and documents. (Fee: None; Time: 15 Minutes; Person: Dental Aide/Dentist I/Dentist II, University Health Services)\n3. Submit for vital signs taking.\n   → 3. Conduct vital signs checking and evaluation of the client. (Fee: None; Time: 15 Minutes; Person: Dental Aide/Dentist I/Dentist II, University Health Services)\n4. Undergo dental examination.\n   → 4. Dentist conducts dental examination and performs diagnosis and treatment planning. (Fee: None; Time: 30 Minutes; Person: Dentist I/Dentist II, University Health Services)\n5. Referral (if needed).\n   → 5. Dentist explains the reason for referral to another specialist. (Fee: None; Time: 5 Minutes; Person: Dentist I/Dentist II, University Health Services)\n6. Receive medication and/or treatment.\n   → 6. Dentist performs dental treatment/s and/or gives medication/s. (Fee: None; Time: 40 Minutes; Person: Dentist I/Dentist II, University Health Services)\n7. Submit medical/dental certificate or diagnostic test results of the referred case (if referred).\n   → 7. Dentist receives, assesses and documents results. (Fee: None; Time: 5 Minutes; Person: Dentist I/Dentist II, University Health Services)\n8. Receive dental education.\n   → 8. Dentist conducts dental education and promotes dental health consciousness. (Fee: None; Time: 5 Minutes; Person: Dentist I/Dentist II, University Health Services)\n\n**Total:** Fee: None • Processing time: 2 Hours\n\n> Source: BU Citizen's Charter 2024 (1st Edition), BU Tabaco Health Services, pp. 869-870. Fees, requirements, and processing times may be updated by the University — always verify with the responsible office before transacting."},{"c":"Citizen's Charter Services","q":"How do I avail a dental examination at the BU Tabaco Health Services?","a":"**Who may avail:** BU Students\n**Classification / type of transaction:** Simple • G2C - Government to Citizen\n\n**Checklist of requirements (where to secure):**\n- For BU Students: Identification Card (1 Original copy) — Office of Student Affairs Services; Certificate of Registration (1 Original copy) — Registrar Office\n- For Incoming Freshmen/New Entrants: BUCET/SHAT/HISET/KAT Result (1 original or photocopy) — BU Admission; Long Brown Envelope (1 pc) — Educational Store; Individual Dental Health Record Form No. BU-F-UHS-21 (1 original copy) — Downloadable at BU Health Services Facebook Page\n\n**Steps, fees and processing time:**\n1. Present identification card or certificate of registration.\n   → 1. Validate the client status from the documents submitted. (Fee: None; Time: 5 Minutes; Person: Dental Aide, University Health Services)\n2. Submit for interview.\n   → 2. Conduct interview and check veracity of forms and documents. (Fee: None; Time: 15 Minutes; Person: Dental Aide/Dentist I/Dentist II, University Health Services)\n3. Submit for vital signs taking.\n   → 3. Conduct vital signs checking and evaluation of the client. (Fee: None; Time: 15 Minutes; Person: Dental Aide/Dentist I/Dentist II, University Health Services)\n4. Undergo dental examination.\n   → 4. Dentist conducts dental examination and performs diagnosis. (Fee: None; Time: 40 Minutes; Person: Dentist I/Dentist II, University Health Services)\n5. Receive medication and/or treatment (if with dental findings).\n   → 5. Dentist performs dental treatment/s, gives medication/s, or schedules the client for an appointment. (Fee: None; Time: 40 Minutes; Person: Dentist I/Dentist II, University Health Services)\n6. Receive dental certificate.\n   → 6. Release dental certificate. (Fee: None; Time: 5 Minutes; Person: Dental Aide, University Health Services)\n\n**Total:** Fee: None • Processing time: 2 Hours\n\n> Source: BU Citizen's Charter 2024 (1st Edition), BU Tabaco Health Services, pp. 871-872. Fees, requirements, and processing times may be updated by the University — always verify with the responsible office before transacting."},{"c":"Citizen's Charter Services","q":"How do I avail medical consultation and treatment at the BU Tabaco Health Services?","a":"**Who may avail:** BU Students; Non-BU Personnel\n**Classification / type of transaction:** Simple • G2C - Government to Citizen\n\n**Checklist of requirements (where to secure):**\n- Bicol University Student Identification Card (1 Original) — Office of Student Affairs Services\n- Student Certificate of Registration (1 Original Copy) — Registrar Office\n\n**Steps, fees and processing time:**\n1. Present identification card or
