to admission to the College, subject to the applicable admission requirements."},{"c":"Conversations — College of Medicine (BUCM)","q":"My NMAT result expired before enrollment. Can I still use it?","a":"If the result is considered expired under the applicable admission requirements, the College may require a valid **NMAT** result. Applicants with this concern should raise it during the screening or interview. Retaking the NMAT may also strengthen an applicant's credentials and ensure that the result remains valid for the intended admission cycle."},{"c":"Conversations — College of Medicine (BUCM)","q":"I submitted an updated NMAT result after the deadline. Will it automatically be included in my evaluation?","a":"Not necessarily. Late-submitted documents may not be included in the original evaluation. Applicants may present the updated result during the screening or interview if they are instructed to do so, but its consideration remains subject to the College's decision."},{"c":"Conversations — College of Medicine (BUCM)","q":"How are applicants evaluated for BUCM?","a":"BUCM conducts a competitive admissions process that considers factors such as academic records, **NMAT** performance, screening examination results, interview performance, and other admission criteria established by the College."},{"c":"Conversations — College of Medicine (BUCM)","q":"What does Qualified mean for BUCM?","a":"It means the applicant has been selected for admission based on the College's evaluation and available admission slots."},{"c":"Conversations — College of Medicine (BUCM)","q":"What does Waitlisted mean for BUCM?","a":"A waitlisted applicant remains under consideration. The applicant may be offered admission if slots become available due to non-confirmation or withdrawal of initially qualified applicants."},{"c":"Conversations — College of Medicine (BUCM)","q":"What does Below Quota or BQ mean?","a":"A Below Quota applicant is not among the applicants initially offered admission because of the limited number of available slots and competitive ranking. However, the applicant may still be considered through the BQ screening process if slots become available."},{"c":"Conversations — College of Medicine (BUCM)","q":"Does being BQ mean I am rejected?","a":"Not necessarily. BQ means the applicant was not initially offered admission due to the limited number of slots. Eligible BQ applicants may undergo additional screening for possible admission."},{"c":"Conversations — College of Medicine (BUCM)","q":"Is there a guarantee that BQ applicants will be admitted?","a":"No. BQ screening provides an opportunity for further consideration, but it does not guarantee admission."},{"c":"Conversations — College of Medicine (BUCM)","q":"Who can participate in the BQ screening?","a":"Interested BQ applicants who meet the requirements and confirm their participation within the prescribed period may participate in the screening process."},{"c":"Conversations — College of Medicine (BUCM)","q":"What should I bring to the BQ screening?","a":"Applicants should bring one valid ID and the original copies of the admission requirements previously submitted online. If applicable, applicants may also bring their portfolio or other relevant supporting documents."},{"c":"Conversations — College of Medicine (BUCM)","q":"Where is the BQ screening held?","a":"The screening is held at the Bicol University College of Medicine, Health Sciences Building, Sagpon, Daraga, Albay 4501."},{"c":"Conversations — College of Medicine (BUCM)","q":"Will all BQ applicants undergo an interview?","a":"Yes. All applicants participating in the BQ screening process will undergo a panel interview. The interview may be conducted on the same day as the screening examination or on the following day, depending on the schedule assigned by the Admissions Committee."},{"c":"Conversations — College of Medicine (BUCM)","q":"When will BQ final results be released?","a":"The final admission result for applicants who underwent the BQ screening is released according to the schedule announced by the College."},{"c":"Conversations — College of Medicine (BUCM)","q":"I cannot attend the scheduled BQ screening because of travel problems. Can I request another schedule?","a":"Applicants may submit their request and explain their circumstances. The request will be referred to the appropriate College authority for consideration. Approval is not guaranteed."},{"c":"Conversations — College of Medicine (BUCM)","q":"Where can I find my Notice of Result for BUCM?","a":"Applicants should check the email address used during the application process. If a Notice of Result was previously issued with a BQ remark, the same Notice of Result may be used together with the subsequent admission offer, when applicable."},{"c":"Conversations — College of Medicine (BUCM)","q":"What are the enrollment requirements for incoming first-year medical students?","a":"The general enrollment requirements include:\n\n• Printed copy of the electronically signed Notice of Result.\n• Official Transcript of Records with Graduated remark and required **GWA**.\n• Certificate of GWA if the GWA is not reflected in the OTR.\n• Official **NMAT** Result meeting the minimum requirement.\n• Two clear photocopies of PSA Birth Certificate.\n• Two clear photocopies of PSA Marriage Certificate for married women.\n• Medical Certificate issued by BU Health Services.\n• Two recent 2x2 pictures with white background and name tag.\n• Two recent 1x1 pictures with white background and name tag.\n• Long brown paper envelope.\n• Long green hard non-expandable folder.\n• Long white hard non-expandable folder.\n• Long white mailing envelope with window.\n• Php 60.00 worth of mailing stamps.\n• Duly accomplished Certificate of Undertaking.\n• Duly accomplished Student Profile.\n\nApplicants should always follow the latest enrollment instructions issued by BUCM."},{"c":"Conversations — College of Medicine (BUCM)","q":"My TOR does not yet have the Graduated remark. Can I still enroll?","a":"This concern should be raised with the BUCM Registrar. The College Registrar has the authority to determine whether a particular document or temporary certification can be accepted."},{"c":"Conversations — College of Medicine (BUCM)","q":"What happens if I fail to complete my enrollment requirements?","a":"Failure to submit the complete enrollment requirements or failure to appear during the designated enrollment period may result in forfeiture of the admission slot."},{"c":"Conversations — College of Medicine (BUCM)","q":"What medical requirements should I prepare for BUCM?","a":"The medical requirements may include:\n\n• Complete Blood Count (CBC).\n• Blood Typing.\n• Urinalysis.\n• Chest X-ray PA View.\n• Hepatitis B Surface Antigen (HBsAg).\n• COVID-19 vaccination card if vaccinated.\n• Medical clearance from the attending physician when applicable.\n• Health Form from BU Health Services."},{"c":"Conversations — College of Medicine (BUCM)","q":"Can I walk in at BU Health Services for my Medical Certificate?","a":"Applicants should check their iBU Portal for the available appointment schedule and follow the instructions of BU Health Services."},{"c":"Conversations — College of Medicine (BUCM)","q":"Can I have my laboratory tests done outside BU?","a":"Yes. Required laboratory tests may be completed through an appropriate laboratory facility. The BU Health Services will assess the submitted medical documents before issuing the University's Medical Certificate."},{"c":"Conversations — College of Medicine (BUCM)","q":"Do BQ applicants have to complete the medical requirements before the screening?","a":"No. It is only recommended for applicants who want to prepare ahead in case they are eventually offered admission. It is optional and is not compulsory for all BQ applicants. Processing medical requirements does not guarantee admission or a slot."},{"c":"Conversations — College of Medicine (BUCM)","q":"What is the deadline for the CHED MSRS application?","a":"For the 2026 MSRS application cycle discussed in these advisories, the deadline is July 13, 2026. Applicants should always verify the latest deadline directly with CHED."},{"c":"Conversations — College of Medicine (BUCM)","q":"I am already qualified for BUCM. Can I apply for CHED MSRS?","a":"Yes, qualified incoming first-year medical students may process their CHED MSRS application if they meet CHED's eligibility and documentary requirements."},{"c":"Conversations — College of Medicine (BUCM)","q":"I am waitlisted or BQ and my admission result is not yet final. Can I still apply for MSRS?","a":"Yes. Applicants whose BUCM admission is still ongoing may proceed with the online MSRS application within the CHED deadline. For proof of admission, you may upload a letter stating that your admission process is still ongoing and indicating when the admission result is expected. Proof of admission may follow once the applicant's admission status is finalized, subject to CHED's instructions."},{"c":"Conversations — College of Medicine (BUCM)","q":"How much is the BUCM application fee?","a":"For the SY 2026-2027 application cycle, the application fee was Php 1,500.00. The fee is non-refundable."},{"c":"Conversations — College of Medicine (BUCM)","q":"Does BUCM accept transferees from other medical schools?","a":"Applicants interested in transferring from another medical school should check the specific transfer admission guidelines for the applicable academic year. Availability and acceptance are subject to the College's policies and available slots."},{"c":"Conversations — College of Medicine (BUCM)","q":"Can I appeal if I am not admitted to BUCM?","a":"Applicants may submit an appeal or request for reconsideration when permitted by the College. However, submission of an appeal does not guarantee reconsideration or admission. Requests requiring an exception are subject to the appropriate authority, particularly the Dean of the College of Medicine."},{"c":"Conversations — College of Law (BUCLET)","q":"When is the application period for the BU College of Law?","a":"The application period is from April 7 to May 24, 2026. The submission of documentary requirements is until May 30, 2026."},{"c":"Conversations — College of Law (BUCLET)","q":"Where can I apply for the BU College of Law?","a":"You may register through the official iBU admissions portal. After registration, please follow the instructions provided in your admissions dashboard."},{"c":"Conversations — College of Law (BUCLET)","q":"Do I need to submit my requirements physically?","a":"No. Physical submission of requirements is not allowed. Applicants should follow the online submission procedure indicated in the iBU admissions dashboard, including the designated email or upload facility, as applicable."},{"c":"Conversations — College of Law (BUCLET)","q":"What are the general admission requirements for the College of Law?","a":"The general requirements are:\n\n• Fully accomplished Application Form.\n• Accomplished Data Privacy Consent Form.\n• Photocopy of the Transcript of Records or a Certification from the Registrar indicating the **GWA** if the GWA is not reflected in the TOR.\n• Photocopy of the NSO or PSA Birth Certificate.\n• Two recent 2x2 ID pictures with white background.\n• Original Receipt as proof of payment of the Php 750.00 application or entrance examination fee."},{"c":"Conversations — College of Law (BUCLET)","q":"What GWA is required to apply for Law?","a":"Applicants must have a **GWA** of 2.4 or 85 percent, or its equivalent, in their pre-law degree."},{"c":"Conversations — College of Law (BUCLET)","q":"How much is the application or entrance examination fee for Law?","a":"The required payment is Php 750.00. Payment must be made through the University Cashier. Online payment options such as GCash and bank transfer are not available at this time."},{"c":"Conversations — College of Law (BUCLET)","q":"Can someone else pay the application fee for me?","a":"Yes. The applicant does not have to personally make the payment. You may assign a representative to settle the application fee on your behalf."},{"c":"Conversations — College of Law (BUCLET)","q":"When will I receive my BU College of Law Test Permit?","a":"The Test Permit will be issued after your application and requirements have been properly processed. Please monitor the email address associated with your application and your iBU admissions dashboard."},{"c":"Conversations — College of Law (BUCLET)","q":"When is the BU College of Law Entrance Test?","a":"The examination dates will be announced separately. Please keep posted through the official Bicol University channels and your iBU admissions dashboard."},{"c":"Conversations — College of Law (BUCLET)","q":"What are the qualifications for admission to the College of Law?","a":"Applicants must have a **GWA** of 2.4 or 85 percent or its equivalent in their pre-law degree, pass the Law Entrance Examination administered by the BU Admissions Office, and pass the panel interview conducted by the College of Law."},{"c":"Conversations — College of Law (BUCLET)","q":"Is passing the entrance examination enough to be admitted to Law?","a":"Not necessarily. Passing the entrance examination is one part of the admission process. Applicants must also pass the panel interview and satisfy the other admission requirements."},{"c":"Conversations — College of Law (BUCLET)","q":"Where can I check my admission result for Law?","a":"Please check your iBU admissions portal or dashboard and other official Bicol University admission announcements. The most recently issued result and the result reflected in the iBU Portal should be treated as the final and official admission status."},{"c":"Conversations — College of Law (BUCLET)","q":"I cannot upload my 2x2 picture or generate my form. What should I do?","a":"Please try uploading the required photo again after reloading the portal. If the issue persists, report the concern to the Admissions Office and provide a screenshot of the error. Do not create another application immediately."},{"c":"Conversations — Important Reminders","q":"What should I remember before submitting my requirements?","a":"Before your appointment, make sure that:\n\n• Your application form contains your complete and correct legal name.\n• Your application form is printed back-to-back on 8.5 x 13-inch long bond paper.\n• The Grades 9 to 11 portion is properly accomplished by the authorized school personnel.\n• All required signatures and school dry seals are present.\n• Your financial documents match your parents' or guardian's actual circumstances.\n• Your documents are clear and readable.\n• You bring all required documents according to your checklist.\n• You follow your scheduled appointment.\n• You regularly check your **iBU Admissions Portal** for updates.\n• You rely only on official Bicol University announcements and portal information for schedules and deadlines."},{"c":"Conversations — Important Reminders","q":"What if my situation is not covered by these FAQs?","a":"If your family or documentary situation is unusual, do not submit a document that does not accurately represent your circumstances just to complete the checklist. Instead, provide the most appropriate available supporting documents and a clear explanation of your situation. The Admissions Office may advise you regarding any additional document needed for verification."},{"c":"Conversations — Important Reminders","q":"What is the quick document guide for BUCET?","a":"• **Both parents working:** 2025 ITR of both parents.\n• **One parent working:** Working parent's 2025 ITR plus non-working parent's CTE.\n• **Both parents not working:** CTE of both parents.\n• **Parent is an OFW:** Latest employment contract or official employment document with salary.\n• **Parent is a 4Ps member:** **Oath of Commitment**.\n• **Parent is retired:** CTE.\n• **Parent is deceased:** Death Certificate.\n• **Living with a legal guardian:** **Affidavit of Guardianship** plus guardian's applicable financial document.\n• **Parent under substituted filing:** 2025 **BIR Form 2316**.\n• **PWD applicant:** Valid PWD ID.\n• **Solo parent:** Valid and unexpired **Solo Parent ID**.\n• **Indigenous Peoples applicant:** NCIP Certificate.\n• **ALS graduate:** ALS Certificate of Rating plus Certificate of Completion."},{"c":"Conversations — Income, ITR & CTE Requirements","q":"What should I submit for my parents' employment/income status if my father is a carpenter and my mother is a housewife? And do I still need the 4Ps Oath of Commitment if we are no longer active beneficiaries?","a":"For your parents' financial documents:\n\n• **Father (carpenter):** if he is not required to file an ITR, he should submit the applicable **Certificate of Tax Exemption (CTE)**.\n• **Mother (housewife, no income):** she should likewise submit the applicable CTE, if indicated in your requirements checklist.\n\n**4Ps Oath of Commitment:** if your family is no longer an active 4Ps beneficiary, **do not use the 4Ps Oath of Commitment in place of the required CTE** — submit the applicable CTEs for your parents instead.\n\nFollow the documents indicated in your **Admissions Requirements Checklist** and make sure all applicable requirements are complete before your scheduled submission."},{"c":"Conversations — Application Form & Personal Information","q":"How can I correct wrong entries in my BUCET application form (e.g., \"first in my family to study in college\" or the monthly income bracket)? Will my application or appointment be cancelled?","a":"For corrections to information in your BUCET application, **do not cancel your current application or appointment**.\n\n• **If the iBU Admissions Portal still allows editing:** make the necessary corrections there, then **download the application form again** to get the updated copy.\n• **If the fields can no longer be edited:** inform the **Admissions Office** during your submission of requirements. The correction may be noted and verified against your supporting documents."},{"c":"AY 2026–2027 Updates","q":"When are AY 2026–2027 enrollment periods?","a":"**Latest calendar dates:**\n- Qualified first-year: June 29–30, 2026; continues July 1\n- Waitlisted: July 2–3, 2026\n- Below-Quota qualifiers: July 13–17, 2026\n- Regular upperclass: July 6–24, 2026\n- Irregular, shifters, transferees, second coursers and returning students: July 20–31, 2026\n- Graduate School: July 20–31, 2026 (including Saturdays); last registration August 1\n- Second Semester (all students): December 14–17, 2026\n- Midyear: May 10–15, 2027.\n\n**Source:** Approved University Calendar, AY 2026–2027."},{"c":"AY 2026–2027 Updates","q":"When are medical and dental exams and BQ/transferee screening?","a":"Medical and dental exams: June 1–26, 2026 for Qualified and Waitlisted first-years; July 9–10 for BQ qualifiers and transferees. Screening for Below-Quota applicants, transferees and shifters: July 6–7, 2026.\n\n**Source:** Approved University Calendar, AY 2026–2027."},{"c":"AY 2026–2027 Updates","q":"What are the class dates, examination dates and break for AY 2026–2027?","a":"**First Semester:** classes begin August 4, 2026; tertiary ends November 28 (elementary/secondary end December 17). Midterms are September 28–October 3; finals November 23–28.\n\n**Christmas Break:** December 18–31, 2026; classes resume January 4, 2027.\n\n**Second Semester:** January 4–April 30, 2027; midterms March 1–6; finals April 24–30.\n\n**Midyear:** May 17–June 26, 2027; midterms June 3–5; finals June 24–26.\n\n**Source:** Approved University Calendar, AY 2026–2027."},{"c":"AY 2026–2027 Updates","q":"When are faculty grade submission deadlines?","a":"First Semester: December 12, 2026. Second Semester: May 14, 2027. Midyear Term (2026): August 1, 2026.\n\n**Source:** Approved University Calendar, AY 2026–2027."},{"c":"AY 2026–2027 Updates","q":"Are there classes on weekends and on the EDSA Anniversary?","a":"Academic units may schedule Saturday and/or Sunday classes when announced. February 25, 2027 (EDSA People Power Anniversary) is a **Special Working Day**; classes and offices generally remain open unless BU announces otherwise.\n\n**Source:** University-Wide Student Orientation 2026 and Approved University Calendar."},{"c":"AY 2026–2027 Updates","q":"What is SF10 and why must I follow it up?","a":"SF10 (formerly Form 137) is your permanent senior-high-school academic record. BU requests it directly from the previous school, but students should follow up with that school. **If BU does not receive the official SF10 within the first semester, the student cannot enroll in the second semester** until admission records are complete.\n\n**Source:** Orientation 2026 — Office of the University Registrar."},{"c":"AY 2026–2027 Updates","q":"Can a graduating student take an overload?","a":"Yes. A student with only one or two subjects left may take an overload up to a **maximum of 33 units**, subject to University implementing policies.\n\n**Source:** Orientation 2026 / Student Handbook."},{"c":"AY 2026–2027 Updates","q":"What are the current academic probation, dismissal and permanent-disqualification rules?","a":"One failed subject: next-term load is reduced by one subject or equivalent units. Two failed subjects: probation next semester with at most 75% of the regular load. Three or more failures: academic dismissal; third-, fourth- and fifth-year students may petition the Academic Petitions Committee if it is a first-time occurrence, with a maximum 9-unit load if re-enrolled.\n\nPermanent disqualification from any BU unit may result from poor scholarship under dismissal rules, complete failure of all subjects in a term, or disciplinary dismissal.\n\n**Source:** Orientation 2026 / Student Handbook."},{"c":"AY 2026–2027 Updates","q":"What are the current Latin Honors brackets?","a":"**Summa Cum Laude:** 1.00–1.25. **Magna Cum Laude:** above 1.25–1.45. **Cum Laude:** above 1.45–1.75. GWA alone is not enough: residency, prescribed load and no disqualifying grades are also required.\n\n**Source:** Orientation 2026."},{"c":"AY 2026–2027 Updates","q":"How long does Free Higher Education cover my studies?","a":"Free Higher Education coverage includes the prescribed program duration plus one additional year: 4-year programs are covered for up to 5 years; 5-year programs for up to 6 years. Beyond the limit, students may continue subject to University rules but lose FHE eligibility and pay tuition/fees.\n\n**Source:** Orientation 2026 / RA 10931 guidance."},{"c":"AY 2026–2027 Updates","q":"How do I create an iBU/ICTO account and get an official BU email?","a":"The iBU Student Portal is BU’s online student gateway. Sign in through the ICTO homepage with Google or University credentials and follow registration prompts. For an official email, use the **Email Creation** request page, choose Student or Employee, complete verification and submit; ICTO sends account details after review. Registration menus may appear only after the department tags the student’s Regular/Irregular status.\n\n**Source:** ICTO Help Center and Orientation 2026."},{"c":"AY 2026–2027 Updates","q":"How do I reset my BU email password or request ICTO support?","a":"Use the **Email Password Reset** page: choose user type, verify identity and set a new password. For assistance, submit a support request, save the request number, track it through My Requests/Track Request, and use Follow-up if needed. Attach JPG, PNG, GIF, WebP or PDF files up to 10 MB each. Simple requests typically take 1–2 business days; complex issues 3–5.\n\n**Source:** BU ICTO Help Center."},{"c":"AY 2026–2027 Updates","q":"How do I access Eduroam and request a Zoom account?","a":"Request/create an Eduroam account through ICTO, then select **eduroam** in Wi-Fi settings and enter your credentials. For Zoom, submit an ICTO Support request, select Zoom Account Creation, choose Individual/Department/Office, provide details and required documents.\n\n**Source:** BU ICTO Help Center and Orientation 2026."},{"c":"AY 2026–2027 Updates","q":"What support hours should students know?","a":"ICTO Technical Support: Monday–Friday, 8:00 AM–5:00 PM (PST). BU Health Services: Monday–Friday, 8:00 AM–5:00 PM; Saturday, 8:00 AM–12:00 PM.\n\n**Source:** ICTO Help Center and Orientation 2026."},{"c":"AY 2026–2027 Updates","q":"What scholarships, assistantships and emergency loans are available?","a":"Students may apply for a better-benefit scholarship, subject to reimbursement of the current grant where applicable; complementary benefits may be allowed. Student Assistants must meet enrollment, conduct and grade conditions and may work up to 100 hours/month and 4 hours/day, adjusted for units.\n\nEmergency/financial programs include SELAF (up to ₱1,000), SLF-RV (₱5,000/school year), ELELAP (₱5,000–₱8,000/semester; up to ₱16,000/year), and SAFE for qualified financially needy upperclass/graduating students.\n\n**Source:** Orientation 2026 — Scholarship and Financial Assistance."},{"c":"AY 2026–2027 Updates","q":"What new library, health and ICT services are highlighted for AY 2026–2027?","a":"Library services include reading areas, Reviewer’s Corner, GAD Corner and e-resources such as NERIA. Philippine E-Journals off-campus access requires library-issued credentials.\n\nHealth Services offers consultations, medical certificates and vaccination drives through campus health units. ICTO provides computer labs, iBU Portal, Eduroam, official emails, Zoom, software licensing, network and hardware support.\n\n**Source:** Orientation 2026."},{"c":"AY 2026–2027 Updates","q":"What does USDS handle for student organizations and activities?","a":"University Student Development Services handles student-organization accreditation/re-accreditation, Authority to Travel for off-campus activities, accident-insurance claims and recognition activities. An organization event needs an approved activity proposal and parental consent for participants; off-campus events may also require accreditation and travel authority.\n\n**Source:** Orientation 2026 / Student Handbook 2025."},{"c":"AY 2026–2027 Updates","q":"What GAD support and reporting mechanisms are available?","a":"BU’s GAD support includes childminding rooms, lactation/breastfeeding areas, GAD Corners, and VAW/GBSH Desks with Legal Clinic. Gender-based sexual harassment or violence may be reported through GBSH/GBSV reporting mechanisms and the applicable college/unit VAW/GBSH Desk.\n\n**Source:** Orientation 2026."},{"c":"AY 2026–2027 Updates","q":"How can I join BU cultural groups or apply for international opportunities?","a":"For culture and arts opportunities, contact the University Culture and Arts Coordinator or monitor official group pages, such as Bicol University Chorale. For international opportunities, watch the International Relations Office Facebook page, submit requirements, secure department/college endorsement, allow IRO/CHED assessment, and **do not finalize travel bookings before approval/clearance**.\n\n**Source:** Orientation 2026 — Culture & Arts and International Relations Office."},{"c":"AY 2026–2027 Updates","q":"What does the International Relations Office (IRO) do besides student mobility?","a":"The BU International Relations Office builds linkages with foreign universities and research bodies, spearheads joint programs, manages international recognition efforts, represents BU in international meetings, and hosts international and virtual academic events such as the Asia Virtual Academy Conference.\n\n**Source:** University-Wide Student Orientation 2026."},{"c":"AY 2026–2027 Updates","q":"When are the major graduation and recognition events for AY 2026–2027?","a":"- **University Recognition Program:** April 19, 2027\n- **University Commencement Exercises:** June 14–19, 2027\n- **Academic Council meetings for graduates:** September 4, 2026 (Midyear 2026); February 26, 2027 (First Semester); June 1, 2027 (Second Semester).\n\n**Source:** Approved University Calendar, AY 2026–2027."},{"c":"AY 2026–2027 Updates","q":"Where can I quickly find the correct BU office or service?","a":"**Technical support, BU email, Zoom and Eduroam:** ICTO Support.\n**Email account creation / password reset:** ICTO request pages.\n**Eduroam setup:** Eduroam guides.\n**Records, grades, enrollment and SF10:** Office of the University Registrar.\n**Student organizations, activities, insurance and discipline:** USDS.\n**Scholarships and loans:** OSAS / Scholarship Office.\n**Study abroad:** BU International Relations Office.\n**Culture and arts:** University Culture and Arts Coordinator, Mark Glenn L. Tejada.\n\nFor policy or schedule conflicts, official documents and the latest BU announcements prevail."},{"c":"General & Fees","q":"Where can I find Bicol University’s official website, portal, programs, careers and Facebook page?","a":"Use Bicol University’s official online channels for verified announcements, services and opportunities.\n\n- **Main BU Website:** university news, offices and official information\n- **iBU Student Portal:** student online services and account access\n- **Programs page:** current academic program information\n- **Career Opportunities page:** official job vacancies\n- **BU on Facebook:** announcements and public updates\n\n**What to do:** Use these official channels rather than unofficial posts when checking admissions, enrollment, schedules, vacancies or University announcements."},{"c":"BUCET & Admissions","q":"AY 2026–2027: What do Qualified, Below Quota, Waitlisted and Failed mean?","a":"**Qualified:** passed and eligible based on ranking and available slots.\n**Below Quota (BQ):** did not meet the cut-off but may be considered when slots open, by ranking—not first come, first served. BQ applicants may apply to other courses when they meet the minimum grade requirements for board/non-board programs.\n**Waitlisted:** may be considered if slots open, by ranking.\n**Failed:** not eligible for the cycle; cannot join the waitlist or BQ screening and cannot enroll in any course.\n\n**Latest AY 2026–2027 admissions guidance.**"},{"c":"BUCET & Admissions","q":"Who handles slot allocation, and is slot hunting allowed?","a":"Slot allocation is handled by the program’s **Department Chair**, not the BU Admissions Office. **No slot hunting:** no walk-ins, reservations or personal requests. Possible vacancies are announced through the official BU Facebook page or other official BU-related social-media pages."},{"c":"BUCET & Admissions","q":"Can I change my course or campus after qualifying?","a":"It is not guaranteed. A change may be considered only **after enrollment**, subject to available slots and Department Chair approval. A qualified student who forfeits a slot to pursue another program loses the qualified slot and must undergo screening without a guarantee of acceptance. Once enrollment in a program is confirmed, the system does not allow applications to other programs."},{"c":"BUCET & Admissions","q":"Is the BUCET for AY 2026–2027 still open?","a":"No. The BUCET for AY 2026–2027 has concluded. For the next cycle, wait for and monitor official BU announcements and Facebook pages. Classes for AY 2026–2027 started on **August 4, 2026**."},{"c":"Transferees & Shifting","q":"What is the AY 2026–2027 shifting process and schedule?","a":"**Requirements:** Certificate of Grades for initial Admissions evaluation; after Admissions clearance, submit application documents to the concerned college; attend Department Chair/Enrolling Officer screening, which may include an interview, skills test or essay.\n\n**Schedule:** June 29–July 3, 2026: submit documents to concerned college; July 6–7: screening/evaluation; July 8: results; July 20–31: registration and academic advising."},{"c":"Transferees & Shifting","q":"What are the current transferee eligibility rules, documents and fees?","a":"**Eligibility:** GWA at least 2.0/89% or equivalent; no failing grades or INC marks; must not have completed more than 25% of total BU-program units; acceptance depends on slots. Transfer credits require an equivalent/higher-accredited school and cannot exceed 25% of total course units.\n\n**Documents:** letter of intent; certified grades or OTR; grading system/unit conversion; application form with two 2×2 photos; BU college slot certification after Admissions evaluation; honorable dismissal only upon acceptance.\n\n**Process:** evaluation is in the 2nd–3rd week of July; no BUCET is required; accepted transferees are probationary for one semester. Application period: June 29–July 3.\n\n**Fees/assessments:** ₱200 processing fee after Order of Payment; Nursing NAT is ₱200; departmental interview/assessment and validation examination for grades lower than 2.5 may be required. BUCM does not accept transfers from other medical schools."},{"c":"Health Services","q":"What are the general medical and dental examination rules?","a":"Physical examination must be completed at the nearest BU University Health Services (UHS) campus. Laboratory tests may be obtained from an RHU, CHO or private diagnostic laboratory. UHS medical/dental examination is **free** for students. Incomplete documents are not accepted, and walk-ins are not allowed—book through the portal.\n\nQualified students may book; Waitlisted and BQ applicants must secure a slot first. A missed appointment is automatically cancelled and must be rebooked through the portal."},{"c":"Health Services","q":"Where can I have my dental examination?","a":"Choose either: **(1)** a UHS dentist at any BU campus, or **(2)** a government dentist at an RHU, CHO or public hospital. A government dentist must sign Page 4 of the Dental Health Record using a **blue ballpen**. **Private dental clinics are not accepted.**"},{"c":"Health Services","q":"How do I prepare my Student Health Record and laboratory envelope?","a":"Log in at **https://ibu.bicol-u.edu.ph**. Print two copies of the Student Health Record on long bond paper (8.5×13), back-to-back and in color. Student and parent/guardian must sign in blue ballpen.\n\nPlace laboratory results in an ordinary long brown envelope. On the back, write in black permanent marker: **SURNAME, FIRST NAME, MIDDLE INITIAL; COURSE; COLLEGE AND CAMPUS; SCHOOL YEAR** (for example, 2026–2027). Bring the complete envelope, printed forms, blue ballpen, umbrella, water and food."},{"c":"Health Services","q":"Which UHS sub-clinics are available, and what are the COVID and certificate rules?","a":"UHS sub-clinics include BUPC–Polangui; BUCAF–Guinobatan; BUCBEM/BUCSSP–Daraga; BUGC–Gubat; BUCIT/BUCEng–Legazpi/Albay; and BUTC–Tabaco City.\n\nCOVID vaccination proof is required only for Nursing, Dental Medicine and Medicine. After examination, UHS issues the Health Services/Medical Certificate to submit to the College Registrar—no separate clinic certificate is needed. Medical findings are for counseling/referral, not for denying admission because of disability or a physical condition."},{"c":"BUCET & Admissions","q":"What documents do first-year students need for enrollment?","a":"Bring: printed BUCET result from iBUSIS (accepted as original); Form 138/SF9; UHS Health Services/Medical Certificate; Good Moral Character; PSA/NSO Birth Certificate (original and photocopies); two 2×2 photos with white background/name tag; Police Clearance; mailing envelope; and long brown envelope.\n\nCOVID vaccination card is required only for Nursing, Medicine and Dental Medicine. A parent/guardian may enroll for the student with an authorization letter and valid IDs. BQ/Waitlisted enrollment follows confirmed slot allocation. A valid SHS ID may be used as identification."},{"c":"Records (TOR/CAV)","q":"How do I request a TOR, and can a representative process it?","a":"TOR, diploma and academic-record requests are **walk-in only** at the University Registrar—there are no online transactions or soft copies. If you cannot visit, send an authorized representative with a formal authorization letter, copy of your valid ID and the representative’s valid ID.\n\nFor TOR: bring two recent 2×2 photos (white background/name tag), University Clearance, documentary stamp(s) as instructed, and ₱30 per TOR page. For CAV/authentication: bring original OTR/diploma/certifications, two photocopy sets and two ₱30 documentary-stamp sets. Standard processing is **three working days after complete submission**."},{"c":"Graduate School & Open University","q":"What are the latest BUGS/BUOU admission deadlines, requirements and class mode?","a":"Deadlines: First Semester (August), on/before **May 15**; Second Semester (January), on/before **October 15**. Requirements include original plus photocopy of TOR, Honorable Dismissal, Special Order for private-school graduates, two recommendation letters, PSA/NSO birth certificate, marriage contract where applicable, and TOEFL 460 for international applicants.\n\nMaintain GWA 2.0; passing grade is 3.0; a failed subject may be retaken up to two times. BUGS normally holds face-to-face weekday classes, 5:30–8:30 PM, while BUOU uses online/distance-learning modality. Online BUGS classes may be used during disruptions/emergencies."},{"c":"Graduate School & Open University","q":"What BUOU programs, payment rules and contacts are available?","a":"**Master’s:** MAELM, MAEngEd, MASocStEd, MLGM, MM and MPA. **Doctoral:** EdDELM. Tuition follows AO No. 42 s. 2003. Payments may be cash, postal money order, telegraphic transfer, cablegram, or certified cashier’s/manager’s check—no personal checks. Honors/topnotcher discounts may range from 50%–100% for the first semester; INC completion requires the corresponding fee.\n\nBUGS contacts: bugs-admission@bicol-u.edu.ph; bugs-dean@bicol-u.edu.ph; bugst.d1971@bicol-u.edu.ph; bugs-secretary@bicol-u.edu.ph; bugsreg@bicol-u.edu.ph. Address: Aquilino P. Bonto Building, Ground Floor, Rizal Street, Legazpi City, Albay."},{"c":"ETEEAP","q":"What programs and eligibility requirements apply to ETEEAP?","a":"Programs: BS Fisheries, BS Automotive Technology, BS Nursing, AB Communication Arts, BS Agricultural Technology and BS Computer Science. Applicants must be Filipino citizens (including Filipinos abroad), at least 23 years old, have at least five years of work experience in the field, and be high-school graduates or ALS/PEPT passers qualified for college.\n\nCoordinator: Dr. Benedicto Balilo — bjbbalilo@bicol-u.edu.ph."},{"c":"General & Fees","q":"What are current office hours and key BU contacts?","a":"Admissions: 8:00 AM–5:00 PM, Monday–Thursday; work-from-home Fridays. Registrar, UHS and other offices generally operate Monday–Thursday; Registrar is closed Friday–Sunday.\n\nKey contacts: Admissions: bu-admission@bicol-u.edu.ph / buao.bucet@gmail.com, (052) 742-5099 or (052) 483-0719. ICTO: bu-icto@bicol-u.edu.ph. UHS: bu-clinic@bicol-u.edu.ph. Registrar: bu-uro@bicol-u.edu.ph, (052) 742-6477. OSAS: bu-osas@bicol-u.edu.ph. VPAA: bu-vpaa@bicol-u.edu.ph. Complaints CC: bu-cpro@bicol-u.edu.ph."},{"c":"Colleges (Law & Medicine)","q":"Where are selected programs located and what special requirements apply?","a":"BTVTED-GFD: BUCIT, BU East Campus, Legazpi City. BS Nursing: BU College of Nursing, Main Campus/Legazpi West; there is no Nursing program at Daraga. Veterinary Medicine: BU Guinobatan/BUCAF. Dental Medicine: BU College of Dental Medicine/BUCAT and requires a passed BUCAT examination, interview and dexterity examination."},{"c":"General & Fees","q":"What common BU policies should students remember?","a":"Eligible undergraduate tuition is free under RA 10931, but organization fees and uncovered miscellaneous fees may apply. BU does not allow late admissions. Classes are generally face-to-face; online classes are used for unforeseen circumstances. Personal data cannot be disclosed without consent. Dress rules generally prohibit shorts, sleeveless shirts, slippers, spaghetti straps and short skirts; prescribed uniform is midnight blue. COR is issued upon official enrollment. For block swapping, consult the campus registrar or relevant department."},{"c":"University Calendar (AY 2026-2027)","q":"When and where were the 56th University Commencement Exercises?","a":"**June 15, 2026 (Monday):** Legazpi West campus graduates.\n**June 16, 2026 (Tuesday):** Legazpi East and BU Daraga graduates.\nVenue: PGA–Bicol University Sports Complex.\nBU Charter Day: June 21, 2026."},{"c":"Academic Policies","q":"How can shifting affect Latin Honors eligibility?","a":"Shifting can result in irregular student status. An underload caused by shifting may disqualify a student from Latin Honors.\n\n**What to consider:** Before shifting, ask the receiving college and your adviser how the new curriculum, residency, regular load and any underload will affect your honors eligibility."},{"c":"Academic Policies","q":"What is the Certificate Program in Teaching (CPT)?","a":"The **2025 Revised BU Student Handbook** identifies **CPT** as a library-user category in its borrowing-policy table, but it does **not** state the current CPT admission requirements, program duration, eligibility, fees or offering schedule.\n\n**What to do:** Contact the **Bicol University College of Education (BUCE)** directly before applying. Ask for the current CPT program title, availability for the term, eligibility, required documents, fees, class schedule, credential outcome and enrollment process. Do not rely on prior academic units or an earlier offering as proof of current eligibility.\n\n**Why this matters:** CPT details may be governed by college-level implementing guidelines that are updated separately from the Student Handbook."},{"c":"Citizen's Charter Services","q":"What are the requirements, steps and fee for the BUCET application (per the Citizen's Charter)?","a":"**Who may avail:** Students of DepEd-recognized high schools that are high school seniors expecting to graduate at the end of the school year; OR Senior High School graduates who have not taken and/or are not taking any college subject.\n**Classification / type of transaction:** Simple • G2C - Government to Citizen\n\n**Checklist of requirements (where to secure):**\n- BUCET Application Form (1 original) — BUAO Website (buao.bicol-u.edu.ph)\n- 2x2 identical photos (in white background, with nametag and signature) (2 pieces) — Requesting Entity\n- Long-sized window envelope — Requesting Entity\n- PHP 50.00 worth of mailing stamps — Post Office\n- IPs Certification/NICP Form (if applicable) (1 original) — NCIP - Regional Office or online\n- 4Ps Certification (if applicable) (1 original) — DSWD\n- Income Tax Return (ITR)/ Certificate of Tax Exemption (if applicable) — Bureau of Internal Revenue (BIR)\n- Geographically-Isolated and Disadvantaged Areas (GIDA) Certification (if applicable) (1 original) — Barangay\n- Solo Parent ID (if applicable) (1 photocopy) — CSWDO/MSWDO\n- PWD ID (if applicable) (1 photocopy) — CSWDO/MSWDO\n- Graduating students: Authenticated SF10-SHS (formerly Form 137) from Grade 9 to Grade 11 (1 photocopy) * — School Registrar\n- Graduated students: Authenticated SF10-SHS (formerly Form 137) from Grade 9 to Grade 11 (1 photocopy) * — School Registrar\n- Graduated students: Authenticated SF9-SHS (formerly Form 138) Grade 12 (1 photocopy) — School Registrar\n- PEPT, A&E, ALS graduate: Certificate of Ratings — DepEd Education Assessment Division (EAD)\n- PEPT, A&E, ALS graduate: Certificate of Completion — DepEd Education Assessment Division (EAD)\n- Foreign students: Original Transcript of Records (TOR) — School Registrar\n- Foreign students: Personal Data — Requesting Entity\n- Foreign students: Affidavit of Support — Bureau of Immigration\n- Foreign students: Alien Certificate of Registration (ACR) — Bureau of Immigration\n- Foreign students: Results of Test on English as a Foreign Language (TOEFL) — Educational Testing Center\n- Foreign students: Approved study permit from CHED — Commission on Higher Education (CHED)\n- Foreign students: Application Fee of USD 50 — University Cashier\n  *Note:* * If academic ratings are not affixed at the back page of application form.\n\n**Steps, fees and processing time:**\n1. Secure the BUCET Application Form through the BUAO website: buao.bicol-u.edu.ph\n   → 1. The website administrator will check the applicant's information. (Fee: None; Time: 5 Minutes; Person: Technical Service Provider, Admissions Office)\n2. Submit the complete application requirements at the Admissions Office.\n   → 2. Receive and verify the Application Form and completeness of requirements. (Fee: None; Time: 3 Minutes; Person: Admin Aide III/Clerical Staff/Technical Service Provider, Admissions Office)\n3. Wait for the Test Permit to be released\n   → 3.1 Check the applicant's information and encode grades. (Fee: None; Time: 2 Minutes; Person: Technical Service Provider, Admissions Office)\n   → 3.2 Assign schedule of examination. (Fee: None; Time: 2 Minutes; Person: Technical Service Provider, Admissions Office)\n   → 3.3 Issue the BUCET Test Permit to the applicant. (Fee: None; Time: 3 Minutes; Person: Technical Service Provider, Admissions Office)\n\n**Total:** Fee: None • Processing time: 15 Minutes\n\n**Note:** PHP 250.00 Testing Fee is free for Filipino freshmen applicants pursuant to R.A. No. 10931.\n\n**Note:** 50 USD application fee shall be paid by a Foreign Student to the University Cashier's Office upon acceptance.\n\n> Source: BU Citizen's Charter, 2023 (2nd Edition), pp. 10-12. Fees, requirements, and processing times may be updated by the University — always verify with the responsible office before transacting."},{"c":"Citizen's Charter Services","q":"What are the requirements, steps and fee for the HISET?","a":"**Who may avail:** Graduates of Elementary School recognized by the Department of Education.\n**Classification / type of transaction:** Simple • G2C - Government to Citizen\n\n**Checklist of requirements (where to secure):**\n- HISET Application Form (1 original) — BUAO Website (buao.bicol-u.edu.ph)\n- 2x2 identical photos (2 pieces) — Requesting Entity\n- Long-sized window envelope — Requesting Entity\n- PHP 50.00 worth of mailing stamps — Post Office\n- Order Payment Form — Admissions Office\n- Official Receipt — University Cashier's Office\n- Graduating students: Authenticated SF10-ES (formerly Form 137) from Grade 1 to Grade 5 (1 photocopy) — School Registrar\n- Graduating students: Certificate of Enrollment (1 original) — School Teacher\n- Graduated students: Authenticated SF10-ES (formerly Form 137) from Grade 1 to Grade 6 (1 photocopy) — School Registrar\n- Graduated students: Authenticated SF9-ES (formerly Form 138) Grade 6 (1 photocopy) — School Registrar\n\n**Steps, fees and processing time:**\n1. Secure the HISET Application Form through the BUAO website: buao.bicol-u.edu.ph\n   → 1. The website administrator will check the applicant's information. (Fee: None; Time: 5 Minutes; Person: Technical Service Provider, Admissions Office)\n2. Submit the complete application requirements at the Admissions Office.\n   → 2.1 Receive and verify the Application Form and completeness of requirements. (Fee: None; Time: 2 Minutes; Person: Admin Aide III/Clerical Staff/Technical Service Provider, Admissions Office)\n   → 2.2 Attach the Order Payment Form in the HISET application form. (Fee: None; Time: 1 Minute; Person: Admin Aide III/Clerical Staff/Technical Service Provider, Admissions Office)\n3. Pay the application fee\n   → 3. Record the Official Receipt No. and Date Paid in the HISET Application Form. (Fee: PHP 100.00; Time: 3 Minutes; Person: Cashier, University Cashier's Office)\n4. Wait for the Test Permit to be released\n   → 4.1 Encode grades and assign schedule of examination. (Fee: None; Time: 2 Minutes; Person: Admin Aide III/Clerical Staff/Technical Service Provider, Admissions Office)\n   → 4.2 Issue the HISET Test Permit to the applicant. (Fee: None; Time: 2 Minutes; Person: Admin Aide III/Clerical Staff/Technical Service Provider, Admissions Office)\n\n**Total:** Fee: PHP 100.00 • Processing time: 15 Minutes\n\n**Note:** Application fee is PHP 100.00 per the University's approved fee schedule (Citizen's Charter, p. 135).\n\n> Source: BU Citizen's Charter, 2023 (2nd Edition), pp. 12-14. Fees, requirements, and processing times may be updated by the University — always verify with the responsible office before transacting."},{"c":"Citizen's Charter Services","q":"What are the requirements, steps and fee for the SHAT?","a":"**Who may avail:** Have completed junior high school; Have not taken senior high school in another school; Have completed Non-formal Education (NFE) Accreditation and Equivalency or Alternative Learning System (ALS); For foreign nationals who completed their junior high school education abroad, except Philippine schools under DepEd.\n**Classification / type of transaction:** Simple • G2C - Government to Citizen\n\n**Checklist of requirements (where to secure):**\n- SHAT Application Form (1 original) — BUAO Website (buao.bicol-u.edu.ph)\n- Official Receipt — University Cashier's Office\n- 2x2 identical photos (2 pieces) — Requesting Entity\n- Long-sized window envelope — Requesting Entity\n- PHP 50.00 worth of mailing stamps — Post Office\n- Order Payment Form — Admissions Office\n- Graduating students: Authenticated SF10-JHS from Grade 7 to Grade 9 (1 photocopy) * — School Registrar\n- Graduated students: Authenticated SF10-JHS (formerly Form 137) from Grade 7 to Grade 9 (1 photocopy) * — School Registrar\n- Graduated students: Authenticated SF9-JHS (formerly Form 138) Grade 10 (1 photocopy) — School Registrar\n  *Note:* * If academic ratings are not affixed at the back page of application form.\n\n**Steps, fees and processing time:**\n1. Secure the SHAT Application Form through the BUAO website: buao.bicol-u.edu.ph\n   → 1. The website administrator will check the applicant's information. (Fee: None; Time: 5 Minutes; Person: Technical Service Provider, Admissions Office)\n2. Submit the complete application requirements at the Admissions Office.\n   → 2.1 Receive and verify the Application Form and completeness of requirements. (Fee: None; Time: 2 Minutes; Person: Admin Aide III/Clerical Staff/Technical Service Provider, Admissions Office)\n   → 2.2 Attach the Order Payment Form in the SHAT application form. (Fee: None; Time: 1 Minute; Person: Admin Aide III/Clerical Staff/Technical Service Provider, Admissions Office)\n3. Pay the application fee\n   → 3. Record the Official Receipt No. and Date Paid in the SHAT Application Form. (Fee: PHP 200.00; Time: 3 Minutes; Person: Cashier, University Cashier's Office)\n4. Wait for the Test Permit to be released\n   → 4.1 Encode grades and assign schedule of examination. (Fee: None; Time: 2 Minutes; Person: Admin Aide III/Clerical Staff/Technical Service Provider, Admissions Office)\n   → 4.2 Issue the SHAT Test Permit to the applicant. (Fee: None; Time: 2 Minutes; Person: Admin Aide III/Clerical Staff/Technical Service Provider, Admissions Office)\n\n**Total:** Fee: PHP 200.00 • Processing time: 15 Minutes\n\n> Source: BU Citizen's Charter, 2023 (2nd Edition), pp. 14-16. Fees, requirements, and processing times may be updated by the University — always verify with the responsible office before transacting."},{"c":"Citizen's Charter Services","q":"What are the requirements, steps and fee for the KAT?","a":"**Who may avail:** The child is at least 5 years old by October 31 of the current year (DepEd Order no. 20 s. 2018); The child has completed Nursery or Kinder 1 in any school; The child passed the Kindergarten Admission Test (KAT) administered by the Office of Admissions covering the following developmental areas: physical, cognitive, and socio-emotional.\n**Classification / type of transaction:** Simple • G2C - Government to Citizen\n\n**Checklist of requirements (where to secure):**\n- KAT Application Form (1 original) — BUAO Website (buao.bicol-u.edu.ph)\n- Certificate of Kinder 1 or Nursery Completion (1 photocopy) OR Certificate of Enrollment (if currently enrolled) (1 original) — School Registrar\n- Birth Certificate (NSO/PSA) (1 original) (1 photocopy) — Requesting Entity/Philippine Statistics Authority\n- Official Receipt — University Cashier's Office\n- 2x2 identical photos (2 pieces) — Requesting Entity\n- Long-sized window envelope — Requesting Entity\n- PHP 50.00 worth of mailing stamps — Post Office\n- Order Payment Form — Admissions Office\n\n**Steps, fees and processing time:**\n1. Secure the KAT Application Form through the BUAO website: buao.bicol-u.edu.ph\n   → 1. The website administrator will check the applicant's information. (Fee: None; Time: 5 Minutes; Person: Technical Service Provider, Admissions Office)\n2. Submit the complete application requirements at the Admissions Office.\n   → 2.1 Receive and verify the Application Form and completeness of requirements. (Fee: None; Time: 2 Minutes; Person: Admin Aide III/Clerical Staff/Technical Service Provider, Admissions Office)\n   → 2.2 Attach the Order Payment Form in the KAT application form. (Fee: None; Time: 1 Minute; Person: Admin Aide III/Clerical Staff/Technical Service Provider, Admissions Office)\n3. Pay the application fee\n   → 3. Record the Official Receipt No. and Date Paid in the KAT Application Form. (Fee: PHP 200.00; Time: 3 Minutes; Person: Cashier, University Cashier's Office)\n4. Wait for the Test Permit to be released\n   → 4.1 Assign schedule of examination. (Fee: None; Time: 2 Minutes; Person: Admin Aide III/Clerical Staff/Technical Service Provider, Admissions Office)\n   → 4.2 Issue the KAT Test Permit to the applicant. (Fee: None; Time: 2 Minutes; Person: Technical Service Provider, Admissions Office)\n\n**Total:** Fee: PHP 200.00 • Processing time: 15 Minutes\n\n> Source: BU Citizen's Charter, 2023 (2nd Edition), pp. 16-18. Fees, requirements, and processing times may be updated by the University — always verify with the responsible office before transacting."},{"c":"Citizen's Charter Services","q":"How do I take the BU College of Law Entrance Exam (CLET)?","a":"**Who may avail:** Graduates of any Baccalaureate degree. General Weighted Average of 2.4 or 85% or its equivalent in his/her pre-law degree.\n**Classification / type of transaction:** Simple • G2C - Government to Citizen\n\n**Checklist of requirements (where to secure):**\n- CLET Application Form (1 original) — BUAO Website (buao.bicol-u.edu.ph)\n- Data Privacy Consent Form (1 original) — School Registrar\n- Birth Certificate (NSO/PSA) (1 original) — Requesting Entity/Philippine Statistics Authority\n- TOR/Certificate of GWA (1 photocopy) — School Registrar\n- Official Receipt — University Cashier's Office\n- 2x2 identical photos (2 pieces) — Requesting Entity\n\n**Steps, fees and processing time:**\n1. Secure the CLET Application Form through the BUAO website: buao.bicol-u.edu.ph\n   → 1. The website administrator will check the applicant's information. (Fee: None; Time: 5 Minutes; Person: Technical Service Provider, Admissions Office)\n2. Pay the non-refundable testing fee or deposit thru Landbank.\n   → 2. Check the original receipt or submit a copy deposit/transactions slip to the cashier for issuance of Official Receipt. (Fee: PHP 750.00; Time: 5 Minutes; Person: Cashier, University Cashier's Office)\n3. Submit the complete application requirements via email.\n   → 3.1 Receive and verify the completeness of requirements. (Fee: None; Time: 5 Minutes; Person: Technical Service Provider, Admissions Office)\n   → 3.2 Notify applicant upon receipt if complete or incomplete. (Fee: None; Time: 5 Minutes; Person: Technical Service Provider, Admissions Office)\n4. Wait for the Test Permit to be released\n   → 4.1 Check the applicant's information and assign schedule of examination. (Fee: None; Time: 2 Minutes; Person: Technical Service Provider, Admissions Office)\n   → 4.2 Issue the Test Permit to the applicant via email. (Fee: None; Time: 2 Minutes; Person: Technical Service Provider, Admissions Office)\n5. Wait for the schedule of the panel interview\n   → 5. After the entrance examination, the details of the interview schedule will be posted online and sent through the email address or contact number provided by the applicant. (Fee: None; Time: 7 Days; Person: BUCL Staff, College of Law)\n\n**Total:** Fee: PHP 750.00 • Processing time: 7 Days and 24 Minutes\n\n> Source: BU Citizen's Charter, 2023 (2nd Edition), pp. 18-20. Fees, requirements, and processing times may be updated by the University — always verify with the responsible office before transacting."},{"c":"Citizen's Charter Services","q":"How do I apply for admission to the BU College of Medicine?","a":"**Who may avail:** Graduates of any Baccalaureate degree. National Medical Admission Test (NMAT) Result with not below 65 PR score.\n**Classification / type of transaction:** Simple • G2C - Government to Citizen\n\n**Checklist of requirements (where to secure):**\n- BUCM Application Form (1 original) — BUAO Website (buao.bicol-u.edu.ph)\n- Birth Certificate (NSO/PSA) (1 original) — Requesting Entity/Philippine Statistics Authority\n- Transcript of Records or Certificate of Grades for graduating students (1 original) — School Registrar\n- Certificate of GWA (1 original) — School Registrar\n- National Medical Admission Test (NMAT) Result (1 original) — Center for Educational Measurement\n- NBI Clearance (1 original) — National Bureau of Investigation\n- Official Receipt — University Cashier's Office\n- 2x2 identical photos (2 pieces) — Requesting Entity\n- Certificate of Good Moral (1 original) — College Dean or Guidance Counselor\n- Latest ITR of parents (1 original) — Bureau of Internal Revenue\n\n**Steps, fees and processing time:**\n1. Secure the BUCM Application Form through the BUAO website: buao.bicol-u.edu.ph\n   → 1. The website administrator will check the applicant's information. (Fee: None; Time: 5 Minutes; Person: Technical Service Provider, Admissions Office)\n2. Pay the non-refundable testing fee or deposit thru Landbank.\n   → 2. Check the original receipt or submit a copy deposit/transactions slip to the cashier for issuance of Official Receipt. (Fee: PHP 1500.00; Time: 5 Minutes; Person: Cashier, University Cashier's Office)\n3. Submit the complete application requirements via online form.\n   → 3.1 Receive and verify the completeness of requirements. (Fee: None; Time: 5 Minutes; Person: Technical Service Provider, Admissions Office)\n   → 3.2 Notify applicant upon receipt if complete or incomplete. (Fee: None; Time: 5 Minutes; Person: Technical Service Provider, Admissions Office)\n4. Wait for the schedule of the panel interview\n   → 4. After endorsing the complete requirements of the applicant, the details of the interview schedule will be sent through the email address or contact number provided by the applicant. (Fee: None; Time: 1 Day; Person: Clerical Staff/Dean's Secretary, College of Medicine)\n\n**Total:** Fee: PHP 1500.00 • Processing time: 1 Day, 20 Minutes\n\n> Source: BU Citizen's Charter, 2023 (2nd Edition), pp. 20-22. Fees, requirements, and processing times may be updated by the University — always verify with the responsible office before transacting."},{"c":"Citizen's Charter Services","q":"How do I shift to another course at BU?","a":"**Who may avail:** A student of any college in the University who has not obtained two or more failing grades in his present course/program. The student has not finished fifty percent (50%) or more of the required units of his present course. General Weighted Average must be 2.4 (85%) or better. Receiving college must have a slot available for the shifter.\n**Classification / type of transaction:** Simple • G2C - Government to Citizen\n\n**Checklist of requirements (where to secure):**\n- Application Form for Shifter (2 original) — Admissions Office\n- 1x1 identical photos (2 pieces) — Requesting Entity\n- Certificate of Grades (1 original) (1 photocopy) — College Registrar\n- Letter of Intent (1 original) (1 photocopy) — Requesting Entity\n- Certificate or Notice of Availability of Slot (1 original) (1 photocopy) — Department Head/Program Chair/College Dean/Director\n- Order Payment Form — Admissions Office\n- Official Receipt — University Cashier's Office\n\n**Steps, fees and processing time:**\n1. Present the Certificate of Grades or TOR for evaluation of Grades.\n   → 1. Compute the grades and sign the COG/TOR presented and inform the student if his/her General Weighted Average is qualified or not. (Fee: None; Time: 2 Minutes; Person: Admin Aide III/Clerical Staff/Technical Service Provider, Admissions Office)\n2. Secure slot availability by submitting the Letter of Intent to the college where s/he plans to continue the new course.\n   → 2.1 Check if transfer is accepted by the Dean/Director. (Fee: None; Time: 3 Minutes; Person: Admin Aide III/Clerical Staff/Technical Service Provider, Admissions Office)\n   → 2.2 Provide the Application Form for Shifters and give instructions on how to fill out the form. (Fee: None; Time: 2 Minutes; Person: Admin Aide III/Clerical Staff/Technical Service Provider, Admissions Office)\n3. Fill out the Application Form for Shifter.\n   → 3.1 Check that no item is left unanswered in the application form. (Fee: None; Time: 2 Minutes; Person: Admin Aide III/Clerical Staff/Technical Service Provider, Admissions Office)\n   → 3.2 Attach an Order Payment Form to be paid at the University Cashier's Office. (Fee: None; Time: 1 Minute; Person: Admin Aide III/Clerical Staff/Technical Service Provider, Admissions Office)\n4. Give Shifter's Form (Endorsement Letter) to the college where the shifter came from. (Applicable if a student will transfer to a different campus)\n   → 4. Check if transfer is accepted by the Dean/Director. (Fee: None; Time: 3 Minutes; Person: Admin Aide III/Clerical Staff/Technical Service Provider, Admissions Office)\n5. Pay the non-refundable processing fee.\n   → 5. Record the Official receipt number and date paid. (Fee: PHP 100.00; Time: 2 Minutes; Person: Cashier, University Cashier's Office)\n6. Submit the accomplished form and necessary attachments.\n   → 6. Receive and verify the completeness of requirements. (Fee: None; Time: 3 Minutes; Person: Admin Aide III/Clerical Staff/Technical Service Provider, Admissions Office)\n7. Wait for the processing of application.\n   → 7.1 Check and review the details for approval of the Dean of Admissions. (Fee: None; Time: 5 Minutes; Person: Admin Aide III/Clerical Staff/Technical Service Provider, Admissions Office)\n   → 7.2 The Dean of Admissions decides if the applicant is qualified for shifting and sign the application. (Fee: None; Time: 3 Minutes; Person: Dean of Admissions, Admissions Office)\n   → 7.3 Issue the signed Shifter's Application Form. (Fee: None; Time: 3 Minutes; Person: Admin Aide III/Clerical Staff/Technical Service Provider, Admissions Office)\n   → 7.4 Record details in Logbook of Shifters and Transferees. (Fee: None; Time: 1 Minute; Person: Admin Aide III/Clerical Staff/Technical Service Provider, Admissions Office)\n\n**Total:** Fee: PHP 100.00 • Processing time: 30 Minutes\n\n**Note:** For BS Nursing course program, a Nursing Aptitude Test is required. Please refer to the Service Specification Table no. 10 (Nursing Aptitude Testing).\n\n> Source: BU Citizen's Charter, 2023 (2nd Edition), pp. 22-25. Fees, requirements, and processing times may be updated by the University — always verify with the responsible office before transacting."},{"c":"Citizen's Charter Services","q":"How do I transfer to BU from another school?","a":"**Who may avail:** An applicant shall not have finished more than twenty-five percent (25%) of the units required for the course. Has General Weighted Average (GWA) of 2.0 or 89% or its equivalent, or better for all the academic units he/she has earned outside of Bicol University. No failed subjects. Receiving college must have a slot available for the transferee.\n**Classification / type of transaction:** Simple • G2C - Government to Citizen\n\n**Checklist of requirements (where to secure):**\n- Application Form for Transferee (2 original) — Admissions Office\n- 1x1 identical photos (2 pieces) — Requesting Entity\n- Certificate of Grades or Transcript of Records (1 original) (1 photocopy) — School Registrar\n- Letter of Intent (1 original) (1 photocopy) — Requesting Entity\n- Certificate or Notice of Availability of Slot (1 original) (1 photocopy) — Department Head/Program Chair/College Dean/Director\n- Order Payment Form — Admissions Office\n- Official Receipt — University Cashier's Office\n- Certificate of Honorable Dismissal — School Registrar\n\n**Steps, fees and processing time:**\n1. Present the Certificate of Grades or TOR for evaluation of Grades.\n   → 1. Compute the grades and sign the COG/TOR presented and inform the student if his/her General Weighted Average is qualified or not. (Fee: None; Time: 2 Minutes; Person: Admin Aide III/Clerical Staff/Technical Service Provider, Admissions Office)\n2. Secure slot availability by submitting the Letter of Intent to the college where s/he plans to continue the new course.\n   → 2.1 Check if transfer is accepted by the Dean/Director. (Fee: None; Time: 3 Minutes; Person: Admin Aide III/Clerical Staff/Technical Service Provider, Admissions Office)\n   → 2.2 Provide the Application Form for Transferee and give instructions on how to fill out the form. (Fee: None; Time: 2 Minutes; Person: Admin Aide III/Clerical Staff/Technical Service Provider, Admissions Office)\n3. Fill out the Application Form for Transferee.\n   → 3.1 Check that no item is left unanswered in the application form. (Fee: None; Time: 2 Minutes; Person: Admin Aide III/Clerical Staff/Technical Service Provider, Admissions Office)\n   → 3.2 Attach an Order Payment Form to be paid at the University Cashier's Office. (Fee: None; Time: 1 Minute; Person: Admin Aide III/Clerical Staff/Technical Service Provider, Admissions Office)\n4. Pay the non-refundable processing fee.\n   → 4. Record the Official receipt number and date paid. (Fee: PHP 100.00; Time: 1 Minute; Person: Cashier, University Cashier's Office)\n5. Submit the accomplished form and necessary attachments.\n   → 5. Receive and verify the completeness of requirements. (Fee: None; Time: 3 Minutes; Person: Admin Aide III/Clerical Staff/Technical Service Provider, Admissions Office)\n6. Wait for the processing of application.\n   → 6.1 Check and review the details for approval of the Dean of Admissions. (Fee: None; Time: 3 Minutes; Person: Admin Aide III/Clerical Staff/Technical Service Provider, Admissions Office)\n   → 6.2 The Dean of Admissions decides if the applicant is qualified for transfer and sign the application. (Fee: None; Time: 5 Minutes; Person: Dean of Admissions, Admissions Office)\n   → 6.3 Issue the signed Application Form for Transferee. (Fee: None; Time: 2 Minutes; Person: Admin Aide III/Clerical Staff/Technical Service Provider, Admissions Office)\n   → 6.4 Record details in Logbook of Shifters and Transferees. (Fee: None; Time: 1 Minute; Person: Admin Aide III/Clerical Staff/Technical Service Provider, Admissions Office)\n\n**Total:** Fee: PHP 100.00 • Processing time: 25 Minutes\n\n**Note:** For BS Nursing course program, a Nursing Aptitude Test is required. Please refer to the Service Specification Table no. 10 (Nursing Aptitude Testing).\n\n> Source: BU Citizen's Charter, 2023 (2nd Edition), pp. 25-27. Fees, requirements, and processing times may be updated by the University — always verify with the responsible office before transacting."},{"c":"Citizen's Charter Services","q":"How do I enroll in a second course at BU?","a":"**Who may avail:** A student must be a graduate of a bachelor's degree of a CHED-recognized/accredited institution of higher learning. General Weighted Average (GWA) of 2.5 or 84% or its equivalent, or better for all the academic units he/she has earned. Receiving college must have a slot available for the second-courser.\n**Classification / type of transaction:** Simple • G2C - Government to Citizen\n\n**Checklist of requirements (where to secure):**\n- Application Form for Shifter/Transferee (2 original) — Admissions Office\n- 1x1 identical photos (2 pieces) — Requesting Entity\n- Certificate of GWA or Transcript of Records (1 original) (1 photocopy) — College Registrar\n- Letter of Intent (1 original) (1 photocopy) — Requesting Entity\n- Certificate or Notice of Availability of Slot (1 original) (1 photocopy) — Department Head/Program Chair/College Dean/Director\n- Order Payment Form — Admissions Office\n- Official Receipt — University Cashier's Office\n\n**Steps, fees and processing time:**\n1. Present the Certificate of Grades or TOR for evaluation of Grades.\n   → 1. Compute the grades and sign the TOR presented and inform the student if his/her General Weighted Average is qualified or not. (Fee: None; Time: 2 Minutes; Person: Admin Aide III/Clerical Staff/Technical Service Provider, Admissions Office)\n2. Secure slot availability by submitting the Letter of Intent to the college where s/he plans to continue the new course.\n   → 2.1 Check if transfer is accepted by the Dean/Director. (Fee: None; Time: 3 Minutes; Person: Admin Aide III/Clerical Staff/Technical Service Provider, Admissions Office)\n   → 2.2 Provide the Application Form for Transferees and give instructions on how to fill out the form. (Fee: None; Time: 2 Minutes; Person: Admin Aide III/Clerical Staff/Technical Service Provider, Admissions Office)\n3. Fill out the Application Form for Second Courser.\n   → 3.1 Check that no item is left unanswered in the application form. (Fee: None; Time: 2 Minutes; Person: Admin Aide III/Clerical Staff/Technical Service Provider, Admissions Office)\n   → 3.2 Attach an Order Payment Form to be paid at the University Cashier's Office. (Fee: None; Time: 1 Minute; Person: Admin Aide III/Clerical Staff/Technical Service Provider, Admissions Office)\n4. Pay the non-refundable processing fee.\n   → 4. Record the Official receipt number and date paid. (Fee: PHP 100.00; Time: 2 Minutes; Person: Cashier, University Cashier's Office)\n5. Submit the accomplished form and necessary attachments.\n   → 5. Receive and verify the completeness of requirements. (Fee: None; Time: 3 Minutes; Person: Admin Aide III/Clerical Staff/Technical Service Provider, Admissions Office)\n6. Wait for the processing of application.\n   → 6.1 Check and review the details for approval of the Dean of Admissions. (Fee: None; Time: 5 Minutes; Person: Admin Aide III/Clerical Staff/Technical Service Provider, Admissions Office)\n   → 6.2 The Dean of Admissions decides if the applicant is qualified for shifting and sign the application. (Fee: None; Time: 5 Minutes; Person: Dean of Admissions, Admissions Office)\n   → 6.3 Issue the signed Application Form for second-courser. (Fee: None; Time: 2 Minutes; Person: Admin Aide III/Clerical Staff/Technical Service Provider, Admissions Office)\n   → 6.4 Record details in Logbook of Shifters and Transferees. (Fee: None; Time: 1 Minute; Person: Admin Aide III/Clerical Staff/Technical Service Provider, Admissions Office)\n\n**Total:** Fee: PHP 100.00 • Processing time: 28 Minutes\n\n**Note:** For BS Nursing course program, a Nursing Aptitude Test is required. Please refer to the Service Specification Table no. 10 (Nursing Aptitude Testing).\n\n> Source: BU Citizen's Charter, 2023 (2nd Edition), pp. 27-30. Fees, requirements, and processing times may be updated by the University — always verify with the responsible office before transacting."},{"c":"Citizen's Charter Services","q":"What are the requirements, steps and fee for the Nursing Aptitude Test (NAT)?","a":"**Who may avail:** A student who is a shifter or transferee or second-courser who has a - General Weighted Average (GWA) of 2.4 or 85% for Shifter; - General Weighted Average (GWA) of 2.0 or 89% for Transferee; - General Weighted Average (GWA) of 2.5 or 84% for Second-Courser; Receiving college must have a slot available for the BS Nursing course program.\n**Classification / type of transaction:** Simple • G2C - Government to Citizen\n\n**Checklist of requirements (where to secure):**\n- Nursing Aptitude Test (NAT) Form (1 original) — Admissions Office\n- 1x1 identical photos (2 pieces) — Requesting Entity\n- Certificate of GWA or Transcript of Records (1 original) — College Registrar\n- Letter of Intent (1 original) (1 photocopy) — Requesting Entity\n- Certificate or Notice of Availability of Slot (1 original) (1 photocopy) — Department Head/Program Chair/College Dean/Director\n- Order Payment Form — Admissions Office\n- Official Receipt — University Cashier's Office\n\n**Steps, fees and processing time:**\n1. Present the Certificate of Grades or TOR for evaluation of Grades.\n   → 1. Compute the grades and sign the COG/TOR presented and inform the student if his/her General Weighted Average is qualified or not. (Fee: None; Time: 5 Minutes; Person: Admin Aide III/Clerical Staff/Technical Service Provider, Admissions Office)\n2. Secure slot availability by submitting the Letter of Intent to the college where s/he plans to study BS Nursing.\n   → 2.1 Check if available slot/s is declared or if transfer is accepted by the Dean/Director. (Fee: None; Time: 1 Day; Person: Admin Aide III/Clerical Staff/Technical Service Provider, Admissions Office)\n   → 2.2 Provide the Nursing Aptitude Test (NAT) Form to the applicant and give instructions on how to fill out the form. (Fee: None; Time: 2 Minutes; Person: Admin Aide III/Clerical Staff/Technical Service Provider, Admissions Office)\n3. Fill out the Nursing Aptitude Test (NAT) Form.\n   → 3.1 Check that no item is left unanswered in the application form. (Fee: None; Time: 2 Minutes; Person: Admin Aide III/Clerical Staff/Technical Service Provider, Admissions Office)\n   → 3.2 Attach an Order Payment Form to be paid at the University Cashier's Office. (Fee: None; Time: 1 Minute; Person: Admin Aide III/Clerical Staff/Technical Service Provider, Admissions Office)\n4. Pay the non-refundable testing fee.\n   → 4. Issue an Official Receipt to the applicant. (Fee: PHP 200.00; Time: 5 Minutes; Person: Cashier, University Cashier's Office)\n5. Submit the accomplished form and necessary attachments.\n   → 5. Receive and verify the completeness of requirements. (Fee: None; Time: 3 Minutes; Person: Admin Aide III/Clerical Staff/Technical Service Provider, Admissions Office)\n6. Wait for the processing of application.\n   → 6.1 Record the Official Receipt number and date paid. (Fee: None; Time: 1 Minute; Person: Admin Aide III/Clerical Staff/Technical Service Provider, Admissions Office)\n   → 6.2 Check and review the details of the applicant. (Fee: None; Time: 3 Minutes; Person: Admin Aide III/Clerical Staff/Technical Service Provider, Admissions Office)\n   → 6.3 Schedule the applicant for the Nursing Aptitude Test (NAT). (Fee: None; Time: 3 Minutes; Person: Admin Aide III/Clerical Staff/Technical Service Provider, Admissions Office)\n\n**Total:** Fee: PHP 200.00 • Processing time: 1 Day and 25 Minutes\n\n> Source: BU Citizen's Charter 2024 (1st Edition), Admissions Office and University Cashier's Office. Fees, requirements, and processing times may be updated by the University — always verify with the responsible office before transacting."},{"c":"Citizen's Charter Services","q":"What are the fees and process for psychological testing at BU?","a":"**Who may avail:** Any individual or organization referred or otherwise, that needs psychological testing.\n**Classification / type of transaction:** Simple • G2C - Government to Citizen\n\n**Checklist of requirements (where to secure):**\n- Request Form or Letter (1 original) — Requesting Entity\n- Order Payment Form — Admissions Office\n- Official Receipt — University Cashier's Office\n\n**Steps, fees and processing time:**\n1. Fill-out the Request Form from Psychologist.\n   → 1. Check that no item is left unanswered in the Request Form. (Fee: None; Time: 10 Minutes; Person: Psychometrician/Admin Aide IV, Admissions Office)\n2. Consult the Dean with regards to testing needs.\n   → 2.1 Inform the client of the approval of the Request Form. (Fee: None; Time: 5 Minutes; Person: Admin Aide IV/Clerical Staff, Admissions Office)\n   → 2.2 Attach an Order Payment Form to be paid at the University Cashier's Office. (Fee: None; Time: 2 Minutes; Person: Admin Aide IV/Clerical Staff/Technical Service Provider, Admissions Office)\n3. Pay the required testing fee and wait for the schedule of test.\n   → 3.1 Check the receipt. (Fee: *See Table Fees per Type of Test; Time: 5 Minutes; Person: Cashier, University Cashier's Office)\n   → 3.2 Schedule the client for the Psychological Test. (Fee: None; Time: 10 Minutes; Person: Admin Aide IV/Psychometrician, Admissions Office)\n4. Take the Psychological Test.\n   → 4.1 Conduct Psychological Test. (Fee: None; Time: 2 Hours; Person: Admin Aide IV/Psychometrician, Admissions Office)\n   → 4.2 Score and profile the test. (Fee: None; Time: 7 Days; Person: Admin Aide IV/Psychometrician, Admissions Office)\n5. Wait for the result.\n   → 5. Individual/group conference conducted for test interpretation. (Fee: None; Time: 1 Hour; Person: Psychometrician, Admissions Office)\n\n**Total:** Fee: *See Table Fees per Type of Test • Processing time: 7 Days, 3 Hours, 2 Minutes\n\n**Note:** Psychological testing fees per the University's approved fee schedule (Citizen's Charter, p. 135-136) - Outside clients: Intelligence/Test of General Mental Ability PHP 400.00; Achievement/Aptitude Test PHP 400.00; Personality test PHP 600.00; Interest/Motivation test PHP 600.00; Special Test (ADHD/ADD, Dyslexia, Autism, Stanford-Binet) PHP 1,100.00. BU Students: Intelligence/GMA PHP 200.00; Achievement/Aptitude PHP 300.00; Personality PHP 300.00; Interest/Motivation PHP 400.00; Special Test PHP 400.00.\n\n> Source: BU Citizen's Charter, 2023 (2nd Edition), pp. 32-34. Fees, requirements, and processing times may be updated by the University — always verify with the responsible office before transacting."},{"c":"Citizen's Charter Services","q":"How do I avail dental consultation and treatment at the University Health Services?","a":"**Who may avail:** BU Students\n**Classification / type of transaction:** Simple • G2C - Government to Citizen\n\n**Checklist of requirements (where to secure):**\n- Identification Card (1 Original Copy); OR — Office of Student Affairs Services\n- Certificate of Registration (1 Original Copy) — Registrar Office\n\n**Steps, fees and processing time:**\n1. Present identification card or certificate of registration.\n   → 1. Validate the client status from the documents submitted. (Fee: None; Time: 5 Minutes; Person: Dental Aide, University Health Services)\n2. Submits for Interview.\n   → 2. Conducts Interview and check veracity of forms and documents. (Fee: None; Time: 15 Minutes; Person: Dental Aide/Dentist I/Dentist II, University Health Services)\n3. Submits for vital signs taking.\n   → 3. Conduct vital signs checking and evaluation of the client. (Fee: None; Time: 15 Minutes; Person: Dental Aide/Dentist I/Dentist II, University Health Services)\n4. Client undergoes dental examination.\n   → 4. Dentist conducts dental examination and perform diagnosis and treatment planning of the Dental problem of the Client. (Fee: None; Time: 30 Minutes; Person: Dentist I/Dentist II, University Health Services)\n5. Referral (If needed).\n   → 5. Dentist explain to client the reason of the need to refer to another specialist. (Fee: None; Time: 5 Minutes; Person: Dentist I/Dentist II, University Health Services)\n6. Client receives medication and/or treatment.\n   → 6. Dentist perform dental treatment/s and/or gives medication/s to the dental problem/s
