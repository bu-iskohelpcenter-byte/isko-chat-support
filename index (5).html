shes to borrow book/s follows the borrowing procedure of the library, using the validated library card and following the borrowing policy (see the Citizen's Charter 'Charging (Borrowing) of Books' for the detailed steps).\n\nResponsibilities of the User: Maintain silence and courtesy inside the library and strictly observe the 'First Come, First Served' policy; follow the rules on the use of library materials and facilities; and return borrowed materials on time.\n\nOther Researchers (External Researchers): External researchers may use the library facilities upon payment of a researcher's fee and compliance with the library's requirements (see the Citizen's Charter 'Admitting External Researchers' for the detailed steps and fee table, per BOR Resolution No. 018, s. 2008)."},{"c":"Student Handbook (Complete)","q":"What are the medical and dental services and other facilities?","a":"Medical and Dental: The Medical-Dental Fee entitles the student to free medical and dental services from BU clinics where s/he is officially enrolled (see the Citizen's Charter University Health Services for the detailed service steps).\n\nOther Facilities:\n• Sports and Recreational Facilities — basketball courts, oval for track and field, volleyball court, soccer field, and swimming pool are available, and can be availed of by students and personnel alike. The students' ID cards issued by Bicol University entitle them to use these facilities.\n• Amphitheater and Audio-Visual Center and Language Laboratory — the amphitheater, located in the Multi-Purpose building, serves as a center for cultural presentations, convocations, meetings, debates and similar activities. Under the College of Arts and Letters, the University operates and maintains a state-of-the-art Audio-Visual and Language laboratory, equipped with television broadcasting, recording and editing capability; the Language Laboratory provides expert instruction and training in languages.\n• Stores and Canteens — the University has private canteens serving both meals and snacks in colleges and units, and stores selling supplies and miscellaneous items. The BU Multi-Purpose Cooperative, owned by BU personnel, also runs a canteen and offers services like granting loans to members; it admits students as associate members.\n• Reprographic Facilities — reprographic services are available in the University.\n• Campus Safety Security — campus security services are provided by the University's security unit."},{"c":"Student Handbook (Complete)","q":"What are the minor offenses and their penalties?","a":"Violation of the following rules and regulations shall be considered as a minor offense and shall have the corresponding penalties:\nFirst Offense — Reprimand\nSecond Offense — Written Warning\nThird Offense — Community Service\nFourth Offense — Suspension for 7 to 14 days\n\n1. Bicol University strictly observes a smoke-free environment. Smoking at any time within the university premises is prohibited.\n2. Students are required to attend university academic activities conducted within the university and even those activities conducted by the university outside its premises.\n3. Students are free to participate in co-curricular activities subject to the following conditions: (a) their participation shall excuse them only for the time missed in class and shall not excuse them from fulfilling other requirements by the university; and (b) their participation shall be their own personal responsibility.\n4. All posters or written announcements, or other similar materials emanating from accredited student organizations, shall bear the stamp of approval of the College Dean or College Student Affairs Coordinator (CSAC), and/or Office of the VP for Planning and Development.\n5. No student may participate in an outside activity (contest, play, band, orchestra, choir conference, congress) nor join any association, club and similar groups as a representative of the Bicol University without being so authorized in writing by the Dean of the College/Unit.\n6. Students are required to wear the prescribed uniform while inside the premises of the university, except during 'non-uniform days'. Inappropriate attire includes blouse with bare back, bare midriffs, low or plunging neckline, spaghetti straps, haltered, hanging blouse, see-through garments, sleeveless shirt (for men), very short skirts/dresses, very low-rise jeans, shorts, beach and Japanese sandals and slippers. The P.E. uniform is to be worn only during P.E. classes or games on the campus, not during academic classes.\n7. Validated ID cards must be worn at all times within the school premises. A lost ID card must be reported immediately to the concerned authorities.\n8. Students should help keep the building and campus clean at all times. Trash cans and similar receptacles should be used. Littering and writing on the walls, doors, chairs or any property of the University are prohibited."},{"c":"Student Handbook (Complete)","q":"What are the major offenses and their sanctions?","a":"The following prohibited acts within the university are considered major offenses, with corresponding sanctions imposed on any student found guilty:\n\n1. BULLYING — adopts the definition under R.A. No. 10627: any severe or repeated use by one or more students of a written, verbal or electronic expression, or a physical act or gesture, directed at another student that has the effect of actually causing or placing the latter in reasonable fear of physical or emotional harm or damage to property; creating a hostile environment at school; infringing on the rights of the other student; or materially and substantially disrupting the education process. Includes unwanted physical contact (punching, pushing, shoving, kicking, slapping, headlocks, pranks, teasing, fighting, use of objects as weapons), acts causing damage to a victim's psyche and/or emotional well-being, slanderous statements or profanity, name-calling, tormenting, negative comments on the victim's looks, clothes and body, and cyber-bullying.\n\n2. CARRYING OF FIREARMS AND OTHER DANGEROUS WEAPONS — bringing dangerous weapons (firearms even if licensed, spring blade knives, knives, guns) into the university premises or facilities used exclusively for school activities is strictly prohibited. Students may be allowed to bring sharp instruments only if designed and to be used in school-related activities such as dissection or other laboratory works.\n\n3. CREATING DISORDER OR DISTURBANCE WITHIN THE UNIVERSITY — any act designed to cause serious disturbance within the University premises, office, classroom, hall, or that interrupts or disturbs performances, functions or gatherings, or peaceful meetings.\n\n4. DESTRUCTION OF ANY PROPERTY OF THE UNIVERSITY, ITS GUESTS, EMPLOYEES OR STUDENTS — willful or negligent destruction, alteration or defacing of property, including vandalism, defacing any library book, journal or periodical, and posting unauthorized notices on walls or furniture. Possession of the means to commit vandalism (drill bit, glass cutter, spray paint) within university premises without proper clearance shall be prima facie evidence of such offense.\n\n5. DISCOURTESY TO SUPERIOR — and other major offenses enumerated in the handbook (including hazing under R.A. 8049, photo or video voyeurism under R.A. 9993, sexual harassment under the BU Rules and Regulations on Administrative Cases of Sexual Harassment, and stalking as modified from R.A. No. 9262)."},{"c":"Student Handbook (Complete)","q":"How does the disciplinary process work?","a":"1. Disciplinary procedures shall commence upon the filing of a written report to the Dean of the College/Unit by the instructor or any school authority who apprehends a student committing any of the acts enumerated in 'Major Offenses'. It may also be commenced by the offended party upon filing a written complaint under oath specifying the act or omission constituting the misconduct.\n2. The Dean of the College/Unit then refers the matter to the College/Unit Disciplinary Committee, which shall convene not later than three (3) days after filing of the case. The committee shall formulate guidelines that will govern the conduct of the proceedings and shall inform in writing the parent(s)/guardian(s) of the student(s) allegedly involved.\n\nA student under administrative investigation shall have the following rights:\na. The student must be informed in writing of the nature and cause of any accusation against him/her;\nb. That s/he shall have the right to answer the charge against him/her with the assistance of counsel or a representative;\nc. (And other due-process rights as provided in the handbook.)"},{"c":"Student Handbook (Complete)","q":"What are the grievance procedures and the Academic Grievance Council?","a":"Grievance Procedures: A complaint or statement of grievance may be filed in person or in writing. A course of action will be taken within five days after filing. If the OSAS's course of action is not acceptable, the complaint may be elevated to the University Grievance Committee designated by the President, composed of: University Legal Officer as Chair; Dean of the College where the complainant is enrolled as Co-Chair; CSC President or his/her representative as Member; and USC Chairperson or his/her representative as Member.\n\nAcademic Grievance Council: Students have the responsibility and right to call the attention of a professor on any grade which the student believes to be in error. Students may appeal in this order: to the Department Chairperson, then to the Dean; if the problem is not resolved at the College Level, the student may appeal to the University Grievance Council lodged at the VPAA."},{"c":"Student Handbook (Complete)","q":"What are the Students' Rights?","a":"In accordance with existing laws, regulations, and university policies, every student shall have the following rights within the university:\n1. The right to receive relevant quality education in line with national/regional goals, educational objectives and standards of the University.\n2. The right to guidance services to enable him/her to know himself/herself, to make decisions and to select from the alternatives in the fields of work in line with his/her potentials.\n3. The right, in the exercise of the constitutional guarantees of free speech and press, to express and pursue his/her opinions on any subject, provided that the expression and dissemination of such views do not disrupt the work and discipline of the University.\n4. The right to receive a copy of every paid publication.\n5. The right to participate in the formulation and development of policies affecting the University through representation in the appropriate body/bodies.\n6. The right to establish, join and participate in organizations and societies not contrary to law.\n7. The right to be secured and protected while inside the University premises or outside when conducting official activity.\n8. The right to be informed of the University rules and regulations affecting him/her.\n9. The right to participate in curricular and co-curricular activities.\n10. The right to be treated with respect and dignity.\n11. The right to redress grievances against any wrong or injustices committed against him/her and/or other students by any member of the academic community in accordance with defined channels of authority.\n12. No student shall be subjected to disciplinary action without due process.\n13. The right of access to his/her class and other records for the purpose of determining his/her class standing; the University shall maintain and preserve such records.\n14. The right of every student officially admitted by the University to continue and pursue his/her course study therein up to graduation, except in cases of academic delinquency and violation of disciplinary regulations.\n15. The right to be assisted by the University through current and adequate information on work opportunities.\n16. The right to expeditious issuance of certificates, diplomas, transcripts of records, grades and transfer credentials.\n17. The right not to be denied admission or re-admission on the ground of pregnancy outside of marriage.\n18. The right against discriminatory and derogatory portrayal of women in any student activities within the University.\n19. The right to be protected against sexual harassment in whatever form.\n20. The right to claim ownership of materials acquired through direct payment or rendered services.\n21. The right to intellectual property.\n22. All other rights guaranteed under the Constitution not mentioned above."},{"c":"Student Handbook (Complete)","q":"What are the duties and responsibilities of students?","a":"Every student, regardless of the circumstances of his/her birth, sex, religion, social status and other factors, shall:\n1. Uphold the integrity and good name of the University;\n2. Strive to lead an upright, virtuous and useful life;\n3. Love, respect, and obey his/her parents, and cooperate with them to keep the family harmonious and united;\n4. Exert his/her utmost to develop his/her potentials for service, particularly by undergoing an education suited to his/her abilities;\n5. Respect the customs and traditions of his/her country and the principles of democracy;\n6. Participate actively in civic affairs and in the promotion of general welfare;\n7. Help in the observance and exercise of individual and social rights, the strengthening of freedom everywhere, the fostering of cooperation among nations in the pursuit of progress, prosperity and world peace;\n8. Respect and cooperate with the faculty, fellow students and University authorities in the attainment and preservation of order in the University and in society; and\n9. Exercise his/her rights responsibly with due regard for the rights of others."},{"c":"Student Handbook (Complete)","q":"What are the general policies and definitions for student organizations?","a":"A. General Policies:\n1. These guidelines cover all accredited students in the University.\n2. The establishment and operation of student organizations in the University shall be allowed as a medium for enriching student life, provided that the activities of such organizations shall be along academic, social or cultural areas, and approved by the College Dean/Directors (for College-Based Organizations) or the Dean of Student Services (for University-Based Organizations) upon recommendation of the Adviser, Department Chair/s and the College Student Affairs Coordinator concerned.\n3. Student or campus organizations can only be established if their purposes are not contrary to law, morals, good custom, public policy or public order, as well as the mission-vision statement of the University.\n4. Membership to student organizations should be voluntary and open to all students of the University, or as prescribed in the Constitution and By-Laws of the respective organization.\n\nB. Definition of Terms:\n1. 'Student organizations' shall mean associations, clubs, societies, councils, or any other form of organized group of students whose members are bona fide students of Bicol University.\n2. A University-Based Organization refers to a student organization whose members belong to two or more colleges/units of the University.\n3. A College-Based Organization refers to a student organization whose members are exclusive to the college/unit."},{"c":"Student Handbook (Complete)","q":"How do I apply for accreditation of a student organization?","a":"Any group of at least fifteen (15) students may form an organization and file application for accreditation as a new student organization. The following shall be required upon registration and every semester thereafter:\n• Accomplished BU-F-OSAS-18 in triplicate copies;\n• A copy of the constitution and by-laws of the organization signed by all officers, members and adviser/s;\n• A list of the founding officers, members and adviser/s;\n• A detailed program of activities for two (2) semesters; and\n• A flyer of the organization.\n\nExisting student organizations (CBOs & UBOs) shall renew their authority to operate within thirty (30) days after the start of regular classes during the first semester of every school year. The failure of any organization to secure accreditation shall be considered a sufficient cause for the cancellation of its name from the Official List of Student Organizations. Required documents for renewal include: accomplished BU-F-OSAS-18 in triplicate; copy of the amendment of the constitution and by-laws (if any); updated list of officers and members; a detailed program of activities for two (2) semesters; accomplishment reports for two (2) semesters of the last school year; audited financial reports for two (2) semesters based on their program of activities; recent flyer; photocopy of the bank book; evaluation every after activities conducted; and such other documents as may be required."},{"c":"Student Handbook (Complete)","q":"What must an organization's constitution and by-laws include?","a":"The provisions of the constitution of any student organization shall conform to the existing rules and regulations of the University and CHED, and must include but not be limited to: the official name of the organization; a detailed declaration of purpose; duties and privileges of membership; frequency of meetings; procedure for the selection and removal of officers; procedure for the selection and removal of adviser/s; titles of officers, their duties and authority; a provision stating that the policies, activities and finances of the organization are subject to the control of the majority of its voting membership; and the procedures for decision-making in the name of the organization."},{"c":"Student Handbook (Complete)","q":"What are the grounds for denial and loss of accreditation?","a":"(The handbook sets out the grounds for denial of accreditation, including failure to comply with the requirements, purposes contrary to law or University policies, and other grounds as provided. Loss of accreditation results from failure to renew within the prescribed period or violation of the guidelines, among other causes, as provided in the handbook.)"},{"c":"Student Handbook (Complete)","q":"How are student organizations classified, and what are their privileges?","a":"Classification of Recognized Student Organizations: organizations are classified as University-Based Organizations (UBO) or College-Based Organizations (CBO) as defined in the handbook.\n\nPrivileges of Accredited Student Organizations: accredited organizations enjoy the privileges provided under the University's rules, including the right to operate, to use University facilities in accordance with the rules, to sponsor activities upon approval, and to be recognized in the Official List of Student Organizations."},{"c":"Student Handbook (Complete)","q":"What are the rules on advisers?","a":"Criteria in Selecting a Student Adviser: advisers are selected in accordance with the criteria set by the University.\n\nResponsibilities of the Adviser: the adviser guides and supervises the organization's activities and finances, and ensures compliance with University rules.\n\nOrganization's Responsibility to the Adviser: the organization supports and cooperates with the adviser, and keeps him/her informed of its activities."},{"c":"Student Handbook (Complete)","q":"What are the rules on approval of activities, publicity, and reports?","a":"N. Approval of Activities: Student organizations should submit an activity proposal to the College Dean for approval (CBOs) or the OSAS Dean (UBOs). The proposal must contain the funding requirements, the objectives, sample solicitation letter (if any), possible income (if any), and other aspects of the activity such as venues, promotional materials and the like. Any accredited student organization may be allowed to sponsor fund-raising activity only upon prior approval in writing by the College Dean/OSAS Dean. Solicitation from individuals or firms within or outside the campus shall need the permission or endorsement from the Dean of the College/OSAS.\n\nO. Publicity Regulations: All posters or written announcements on campus shall bear the stamp of approval of the CSAC/Dean of the Office of the VP for Planning and Development. Banners, billboards, flyers, newsletters or any printed matter may be displayed or circulated only upon prior approval. Posters may be placed only on designated bulletin boards and spaces. Posting of advertisements of companies and outside institutions may be approved if they have a direct bearing on the welfare of the students. It is the responsibility of the concerned organization to remove their posters, banners, billboards and similar materials the day after the last day of the activity. Violators shall be subject to disciplinary action.\n\nP. Accomplishment and Financial Reports: At the end of the semester, all recognized student organizations must submit their accomplishment and financial reports to the College Dean through the College Student Activities Coordinator or to the OSAS for clearance and renewal. Financial reports should be accompanied with proof of purchase (official receipt, sales invoice, acknowledgement receipt) and proof of acceptance (delivery report). Receipts printed on thermal paper must be photocopied immediately upon concluded transaction."},{"c":"Student Handbook (Complete)","q":"What is the student organization clearance?","a":"1. The University shall require the officers of student organizations and student councils to secure a clearance from money or property accountability from the school authorities concerned. This clearance shall be an additional clearance to the existing student clearance as a requirement for enrollment or for graduation.\n2. Officers of dissolved student organizations, whether the dissolution is voluntary or otherwise, shall be required to secure a clearance from money or property accountability.\n3. Funds of dissolved organizations shall automatically be transferred to the CSC fund in the case of CBOs and to the USC fund for UBOs.\n\nMiscellaneous Rules: All amendments to the Constitution and By-Laws of any student organization are subject to the approval of the OSAS as recommended by the Adviser(s) and Dean/s concerned. Subsequent rules promulgated by the University shall be effective upon the date of their adoption; directives, prescriptions and regulations issued by CHED shall be effective on the date prescribed."},{"c":"Student Handbook (Complete)","q":"What is the University Student Council (USC)?","a":"The University Student Council is the official governmental organization for all Bicol University students. It serves the community by assisting with issues and problems involving students and the Bicol University community, and provides channels of communication between the students and the University. All students are encouraged to vote for the representative of their choice each year and to seek any elected or appointed position if they meet the established criteria. Membership consists of an elected chairperson who likewise serves as the student regent representing the student body in the board meetings, internal and external vice-chairpersons, a secretary-general and his/her deputy, a finance manager and his/her deputy, an auditor, a business manager, and a public information officer."},{"c":"Student Handbook (Complete)","q":"What are the University and College Student Publications?","a":"Pursuant to R.A. 7079 or the 'Campus Journalism Act of 1991,' the University recognizes the importance of a free press in its support of the existence and operation of university, college and department-based student publications. The official student publication of the University is the Bicol Universitarian, also known as 'Unibe,' while the different colleges and departments within them may also have their own student publications, governed by their respective editorial policies and with the supervision of a technical adviser."},{"c":"Student Handbook (Complete)","q":"What types of off-campus activities are there (curricular vs non-curricular)?","a":"Curricular activities are required off-campus activities and are an integral part of the institutional program. Since scheduled off-campus activities are part of the regularly scheduled class time, all students are expected to attend the said activities, such as:\nA. Educational Tours — off-campus learning activities involving mobility of students with the supervision of authorized personnel outside the premises of the institution that last for more than one (1) day and involve relatively more places of destination than a field trip, in accordance with specific degree program requirements.\nB. Field Trips — off-campus learning activities of relatively shorter duration, usually lasting only one (1) day and with fewer places of destination.\nC. Field Study / Experiential Learning / Related Learning Experience — off-campus activities congruent to the learning outcomes of the course in terms of time and context; these activities are learning as curriculum delivery.\n\nNon-Curricular Activities — off-campus activities considered as non-curricular or non-program-based, left to the discretion of the University as long as the safety and security of the students are ensured. These include: A. Mission-based activities (retreat, recollection, etc.); B. Conventions, seminars, conferences, symposiums, trainings and team building; C. Volunteer work including peer helper programs, relief operations, community outreach and immersions; D. Advocacy projects and campaigns; E. Participation in sports activities; F. Activities initiated by various recognized student groups; G. Inter-school competitions/tournaments; and H. Culture and art performances and competition."},{"c":"Student Handbook (Complete)","q":"What are the general guidelines in the conduct of off-campus activities?","a":"1. As a general principle, off-campus activities should be undertaken in periods wherein there will be minimal disruption of classes and should not severely affect the conduct of classes in other subjects taken by participating students.\n2. To protect all parties, all students participating in off-campus activities, whether curricular or non-curricular, should secure a parents' permit and should be covered by group insurance.\n3. All off-campus activities should be approved by the concerned University official. All off-campus intra-curricular activities should be approved by the President through the VPAA. All these activities (both CSC and USC) should be presented in a proposal indicating all funding requirements, the objectives and the possible income that will be generated, if any. In the absence of a proposal, requests shall be automatically denied.\n4. All off-campus activities should be presented in a proposal indicating the rationale, objectives, list of key participants and their corresponding documents, safety and security details/preparations and protocol, budgetary requirements, fund source and possible income.\n5. Planning and organizing an off-campus activity is the responsibility of the faculty handling the course and should be in accordance with the existing CMO.\n6. All off-campus activities of students shall be approved in accordance with the existing policies of the University.\n7. Non-participation of students in off-campus activities should not result in an incomplete grade or failing mark. If the student cannot participate because of a valid reason, alternative activities should be required that will approximate the learning gained.\n8. All OJT/Practicum of students shall be approved by the University President through the OSAS for information/evaluation/endorsement.\n9. All co-curricular activities should be coursed through the OSAS for information/evaluation/endorsement.\n10. All cases of personal misconduct or breaches of discipline committed by a student during the off-campus activity shall fall under the jurisdiction of the Dean of the college concerned."},{"c":"Student Handbook (Complete)","q":"What are the specific guidelines for off-campus activities?","a":"1. Excuse Letter for Affected Faculty Members — the designated faculty-in-charge should prepare an excuse letter addressed to the faculty members handling the classes of participating students, duly noted and addressed by the Academic Dean/Director.\n2. Adequate Preparation — preparation for the conduct of off-campus activities should be started at least one month before the conduct of the activity. All papers must be finalized at least two (2) weeks before the scheduled departure.\n3. Schedule Should Not Affect Examination — no off-campus activities should be scheduled two (2) weeks before (or during) major examinations."},{"c":"Student Handbook (Complete)","q":"What are the rules on curricular projects and activities involving student money?","a":"These guidelines cover all students of Bicol University (including the Graduate School and the Integrated Laboratory School).\n1. This section covers curricular projects, educational materials, and activities with students' monetary contributions or direct payment for acquisition of materials, implemented as requisite for learning in a specific course. This includes evaluated projects/activities and personally used materials such as but not limited to textbooks, workbooks, handouts, laboratory kits and devices, and protective equipment.\n2. Curricular projects and activities should be included in the course syllabus with details on the cost limit and the sourcing of funds. The Instruction Committee of the college shall examine the merit for inclusion or necessity of such projects to the course and recommend appropriate action of the Dean.\n3. The university or any faculty member or personnel has no claim to ownership of any materials paid or obtained through the services of the students. After the material has served its purpose, the students, by virtue of ownership, shall claim the material or the services at the proper time. The faculty concerned or the school is duty bound to return these materials. The concerned students may voluntarily waive the right to ownership.\n4. Materials paid by the student must be at cost.\n5. Material donations as a result of project completion should be made voluntarily without prejudice and without bearing on the evaluation or credit to the performance of the student in class.\n6. Whenever possible, an alternative activity or project as approved by the committee is provided in cases when the cost or mode of acquisition proves difficult or beyond the means of the student."},{"c":"Student Handbook (Complete)","q":"What are the prohibitions on off-campus activities?","a":"1. Specific off-campus activities shall not be made as a substitute for a major examination and shall not be used to compel students' participation in the said activity.\n2. There should be no imposition of punitive measures upon the student who failed to attend/join the off-campus activities.\n3. Conduct of off-campus activities shall not unduly benefit or accommodate any of the establishments owned by the University or CHED employees and officials or by an owner who is a relative within the third civil degree of consanguinity or affinity.\n4. Exorbitant/excessive contributions required from student-participants to off-campus activities will not be allowed.\n5. No student shall participate in any off-campus activity if s/he is not enrolled and not physically fit to travel.\n6. Side trips or additional trips not included in the itinerary are not allowed and shall be treated as a violation of the approved activity."},{"c":"Student Handbook (Complete)","q":"Appendix A — Summary of Supporting BOR Resolutions and Admin Orders","a":"Title / Corresponding Reference:\n• Mission — R.A. 5521, Sec. 3.0\n• The Governing Board — R.A. 8292\n• The Administrative Council — BU Code of 2016\n• Representation of Students in Governing Bodies — CHED M.O. No. 3 s. 2001 & R.A. 8292\n• Transfer Students — BOR Resolution No. 88 s. 2003\n• Undergraduate Foreign Students — BOR Resolution No. 36 s. 2014; No. 15 s. 2015\n• Tertiary Level (Academic load) — BOR Resolution No. 26 s. 2011\n• Maximum Residence Rule — Section 6.C, R.A. 10931\n• Grading System — BOR Resolution No. 89 s. 2006\n• Opening of Tutorial Courses on Cost Recovery Basis — BOR Resolution No. 051 s. 2001 & No. 65 s.\n• Financial Information — BOR Resolution No. 315 s. 2018; R.A. No. 10931\n• Student Affairs and Services — BOR Resolution No. 112 s. 2016; CMO No. 9, s. 2013\n• Scholarships and Financial Assistance (General Policies) — BOR Resolution No. 40, s. 2000\n• University Athletes — BOR Resolution No. 14 s. 2012\n• Members of the University Band — BOR Resolution No. 94 s. 2006\n• Members of the University Cultural Groups — Secretary's Certification No. 47, s. 2018\n• Other Researchers (External Researchers) — BOR Resolution No. 018, s. 2008\n• Hazing of Any Variety — R.A. 8049, Sec. 1\n• Photo or Video Voyeurism — R.A. 9993, Sec. 3(d)\n• Sexual Harassment — Sec. 2, BU Rules and Regulations in Administrative Cases of Sexual Harassment and Similar Offenses\n• Stalking — modified definition from R.A. No. 9262\n• Student Related University Policies and Procedures — BOR Resolution No. 206 s. 2017; CMO No. 9, s. 2013"},{"c":"Student Handbook (Complete)","q":"Appendix B — Checklist of Requirements for Student Internship (CMO No. 23, s. 2009)","a":"Guidelines for Student Internship Program in the Philippines for All Programs with Practicum Subjects:\n1. HEI must execute a MOA with Host Training Establishment (HTE) duly notarized — copy of the duly notarized MOA.\n2. HEI must develop a Training Manual or Plan which shall be part of the Training Contract signed by the Trainee and co-signed by the parent/guardian — Training manual/Plan, Syllabus, Training Contract.\n3. Monitor and evaluate performance of the student trainees based on the prescribed Training Manual or Plan — Evaluation Sheet, Criteria for Grading.\n4. Conduct general orientation for qualified student trainees and their parents/guardian — Notice of orientation, Minutes of the orientation conducted, Attendance of the participants.\n5. Set criteria on the selection of a faculty practicum coordinator per program — copy of the designation of the faculty coordinator.\n6. Student Trainee must be enrolled in a practicum or equivalent subject — Certification from the College Registrar that the student is officially enrolled and has completed all academic requirements prior to OJT/practicum/affiliation.\n7. The trainee shall be physically, mentally, and emotionally fit — Medical Certificate duly certified by the University Physician or DOH accredited clinic & hospitals.\n8. Has consent from Parents/guardian — Parent/guardian consent duly notarized."},{"c":"Student Handbook (Complete)","q":"Appendix C — List of Externally-Funded Scholarships","a":"1. Andres P. Tamayo Scholarship Financial Inc.\n2. Bicol National American Association (BNAA)\n3. Cagsawa Rural Bank\n4. CHED (Cash Grant for Medicine Students; Full-Merit Scholarship Program; Half-Merit Scholarship Program; Grant-in-Aid 'Tulong-Dunong' Scholarship Program)\n5. DA Competitiveness Enhancement Fund Executive Committee (DA-ACEF Execom)\n6. Dean Arsenio Mirabueno Scholarship Program\n7. Department of Science & Technology (DOST)\n8. Luis Co Chi Kiat Foundation, Inc. (LCCKFI)\n9. Masbate Gold\n10. Melanie Condes Scholarship Program\n11. Momentum Construction & Development Corporation\n12. MORMS Batch 1974 Association Inc.\n13. NAGAs Tertiary Scholarship Program\n14. National Grid Corporation (NGCP)\n15. Nicolas Relacion Scholarship Program\n16. Philippine Business for Education (PBED)\n17. Philippine Geothermal Production Company, Inc. (PGPC-CHEVRON)\n18. PLDT-SMART Scholarship Program\n19. Social Action Center-SEDP\n20. Sunwest Care Foundation, Inc.\n21. Tertiary Education Subsidy (RA 10931)\n22. UCPB-CIIF, Foundation, Inc."},{"c":"Student Handbook (Complete)","q":"Appendix D — Actual Fees Collected from Undergraduate Students (BOR Res. No. 315, s. 2018)","a":"Prescribed fees (per BOR Resolution No. 315, s. 2018):\n• Admission Fee (Processing and Application) — P250 — Res. No. 200, s. 2017 — once only\n• Entrance Fee — P125 — Res. No. 18, s. 1989 — once only\n• Registration Fee (Matriculation Fee) — P10 — Res. No. 200, s. 2019 — semestral\n• NSTP Fee — P262.50 — Res. No. 85, s. 2002 / RA 9163 — semestral\n• Medical and Dental Fee — P20 — Res. No. 16-A, s. 2000 — semestral\n• Library Fee — P50 — Res. No. 16-A, s. 2000 — semestral\n• Athletic Fee — P40 — Res. No. 10m, s. 2000 — semestral\n• SCUAA Fee — P50 — Res. No. 23, s. 2009 — semestral\n• Swimming Pool Fee (All Students) — P160 — Res. No. 209, s. 2009 — semestral; Swimming Pool Fee (PE Majors) — P360 — once only\n• Guidance Fee — P50 — Res. No. 10, s. 2004 — semestral; Psychological Testing — per Res. No. 24, s. 2004 — semestral\n• Cultural Fee — P20 — Res. No. 80, s. 2016 — semestral\n• Science Laboratory (incl. Health & Science Lab) — P200/unit — Res. No. 80, s. 2006\n• Technology/Engineering/Mathematics/CADD/Surveying/Architectural Design (manual) Laboratory — P50/unit — Res. No. 29-C, s. 2006\n• Agricultural Technology Laboratory — P50/unit\n• Nursing Laboratory — P200–400/unit\n• AVC/STA/Journ (per subject) — P400/unit\n• Speech Laboratory — P300 — Res. No. 62, s. 2011 — per semester\n• Animation — P4000 — Res. No. 52, s. 2011\n• Special-use Research Laboratory (per sem) — P500 — Res. No. 29-C, s. 2006\n• Computer Fee (Internet Fee) — P175 — Res. No. 213, s. 2006 — semestral; Computer Laboratory — P200 — Res. No. 2, s. 1996\n• Development Fee (Publication) — P20 — Res. No. 2, s. 1996 — semestral; Graduation Fee — P25 — Res. No. 9, s. 1995 — once only\n\nNote: The said fees are subject to review after five years of implementation of R.A. No. 10931."},{"c":"Student Handbook (Complete)","q":"Appendix E — Prescribed School Uniform (Male & Female)","a":"Appendix E of the handbook contains the prescribed school uniform designs (Male and Female) approved by the Board of Regents. The uniform plates are provided in the official handbook PDF. Students must wear the required uniform for their academic level; the design approved by the Board of Regents is disseminated upon enrollment."},{"c":"Student Handbook (Complete)","q":"Appendix F — Reply Slip","a":"Appendix F of the handbook contains the Reply Slip, which students and parents/guardians accomplish as an acknowledgement of receipt and understanding of the contents of the Student Handbook (see the official handbook PDF for the form)."},{"c":"Student Handbook (Complete)","q":"Bicol University Hymn","a":"This is a school we wish to sing of\nA school to honor and revere\nA temple built by men of firmness\nA mould for youth who walks with pride\nFor thee we'll always be united\nAlthough we tread on distant lands\nWe shall cherish what you taught us\nThat you wholeheartedly gave forth.\n\nRefrain:\nBicol University, burning torch of wisdom\nFount of courage, hope and love\nSeat of truth and light.\n\nLyrics and Music: Bobbie A. Garcia"}];

var ENG = {
  norm: function (w) { return String(w).toLowerCase().replace(/[^a-z0-9]/g, ''); },
  clean: function (s) { return ' ' + String(s || '').toLowerCase().replace(/[^a-z0-9\s]/g, ' ') + ' '; },
  words: function (s) { return String(s || '').toLowerCase().replace(/[^a-z0-9\s']/g, ' ').split(/\s+/).filter(Boolean); },
  levenshtein: function (a, b) {
    if (!a.length) return b.length; if (!b.length) return a.length;
    var m = [], i, j;
    for (i = 0; i <= b.length; i++) { m[i] = [i]; }
    for (j = 0; j <= a.length; j++) { m[0][j] = j; }
    for (i = 1; i <= b.length; i++) {
      for (j = 1; j <= a.length; j++) {
        var c = a.charAt(j - 1) === b.charAt(i - 1) ? 0 : 1;
        m[i][j] = Math.min(m[i - 1][j] + 1, m[i][j - 1] + 1, m[i - 1][j - 1] + c);
      }
    }
    return m[b.length][a.length];
  },
  fuzzyOK: function (w, t) {
    if (w.length < 4 || t.length < 4) return false;
    var d = ENG.levenshtein(w, t);
    return (w.length >= 8 && d <= 2) || (w.length >= 5 && d <= 1);
  },
  expand: function (ws) {

    ws.forEach(function (w) {
      var n = ENG.norm(w);

      if (ISKO_SYN_LOOKUP[n]) {
        ISKO_SYNONYM_GROUPS[ISKO_SYN_LOOKUP[n]].forEach(function (x) {
          if (!set[x]) { set[x] = 1; out.push(x); }
        });
      } else if (!set[n]) { set[n] = 1; out.push(n); }
    });
    return out;
  },
  score: function (f, ets, ws) {
    var hay = ENG.clean((f.q || '') + ' ' + (f.a || ''));
    var qhay = ENG.clean(f.q);
    var score = 0, used = {};
    ets.forEach(function (t) {
      if (!used[t] && hay.indexOf(' ' + t + ' ') !== -1) {
        used[t] = 1;
        score += (qhay.indexOf(' ' + t + ' ') !== -1 ? 6 : 2);
      }
    });
    var phrase = ws.join(' ');
    if (phrase.length > 3 && qhay.indexOf(' ' + phrase + ' ') !== -1) score += 12;
    var own = 0, nstop = [];
    ws.forEach(function (w) {
      var n = ENG.norm(w);
      if (!n || ISKO_STOPWORDS[n]) return;
      nstop.push(n);
      if (qhay.indexOf(' ' + n + ' ') !== -1) own++;
    });
    score += own * 3;
    /* question-order bonus: any adjacent query pair found verbatim in the FAQ question */
    if (nstop.length >= 2) {
      for (var bi = 0; bi < nstop.length - 1 && score < 99; bi++) {
        if (qhay.indexOf(' ' + nstop[bi] + ' ' + nstop[bi + 1] + ' ') !== -1) score += 6;
      }
    }
    /* coverage bonus: every meaningful query word appears in the FAQ question */
    if (nstop.length >= 2 && own === nstop.length) score += 8;
    ws.forEach(function (w) {
      var n = ENG.norm(w);
      if (!n || ISKO_STOPWORDS[n]) return;
      if (hay.indexOf(' ' + n + ' ') !== -1 || used[n]) return;
      var qws = qhay.split(/\s+/);
      for (var i = 0; i < qws.length; i++) {

    return score;

  flat: function (ws) {
    var cache = ENG._fc;
    var key = ws.join(' ');
    if (cache && ENG._fk === key) return cache;
    var ets = ENG.expand(ws), arr = [];
    FAQLIB.forEach(function (f) {
      var s = ENG.score(f, ets, ws);
      if (s > 0) arr.push({ f: f, s: s });
    });
    arr.sort(function (a, b) { return b.s - a.s || a.f._i - b.f._i; });
    ENG._fc = arr; ENG._fk = key;
    return arr;
  },
  best: function (ws, n) { return ENG.flat(ws).slice(0, n || 5); },
  existsInQ: function (n) {
    for (var i = 0; i < FAQLIB.length; i++) {
      if (ENG.clean(FAQLIB[i].q).indexOf(' ' + n + ' ') !== -1) return true;
    }
    return false;

  didYouMean: function (ws) {
    var corrected = [];
    ws.forEach(function (w) {
      var n = ENG.norm(w);
      if (!n || ISKO_STOPWORDS[n]) return;
      if (ISKO_SYN_LOOKUP[n] || ENG.existsInQ(n)) { corrected.push(w); return; }
      var best = null, bd = 99;
      Object.keys(ISKO_SYN_LOOKUP).forEach(function (cand) {

        var d = ENG.levenshtein(n, cand);
        if (d < bd) { bd = d; best = cand; }
      });
      corrected.push((best && bd <= 2) ? best : w);
    });
    return corrected.join(' ');
  },
  topChips: function (n) {
    var queries = [
      'Is the BUCET online application portal open?',
      'BUCET documentary requirements',
      'How much is the tuition for a second course?',
      'How do I request my TOR?',

  categories: function () {

      headers: { 'Content-Type': 'application/json', 'X-Isko-Token': AI_CFG.token },
      body: JSON.stringify({ q: String(q || '').slice(0, 400), lang: lang || LANG, faqs: (faqs || []).slice(0, 3) })
    }).then(function (r) { return r.json(); }).then(function (j) {
      if (done) return; done = true; clearTimeout(timer);
      cb(j && j.ok ? String(j.text) : null, j && j.model);
    }).catch(function () { if (!done) { done = true; clearTimeout(timer); cb(null); } });
  } catch (e) { if (!done) { done = true; clearTimeout(timer); cb(null); } }
}
function doAiExplain(label) {
  var c = CHAT.aiCtx;
  if (!c || !c.faqs || !c.faqs.length) { addBot(esc(STR[LANG].ai_none)); return; }
  typing(true);
  aiAsk(c.q, c.faqs, LANG, function (txt, model) {
    typing(false);
    if (!txt) { addBot(esc(STR[LANG].ai_unavailable)); return; }
    addBot('<span class="badge ai">✨ ' + esc(label || STR[LANG].ai_badge) + '</span>' +
      '<span class="ans">' + fmtBlocks(txt) + '</span>' +
      '<div class="srcline">' + esc(STR[LANG].ai_verify) + (model ? ' · ' + esc(model) : '') + '</div>');
    askQ();
  });
}

/* ---- markdown-lite renderer (official FAQ text + AI replies) ---- */
/*FMT-START*/
function fmtBlocks(text) {
  if (!text) return '';
  var html = esc(text);
  html = html.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
  html = html.replace(/(^|[\s(])(https?:\/\/[^\s)]+)/g, '$1<a href="$2" target="_blank" rel="noopener nofollow">$2</a>');
  var lines = html.split(/\r?\n/);
  var out = [], ul = false, ol = false;
  function close() { if (ul) { out.push('</ul>'); ul = false; } if (ol) { out.push('</ol>'); ol = false; } }
  for (var i = 0; i < lines.length; i++) {
    var L = lines[i].trim();
    if (!L) { close(); continue; }
    var um = L.match(/^[-•*]\s+(.+)/);
    var om = L.match(/^(\d+)[.)]\s+(.+)/);
    if (um) { if (ol) { close(); } if (!ul) { out.push('<ul>'); ul = true; } out.push('<li>' + um[1] + '</li>'); }
    else if (om) { if (ul) { close(); } if (!ol) { out.push('<ol>'); ol = true; } out.push('<li>' + om[2] + '</li>'); }
    else { close(); out.push('<p>' + L + '</p>'); }
  }
  close();
  return out.join('');
}
function fmtAnswer(text, f) {
  return fmtBlocks(text) +
    '<div class="src">Source: official ISKO FAQ — “' + esc(f.q) + '” · Category: ' + esc(f.c) + '</div>';
}
/*FMT-END*/

function addSys(text) {
  MSGS.appendChild(el('div', 'row sys', '<div class="sysnote">' + esc(text) + '</div>'));
  scrollDown();
}
function typing(on) {
  var old = document.getElementById('typingRow');
  if (old) old.remove();
  if (!on) return;
  var row = el('div', 'row bot', '<div class="msg"><div class="bubble typing"><i></i><i></i><i></i></div></div>');
  row.id = 'typingRow';
  MSGS.appendChild(row);
  scrollDown();
}
function reply(fn, ms) {
  typing(true);
  setTimeout(function () { typing(false); try { fn(); } catch (e) {} scrollDown(); resetIdle(); }, ms || 600 + Math.random() * 500);
}
function resetIdle() {
  if (CHAT.idleTimer) clearTimeout(CHAT.idleTimer);
  CHAT.idleTimer = setTimeout(function () {
    if (CHAT.step === 'idle' && MSGS.children.length > 0) {
      addBot(esc(pick(T('anything'))));
      addChips([{ label: T('more'), act: 'more' }, { label: T('finish'), act: 'fb' }]);
    }
  }, 45000);
}
function addChips(items) {
  var wrap = el('div', 'chips');
  items.forEach(function (c) {
    var b = el('button', 'chip' + (c.primary ? ' primary' : ''));
    b.type = 'button';
    b.textContent = c.label;
    b.onclick = function () {
      if (c.act === 'more') { askQ(); }
      else if (c.act === 'fb') { startFeedback(); }
      else if (c.act === 'skip') { skipName(); }
      else if (c.act === 'ai') { doAiExplain(); }
      else if (c.act === 'name') { askName(); }
      else if (c.act && /^role\d$/.test(c.act)) { pickRole(+c.act.slice(4)); }
      else userSend(c.query || c.label);
    };
    wrap.appendChild(b);
  });
  addBot('');
  var last = MSGS.lastChild;
  if (last) { last.querySelector('.bubble').appendChild(wrap); }
  scrollDown();
  return wrap;
}
function pickRole(i) {
  var roles = ['student', 'parent', 'alumni', 'other'];
  if (!CHAT.user) CHAT.user = { name: '', role: '' };
  CHAT.user.role = roles[i] || 'other';
  CHAT.user.t = Date.now();
  saveState();
  addBot(esc('Thank you! I’ll keep that in mind. 😊'));
  showTop();
}

/* ---- conversation flow ---- */
function welcome() {
  var u = loadUser();
  if (u && u.name) {
    CHAT.user = u;
    addBot(esc(pick(['Hey ' + esc(u.name) + '! 👋 Welcome back! What can I help you with?', 'Great to see you again, ' + esc(u.name) + '! 👋 What’s on your mind?'])));
    showTop();
    return;
  }
  CHAT.step = 'name';
  addBot(esc(pick(T('greet'))));
  addBot(esc(T('askName')));
  addChips([{ label: 'Skip →', act: 'skip' }]);
}
function askQ() {
  CHAT.step = 'idle';
  addBot(esc(pick(T('anything'))));
  setTimeout(function () { $('inp').focus(); }, 80);
}
function showTop() {
  CHAT.step = 'idle';
  addBot(esc(T('top')));
  var tops = ENG.topChips(5);
  var items = tops.map(function (f) { return { label: f.q.length > 62 ? f.q.slice(0, 59) + '…' : f.q, query: f.q }; });
  addChips(items);
  addBot(esc(T('askQ')));
}
function startFeedback() {
  if (CHAT.fbAsked) { addBot(esc(STR[LANG].fbDone)); return; }
  CHAT.step = 'feedback'; CHAT.rating = 0;
  addBot(esc(T('fbIntro')));
  var s = el('div', 'stars');
  s.id = 'stars';
  for (var i = 1; i <= 5; i++) {
    (function (v) {
      var b = el('button', 'star'); b.type = 'button'; b.textContent = '★'; b.setAttribute('aria-label', v + '/5');
      b.onmouseenter = function () { hoverStars(v); };
      b.onclick = function () { rate(v); };
      s.appendChild(b);
    })(i);
  }
  addBot('');
  MSGS.lastChild.querySelector('.bubble').appendChild(s);
  scrollDown();
}
function hoverStars(n) {
  var st = $('stars'); if (!st) return;
  var arr = st.querySelectorAll('.star');
  for (var i = 0; i < arr.length; i++) arr[i].classList.toggle('on', i < n);
}
function rate(n) {
  CHAT.rating = n; CHAT.fbAsked = true;
  var st = $('stars'); if (st) hoverStars(n);
  // local-only record (conversation site — nothing leaves the browser)
  try {
    var rec = JSON.parse(localStorage.getItem('iskoChatFeedback') || '[]');
    rec.push({ r: n, t: new Date().toISOString() });
    localStorage.setItem('iskoChatFeedback', JSON.stringify(rec));
  } catch (e) {}
  CHAT.step = 'idle';
  reply(function () { addBot(esc(T('fbDone'))); askQ(); }, 500);
}

/* ---- intent regexes ---- */
var RX_GREET = /(^|\s)(hi|hello|hey|helo|good\s?(morning|afternoon|evening)|good\s?day|kumusta|musta|magandang\s?(araw|umaga|hapon|gabi)|kumustas?)(\s|$|[.!?])/i;
var RX_THANKS = /(^|\s)(thank|thanks|salamat|maraming\s?salamat|ty|thankyou|salamat\s?po)(\s|$|[.!?])/i;
var RX_BYE = /(bye|goodbye|paalam|see\s?you|hanggang\s?sa\s?muli|ayo\s?na)/i;
var RX_YES = /(^|\s)(yes|yeah|yep|oo|opo|sige|okay|ok|tama|sure|yes\s?po)(\s|$|[.!?])/i;
var RX_NO = /(^|\s)(no|hindi|hindi\s?po|not\s?yet|wala|hindi\s?pa|none)(\s|$|[.!?])/i;
var RX_WHO = /(who\s?are\s?you|ano\s?ka|sino\s?ka|what\s?is\s?isko|ano\s?ang\s?isko|tell\s?me\s?about\s?yourself|about\s?isko)/i;
var RX_CAP = /(what\s?can\s?you\s?(do|answer|help)|what\s?do\s?you\s?know|ano\s?ang\s?kaya\s?mo|paano\s?ka\s?tumutulong|topics|topik|topiks|help\s?me)/i;
var FIL_TOKENS = /(\bpo\b|\bba\b|\bako\b|\bikaw\b|\bmagkano\b|\bkailan\b|\bpaano\b|\bsaan\b|\bano\b|\bbakit\b|\bsino\b|\bilan\b|\bgusto\b|\bkulang\b|\bsalamat\b|\bkumusta\b|\bsa\b|\bng\b|\bmga\b|\bpara\b|\bmay\b|\bwalang\b|\bakala\b|\bnaman\b|\bpo\b)/i;
function isFil(text) { return FIL_TOKENS.test(text); }

/* ---- main handler ---- */
function handle(text) {
  var low = text.toLowerCase();
  var nw = ENG.words(text).length;

  /* name capture stage */
  if (CHAT.step === 'name') {
    var name = text.replace(/^(my name is|ako si|ako po si|ako nga si|i am|name|pangalan)\s+/i, '').replace(/^[.!?]+$/, '').trim();
    if (!name || name.length > 60) { addBot(esc(T('nameErr'))); return; }
    CHAT.user = { name: name, t: Date.now() };
    saveState();
    CHAT.step = 'role';
    addBot(esc(T('nice').replace('{name}', esc(name))));
    addBot(esc(T('roleQ')));
    addChips(T('roles').map(function (r, i) { return { label: r, act: 'role' + i }; }));
    return;
  }
  /* role stage: chips or typed word */
  if (CHAT.step === 'role') {
    var rm = low.match(/^(role[0-3])$/);
    if (rm) { pickRole(+rm[1].slice(4)); return; }
    var words2 = low.replace(/[^a-z\s]/g, '').trim();
    if (words2 && words2.length <= 24) {
      if (/(student|estudyante|mag?a?aral|freshman|incoming)/.test(words2)) { pickRole(0); return; }
      if (/(parent|magulang|guardian|tutor|nanay|tatay)/.test(words2)) { pickRole(1); return; }
      if (/(alumni|graduate|graduate)/.test(words2)) { pickRole(2); return; }
      if (/(other|iba|teacher|staff|faculty)/.test(words2)) { pickRole(3); return; }
    }
  }
  if (CHAT.step === 'feedback') { startFeedback(); return; }

  if (nw <= 3 && RX_GREET.test(low)) { addBot(esc(pick(T('greet')))); resetIdle(); return; }
  if (nw <= 3 && RX_THANKS.test(low)) { addBot(esc(pick(T('wc')))); resetIdle(); return; }
  if (RX_BYE.test(low)) { addBot(esc(pick(T('bye')))); CHAT.step = 'idle'; return; }
  if (RX_WHO.test(low)) { addBot(esc(T('who'))); showTopicsChips(); return; }
  if (RX_CAP.test(low)) { addBot(esc(T('cap'))); showTopicsChips(); return; }
  if (nw <= 3 && RX_YES.test(low)) {
    if (CHAT.last >= 0) { addBot(esc(pick(T('glad')))); askQ(); }
    else showTop();
    return;
  }
  if (nw <= 3 && RX_NO.test(low)) {
    if (CHAT.last >= 0) { addBot(esc(pick(T('sorry')))); suggestRelated(3); askQ(); }
    else startFeedback();
    return;
  }

  /* follow-up: short question right after an answer — merge with last question */
  var isQ = /^(what|which|when|where|who|why|how|paano|saan|kailan|magkano|ano|bakit|sino|gaano|may|meron)\b/i.test(text);
  var isFollowUp = /more|details|requirement|fee|fees|how\s+much|magkano|detalye|kailangan|ano\s+pa|about\s+that|yung|tapos|then|sige/i.test(text);
  if (CHAT.step === 'answered' && CHAT.last >= 0 && !isQ && isFollowUp && nw <= 4 && text.length < 45) {
    var solo = ENG.best(ENG.words(text), 2);
    var confident = solo.length && solo[0].s >= 4 && (!solo[1] || (solo[0].s - solo[1].s >= 3));
    if (!confident) { handleTopic(CHAT.lastQ + ' ' + text); return; }
  }
  handleTopic(text);
}
function showTopicsChips() {
  var cs = ENG.categories().slice(0, 10);
  addChips(cs.map(function (c) { return { label: c.length > 48 ? c.slice(0, 45) + '…' : c, query: c }; }));
  addBot(esc(pick(T('anything'))));
}
function suggestRelated(n) {
  if (CHAT.options && CHAT.options.length) {
    addChips(CHAT.options.slice(0, n || 3).map(function (o) { return { label: o.label, query: o.query }; }));
  }
}
function handleTopic(text) {
  var ws = ENG.words(text);
  if (!ws.length) { addBot(esc(T('oops'))); return; }
  var meaningful = 0;
  ws.forEach(function (w) { if (!ISKO_STOPWORDS[ENG.norm(w)]) meaningful++; });
  var flat = ENG.flat(ws);
  if (!flat.length || flat[0].s < 3) { noMatch(text, ws); return; }
  var top = flat[0], second = flat[1];
  if (CHAT.last >= 0 && top.f._i === CHAT.last) {
    var others = flat.filter(function (o) { return o.f._i !== CHAT.last; }).slice(0, 3);
    if (others.length) {
      addBot(esc(T('related')));
      addChips(others.map(function (o) { return { label: o.f.q.length > 62 ? o.f.q.slice(0, 59) + '…' : o.f.q, query: o.f.q }; }));
      CHAT.step = 'idle'; CHAT.last = -1;
      return;
    }
  }
  var gap = second ? (top.s - second.s) : 99;
  var specific = meaningful >= 2;
  if (top.s >= 4 && (gap >= 3 || specific)) {
    CHAT.step = 'answered'; CHAT.last = top.f._i; CHAT.lastQ = top.f.q;
    CHAT.options = flat.slice(0, 4).map(function (o) { return { label: o.f.q.length > 62 ? o.f.q.slice(0, 59) + '…' : o.f.q, query: o.f.q }; });
    if (CHAT.topics.indexOf(top.f.q) === -1) CHAT.topics.push(top.f.q);
    saveState();
    answerCard(top, false, text, aiCtxFor(text, flat));
    /* short one-word questions: show the runner-up questions as tap options */
    if (meaningful < 2) { addChips(flat.slice(1, 4).map(function (o) { return { label: o.f.q.length > 62 ? o.f.q.slice(0, 59) + '…' : o.f.q, query: o.f.q }; })); }
  } else if (top.s > 0 && gap < 3 && second && second.s > 0) {
    CHAT.step = 'awaiting';
    CHAT.options = flat.slice(0, 4).map(function (o) { return { label: o.f.q.length > 62 ? o.f.q.slice(0, 59) + '…' : o.f.q, query: o.f.q }; });
    addBot(esc(T('dym')));
    addChips(CHAT.options);
  } else if (top.s > 0) {
    CHAT.step = 'answered'; CHAT.last = top.f._i; CHAT.lastQ = top.f.q;
    CHAT.options = flat.slice(0, 4).map(function (o) { return { label: o.f.q.length > 62 ? o.f.q.slice(0, 59) + '…' : o.f.q, query: o.f.q }; });
    if (CHAT.topics.indexOf(top.f.q) === -1) CHAT.topics.push(top.f.q);
    saveState();
    answerCard(top, true, text, aiCtxFor(text, flat));
  } else {
    noMatch(text, ws);
  }
}
function aiCtxFor(text, flat) {
  var faqs = flat.slice(0, 3).map(function (o) {
    return { q: String(o.f.q).slice(0, 220), a: String(o.f.a).replace(/\*\*/g, '').replace(/\s+/g, ' ').trim().slice(0, 1400) };
  });
  return { q: String(text).slice(0, 400), faqs: faqs };
}
function answerCard(f, uncertain, qText, ctx) {
  if (ctx) CHAT.aiCtx = ctx;
  var html = '<span class="badge">✓ ' + esc(T('based')) + '</span>' +
    '<span class="ans">' + fmtAnswer(f.a, f) + '</span>';
  addBot(html);
  addBot(esc(T('did')) + ' ' +
    '<span class="helprow">' +
    '<button class="hbtn2" id="hbYes">' + esc(T('yes')) + '</button>' +
    '<button class="hbtn2" id="hbNo">' + esc(T('no')) + '</button></span>');
  var yes = $('hbYes'), no = $('hbNo');
  if (yes) yes.onclick = function () {
    yes.classList.add('on'); no.classList.remove('on');
    addBot(esc(pick(T('glad'))));
    askQ();
  };
  if (no) no.onclick = function () {
    no.classList.add('on'); yes.classList.remove('on');
    addBot(esc(pick(T('sorry'))));
    suggestRelated(3);
    askQ();
  };
  if (uncertain) {
    addChips(CHAT.options.slice(1, 4));
  }
  if (AI_CFG.mode !== 'off' && CHAT.aiCtx && CHAT.aiCtx.faqs && CHAT.aiCtx.faqs.length) {
    addChips([{ label: '✨ ' + T('ai_chip'), act: 'ai', primary: true }]);
  }
}
function noMatch(text, ws) {
  addBot(esc(T('noMatch')));
  /* topic chips */
  addChips([
    { label: '🎓 BUCET & admissions', query: 'BUCET admissions' },
    { label: '💰 Tuition & fees', query: 'tuition fees' },
    { label: '📅 Enrollment & calendar', query: 'enrollment calendar' },
    { label: '📄 Records (TOR)', query: 'request TOR' },
    { label: '🎗️ Scholarships', query: 'scholarships' },
    { label: '🏥 Health services', query: 'health services' }
  ]);
  /* did-you-mean */
  var dym = ENG.didYouMean(ws);
  if (dym && dym.toLowerCase() !== ws.join(' ').toLowerCase()) {
    addBot(esc(T('typo')));
    addChips([{ label: dym, query: dym, primary: true }]);
  }
  /* closest effort */
  var rel = ENG.best(ws, 3);
  if (rel.length) {
    addBot(esc(T('related')));
    addChips(rel.map(function (r) { return { label: r.f.q.length > 62 ? r.f.q.slice(0, 59) + '…' : r.f.q, query: r.f.q }; }));
  }
  CHAT.step = 'idle';
  /* automatic AI assist (grounded on the closest official FAQs) when enabled */
  if (AI_CFG.mode === 'full' && rel.length) {
    var ctx = { q: String(text).slice(0, 400), faqs: rel.slice(0, 3).map(function (o) {
      return { q: String(o.f.q).slice(0, 220), a: String(o.f.a).replace(/\*\*/g, '').replace(/\s+/g, ' ').trim().slice(0, 1400) };
    }) };
    CHAT.aiCtx = ctx;
    typing(true);
    aiAsk(ctx.q, ctx.faqs, LANG, function (txt, model) {
      typing(false);
      if (!txt) return;
      addBot('<span class="badge ai">✨ ' + esc(T('ai_badge')) + '</span>' +
        '<span class="ans">' + fmtBlocks(txt) + '</span>' +
        '<div class="srcline">' + esc(T('ai_verify')) + (model ? ' · ' + esc(model) : '') + '</div>');
    });
  }
}
function userSend(text) {
  text = String(text || '').trim();
  if (!text) return;
  addUser(text);
  resetIdle();
  /* auto language: filipino-ish message */
  if (isFil(text) && !/^(Skip →)/.test(text)) {
    if (LANG !== 'fil') {
      LANG = 'fil';
      try { localStorage.setItem('iskoChatLang', 'fil'); } catch (e) {}
      renderChrome();
    }
  }
  reply(function () { handle(text); });
}

/* ---- name prompt actions ---- */
function askName() { CHAT.step = 'name'; addBot(esc(T('askName'))); }
function skipName() {
  CHAT.user = { name: '', role: '', t: Date.now() };
  saveState();
  CHAT.step = 'idle';
  showTop();
}

/* ---- chrome ---- */
function renderChrome() {
  $('appTitle').textContent = T('title');
  $('appStatus').textContent = T('status');
  $('langIc').textContent = LANG === 'fil' ? 'FIL' : 'EN';
  $('langLbl').textContent = LANG === 'fil' ? 'English' : 'Filipino';
  $('inp').placeholder = $('inp').getAttribute('data-ph-' + LANG) || (LANG === 'fil' ? 'Magtanong tungkol sa admission, tuition, records…' : 'Ask about admissions, tuition, records…');
  $('hintText').textContent = (AI_CFG.mode === 'off')
    ? (LANG === 'fil' ? 'Ang mga sagot ay base lamang sa opisyal na ISKO Help Center FAQ database.' : 'Answers are based only on the official ISKO Help Center FAQ database.')
    : (LANG === 'fil' ? 'Ang mga sagot ay mula sa opisyal na FAQ; maaaring tumulong ang AI (ipinapadala ang tanong sa napiling provider).' : 'Official ISKO FAQs are the source; AI may assist (your question is sent to the configured AI provider).');
  document.documentElement.setAttribute('data-theme', THEME);
  $('themeBtn').querySelector('.ic').textContent = THEME === 'dark' ? '☀' : '◐';
}
$('langBtn').onclick = function () {
  LANG = LANG === 'fil' ? 'en' : 'fil';
  try { localStorage.setItem('iskoChatLang', LANG); } catch (e) {}
  renderChrome();
};
$('themeBtn').onclick = function () {
  THEME = THEME === 'dark' ? 'light' : 'dark';
  try { localStorage.setItem('iskoChatTheme', THEME); } catch (e) {}
  renderChrome();
};
$('resetBtn').onclick = function () {
  if (!confirm('Start a new conversation? This clears the chat history on this device.')) return;
  try { localStorage.removeItem('iskoChatUser'); } catch (e) {}
  MSGS.innerHTML = '';
  CHAT = { step: 'idle', last: -1, lastQ: '', topics: [], user: null, rating: 0, fbAsked: false, idleTimer: null, aiCtx: null };
  addSys(pick(T('restart')) + ' — ' + T('title') + ' · ' + new Date().toLocaleDateString());
  welcome();
};

$('sendBtn').onclick = function () { doSend(); };
$('inp').addEventListener('keydown', function (e) {
  if (e.key === 'Enter') { e.preventDefault(); doSend(); }
});
function doSend() {
  var v = $('inp').value;
  if (!v.trim()) return;
  $('inp').value = '';
  if (v.trim() === 'Skip →') skipName();
  else userSend(v);
}

/* ---- boot ---- */
(function init() {
  renderChrome();
  document.documentElement.lang = LANG;
  var d = new Date();
  addSys('ISKO Chat · ' + (LANG === 'fil' ? 'Knowledge base ng ISKO (' + FAQLIB.length + ' FAQ) · ' : 'Knowledge base (' + FAQLIB.length + ' FAQs) · ') + d.toLocaleDateString(undefined, { year: 'numeric', month: 'long', day: 'numeric' }));
  try {
    var u = loadUser();
    if (u && u.name) CHAT.user = u;
  } catch (e) {}
  welcome();
  setTimeout(function () { $('inp').focus(); }, 400);
})();
</script>
